<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Infinite Dodge v2 — DETERMINATION</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;touch-action:none}
html,body{height:100%;background:#030303;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100vw,calc(100vh*4/3));height:auto;aspect-ratio:4/3;background:#000;image-rendering:pixelated;box-shadow:0 0 60px rgba(255,0,0,.15)}
</style></head><body>
<canvas id="c" width="640" height="480"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=640,H=480,F='"Press Start 2P",monospace';
const B={x:200,y:125,w:240,h:240},T={w:240,h:240};
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ch=a=>a[Math.random()*a.length|0];
const DIR=[[0,-1],[1,0],[0,1],[-1,0]],COL={red:'#f33',blue:'#4af',green:'#0f0',yellow:'#ff0'};
let st='title',wave=0,t=0,score=0,graze=0,tp=0,bullets=[],shots=[],ps=[],pk=null,picks=[],shake=0,flash=0,mode='red',mt=0,mtMax=1,sh=0,atks=[],at=0,dur=1,diff=1,keys={},msg='',bombT=0,shotCd=0,mute=false,pdown=false,pp=null;
let cut=null;let hs=0;try{hs=+localStorage.getItem('dodge_v2')||0}catch(e){}
const stars=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.2,1)}));
let P,so;
function reset(){P={spd:3.1,dcd:1.1,gr:14,hr:4.5,slow:1,max:20,rw:0,tg:3};so={x:W/2,y:245,vx:0,vy:0,hp:20,inv:0,dash:0,dcd:0,dx:0,dy:0,g:0,on:0,mv:0};wave=0;t=0;score=0;graze=0;tp=0;bullets=[];shots=[];ps=[];pk=null;cut=null;mode='red';mt=0;bombT=0;shake=0;flash=0}
/* audio */
let AC;function snd(f,d=.1,ty='square',v=.04,s=0){if(mute)return;try{AC=AC||new AudioContext();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function emit(x,y,n,c,sp=2){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(.3,1)*sp;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.7),m:.7,c})}}
/* bullets */
const S=v=>v*(1+(diff-1)*.35)*P.slow;
function bl(o){const b=Object.assign({x:0,y:0,vx:0,vy:0,k:'c',r:6,w:10,h:10,ty:'w',life:5,warn:0,dmg:1,ang:null,gz:0,ar:0,fl:0,fire:0,col:'#fff',u:null,ml:1},o);
 if(b.k=='s'&&b.ang==null)b.ang=Math.atan2(b.vy,b.vx)+Math.PI/2;b.ang=b.ang||0;
 if(b.ty=='b')b.col='#4af';if(b.ty=='o')b.col='#f80';if(b.ar)b.col='#0f0';bullets.push(b);return b}
const ev=(s,k,i,dt,f)=>{s[k]=(s[k]||0)+dt;while(s[k]>=i){s[k]-=i;s[k+'n']=(s[k+'n']||0)+1;f(s[k+'n'])}};
function near(b,pad,p=so){if(b.k=='b'||b.k=='l'||b.k=='z')return Math.abs(p.x-b.x)<b.w/2+pad&&Math.abs(p.y-b.y)<b.h/2+pad;return Math.hypot(p.x-b.x,p.y-b.y)<b.r+pad}
const setMode=(m,d)=>{mode=m;mt=mtMax=d;if(m=='green'){so.x=W/2;so.y=245;so.vx=so.vy=0;sh=0;emit(so.x,so.y,10,'#0f0',2)}};
const cx=()=>B.x+B.w/2,cy=()=>B.y+B.h/2;
function laser(h,pos,w=18,warn=.8,life=1.4){return h?bl({k:'l',x:cx(),y:pos,w:B.w+300,h:w,warn,life,dmg:2,src:[B.x-60,pos,0]}):bl({k:'l',x:pos,y:cy(),w:w,h:B.h+300,warn,life,dmg:2,src:[pos,B.y-60,Math.PI/2]})}
/* attacks */
const zn=(x,y,w,h,wr=1,l=.3)=>bl({k:'z',x:x+w/2,y:y+h/2,w,h,warn:wr,life:l,ml:l,dmg:3,gz:1});
const A={
swordSlash:{n:'SWORD OF RUIN',d:6.5,f(dt,s){ev(s,'a',1.9,dt,n=>{const v=n%2,k=wave>8?4:3,sz=(v?B.w:B.h)/k,sf=Math.random()*k|0;for(let i=0;i<k;i++)if(i!=sf)v?zn(B.x+i*sz,B.y,sz,B.h,1):zn(B.x,B.y+i*sz,B.w,sz,1)})}},
quad:{n:'FOUR CORNERS',d:6,mw:4,f(dt,s){ev(s,'a',2,dt,()=>{const hw=B.w/2,hh=B.h/2,sf=Math.random()*4|0;for(let i=0;i<4;i++)if(i!=sf)zn(B.x+(i%2)*hw,B.y+(i>>1)*hh,hw,hh,.95)})}},
checker:{n:'CHECKERBOARD',d:6.4,mw:7,f(dt,s){ev(s,'a',1.6,dt,n=>{const c=4,cw=B.w/c,cg=B.h/c;for(let i=0;i<c;i++)for(let j=0;j<c;j++)if((i+j+n)%2==0)zn(B.x+i*cw,B.y+j*cg,cw,cg,.9,.25)})}},
greatsword:{n:'GREAT SWORD',d:7.2,mw:5,f(dt,s){ev(s,'a',2.4,dt,()=>{const m=Math.random()*4|0,w=B.w,h=B.h;const R=[[B.x,B.y,w/2,h],[B.x+w/2,B.y,w/2,h],[B.x,B.y,w,h/2],[B.x,B.y+h/2,w,h/2]];zn(...R[m],1.2,.35);const o=R[m^1];if(m<2)zn(o[0]+o[2]/2-20,B.y,40,h,1.9,.25);else zn(B.x,o[1]+o[3]/2-20,w,40,1.9,.25)})}},
pillars:{n:'PILLARS OF LIGHT',d:5.5,mw:3,f(dt,s){ev(s,'a',.55,dt,()=>zn(cl(so.x+rnd(-70,70),B.x,B.x+B.w-40),B.y,40,B.h,.8,.2))}},
stomp:{n:'STOMP',d:5.5,mw:3,f(dt,s){ev(s,'a',.7,dt,()=>zn(cl(so.x-35,B.x,B.x+B.w-70),cl(so.y-35,B.y,B.y+B.h-70),70,70,.8,.22))}},
crusher:{n:'CRUSHER',d:6,mw:6,f(dt,s){ev(s,'a',2.2,dt,n=>{const v=n%2,g=64,w=v?B.w:B.h,o=Math.random()*(w-g);if(v){zn(B.x,B.y,o,B.h,1);zn(B.x+o+g,B.y,w-o-g,B.h,1)}else{zn(B.x,B.y,B.w,o,1);zn(B.x,B.y+o+g,B.w,w-o-g,1)}})}},
cutHalf:{n:'BOARD SPLIT',d:9.5,mw:8,i(){const v=Math.random()<.5,L=(v?B.h:B.w);cut={v,gh:66,o:(L-66)/2,to:(L-66)/2}},f(dt,s){const v=cut.v;ev(s,'a',2.6,dt,()=>{const sd=(v?so.x<cx():so.y<cy())?0:1;v?zn(B.x+sd*B.w/2,B.y,B.w/2,B.h,1.5,.3):zn(B.x,B.y+sd*B.h/2,B.w,B.h/2,1.5,.3);cut.to=rnd(10,(v?B.h:B.w)-76)});ev(s,'b',.45,dt,()=>bl({x:rnd(B.x+10,B.x+B.w-10),y:B.y-12,vy:S(2.2),r:5.5,life:4.5}))}},
windmill:{n:'WINDMILL',d:6,mw:5,f(dt,s){if(s.on)return;s.on=1;const arms=wave>14?4:3,sp=(Math.random()<.5?1:-1)*.012*(1+diff*.15);for(let a=0;a<arms;a++)for(let i=1;i<=7;i++)bl({r:5.5,life:5.8,th:a*6.283/arms,rd:i*16+8,u:(b,d)=>{b.th+=sp*d*60;b.x=cx()+Math.cos(b.th)*b.rd;b.y=cy()+Math.sin(b.th)*b.rd}})}},
orbit:{n:'CLOSING CIRCLE',d:5.5,mw:4,f(dt,s){ev(s,'a',1.8,dt,()=>{const k=16,ph=rnd(0,6.28),g=Math.random()*k|0;for(let i=0;i<k;i++){if(i==g||i==(g+1)%k)continue;bl({r:6,life:3.2,th:i/k*6.283+ph,rd:150,u:(b,d)=>{b.rd-=S(.9)*d*60;b.x=cx()+Math.cos(b.th)*b.rd;b.y=cy()+Math.sin(b.th)*b.rd}})}})}},
snake:{n:'SERPENT',d:5.5,mw:4,f(dt,s){ev(s,'a',.2,dt,n=>{const m=B.h/2-35;bl({x:B.x+B.w+20,y:cy()+Math.sin(n*.35)*m,vx:-S(2.6),r:7,life:5});if(n%2)bl({x:B.x+B.w+20,y:cy()+Math.sin(n*.5+2)*m,vx:-S(2.6),r:5,life:5,col:'#8cf'})})}},
homing:{n:'SEEKERS',d:6,mw:5,f(dt,s){ev(s,'a',1.1,dt,()=>{const a=rnd(0,6.28);bl({x:cx()+Math.cos(a)*(B.w/2+30),y:cy()+Math.sin(a)*(B.h/2+30),r:8,life:4.2,col:'#f4f',u:(b,d)=>{const dx=so.x-b.x,dy=so.y-b.y,m=Math.hypot(dx,dy)||1,v=S(1.5);b.vx+=(dx/m*v-b.vx)*.04;b.vy+=(dy/m*v-b.vy)*.04}})})}},
boomerang:{n:'BOOMERANG BONES',d:6,mw:4,f(dt,s){ev(s,'a',.9,dt,()=>{const l=Math.random()<.5,sd=l?1:-1;bl({x:l?B.x-20:B.x+B.w+20,y:rnd(B.y+30,B.y+B.h-30),vx:sd*S(3.6),k:'b',w:11,h:50,life:4.5,tt:0,u:(b,d)=>{b.tt+=d;if(b.tt>.9&&!b.rv){b.rv=1;b.vx*=-1.1}}})})}},
sniper:{n:'SNIPER',d:6,mw:7,f(dt,s){ev(s,'a',1.6,dt,n=>{const h=n%2,b=laser(h,h?so.y:so.x,14,1.1,.5);b.u=(q,d)=>{if(q.warn>.3){if(h){q.y=so.y;q.src[1]=so.y}else{q.x=so.x;q.src[0]=so.x}}}})}},
wall:{n:'RAINBOW WALL',d:5.5,mw:3,f(dt,s){ev(s,'a',1.5,dt,()=>{const k=10,g=Math.random()*(k-2)|0;for(let i=0;i<k;i++)if(i<g||i>g+1)bl({x:B.x+B.w*(i+.5)/k,y:B.y-12,vy:S(2.3),r:6.5,life:4.6,col:'hsl('+i*36+',90%,60%)'})})}},
boneWave:{n:'BONE WAVE',d:5.5,f(dt,s){ev(s,'a',.4,dt,n=>{const sd=(n>>2)%2?1:-1,gy=B.y+55+Math.random()*(B.h-110),x=sd>0?B.x-30:B.x+B.w+30,v=S(3.2)*sd;[-1,1].forEach(q=>bl({x,y:gy+q*78,vx:v,k:'b',w:11,h:100}))})}},
boneGap:{n:'BONE GAP',d:5.5,f(dt,s){ev(s,'a',.65,dt,()=>{const gh=62+rnd(0,18),gy=B.y+25+Math.random()*(B.h-50-gh),x=B.x+B.w+25,v=-S(2.7),bh=gy-B.y,th=B.y+B.h-gy-gh;bl({x,y:B.y+bh/2,vx:v,k:'b',w:12,h:bh});bl({x,y:gy+gh+th/2,vx:v,k:'b',w:12,h:th})})}},
fireRain:{n:'FIRE MAGIC',d:5.2,f(dt,s){ev(s,'a',.22,dt,()=>bl({x:rnd(B.x+15,B.x+B.w-15),y:B.y-15,vx:rnd(-.7,.7),vy:S(2.2),r:7,fire:1,col:'#f60'}))}},
helix:{n:'FIRE HELIX',d:5.4,f(dt,s){s.a=(s.a||0)+dt*6;ev(s,'e',.15,dt,()=>[-1,1].forEach(q=>bl({x:cx()+Math.sin(s.a)*55*q,y:B.y-14,vx:Math.cos(s.a)*.6*q,vy:S(2.3),r:6,fire:1,col:'#f60'})))}},
spiral:{n:'SPIRAL',d:5.2,f(dt,s){s.a=(s.a||0)+dt*8.5*Math.min(diff,2);const arms=wave>12?3:2;ev(s,'e',.12,dt,()=>{for(let i=0;i<arms;i++){const a=s.a+i*6.283/arms;bl({x:cx(),y:cy(),vx:Math.cos(a)*S(2.2),vy:Math.sin(a)*S(2.2),r:5.5,life:3.6})}})}},
tears:{n:'TEARS',d:4.8,f(dt,s){ev(s,'a',.38,dt,()=>{const l=Math.random()<.5,x=l?B.x-16:B.x+B.w+16,y=rnd(B.y+30,B.y+B.h-30),dx=so.x-x,dy=so.y-y,d=Math.hypot(dx,dy)||1,v=S(1.7);bl({x,y,vx:dx/d*v,vy:dy/d*v,r:6.5,life:5})})}},
ring:{n:'EXPAND RING',d:5.4,f(dt,s){ev(s,'a',1.1,dt,n=>{const k=14+(wave>8?4:0);for(let i=0;i<k;i++){const a=i/k*6.283+n*.4;bl({x:cx(),y:cy(),vx:Math.cos(a)*S(1.9),vy:Math.sin(a)*S(1.9),r:6,life:3.5})}})}},
spearRing:{n:'SPEAR RING',d:5,f(dt,s){ev(s,'a',1.2,dt,n=>{if(n>3)return;const k=9+(diff*.6|0);for(let i=0;i<k;i++){const a=i/k*6.283+n*.25;bl({k:'s',x:cx(),y:cy(),vx:Math.cos(a)*S(1.9),vy:Math.sin(a)*S(1.9),r:7,w:9,h:18,life:3.6})}})}},
blasters:{n:'GASTER BLASTER',d:6.5,b:[270,230],f(dt,s){ev(s,'a',1.15,dt,n=>{if(n>3+(diff/1.6|0))return;const h=Math.random()<.5;laser(h,h?cl(so.y+rnd(-30,30),B.y+15,B.y+B.h-15):cl(so.x+rnd(-30,30),B.x+15,B.x+B.w-15),18);snd(90,.4,'sawtooth',.04,60)})}},
colorBones:{n:'BLUE / ORANGE',d:6,f(dt,s){ev(s,'a',.5,dt,()=>{const l=Math.random()<.5;bl({x:l?B.x-26:B.x+B.w+26,y:rnd(B.y+40,B.y+B.h-40),vx:l?S(3):-S(3),k:'b',w:12,h:60,ty:Math.random()<.5?'b':'o',life:4.5})})}},
boneDrop:{n:'BONE DROP',d:5.2,f(dt,s){ev(s,'a',.3,dt,()=>bl({x:rnd(B.x+25,B.x+B.w-25),y:B.y-35,vx:rnd(-.35,.35),vy:S(2.4),k:'b',w:9,h:42}))}},
crossBeam:{n:'CROSS BEAM',d:5,b:[270,230],f(dt,s){ev(s,'a',1.7,dt,n=>{laser(1,cl(so.y+rnd(-25,25),B.y+20,B.y+B.h-20),16,.75);laser(0,cl(so.x+rnd(-25,25),B.x+20,B.x+B.w-20),16,.75)})}},
chaos:{n:'CHAOS',d:5.8,f(dt,s){ev(s,'a',.22,dt,()=>{const k=Math.random();if(k<.35)bl({x:rnd(B.x,B.x+B.w),y:B.y-16,vx:rnd(-.8,.8),vy:S(2.2),r:5.5});else if(k<.7){const l=Math.random()<.5;bl({x:l?B.x-22:B.x+B.w+22,y:rnd(B.y+30,B.y+B.h-30),vx:l?S(2.8):-S(2.8),k:'b',w:9,h:44})}else{const a=rnd(0,6.283);bl({k:'s',x:cx(),y:cy(),vx:Math.cos(a)*S(2.4),vy:Math.sin(a)*S(2.4),r:6,w:8,h:15})}})}},
blueBones:{n:'BLUE BONES',d:6,sp:1,b:[300,200],i(){setMode('blue',9)},f(dt,s){ev(s,'a',.58,dt,()=>{const lo=Math.random()<.55,sd=Math.random()<.5?-1:1;bl({x:sd>0?B.x-24:B.x+B.w+24,y:lo?B.y+B.h-16:B.y+B.h*.42,vx:sd*S(2.7),k:'b',w:11,h:lo?32:85,ty:lo?'w':'b',life:4.5})})}},
slam:{n:'GRAVITY SLAM',d:6,sp:1,b:[300,200],i(){setMode('blue',9);so.g=9},f(dt,s){ev(s,'a',1.3,dt,n=>{for(let i=0;i<3;i++)bl({x:rnd(B.x+20,B.x+B.w-20),y:B.y+B.h+38,vy:-S(5.5),k:'b',w:14,h:76,warn:.65,life:.45});if(n%2)for(let i=0;i<4;i++)bl({x:B.x+30+i*(B.w-60)/3,y:B.y-20,vy:S(3),k:'b',w:11,h:40,life:3})})}},
spears:{n:'SPEAR OF JUSTICE',d:10,sp:1,b:[190,190],i(){setMode('green',13)},f(dt,s){ev(s,'a',.42,dt,n=>{if(n>22)return;const dd=ch(DIR),sl=Math.random()<.3,v=sl?1.6:S(2.9),b=bl({k:'s',x:so.x-dd[0]*105,y:so.y-dd[1]*105,vx:dd[0]*v,vy:dd[1]*v,r:7,w:11,h:20,ar:1,life:3.6});if(Math.random()<.22){b.fl=.85;b.life=4.2}})}},
yellowRain:{n:'YELLOW RAIN',d:6.5,sp:1,i(){setMode('yellow',10)},f(dt,s){ev(s,'a',.2,dt,()=>bl({x:rnd(B.x+16,B.x+B.w-16),y:B.y-18,vx:rnd(-.45,.45),vy:S(2.1),r:6.5}))}}
};
const POOL=['boneWave','boneGap','fireRain','helix','spiral','tears','ring','spearRing','blasters','colorBones','boneDrop','crossBeam','chaos','swordSlash','quad','checker','greatsword','pillars','stomp','crusher','cutHalf','windmill','orbit','snake','homing','boomerang','sniper','wall'];
const FLAV=['* The air grows tense...','* Keep your DETERMINATION!','* Something approaches...','* Don\'t give up!','* The SOUL shines brighter.','* Another wave begins...','* You feel your power growing.'];
const hv=k=>A[k].hv||['blasters','crossBeam','spiral','windmill','orbit'].includes(k);
function nextWave(){wave++;diff=1+wave*.09;at=0;cut=null;so.hp=Math.min(P.max,so.hp+P.rw);let ks;
 if(wave%6==0)ks=['spears'];else if(wave%5==0)ks=[ch(['blueBones','slam'])];else if(wave%7==0)ks=['yellowRain'];
 else{let p=POOL.filter(k=>(wave>=3||['boneWave','fireRain','boneGap','boneDrop','tears','swordSlash'].includes(k))&&(A[k].mw||0)<=wave);if(wave<6)p=p.filter(k=>k!='chaos'&&k!='blasters'&&k!='crossBeam');if(wave<10)p=p.filter(k=>k!='chaos');
  const a=ch(p);ks=[a];if(wave>=10&&!hv(a)&&Math.random()<.5){const b=ch(p.filter(k=>!hv(k)&&k!=a));if(b)ks.push(b)}}
 atks=ks.map(k=>({...A[k],s:{}}));dur=Math.max(...atks.map(a=>a.d));
 const bz=atks.find(a=>a.b);T.w=bz?bz.b[0]:240;T.h=bz?bz.b[1]:240;if(atks[0].sp&&atks[0].b)(T.w=atks[0].b[0],T.h=atks[0].b[1]);
 if(mode!='red'&&!atks[0].sp){mode='red';mt=0}
 atks.forEach(a=>a.i&&a.i());msg=ch(FLAV);banner=atks.map(a=>a.n).join(' + ');bt=1.6;snd(330,.15,'triangle',.05);
 if(Math.random()<.5&&!pk)pk={x:rnd(B.x+30,B.x+B.w-30),y:rnd(B.y+30,B.y+B.h-30),l:9}}
let banner='',bt=0;
/* perks */
const PERKS=[['+5 MAX HP','Max HP up and heal 5',()=>{P.max+=5;so.hp+=5}],['FULL HEAL','Restore all HP',()=>so.hp=P.max],['SWIFT SOUL','Move 12% faster',()=>P.spd*=1.12],['TINY SOUL','Smaller hitbox',()=>P.hr*=.8],['DASH TUNING','Dash cooldown -30%',()=>P.dcd*=.7],['WIDE GRAZE','Bigger graze radius',()=>P.gr+=7],['TIME WARP','Bullets 8% slower',()=>P.slow*=.92],['REGEN','+1 HP every wave',()=>P.rw++],['TP SURGE','Graze charges TP faster',()=>P.tg*=1.5]];
function perkScreen(){picks=PERKS.slice().sort(()=>Math.random()-.5).slice(0,3);st='perk'}
function choose(i){if(!picks[i])return;picks[i][2]();snd(660,.2,'triangle',.05,300);st='play';nextWave()}
/* player */
function hurt(d){so.hp-=d;so.inv=1.15;flash=.1;snd(130,.2,'sawtooth',.05,-70);emit(so.x,so.y,5,COL[mode],1.5);if(so.hp<=0){so.hp=0;st='over';if(score>hs){hs=score|0;try{localStorage.setItem('dodge_v2',hs)}catch(e){}}snd(80,.8,'sawtooth',.08,-40);emit(so.x,so.y,40,'#f33',4)}}
function bomb(){if(tp<100||st!='play')return;tp=0;bullets.forEach(b=>{emit(b.x,b.y,3,'#ff0',2);score+=10});bullets=[];so.inv=Math.max(so.inv,1.6);flash=.3;snd(200,.5,'sawtooth',.07,600)}
function upS(dt){so.px=so.x;so.py=so.y;let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
 if(pp&&mode!='green'&&mode!='blue'){so.x+=pp.dx;so.y+=pp.dy;pp.dx=pp.dy=0}
 if(mode=='green'){so.vx=so.vy=0;if(dx)sh=dx>0?1:3;if(dy)sh=dy>0?2:0;so.mv=0}
 else if(mode=='blue'){so.vx=dx*P.spd*.9;const up=keys.arrowup||keys.w;if(so.on&&up){so.g=-6.2;so.on=0;snd(440,.07,'square',.02)}if(!up&&so.g<-2.5)so.g*=.88;so.g+=17.5*dt;so.x+=so.vx*dt*60;so.y+=so.g*dt*60;so.mv=so.vx!=0||!so.on;
  if(so.y>=B.y+B.h-so.r-2){so.y=B.y+B.h-so.r-2;so.g=0;so.on=1}else so.on=0}
 else{if(dx&&dy){dx*=.707;dy*=.707}
  if((keys.shift||keys.c)&&so.dcd<=0&&(dx||dy)&&so.dash<=0){so.dash=.13;so.dx=dx;so.dy=dy;so.dcd=P.dcd;so.inv=Math.max(so.inv,.25);snd(500,.1,'triangle',.04,400)}
  let sp=P.spd;if(so.dash>0){so.dash-=dt;dx=so.dx;dy=so.dy;sp*=3.3;emit(so.x,so.y,1,'#f66',.4)}
  so.vx=dx*sp;so.vy=dy*sp;so.x+=so.vx*dt*60;so.y+=so.vy*dt*60;so.mv=Math.abs(so.vx)+Math.abs(so.vy)>.3}
 so.r=P.hr;so.x=cl(so.x,B.x+7,B.x+B.w-7);so.y=cl(so.y,B.y+7,B.y+B.h-7);
 if(cut){cut.o+=(cut.to-cut.o)*Math.min(1,dt*4);const p=cut.v?so.x:so.y,wc=cut.v?cx():cy(),al=cut.v?so.y-B.y:so.x-B.x;if(Math.abs(p-wc)<so.r+3&&(al-so.r<cut.o||al+so.r>cut.o+cut.gh)){const q=(cut.v?so.px:so.py)<wc?wc-so.r-3:wc+so.r+3;cut.v?so.x=q:so.y=q}}
 so.dcd-=dt;so.inv-=dt;
 if(mt>0&&(mt-=dt)<=0&&mode!='red'){mode='red'}
 if(mode=='yellow'){shotCd-=dt;if((keys.z||keys[' ']||keys.enter||pdown)&&shotCd<=0){shotCd=.13;shots.push({x:so.x,y:so.y-9,vy:-8.5,l:1.2,r:3.5});snd(900,.04,'square',.02)}}}
function upd(dt){t+=dt;score+=dt*10;bombT-=dt;
 B.w+=(T.w-B.w)*Math.min(1,dt*6);B.h+=(T.h-B.h)*Math.min(1,dt*6);B.x=W/2-B.w/2;B.y=245-B.h/2;
 upS(dt);at+=dt;atks.forEach(a=>a.f(dt,a.s));
 if(at>=dur){score+=wave*50;if(wave%3==0)perkScreen();else nextWave()}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
  if(b.u)b.u(b,dt);if(b.warn>0){if((b.warn-=dt)<=0&&b.k=='z')snd(160,.25,'sawtooth',.04,-80)}else{b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;b.life-=dt;if(b.fl&&(b.fl-=dt)<=0){b.fl=0;b.vx*=-1;b.vy*=-1;b.ang+=Math.PI}
   if(b.life<=0||b.x<-150||b.x>W+150||b.y<-150||b.y>H+150){bullets.splice(i,1);continue}
   if(mode=='green'&&b.ar){const d=DIR[sh],px=b.x-so.x,py=b.y-so.y;if(px*d[0]+py*d[1]>0&&Math.hypot(px,py)<50){bullets.splice(i,1);emit(b.x,b.y,8,'#0f0',2);score+=15;snd(600,.06,'square',.04);continue}}
   const ok=!(b.ty=='b'&&!so.mv)&&!(b.ty=='o'&&so.mv);
   if(ok){if(so.inv<=0&&near(b,so.r))hurt(b.dmg);else if(!b.gz&&near(b,so.r+P.gr)){b.gz=1;graze++;tp=Math.min(100,tp+P.tg);score+=5;snd(900,.04,'triangle',.025);}}}}
 if(st=='over')return;
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y+=s.vy*dt*60;s.l-=dt;if(s.l<=0||s.y<B.y-25){shots.splice(i,1);continue}
  for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(b.k=='l'||b.k=='z'||b.warn>0)continue;if(near(b,s.r+4,s)){emit(b.x,b.y,6,'#ff0',2);bullets.splice(j,1);shots.splice(i,1);score+=10;snd(300,.05,'square',.03);break}}}
 if(pk){pk.l-=dt;if(pk.l<=0)pk=null;else if(Math.hypot(so.x-pk.x,so.y-pk.y)<16){so.hp=Math.min(P.max,so.hp+4);emit(pk.x,pk.y,14,'#0f0',2.5);snd(700,.15,'triangle',.05,500);pk=null}}
}
/* drawing */
function txt(s,x,y,sz,c='#fff',al='center'){X.font=sz+'px '+F;X.fillStyle=c;X.textAlign=al;X.fillText(s,x,y)}
function heart(x,y,sz,c){X.save();X.translate(x,y);X.scale(sz/16,sz/16);X.fillStyle=c;X.beginPath();X.moveTo(0,5.5);X.bezierCurveTo(-1.2,1.2,-9.2,-3.2,-9.2,-8.2);X.bezierCurveTo(-9.2,-13.8,-4.6,-15.8,0,-11.6);X.bezierCurveTo(4.6,-15.8,9.2,-13.8,9.2,-8.2);X.bezierCurveTo(9.2,-3.2,1.2,1.2,0,5.5);X.fill();X.fillStyle='rgba(255,210,210,.7)';X.beginPath();X.ellipse(-3.1,-7.6,2.4,2.9,-.3,0,6.3);X.fill();X.restore()}
function drawB(b){
 if(b.k=='z'){const L=b.x-b.w/2,Tp=b.y-b.h/2;if(b.warn>0){const f=Math.floor(performance.now()/110)%2;X.fillStyle=f?'rgba(255,40,40,.4)':'rgba(255,220,0,.4)';X.fillRect(L,Tp,b.w,b.h);X.strokeStyle=f?'#ff0':'#f33';X.lineWidth=2;X.strokeRect(L+1,Tp+1,b.w-2,b.h-2)}
  else{const p=1-b.life/b.ml;X.globalAlpha=Math.max(0,.9-p*.8);X.fillStyle='#fff';X.fillRect(L,Tp,b.w,b.h);X.globalAlpha=1;X.fillStyle='#8ef';if(b.w>=b.h)X.fillRect(L+b.w*p-8,Tp,16,b.h);else X.fillRect(L,Tp+b.h*p-8,b.w,16)}return}
 if(b.warn>0){const a=.25+Math.sin(performance.now()*.02)*.2;X.globalAlpha=a;X.fillStyle='#f22';
  if(b.k=='l')X.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);else{X.fillText('!',cl(b.x,B.x+8,B.x+B.w-8),cl(b.y,B.y+16,B.y+B.h-4))}X.globalAlpha=1;return}
 X.save();X.translate(b.x,b.y);X.fillStyle=b.col;
 if(b.k=='c'){X.globalAlpha=.25;X.beginPath();X.arc(0,0,b.r*1.7,0,6.3);X.fill();X.globalAlpha=1;X.beginPath();X.arc(0,0,b.r,0,6.3);X.fill();if(b.fire){X.fillStyle='#fc4';X.beginPath();X.arc(0,-2.5,b.r*.55,0,6.3);X.fill()}}
 else if(b.k=='b'){X.fillRect(-b.w/2,-b.h/2,b.w,b.h);X.beginPath();X.arc(0,-b.h/2,b.w*.78,0,6.3);X.arc(0,b.h/2,b.w*.78,0,6.3);X.fill()}
 else if(b.k=='s'){X.rotate(b.ang);X.beginPath();X.moveTo(0,-b.h/2);X.lineTo(b.w/2,b.h/2);X.lineTo(0,b.h/2-5);X.lineTo(-b.w/2,b.h/2);X.fill()}
 else if(b.k=='l'){const f=Math.random()*.15;X.globalAlpha=.2+f;X.fillRect(-b.w/2-(b.h>b.w?8:0),-b.h/2-(b.h<b.w?8:0),b.w+(b.h>b.w?16:0),b.h+(b.h<b.w?16:0));X.globalAlpha=1;X.fillRect(-b.w/2,-b.h/2,b.w,b.h)}
 X.restore()}
function draw(dt){
 let sx=0,sy=0;if(shake>0.4){shake*=.88;sx=rnd(-1,1)*shake;sy=rnd(-1,1)*shake}else shake=0;
 X.setTransform(1,0,0,1,sx,sy);X.fillStyle='#000';X.fillRect(-20,-20,W+40,H+40);
 stars.forEach(s=>{s.y-=s.s*dt*20;if(s.y<0)s.y=H;X.globalAlpha=.15+s.s*.25;X.fillStyle=mode=='red'?'#f55':COL[mode];X.fillRect(s.x,s.y,2,2)});X.globalAlpha=1;
 if(st=='title'){txt('* INFINITE DODGE *',W/2,110,22,'#f33');txt('v2  —  DETERMINATION',W/2,140,9,'#888');
  ['You are the SOUL. Survive endless waves.','','ARROWS / WASD  move      SHIFT  dash','Z / SPACE  shoot (YELLOW)      X  BOMB when TP full','Graze bullets to charge TP. Pick perks every 3 waves.','BLUE attacks: stay still     ORANGE: keep moving','GREEN: aim shield with arrows      P pause   M mute','Touch: drag to move, tap to shoot'].forEach((l,i)=>txt(l,W/2,200+i*24,8,i==5?'#4af':'#ccc'));
  txt('PRESS ENTER OR CLICK',W/2,430,11,Math.floor(performance.now()/500)%2?'#fff':'#f33');txt('BEST '+hs,W/2,458,8,'#666');return}
 /* box */
 X.fillStyle='rgba(14,14,26,.7)';X.fillRect(B.x,B.y,B.w,B.h);
 X.save();X.beginPath();X.rect(B.x,B.y,B.w,B.h);X.clip();bullets.forEach(drawB);X.restore();
 bullets.forEach(b=>{if(b.k=='l'&&b.src&&b.life>0){X.save();X.translate(b.src[0],b.src[1]);X.rotate(b.src[2]);X.fillStyle='#eee';X.beginPath();X.ellipse(0,0,22,17,0,0,6.3);X.fill();X.fillStyle='#111';X.fillRect(-9,-8,5,8);X.fillRect(4,-8,5,8);X.fillStyle='#bbb';X.fillRect(-14,8,28,7);X.restore()}});
 X.strokeStyle=mode=='red'?'#fff':COL[mode];X.lineWidth=4;X.strokeRect(B.x-2,B.y-2,B.w+4,B.h+4);
 if(cut){X.strokeStyle='#8ef';X.lineWidth=4;X.beginPath();if(cut.v){const x=cx();X.moveTo(x,B.y);X.lineTo(x,B.y+cut.o);X.moveTo(x,B.y+cut.o+cut.gh);X.lineTo(x,B.y+B.h)}else{const y=cy();X.moveTo(B.x,y);X.lineTo(B.x+cut.o,y);X.moveTo(B.x+cut.o+cut.gh,y);X.lineTo(B.x+B.w,y)}X.stroke()}
 shots.forEach(s=>{X.fillStyle='#ff0';X.beginPath();X.arc(s.x,s.y,s.r,0,6.3);X.fill()});
 if(pk){X.fillStyle='#0f0';const p=pk;X.globalAlpha=.6+Math.sin(t*8)*.4;X.fillRect(p.x-2,p.y-7,4,14);X.fillRect(p.x-7,p.y-2,14,4);X.globalAlpha=1}
 if(st!='over'){X.save();if(so.inv>0&&Math.floor(so.inv*14)%2==0)X.globalAlpha=.35;heart(so.x,so.y,17,COL[mode]);
  if(mode=='green'){const d=DIR[sh];X.strokeStyle='#0f0';X.lineWidth=4;X.beginPath();X.arc(so.x+d[0]*24,so.y+d[1]*24,13,0,6.3);X.stroke()}
  if(mode=='yellow'){X.fillStyle='#ff0';X.fillRect(so.x-2,so.y-18,4,7)}X.restore()}
 ps.forEach((p,i)=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.l-=dt;X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.fillRect(p.x-1.5,p.y-1.5,3,3)});ps=ps.filter(p=>p.l>0);X.globalAlpha=1;
 if(flash>0){X.fillStyle='rgba(255,40,40,'+flash*.5+')';X.fillRect(-20,-20,W+40,H+40);flash-=dt*1.8}
 /* hud */
 const hw=Math.min(P.max*4,160);txt('HP',20,32,9,'#fff','left');X.fillStyle='#400';X.fillRect(48,18,hw,16);X.fillStyle=so.hp/P.max<.3?'#f80':'#fc0';X.fillRect(48,18,hw*so.hp/P.max,16);X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(48,18,hw,16);txt(Math.ceil(so.hp)+'/'+P.max,56+hw,32,8,'#fff','left');
 txt('WAVE '+wave,W-20,30,10,'#ff0','right');txt('SCORE '+(score|0),W-20,50,8,'#aaa','right');txt(t.toFixed(1)+'s',W/2,30,9,'#888');
 if(mode!='red'){txt(mode.toUpperCase(),W/2,50,8,COL[mode]);X.fillStyle=COL[mode];X.fillRect(B.x,B.y-12,B.w*Math.max(0,mt/mtMax),4)}
 txt('TP',20,H-24,9,'#fff','left');X.fillStyle='#310';X.fillRect(48,H-34,140,14);X.fillStyle=tp>=100?'#ff0':'#f90';X.fillRect(48,H-34,140*tp/100,14);X.strokeStyle='#fff';X.strokeRect(48,H-34,140,14);
 if(tp>=100&&Math.floor(performance.now()/250)%2)txt('X: BOMB!',200,H-23,8,'#ff0','left');
 txt('DASH',W-120,H-24,8,'#fff','right');X.fillStyle='#123';X.fillRect(W-110,H-34,90,14);X.fillStyle='#4af';X.fillRect(W-110,H-34,90*(1-cl(so.dcd/P.dcd,0,1)),14);X.strokeRect(W-110,H-34,90,14);
 txt(msg,W/2,B.y+B.h+34,7,'#777');
 if(bt>0&&st=='play'){bt-=dt;X.globalAlpha=Math.min(1,bt);txt(banner,W/2,B.y-24,11,'#fff');X.globalAlpha=1}
 if(st=='perk'){X.fillStyle='rgba(0,0,0,.85)';X.fillRect(0,0,W,H);txt('* CHOOSE A BLESSING *',W/2,110,14,'#ff0');
  picks.forEach((p,i)=>{const x=20+i*205,y=160;X.strokeStyle='#fff';X.lineWidth=3;X.strokeRect(x,y,190,170);txt(i+1+'',x+95,y+28,14,'#f33');txt(p[0],x+95,y+75,9,'#fff');txt(p[1],x+95,y+110,6,'#aaa')});txt('PRESS 1 / 2 / 3 OR CLICK',W/2,400,8,'#888')}
 if(st=='over'){X.fillStyle='rgba(0,0,0,.8)';X.fillRect(0,0,W,H);txt('* GAME OVER *',W/2,160,22,'#f00');txt('Wave '+wave+'   Time '+t.toFixed(1)+'s',W/2,220,10,'#fff');txt('Score '+(score|0)+'   Graze '+graze,W/2,250,10,'#ff0');txt('Best '+hs,W/2,280,9,'#888');txt('* You cannot give up just yet...',W/2,330,8,'#666');txt('PRESS ENTER OR CLICK',W/2,400,11,Math.floor(performance.now()/500)%2?'#fff':'#f33')}
 if(st=='pause'){X.fillStyle='rgba(0,0,0,.7)';X.fillRect(0,0,W,H);txt('PAUSED',W/2,245,20,'#fff')}
 X.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<H;y+=3)X.fillRect(0,y,W,1)}
function start(){reset();st='play';nextWave();snd(440,.2,'triangle',.05,300)}
let last;function loop(ts){const dt=Math.min((ts-(last||ts))/1e3,.033);last=ts;if(st=='play'||st=='over')upd(dt);draw(dt);requestAnimationFrame(loop)}
/* input */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(e.repeat)return;
 if(k=='m')mute=!mute;
 if(st=='title'||st=='over'){if(k=='enter'||k==' ')start()}
 else if(st=='perk'){if('123'.includes(k))choose(+k-1)}
 else if(k=='p'||k=='escape'){st=st=='pause'?'play':st=='play'?'pause':st}
 else if(k=='x')bomb()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{if(st=='play')st='pause';keys={}});
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.addEventListener('pointerdown',e=>{const p=pos(e);pdown=true;pp={lx:e.clientX,ly:e.clientY,dx:0,dy:0};
 if(st=='title'||st=='over')start();else if(st=='perk'){const i=Math.floor((p.x-20)/205);if(p.y>150&&p.y<340&&i>=0&&i<3)choose(i)}else if(st=='pause')st='play'});
C.addEventListener('pointermove',e=>{if(pdown&&pp){pp.dx+=(e.clientX-pp.lx)*W/C.getBoundingClientRect().width;pp.dy+=(e.clientY-pp.ly)*W/C.getBoundingClientRect().width;pp.lx=e.clientX;pp.ly=e.clientY}});
addEventListener('pointerup',()=>{pdown=false;pp=null});
reset();requestAnimationFrame(loop);
</script></body></html>
