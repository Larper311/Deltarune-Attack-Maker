<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss Fight Maker 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--bg:#05030b;--panel:#0d0a1c;--accent:#ff3fd0;--accent2:#8b5cff;--text:#f0ecfa;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    min-height:100%;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;
    background-image:radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,63,208,.10), transparent 60%);
  }
  h1{display:none;}
  #frame{
    width:100%;max-width:720px;margin-top:14px;
    background:linear-gradient(180deg,#171130,#0a0716);
    border:2px solid #35285e;border-radius:14px;padding:10px;
    box-shadow:0 0 60px rgba(140,70,255,.15), inset 0 0 0 1px rgba(255,255,255,.03);
  }
  #cvwrap{width:100%;aspect-ratio:640/480;position:relative;border-radius:8px;overflow:hidden;background:#000;}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;}
  #hint{
    font-size:11px;color:#9a8fc9;text-align:center;margin:8px 0 2px;line-height:1.6;
  }
  #hint b{color:#e7dcff;font-weight:600;}
  #startOverlay{
    position:absolute;inset:0;background:rgba(4,2,10,.88);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;cursor:pointer;z-index:5;
  }
  #startOverlay.hide{display:none;}
  #startOverlay .go{
    font-family:'Press Start 2P',monospace;font-size:clamp(14px,3vw,20px);color:#ffe14a;
    text-shadow:0 0 18px rgba(255,225,74,.5);
  }
  #startOverlay .sub{font-size:12px;color:#a99ed6;}
  footer{font-size:10px;color:#4d4370;margin:14px 0 26px;text-align:center;}
</style>
</head>
<body>
<div id="frame">
  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <div id="startOverlay"><div class="go">CLICK TO START</div><div class="sub">sound is better on</div></div>
  </div>
</div>
<div id="hint"><b>Arrows/WASD</b> move &nbsp; <b>Z / Enter / Space</b> confirm &amp; shoot &nbsp; <b>Shift</b> slow-walk</div>
<footer>BOSS FIGHT MAKER 2.0 — fan-made, built for fun</footer>
<script>
'use strict';
/* ===================== BOSS FIGHT MAKER 2.0 ===================== */
const W=640,H=480,S=2;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W*S;cv.height=H*S;
const TAU=Math.PI*2,PI=Math.PI;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=t=>1-Math.pow(1-t,3);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const $=id=>document.getElementById(id);
const FONT='"Press Start 2P", ui-monospace, monospace';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let inFight=false,G=null;
const BOX0={x:150,y:190,w:340,h:210};
const MENUBOX={x:40,y:300,w:560,h:100};

/* ---------- storage ---------- */
function store(k,v){try{if(v===undefined)return localStorage.getItem('bfm2_'+k);localStorage.setItem('bfm2_'+k,v);}catch(e){return null;}}

/* ---------- input ---------- */
const keys={},pressed={},released={};
function typing(e){const t=e.target&&e.target.tagName;return t==='INPUT'||t==='TEXTAREA'||t==='SELECT';}
addEventListener('keydown',e=>{
  if(typing(e))return;
  const k=e.key.toLowerCase();
  if(!keys[k])pressed[k]=true;
  keys[k]=true;
  if(inFight&&['arrowup','arrowdown','arrowleft','arrowright',' ','z','x','shift'].includes(k))e.preventDefault();
  initAudio();
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;released[k]=true;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const isDown=(...a)=>a.some(k=>keys[k]);
const isTap=(...a)=>a.some(k=>pressed[k]);
const isRel=(...a)=>a.some(k=>released[k]);

/* ---------- audio ---------- */
let AC=null,master=null;
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.32;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(f,d,type,vol,slide,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,vol,lp,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*d);
  const b=AC.createBuffer(1,n,AC.sampleRate),dat=b.getChannelData(0);
  for(let i=0;i<n;i++)dat[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||2000;
  const g=AC.createGain();g.gain.value=vol||.2;
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const SFX={
  blip:()=>tone(880,.05,'square',.1),
  sel:()=>{tone(660,.06,'square',.13);tone(990,.09,'square',.13,0,.06);},
  no:()=>tone(160,.12,'square',.13),
  type:()=>tone(rnd(300,360),.03,'square',.05),
  graze:()=>tone(1500,.06,'triangle',.07,700),
  hit:()=>{noise(.25,.4,1500);tone(140,.25,'sawtooth',.25,-100);},
  shot:()=>tone(900,.08,'square',.08,-500),
  big:()=>{tone(300,.3,'sawtooth',.16,600);noise(.2,.2,3000);},
  boom:()=>{noise(.45,.4,900);tone(90,.35,'sawtooth',.22,-60);},
  slash:()=>{noise(.16,.3,7000);tone(1800,.1,'sawtooth',.1,-1500);},
  charge:()=>tone(200,.5,'sawtooth',.1,900),
  crack:()=>{noise(.3,.45,5000);tone(60,.3,'square',.25,-30);},
  pop:()=>tone(500,.08,'triangle',.13,300),
  buster:()=>{tone(200,.6,'sawtooth',.25,900);noise(.6,.35,4000);},
  heal:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.13,0,i*.07));},
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'square',.13,0,i*.09));},
  lose:()=>tone(300,.9,'sawtooth',.22,-250),
  warn:()=>tone(1200,.05,'square',.05),
  pipis:()=>tone(400,.14,'sine',.16,300)
};
const sfx=n=>{try{if(SFX[n])SFX[n]();}catch(e){}};

/* ---------- geometry helpers ---------- */
function sdSeg(px,py,x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy||1;
  const t=clamp(((px-x0)*dx+(py-y0)*dy)/l2,0,1);
  return Math.hypot(px-(x0+dx*t),py-(y0+dy*t));
}
function sdBox(px,py,cx,cy,hw,hh){
  const dx=Math.abs(px-cx)-hw,dy=Math.abs(py-cy)-hh;
  return Math.max(dx,dy)<0?Math.max(dx,dy):Math.hypot(Math.max(dx,0),Math.max(dy,0));
}

/* ---------- drawing helpers ---------- */
function text(c,s,x,y,size,col,align){
  c.font=(size||8)+'px '+FONT;c.fillStyle=col||'#fff';c.textAlign=align||'left';c.textBaseline='alphabetic';c.fillText(s,x,y);
}
function wrapLines(c,s,size,maxW){
  c.font=size+'px '+FONT;
  const words=s.split(' '),lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}
function heartPath(c,x,y,s){
  c.beginPath();
  c.moveTo(x,y+s*.9);
  c.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.9,y-s*1.2,x,y-s*.45);
  c.bezierCurveTo(x+s*.9,y-s*1.2,x+s*1.5,y-s*.1,x,y+s*.9);
  c.closePath();
}
function star6(c,x,y,R,rot,col){
  c.save();c.translate(x,y);c.rotate(rot);
  const heavy = !(typeof G!=='undefined' && G && G.ents && G.ents.length>12);
  if(heavy){c.shadowColor=col;c.shadowBlur=6;}
  c.fillStyle=col;
  const n=8;
  c.beginPath();
  for(let i=0;i<n*2;i++){
    const a=i*PI/n-PI/2,rr=(i%2===0)?R:R*.32;
    const px=Math.cos(a)*rr,py=Math.sin(a)*rr;
    i?c.lineTo(px,py):c.moveTo(px,py);
  }
  c.closePath();c.fill();
  if(heavy) c.shadowBlur=0;
  c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1;c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(0,0,R*.16,0,TAU);c.fill();
  c.restore();
}
function drawSword(c,x,y,ang,len,w,col,glow){
  c.save();c.translate(x,y);c.rotate(ang);
  if(glow){c.shadowColor=glow;c.shadowBlur=12;}
  c.fillStyle=col;
  c.beginPath();
  c.moveTo(len/2,0);c.lineTo(len/2-18,-w*.42);c.lineTo(-len/2+10,-w*.5);
  c.lineTo(-len/2-6,0);c.lineTo(-len/2+10,w*.5);c.lineTo(len/2-18,w*.42);
  c.closePath();c.fill();
  c.shadowBlur=0;
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.stroke();
  c.fillStyle='#8a7cff';c.fillRect(-len/2+8,-w*.9,3,w*1.8);
  c.fillStyle='#3b2d7a';c.fillRect(-len/2,-w*.25,8,w*.5);
  c.restore();
}

/* ---------- fight state ---------- */
function newFight(cfg){
  G={
    cfg,B:BOSSES[cfg.boss],t:0,dt:0,turn:0,turnDef:null,phase:'text',pt:0,
    ents:[],shots:[],parts:[],pops:[],cos:[],soulEchoes:[],
    box:Object.assign({},MENUBOX),boxT:Object.assign({},MENUBOX),
    soul:{x:320,y:300,r:3.2,hp:cfg.hp||100,maxhp:cfg.hp||100,inv:0,freeze:0,kx:0,ky:0,side:1,moving:false,slow:false,charge:0,grazeFlash:0,fast:false},
    tp:0,hpBoss:cfg.bossHp,maxBoss:cfg.bossHp,guard:false,shake:0,flash:0,freeze:0,
    pose:'idle',bossFlash:0,dark:0,split:null,faceBoard:null,atkTint:null,
    flags:{phonesHard:false,face:null,neoDone:false,holdBreath:false,novaDone:false},
    novaMode:false,novaGlow:0,novaHue:0,novaFinale:false,novaShattered:false,glitchT:0,fleeT:0,
    menuSel:0,subSel:0,menuMode:'main',
    text:'',ti:0,doneT:-1,lastN:0,msg:'',hurtThisAttack:false,q:0,neoHits:0,
    lastGraze:0,ending:false,endT:0,fb:null,anim:null,tpFlash:0,
    btnPulse:0,btnFlash:0,
    fightBar:null,
    slashAnims:[],
    items:[
      {id:'candy',name:'Dark Candy',desc:'Restores 40 HP.',uses:2,effect:'hp',val:40},
      {id:'tea',name:'Choco Tea',desc:'Restores 60 HP.',uses:1,effect:'hp',val:60},
      {id:'tpbar',name:'TP Bar',desc:'Fills 40 TP.',uses:2,effect:'tp',val:40},
      {id:'tension',name:'Tension Bit',desc:'Fills 100 TP.',uses:1,effect:'tp',val:100},
      {id:'shield',name:'Scrap Shield',desc:'Guard this turn (extra).',uses:1,effect:'guard',val:1},
      {id:'spark',name:'Spark Cookie',desc:'Restores 25 HP + 20 TP.',uses:2,effect:'both',hp:25,tp:20}
    ]
  };
  inFight=true;
  nextTurn();
}
function spawn(o){
  const e=Object.assign({x:0,y:0,vx:0,vy:0,r:5,t:0,life:30,dmg:9,inv:.9,graze:.5,on:true,rot:0,spin:0,col:'#ff4a6b'},o);
  G.ents.push(e);return e;
}
function co(gen){G.cos.push({g:gen,w:0,done:false});}
function stepCos(dt){
  for(const c of G.cos){
    c.w-=dt;let n=0;
    while(c.w<=0&&!c.done&&n++<60){
      const r=c.g.next();
      if(r.done){c.done=true;break;}
      const v=r.value||0;
      if(v<=0){c.w=0;break;}
      c.w+=v;
    }
  }
  G.cos=G.cos.filter(c=>!c.done);
}
function* tween(dur,fn){let t=0;while(t<dur){t+=G.dt;fn(Math.min(1,t/dur));yield 0;}fn(1);}
function* until(f,max){let t=0;max=max||60;while(!f()&&t<max){t+=G.dt;yield 0;}}
function* delayed(t,f){yield t;f();}

function burst(x,y,n,col,sp,life,size){
  if(G.parts.length>180)return;
  n = Math.min(n, G.novaMode ? 8 : 14);
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),v=rnd(.3,1)*(sp||120);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.5,1)*(life||.5),max:life||.5,size:size||2,col:col||'#fff'});
  }
}
function pop(x,y,txt,col,big){G.pops.push({x,y,txt,col:col||'#fff',t:0,big:!!big});}
function addTP(n){G.tp=Math.min(100,G.tp+n);G.tpFlash=.15;}
function dmgBoss(n,o){
  o=o||{};
  n=Math.max(1,Math.round(n));
  if(G.phase==='victory')return;
  G.hpBoss=Math.max(0,G.hpBoss-n);G.bossFlash=.1;
  if(!o.quiet)pop(o.x||G.B.x,o.y||G.B.y+20,String(n),'#ffe14a',true);
  if(G.hpBoss<=0)winFight();
}
function hurt(dmg,inv,opt){
  const s=G.soul;
  if(s.inv>0||G.phase!=='attack'||s.hp<=0)return;
  opt=opt||{};
  let d;
  if(opt.pct)d=Math.max(0,Math.min(s.hp-1,Math.round(s.maxhp*opt.pct)));
  else d=Math.max(1,Math.round(dmg*(G.guard?.55:1)));
  s.hp=Math.max(0,s.hp-d);s.inv=inv||.9;G.hurtThisAttack=true;
  G.shake=Math.max(G.shake,9);G.freeze=Math.max(G.freeze,.05);
  sfx('hit');burst(s.x,s.y,10,'#ff2f55',150,.4,2);pop(s.x,s.y-12,String(d),'#ff6a7d',true);
  if(s.hp<=0){G.phase='dead';G.pt=0;sfx('lose');burst(s.x,s.y,30,'#ff2f55',220,1,3);}
}

/* ---------- soul ---------- */
function constrainSoul(){
  const s=G.soul,b=G.box,m=s.r+3;
  const clampRect=(p)=>{p.x=clamp(p.x,b.x+m,b.x+b.w-m);p.y=clamp(p.y,b.y+m,b.y+b.h-m);};
  if(!G.split){clampRect(s);return;}
  const sp=G.split,off=sp.off*s.side;
  const p={x:s.x-sp.nx*off,y:s.y-sp.ny*off};
  clampRect(p);
  let d=((p.x-sp.cx)*sp.nx+(p.y-sp.cy)*sp.ny)*s.side;
  if(d<m){p.x+=sp.nx*s.side*(m-d);p.y+=sp.ny*s.side*(m-d);}
  clampRect(p);
  s.x=p.x+sp.nx*off;s.y=p.y+sp.ny*off;
}
function updateSoul(dt){
  const s=G.soul;
  if(s.inv>0)s.inv-=dt;
  if(s.grazeFlash>0)s.grazeFlash=Math.max(0,s.grazeFlash-dt);
  if(s.freeze>0)s.freeze-=dt;
  else{
    let dx=(isDown('arrowright','d')?1:0)-(isDown('arrowleft','a')?1:0);
    let dy=(isDown('arrowdown','s')?1:0)-(isDown('arrowup','w')?1:0);
    s.slow=isDown('shift','x');
    const base=s.fast?148:118;
    const sp=s.slow?(base*0.5):base;
    if(dx&&dy){dx*=.7071;dy*=.7071;}
    s.x+=dx*sp*dt;s.y+=dy*sp*dt;s.moving=!!(dx||dy);
  }
  s.x+=s.kx*dt;s.y+=s.ky*dt;
  const dec=Math.pow(.004,dt);s.kx*=dec;s.ky*=dec;
  constrainSoul();
  if(G.cfg.soul==='yellow')updateShooting(dt);
}
function updateShooting(dt){
  const s=G.soul;
  if(s.freeze>0)return;
  if(isTap('z','enter',' ')){s.charge=0;s.holding=true;fireShot(false);}
  if(s.holding&&isDown('z','enter',' ')){
    const before=s.charge;s.charge+=dt;
    if(before<.7&&s.charge>=.7)sfx('charge');
  }
  if(isRel('z','enter',' ')&&s.holding){
    if(s.charge>=.7)fireShot(true);
    s.holding=false;s.charge=0;
  }
}
function fireShot(big){
  const s=G.soul;
  G.shots.push({x:s.x,y:s.y-8,vy:-560,big,r:big?10:3.6,dmg:big?4:1,hit:new Set(),life:2,dead:false});
  sfx(big?'big':'shot');
  if(big)G.shake=Math.max(G.shake,3);
}
function hitShootable(e,sh){
  e.hp-=sh.dmg;e.flash=.1;
  if(e.onHit)e.onHit(e,sh);
  if(e.hp<=0&&!e.dead){e.dead=true;if(e.onKill)e.onKill(e);}
}
function updateShots(dt){
  for(const sh of G.shots){
    sh.y+=sh.vy*dt;sh.life-=dt;
    for(const e of G.ents){
      if(!e.shoot||e.dead||sh.dead||sh.hit.has(e))continue;
      const d=e.sdShoot?e.sdShoot(e,sh.x,sh.y):Math.hypot(e.x-sh.x,e.y-sh.y)-e.r;
      if(d<sh.r){sh.hit.add(e);hitShootable(e,sh);if(!sh.big)sh.dead=true;}
    }
    const bh=G.B.hit;
    if(!sh.dead&&bh&&sh.y<bh.y+bh.h&&sh.y>bh.y&&Math.abs(sh.x-bh.x)<bh.w/2&&G.phase==='attack'){
      sh.dead=true;dmgBoss(sh.big?9:2,{x:sh.x,y:sh.y-10,quiet:!sh.big});burst(sh.x,sh.y,sh.big?10:4,'#ffe14a',110,.35,2);
    }
    if(sh.y<-20)sh.dead=true;
  }
  G.shots=G.shots.filter(s=>!s.dead&&s.life>0);
}

/* ---------- entities ---------- */
function updateEnts(dt){
  const s=G.soul;
  for(const e of G.ents){
    if(e.dead)continue;
    e.t+=dt;e.life-=dt;
    if(e.flash>0)e.flash-=dt;
    if(e.life<=0){e.dead=true;if(e.onDie)e.onDie(e);continue;}
    if(!e.nomove){e.x+=e.vx*dt;e.y+=e.vy*dt;}
    if(e.spin)e.rot+=e.spin*dt;
    if(e.upd)e.upd(e,dt);
    if(e.dead)continue;
    if(e.cull!==false&&(e.x<-90||e.x>W+90||e.y<-90||e.y>H+90)){e.dead=true;continue;}
    if(e.harm!==false&&e.on&&!(e.fade&&e.life<e.fade*.6)){
      const d=e.sd?e.sd(e,s.x,s.y):Math.hypot(e.x-s.x,e.y-s.y)-e.r;
      if(d<s.r)hurt(e.dmg,e.inv);
      else if(d<12&&!e.grazed&&e.graze>0){
        e.grazed=true;addTP(e.graze);
        s.grazeFlash=.2;
        if(!G.soulEchoes)G.soulEchoes=[];
        G.soulEchoes.push({x:s.x,y:s.y,life:.3,max:.3,col:G.cfg.soul==='yellow'?'#ffe83a':'#ff2a4d'});
        if(G.soulEchoes.length>8)G.soulEchoes.shift();
        if(G.t-G.lastGraze>.06){sfx('graze');G.lastGraze=G.t;}
        G.parts.push({x:s.x,y:s.y,vx:rnd(-40,40),vy:rnd(-40,40),life:.25,max:.25,size:2,col:'#fff'});
      }
    }
  }
  G.ents=G.ents.filter(e=>!e.dead);
}

/* ---------- board / bg drawing ---------- */
function drawBg(c){
  c.fillStyle='#05030b';c.fillRect(0,0,W,H);
  const th=G.B.theme,bx=G.B.x,by=G.B.y;
  if(G.novaMode){
    const hue = G.novaHue||0;
    const g=c.createRadialGradient(W/2,H/2-20,20,W/2,H/2-20,420);
    g.addColorStop(0, 'rgba('+(180+75*hue)+','+(20+40*hue)+','+(60+120*hue)+','+(0.55+0.25*hue)+')');

/* ---- Stars ---- */
function* atkStars(v){

  G.atkTint=v===1?'160,90,255':v===2?'220,40,60':'255,40,190';
  const n=v===3?18:26,col=v===1?'#b57bff':v===2?'#ffd23f':'#ff5aa5';
  const stars=[];

      rot:rnd(0,TAU),spin:rnd(1,2)*(i%2?1:-1),col,size:2,sa:rnd(0,TAU),tele:0,
      upd(e,dt){e.size=Math.min(11,e.size+dt*5.5);},
      draw(c,e){
        if(e.tele>0){
          c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1;
          for(let k=0;k<6;k++){const a2=e.sa+k*PI/3;c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.x+Math.cos(a2)*46,e.y+Math.sin(a2)*46);c.stroke();}
        }

function starBurst(s,v){

/* ---- Tracking Swords ---- */
function slashLine(x,y,ang,o){
  o=o||{};
  const w=o.w||9,tele=o.tele||0,dur=o.dur||.26,len=o.len||1000;
  const e=spawn({kind:'slash',x,y,ang,w,on:false,life:tele+dur+.25,dmg:o.dmg||12,inv:o.inv||.9,graze:o.graze!==undefined?o.graze:4,cull:false,len,
    sd(e,px,py){
      const dx=px-e.x,dy=py-e.y,ca=Math.cos(e.ang),sa=Math.sin(e.ang);
      const perp=Math.abs(-dx*sa+dy*ca),along=Math.abs(dx*ca+dy*sa);
      return (along>e.len/2?Math.hypot(along-e.len/2,perp):perp)-e.w/2;
    },
    draw(c,e){
      const ca=Math.cos(e.ang),sa=Math.sin(e.ang),L=e.len/2;
      let a,wd,col;
      if(e.t<tele){a=.25+.5*(e.t/tele);wd=1.5;col='255,60,90';}
      else if(e.t<tele+dur){a=1;wd=e.w;col='255,255,255';}
      else{const f=Math.max(0,1-(e.t-tele-dur)/.25);a=f;wd=e.w*f;col='255,255,255';}
      c.strokeStyle='rgba('+col+','+a+')';c.lineWidth=Math.max(.5,wd);
      c.beginPath();c.moveTo(e.x-ca*L,e.y-sa*L);c.lineTo(e.x+ca*L,e.y+sa*L);c.stroke();
      if(e.t>=tele&&e.t<tele+dur){c.strokeStyle='rgba(170,215,255,.45)';c.lineWidth=wd*2.4;c.stroke();}
    }});
  co((function*(){
    if(tele>0)yield tele;
    e.on=true;sfx('slash');G.shake=Math.max(G.shake,3);
    yield dur;e.on=false;
  })());
  return e;
}
function advanceStrike(e,dt){
  if(e.mode==='lock'){
    if(e.t>=.22){e.mode='pull';e.t=0;e.fromX=e.x;e.fromY=e.y;
      e.toX=e.x+Math.cos(e.ang)*28;e.toY=e.y+Math.sin(e.ang)*28;}
  }else if(e.mode==='pull'){
    const f=Math.min(1,e.t/.14);
    e.x=lerp(e.fromX,e.toX,easeOut(f));e.y=lerp(e.fromY,e.toY,easeOut(f));
    if(f>=1){e.mode='dash';e.t=0;e.harm=true;
      e.vx=-Math.cos(e.ang)*e.spd;e.vy=-Math.sin(e.ang)*e.spd;
      sfx('slash');G.shake=Math.max(G.shake,3);}
  }else if(e.mode==='dash'){
    e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.x<-80||e.x>W+80||e.y<-80||e.y>H+80)e.dead=true;
  }
}
function strikeSd(e,px,py){
  if(e.mode!=='dash')return 999;
  const ca=-Math.cos(e.ang),sa=-Math.sin(e.ang);
  return sdSeg(px,py,e.x-ca*20,e.y-sa*20,e.x+ca*34,e.y+sa*34)-4;
}
function strikeDraw(c,e){
  const dashing=e.mode==='dash';
  drawSword(c,e.x,e.y,e.ang+PI,58,8,dashing?'#ffffff':(e.red?'#ff2f55':'#e7ecff'),dashing?'#fff':(e.red?'#ff2f55':null));
}
function spawnTSword(ang,trackDur,dmg,spd){
  const startDist=rnd(175,210);
  return spawn({kind:'tsword',x:G.soul.x+Math.cos(ang)*startDist,y:G.soul.y+Math.sin(ang)*startDist,ang,mode:'track',
    trackDur,dmg,spd,startDist,harm:false,life:trackDur+3.2,cull:false,red:0,graze:.4,
    sd:strikeSd,
    upd(e,dt){
      if(e.mode==='track'){
        const dist=e.startDist;
        e.x=G.soul.x+Math.cos(e.ang)*dist;e.y=G.soul.y+Math.sin(e.ang)*dist;
        if(e.t>=e.trackDur){e.mode='lock';e.t=0;e.red=1;sfx('warn');}

}
function* atkTracking(v){
  G.pose='cast2';

  const n=v===1?12:22;let last=-1;
  for(let i=0;i<n;i++){

function* trackRing(){
  for(let round=0;round<2;round++){
    const ring={cx:G.soul.x,cy:G.soul.y,t:0,R:30};
    const ringE=spawn({harm:false,cull:false,life:40,
      upd(e,dt){

        ring.cx+=(G.soul.x-ring.cx)*Math.min(1,dt*1.8);ring.cy+=(G.soul.y-ring.cy)*Math.min(1,dt*1.8);
        ring.R=lerp(ring.R,74+30*Math.sin(ring.t*2.6),Math.min(1,dt*6));
      }});
    const sws=[];
    for(let k=0;k<8;k++){
      sws.push(spawn({kind:'tsword',mode:'ring',harm:false,ang:k*PI/4,x:ring.cx,y:ring.cy,red:0,cull:false,life:40,graze:.4,
        dmg:13+round*3,spd:560+round*90,
        sd:strikeSd,
        upd(e,dt){
          if(e.mode==='ring'){e.x=ring.cx+Math.cos(e.ang)*ring.R;e.y=ring.cy+Math.sin(e.ang)*ring.R;return;}
          advanceStrike(e,dt);

function pickSpeed(hist){

  if(n>=2&&hist[n-1]===hist[n-2]&&hist[n-1]===sp)sp=(sp===270?150:270);
  hist.push(sp);if(hist.length>3)hist.shift();
  return sp;
}
function spawnDia(x,y,vx,vy,col){

function cleave(nx,ny,d){

  sfx('hit');G.freeze=.12;s.freeze=.4;
  const sg=d>=0?1:-1;s.kx=nx*sg*380;s.ky=ny*sg*380;G.shake=Math.max(G.shake,14);

function* doCut(mode,v){
  const b=G.box,s=G.soul,cx=b.x+b.w/2,cy=b.y+b.h/2;
  const th=mode==='v'?PI/2+rnd(-.07,.07):mode==='h'?rnd(-.07,.07):pick([PI/4,-PI/4]);
  const nx=-Math.sin(th),ny=Math.cos(th),dx=Math.cos(th),dy=Math.sin(th);

    draw(c,e){
      const a=Math.min(1,e.t/.5);
      c.save();c.beginPath();c.rect(b.x,b.y,b.w,b.h);c.clip();
      c.strokeStyle='rgba(255,60,90,'+(.25+.7*a)+')';c.lineWidth=1+3*a;
      c.beginPath();c.moveTo(ccx-dx*500,ccy-dy*500);c.lineTo(ccx+dx*500,ccy+dy*500);c.stroke();
      c.restore();
    }});
  sfx('warn');
  yield .5;

  const d=(s.x-ccx)*nx+(s.y-ccy)*ny;

  const sp=G.split={cx:ccx,cy:ccy,nx,ny,th,off:0};
  s.side=d>=0?1:-1;
  yield* tween(.12,p=>{sp.off=26*easeOut(p);});
  const hist={1:[],'-1':[]},ext=Math.abs(dx)*b.w/2+Math.abs(dy)*b.h/2-6;

        spawnDia(ccx,ccy,Math.cos(a)*spd,Math.sin(a)*spd);

      rot+=.33;

      for(const side of [1,-1]){
        const u=rnd(-ext,ext),spd=pickSpeed(hist[side]);
        spawnDia(ccx+dx*u+nx*side*sp.off,ccy+dy*u+ny*side*sp.off,nx*side*spd,ny*side*spd);

function* atkSplitter(v){

/* ---- Sword Tunnel ---- */
function* atkTunnel(v){

  const gapH=v===3?18:26,spd=v===3?420:360,dur=v===2?6.8:6.0,step=.095;

/* ---- Rotating Slash ---- */
function rotLines(C,n){
  const a0=rnd(0,PI),w0=rnd(9,13)*(Math.random()<.5?1:-1),T=.78;
  spawn({kind:'rot',x:C.x,y:C.y,cull:false,life:T+.22+.22+.28,dmg:10,graze:3,on:false,inv:1,n,ang:a0,fired:false,
    sd(e,px,py){
      let m=999;
      for(let k=0;k<e.n;k++){
        const a=e.ang+k*PI/e.n,d=Math.abs(-(px-e.x)*Math.sin(a)+(py-e.y)*Math.cos(a));
        if(d<m)m=d;
      }
      return m-8;
    },
    upd(e,dt){
      if(e.t<T){const p=e.t/T;e.ang=a0+w0*T/3*(1-Math.pow(1-p,3));}
      e.on=e.t>=T+.22&&e.t<T+.44;
      if(e.on&&!e.fired){e.fired=true;sfx('slash');G.shake=Math.max(G.shake,4);}
    },
    draw(c,e){
      let col,wd,al;
      if(e.t<T){col='255,50,80';wd=1.5;al=.55;}
      else if(e.t<T+.22){col='255,70,90';wd=3;al=.95;}
      else if(e.t<T+.44){col='255,255,255';wd=9;al=1;}
      else{const f=Math.max(0,1-(e.t-T-.44)/.28);col='255,255,255';wd=9*f;al=f;}
      c.strokeStyle='rgba('+col+','+al+')';c.lineWidth=Math.max(.5,wd);
      for(let k=0;k<e.n;k++){
        const a=e.ang+k*PI/e.n;
        c.beginPath();c.moveTo(e.x-Math.cos(a)*700,e.y-Math.sin(a)*700);c.lineTo(e.x+Math.cos(a)*700,e.y+Math.sin(a)*700);c.stroke();
      }
      if(e.t<T+.22){c.strokeStyle='rgba(255,90,110,.8)';c.lineWidth=1.5;c.beginPath();c.arc(e.x,e.y,6,0,TAU);c.stroke();}
    }});
}
function* atkRotSlash(v){

/* ---- Knight drawing ---- */
function drawKnight(c,x0,y0,t,o){

  const baseX=x0+leanX,baseY=y0+bob;

  else if(pose==='spread'){px=x-70;py=y+8;}

  c.beginPath();c.moveTo(x-19,y-8);c.lineTo(x-21,y-38);c.lineTo(x-14,y-30);c.lineTo(x-9,y-52);c.lineTo(x-3,y-36);c.lineTo(x+3,y-58);c.lineTo(x+9,y-36);c.lineTo(x+14,y-52);c.lineTo(x+14,y-30);c.lineTo(x+21,y-38);c.lineTo(x+19,y-8);c.closePath();c.fill();
  c.strokeStyle=fl?'#fff':'#7a5cff';c.stroke();
  c.fillStyle=fl?'#fff':'#12092b';
  for(const hs of [-1,1]){
    c.beginPath();c.moveTo(x+hs*13,y-46);

}

/* ---------- turn flow ---------- */
/* ---------- FIGHT timing bar + slash anim ---------- */
function startFightBar(){
  const zone = 0.38 + rnd(-0.04, 0.06);
  G.fightBar = {
    t:0, stopped:false, pos:1.08,
    zone, zoneW:0.07,
    result:null, dmg:0, label:'',
    animT:0, done:false, pressLock:false, applied:false
  };
  G.phase = 'fightBar';
  G.pose = 'idle';
  sfx('sel');
}
function scoreFightBar(pos, zone, zoneW){
  const dist = Math.abs(pos - zone);
  if(dist <= zoneW * 0.28) return {tier:'perfect', dmg:76, label:'PERFECT!'};
  if(dist <= zoneW * 0.7)  return {tier:'great',   dmg:rint(52,60), label:'GREAT'};
  if(dist <= zoneW * 1.35) return {tier:'ok',      dmg:rint(26,34), label:'OK'};
  return {tier:'miss', dmg:0, label:'MISS'};
}
function resolveFightBar(){
  const fb = G.fightBar;
  if(!fb || fb.stopped) return;
  fb.stopped = true;
  fb.pos = clamp(fb.pos, 0, 1);
  const sc = scoreFightBar(fb.pos, fb.zone, fb.zoneW);
  fb.result = sc.tier;
  fb.dmg = sc.dmg;
  fb.label = sc.label;
  fb.animT = 0;
  if(sc.dmg > 0){
    sfx('slash');
    const fl = bossFloat(G.t, false);
    const tx = G.B.x + fl.ox, ty = G.B.y + fl.oy + 20;
    G.slashAnims.push({
      x: 320, y: 360, tx, ty, t:0, life:0.45,
      hit:false, dmg:sc.dmg, big:sc.tier==='perfect'
    });
  } else {
    sfx('no');
  }
}
function updateFightBar(dt){
  const fb = G.fightBar;
  if(!fb) return;
  fb.t += dt;
  if(!fb.stopped){
    const spd = 1.15 + Math.min(0.35, fb.t * 0.08);
    fb.pos -= spd * dt;
    if(fb.pos < -0.05){
      fb.pos = -0.05;
      resolveFightBar();
    }
    if(isTap('z','enter',' ')) resolveFightBar();
  } else {
    fb.animT += dt;
    const wait = fb.dmg > 0 ? 0.7 : 0.55;
    if(fb.animT >= wait && !fb.done){
      fb.done = true;
      if(fb.dmg > 0){
        // apply damage now if the slash-anim path hasn't already (rare edge case)
        if(!fb.applied){
          dmgBoss(fb.dmg, {x:G.B.x, y:G.B.y+20});
          G.shake = Math.max(G.shake, fb.result==='perfect'?10:6);
          G.bossFlash = 0.18;
          G.pose = 'slash';
          fb.applied = true;
        }
        // finalize this FIGHT — regardless of WHICH path applied the damage,
        // this is the single place that decides what happens next.
        if(G.novaFinale){
          G.fightBar = null;
          triggerNovaVictory();
          return;
        }
      } else {
        pop(320, 250, 'MISS', '#9a8fc9', true);
      }
      startAttack();
      G.fightBar = null;
    }
  }
}
function updateSlashAnims(dt){
  for(const s of G.slashAnims){
    s.t += dt;
    const p = Math.min(1, s.t / 0.28);
    const e = easeOut(p);
    s.x = lerp(320, s.tx, e);
    s.y = lerp(360, s.ty, e);
    if(!s.hit && p >= 1){
      s.hit = true;
      if(G.fightBar && !G.fightBar.applied){
        // this only ever APPLIES the hit's damage/vfx — it never decides
        // what happens after (that's updateFightBar's job, see above)
        dmgBoss(s.dmg, {x:s.tx, y:s.ty});
        G.fightBar.applied = true;
        G.shake = Math.max(G.shake, s.big?12:7);
        G.bossFlash = 0.2;
        G.pose = 'slash';
        burst(s.tx, s.ty, s.big?18:10, '#ffe14a', 160, 0.5, 3);
        if(s.big){ G.flash = 0.12; G.flashCol = '#ffe14a'; }
      }
    }
  }
  G.slashAnims = G.slashAnims.filter(s => s.t < s.life);
}
function drawFightBar(c){
  const fb = G.fightBar;
  if(!fb || G.phase !== 'fightBar') return;
  const bx = 80, by = 340, bw = 480, bh = 28;
  c.fillStyle = 'rgba(0,0,0,0.75)';
  c.fillRect(bx-4, by-8, bw+8, bh+36);
  c.strokeStyle = '#5b3fc4'; c.lineWidth = 2;
  c.strokeRect(bx-4, by-8, bw+8, bh+36);
  c.fillStyle = '#1a1030';
  c.fillRect(bx, by, bw, bh);
  c.strokeStyle = '#fff'; c.lineWidth = 2;
  c.strokeRect(bx, by, bw, bh);
  const zx = bx + fb.zone * bw;
  const zw = fb.zoneW * bw;
  const pulse = 0.55 + 0.45 * Math.abs(Math.sin(G.t * 6));
  c.fillStyle = 'rgba(255,225,74,' + (0.25 * pulse) + ')';
  c.fillRect(zx - zw/2, by+2, zw, bh-4);
  c.strokeStyle = 'rgba(255,225,74,' + pulse + ')';
  c.lineWidth = 2;
  c.strokeRect(zx - zw/2, by+2, zw, bh-4);
  c.strokeStyle = '#ffe14a'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(zx, by+2); c.lineTo(zx, by+bh-2); c.stroke();
  const mx = bx + clamp(fb.pos, 0, 1) * bw;
  c.fillStyle = fb.stopped ? (fb.dmg>0 ? '#fff' : '#ff6a7d') : '#ff2a4d';
  c.fillRect(mx-3, by-4, 6, bh+8);
  c.strokeStyle = '#fff'; c.lineWidth = 1;
  c.strokeRect(mx-3, by-4, 6, bh+8);
  if(fb.stopped){
    const col = fb.result==='perfect' ? '#ffe14a' : fb.result==='miss' ? '#ff6a7d' : '#fff';
    text(c, fb.label, W/2, by-18, fb.result==='perfect'?14:11, col, 'center');
    if(fb.dmg>0) text(c, String(fb.dmg), W/2, by+bh+22, 12, '#ffe14a', 'center');
  } else {
    text(c, 'Z / ENTER — stop the bar!', W/2, by+bh+20, 8, '#9a8fc9', 'center');
  }
}
function drawSlashAnims(c){
  for(const s of G.slashAnims){
    const a = 1 - s.t / s.life;
    c.save();
    c.globalAlpha = Math.max(0, a);
    const ang = Math.atan2(s.ty - 360, s.tx - 320);
    c.strokeStyle = s.big ? '#ffe14a' : '#c9d0ff';
    c.lineWidth = s.big ? 5 : 3;
    c.shadowColor = s.big ? '#ffe14a' : '#8b5cff';
    c.shadowBlur = 12;
    c.beginPath();
    c.moveTo(s.x - Math.cos(ang)*40, s.y - Math.sin(ang)*40);
    c.lineTo(s.x + Math.cos(ang)*20, s.y + Math.sin(ang)*20);
    c.stroke();
    drawSword(c, s.x, s.y, ang, s.big?70:52, s.big?10:7, s.big?'#fff':'#e7ecff', s.big?'#ffe14a':'#8b5cff');
    c.restore();
  }
}

/* ---------- Crystal Nova ---------- */
function* atkCrystalNova(){
  G.pose = 'spread';
  G.flags.novaDone = true;
  G.novaMode = true;
  G.novaFinale = false;
  G.novaShattered = false;
  G.atkTint = null;
  G.msg = 'The Knight gathers an unfathomable light...';
  G.boxT = {x: 8, y: 8, w: W-16, h: H-16};
  G.boardCol = 'rgba(255,255,255,0)';
  G.novaGlow = 0;
  G.novaHue = 0;

  yield* tween(1.2, p => {
    G.novaGlow = p;
    G.dark = 0.12 * p;
    G.novaHue = p * 0.35;
  });
  sfx('charge');
  yield* tween(0.5, p => {
    G.novaGlow = 1;
    G.novaHue = 0.35 + 0.65 * p;
    G.dark = 0.12 + 0.2 * p;
  });
  sfx('big');
  G.shake = Math.max(G.shake, 6);
  G.flash = 0.15; G.flashCol = '#ffffff';

  const cx = W/2, cy = H/2 - 40;
  const crystals = [];

  // trimmed crystal counts (was 8/12/10/6 = 36) for far fewer simultaneous entities
  const patterns = [
    { n:6,  R:[300,380], delay:0.00, size:[18,26], sp:[70,100], spin:1.2 },
    { n:8,  R:[260,340], delay:0.55, size:[14,20], sp:[85,120], spin:1.8 },
    { n:7,  R:[280,400], delay:1.15, size:[16,26], sp:[60,110], spin:2.2 },
    { n:4,  R:[320,420], delay:1.75, size:[20,30], sp:[90,130], spin:1.0 },
  ];

  for(const pat of patterns){
    for(let i=0;i<pat.n;i++){
      const a = (i/pat.n)*TAU + rnd(-0.15,0.15) + pat.delay;
      const R = rnd(pat.R[0], pat.R[1]);
      const ox = cx + Math.cos(a)*R, oy = cy + Math.sin(a)*R;
      const sz = rnd(pat.size[0], pat.size[1]);
      const sp = rnd(pat.sp[0], pat.sp[1]);
      const ang = Math.atan2(cy-oy, cx-ox);
      const e = spawn({
        kind:'star', x:ox, y:oy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        r: sz*0.45, life:12, dmg:11, graze:0.8, harm:true,
        rot:rnd(0,TAU), spin:pat.spin*(i%2?1:-1),
        col:pick(['#ff6ad5','#c9a0ff','#ffe14a','#fff','#ff2f55','#e0c0ff']),
        size:sz, targetSize:sz, sa:ang, phase:'in',
        draw(c,e){
          star6(c, e.x, e.y, e.size, e.rot, e.col);
        },
        upd(e,dt){
          if(e.phase==='in'){
            const d = Math.hypot(e.x-cx, e.y-cy);
            if(d < 55){ e.vx*=0.85; e.vy*=0.85; }
            if(d < 28){ e.vx=0; e.vy=0; e.phase='held'; e.holdT=0; }
          } else if(e.phase==='held'){
            e.holdT = (e.holdT||0)+dt;
            e.x = cx + Math.cos(e.sa + e.holdT*0.8)*22;
            e.y = cy + Math.sin(e.sa + e.holdT*0.8)*22;
          }
        }
      });
      crystals.push(e);
      if(i%3===0) sfx('pop');
      yield 0.04;
    }
    yield Math.max(0, pat.delay > 0 ? 0.15 : 0.25);
  }

  yield* until(() => crystals.filter(c=>!c.dead && c.phase==='held').length >= crystals.length*0.7, 4);
  yield 0.35;

  G.pose = 'slash';
  sfx('boom'); sfx('buster');
  G.shake = Math.max(G.shake, 14);
  G.flash = 0.22; G.flashCol = '#ffffff';
  G.novaGlow = 1.2;

  for(const e of crystals){
    if(e.dead) continue;
    e.phase = 'out';
    const a = Math.atan2(e.y-cy, e.x-cx) + rnd(-0.2,0.2);
    const sp = rnd(280,420);
    e.vx = Math.cos(a)*sp;
    e.vy = Math.sin(a)*sp;
    e.spin = rnd(4,8)*(Math.random()<0.5?1:-1);
  }
  yield 0.55;

  for(const e of crystals){
    if(e.dead) continue;
    e.phase = 'return';
    const a = Math.atan2(cy-e.y, cx-e.x);
    const sp = rnd(160,240);
    e.vx = Math.cos(a)*sp;
    e.vy = Math.sin(a)*sp;
  }
  sfx('charge');
  yield 0.45;

  // explode — trimmed shard counts (was 5-8 each) for far fewer entities on screen at once
  for(const e of crystals){
    if(e.dead) continue;
    e.dead = true;
    burst(e.x, e.y, 5, e.col, 140, 0.4, 3);
    const nSh = 3 + (e.size>24?2:0);
    for(let k=0;k<nSh;k++){
      const a = rnd(0,TAU);
      const sp = rnd(80,160);
      spawn({
        kind:'shard', x:e.x, y:e.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        r: 5 + e.size*0.15, life:2.0, fade:0.4, dmg:11, graze:0.5,
        col: e.col, rot:a, spin:rnd(-4,4),
        draw(c,q){
          const al = q.fade?clamp(q.life/q.fade,0,1):1;
          c.globalAlpha = al;
          c.save(); c.translate(q.x,q.y); c.rotate(q.rot||0);
          c.fillStyle = q.col;
          const s2 = 8 + (q.r||5);
          c.beginPath();
          c.moveTo(s2,0); c.lineTo(0,s2*0.5); c.lineTo(-s2*0.75,0); c.lineTo(0,-s2*0.5);
          c.closePath(); c.fill();
          c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;c.stroke();
          c.restore(); c.globalAlpha=1;
        }
      });
    }
  }
  sfx('boom'); sfx('crack');
  G.shake = Math.max(G.shake, 10);
  G.flash = 0.2; G.flashCol = '#ffd0ff';
  yield 0.5;

  G.pose = 'slash';
  const th = PI/4 + rnd(-0.08,0.08);
  slashLine(cx, cy, th, {w:16, tele:0.35, dur:0.3, dmg:14, graze:2, len:1500});
  yield 0.2;
  slashLine(cx, cy, th+PI/2, {w:14, tele:0.28, dur:0.26, dmg:13, graze:2, len:1500});
  yield 0.18;
  slashLine(cx, cy, th+0.4, {w:12, tele:0.22, dur:0.22, dmg:12, graze:1.5, len:1500});
  yield 0.35;

  G.novaShattered = true;
  G.shatterPieces = [];
  for(let i=0;i<12;i++){
    G.shatterPieces.push({
      x: rnd(0,W), y: rnd(0,H),
      vx: rnd(-180,180), vy: rnd(-60,220),
      rot: rnd(0,TAU), spin: rnd(-4,4),
      w: rnd(40,120), h: rnd(30,90),
      life: 1.2, max: 1.2,
      col: pick(['#5a1020','#3a0a30','#2a1040','#4a1830'])
    });
  }
  sfx('crack'); sfx('boom');
  G.shake = Math.max(G.shake, 16);
  G.flash = 0.3; G.flashCol = '#ffffff';

  yield* tween(0.9, p => {
    G.novaHue = 1-p;
    G.novaGlow = 1-p;
    G.dark = 0.35*(1-p);
    for(const pce of G.shatterPieces){
      pce.x += pce.vx * G.dt;
      pce.y += pce.vy * G.dt;
      pce.vy += 280 * G.dt;
      pce.rot += pce.spin * G.dt;
      pce.life -= G.dt;
    }
  });
  G.shatterPieces = [];
  G.novaMode = false;
  G.novaGlow = 0;
  G.novaHue = 0;
  G.boardCol = null;
  G.boxT = Object.assign({}, BOX0);
  G.pose = 'idle';

  for(const e of G.ents){
    if(e.kind==='star'||e.kind==='shard'||e.kind==='slash'){ e.dead=true; e.harm=false; }
  }

  G.novaFinale = true;
  G.msg = 'The Knight is exposed... FIGHT!';
  G.pose = 'cast';
  for(let wave=0; wave<3; wave++){
    for(let k=0;k<6;k++){
      const a = k/6*TAU + wave*0.3;
      spawn({
        kind:'shard', x:G.B.x+Math.cos(a)*20, y:G.B.y+Math.sin(a)*20,
        vx:Math.cos(a)*rnd(100,150), vy:Math.sin(a)*rnd(100,150),
        r:5, life:2.5, fade:0.3, dmg:10, graze:0.4,
        col:'#c9a0ff', rot:a, draw:drawShard
      });
    }
    sfx('pop');
    yield 0.55;
  }
  yield 0.8;
  G.pose = 'idle';
}

  }else if(it.effect==='tp'){
    addTP(it.val);sfx('sel');pop(s.x,s.y-16,'+'+it.val+' TP','#8fe3ff',true);
  }else if(it.effect==='guard'){
    G.guard=true;sfx('sel');pop(s.x,s.y-16,'Guarding!','#8fe3ff',true);

    return 'text';
  }
  if(idx===1){
    if(G.flags.holdBreath){
      G.msg='* You already held your breath.\n* (Speed boost cannot stack.)';
      sfx('no');
      return 'text';
    }
    G.flags.holdBreath=true;G.soul.fast=true;
    G.msg='* You hold your breath.\n* Your SOUL feels lighter... MOVEMENT UP!';
    sfx('heal');pop(G.soul.x,G.soul.y-16,'SPD UP','#8fe3ff',true);
    return 'text';
  }
  return null;
}

let trailTick=0;
function bossFloat(t,active){
  const amp=active?1.15:1;
  const ox=(Math.sin(t*.55)*38+Math.sin(t*1.45)*14+Math.sin(t*2.1)*6)*amp;
  const oy=(Math.cos(t*.42)*22+Math.sin(t*1.05)*10+Math.cos(t*1.8)*5)*amp;
  const lean=active?Math.sin(t*1.7)*8:0;
  return{ox:ox+lean,oy:oy};
}
function drawPose(c){
  const fl=bossFloat(G.t,G.pose!=='idle'||G.novaMode);
  let bx = G.novaMode ? (W/2 + fl.ox*0.4) : (G.B.x+fl.ox);
  let by = G.novaMode ? (H/2 - 40 + fl.oy*0.4) : (G.B.y+fl.oy);
  if(G.phase==='glitchFlee' && G.fleeT>0){
    bx += G.fleeT * 40;
    by -= G.fleeT * G.fleeT * 180;
  }
  if(G.phase==='glitchFlee' && G.glitchT>=0.55 && G.glitchT<1.7){
    bx += rnd(-8,8);
    by += rnd(-6,6);
  }
  trailTick++;
  if(!G.trail)G.trail=[];
  if(trailTick%2===0){
    G.trail.push({x:bx,y:by,t:G.t,pose:G.pose});
    // trimmed trail cap during nova (was 16) — fewer full-boss redraws per frame
    if(G.trail.length > (G.novaMode?7:10)) G.trail.shift();
  }
  const active = G.pose!=='idle' || G.novaMode;
  const ghostN = G.novaMode ? G.trail.length : (active?G.trail.length:Math.min(3,G.trail.length));
  for(let i=0;i<Math.max(0,ghostN-1);i++){
    const gI=G.trail.length-ghostN+i;
    const g2=G.trail[gI];
    if(!g2)continue;
    const a = G.novaMode
      ? ((i+1)/ghostN) * 0.5
      : ((i+1)/ghostN)*(active?.28:.12);
    c.save();
    c.globalAlpha=a;
    c.globalCompositeOperation='lighter';
    // dropped the per-ghost brightness filter — canvas filters are expensive when
    // applied to a full multi-shape sprite redraw several times a frame; the
    // 'lighter' composite + alpha alone already reads as a bright glow trail
    G.B.draw(c,g2.x,g2.y,g2.t,{pose:g2.pose, flash: 0});
    c.restore();
  }
  if(G.novaGlow > 0){
    const g = c.createRadialGradient(bx, by, 10, bx, by, 90 + G.novaGlow*40);
    g.addColorStop(0, 'rgba(255,255,255,'+(0.55*G.novaGlow)+')');
    g.addColorStop(0.4, 'rgba(255,200,255,'+(0.25*G.novaGlow)+')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.fillRect(bx-140, by-140, 280, 280);
  }
  c.save();
  if(G.bossFlash>0 || (G.novaGlow||0)>0.5){
    c.filter = 'brightness('+(2.4 + (G.novaGlow||0)*1.5)+')';
  }
  G.B.draw(c,bx,by,G.t,{flash: G.bossFlash || ((G.novaGlow||0)>0.6 ? 0.5 : 0), pose:G.pose});
  c.restore();
}

/* ---------- particles / pops ---------- */
function updateFX(dt){
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.soulEchoes){for(const e of G.soulEchoes)e.life-=dt;G.soulEchoes=G.soulEchoes.filter(e=>e.life>0);}
  for(const p of G.pops){p.t+=dt;p.y-=dt*22;}
  G.pops=G.pops.filter(p=>p.t<.9);
  const rdt=G.rawDt||dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-rdt*22);
  if(G.flash>0)G.flash-=rdt*3.3;
  if(G.bossFlash>0)G.bossFlash-=dt;
  if(G.tpFlash>0)G.tpFlash-=dt;
  const bt=G.boxT;
  G.box.x=lerp(G.box.x,bt.x,Math.min(1,dt*7));G.box.y=lerp(G.box.y,bt.y,Math.min(1,dt*7));
  G.box.w=lerp(G.box.w,bt.w,Math.min(1,dt*7));G.box.h=lerp(G.box.h,bt.h,Math.min(1,dt*7));
}
function drawFX(c){
  for(const p of G.parts){c.globalAlpha=Math.max(0,p.life)/p.max||Math.max(0,p.life);c.fillStyle=p.col;c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  c.globalAlpha=1;
  for(const p of G.pops){
    const a=1-p.t/.9;c.globalAlpha=a;
    text(c,p.txt,p.x,p.y,p.big?11:8,p.col,'center');
  }
  c.globalAlpha=1;
}

/* ---------- MAIN LOOP ---------- */
let lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.033,(now-lastT)/1000);lastT=now;
  ctx.setTransform(S,0,0,S,0,0);
  if(!inFight){menuFrame(dt);for(const k in pressed)delete pressed[k];for(const k in released)delete released[k];return;}
  G.rawDt=dt;
  if(G.freeze>0)G.freeze=Math.max(0,G.freeze-dt);
  G.dt=dt*(G.freeze>0?0:1);
  G.t+=dt;
  updateGame(G.dt);
  renderGame();
  for(const k in pressed)delete pressed[k];
  for(const k in released)delete released[k];
}
function updateGame(dt){
  if(dt<=0){dt=0;}
  stepCos(G.dt);
  updateFX(dt);
  const s=G.soul;
  if(G.phase==='menu'){
    G.btnPulse=(G.btnPulse||0)+dt;
    if(G.btnFlash>0)G.btnFlash-=dt;
    if(G.menuMode==='main'){
      if(isTap('arrowleft','a')){G.menuSel=(G.menuSel+3)%4;sfx('sel');}
      if(isTap('arrowright','d')){G.menuSel=(G.menuSel+1)%4;sfx('sel');}
      if(isTap('z','enter',' ')){
        sfx('sel');G.btnFlash=.25;
        if(G.menuSel===0){
          startFightBar();
        }else if(G.menuSel===1){
          G.menuMode='act';G.subSel=0;
        }else if(G.menuSel===2){
          const avail=G.items.filter(it=>it.uses>0);
          if(avail.length===0){sfx('no');G.msg='* You have no items left.';G.menuMode='text';G.pt=0;}
          else{G.menuMode='item';G.subSel=0;}
        }else{
          G.guard=true;pop(s.x,s.y-4,'Defending...','#8fe3ff');startAttack();
        }
      }
    }else if(G.menuMode==='act'){
      if(isTap('arrowup','w')){G.subSel=(G.subSel+1)%2;sfx('sel');}
      if(isTap('arrowdown','s')){G.subSel=(G.subSel+1)%2;sfx('sel');}
      if(isTap('x','shift','escape')){G.menuMode='main';sfx('sel');}
      if(isTap('z','enter',' ')){
        const r=doAct(G.subSel);
        if(r==='text'){G.menuMode='text';G.pt=0;}
        else startAttack();
      }
    }else if(G.menuMode==='item'){
      const avail=G.items.filter(it=>it.uses>0);
      const n=avail.length||1;
      if(isTap('arrowup','w')){G.subSel=(G.subSel+n-1)%n;sfx('sel');}
      if(isTap('arrowdown','s')){G.subSel=(G.subSel+1)%n;sfx('sel');}
      if(isTap('x','shift','escape')){G.menuMode='main';sfx('sel');}
      if(isTap('z','enter',' ')){
        if(avail.length===0){G.menuMode='main';return;}
        const realIdx=G.items.indexOf(avail[G.subSel]);
        if(useItem(realIdx)){startAttack();}
      }
    }else if(G.menuMode==='text'){
      G.pt+=dt;
      if(isTap('z','enter',' ')||G.pt>2.4){G.menuMode='main';G.msg=G.turnDef?G.turnDef.txt:'';startAttack();}
    }
    return;
  }
  if(G.phase==='fightBar'){
    updateFX(dt);
    updateFightBar(dt);
    updateSlashAnims(dt);
    return;
  }
  if(G.phase==='glitchFlee'){
    updateFX(dt);
    G.glitchT += dt;
    if(G.glitchT < 0.55){
      G.bossFlash = 0.4;
      G.pose = 'idle';
    } else if(G.glitchT < 1.7){
      G.bossFlash = Math.random() < 0.4 ? 0.6 : 0;
      if(Math.random() < 0.15) sfx('crack');
      G.shake = Math.max(G.shake, 4);
    } else if(G.glitchT < 3.0){
      G.fleeT = G.glitchT - 1.7;
      G.pose = 'cast2';
    } else {
      winFight();
    }
    return;
  }
  if(G.phase==='toAttack'){
    G.pt+=dt;
    if(G.pt>.15){G.phase='attack';G.pt=0;co(G.B.run(G.turnDef));}
    return;
  }
  if(G.phase==='attack'||G.phase==='dead'||G.phase==='victory'){
    if(G.phase==='attack'){
      updateSoul(dt);updateShots(dt);updateEnts(dt);
      if(G.cos.length===0)attackDone();
    }else if(G.phase==='dead'){
      G.pt+=dt;updateEnts(0);
      if(isTap('z','enter',' ')&&G.pt>.6)resetFight();
    }else if(G.phase==='victory'){
      G.pt+=dt;updateEnts(dt*.3);
      if(isTap('z','enter',' ')&&G.pt>.6)backToMenu();
    }
    return;
  }
  if(G.phase==='post'){
    G.pt+=dt;
    if(G.pt>.5||isTap('z','enter',' '))nextTurn();
  }
}
function resetFight(){newFight(G.cfg);}
function backToMenu(){inFight=false;G.ents=[];G.cos=[];lastT=performance.now();}

function renderGame(){
  const c=ctx;
  c.save();
  if(G.shake>0){c.translate(rnd(-1,1)*G.shake*.5,rnd(-1,1)*G.shake*.5);}
  drawBg(c);
  if(G.dark>0){c.fillStyle='rgba(0,0,0,'+G.dark+')';c.fillRect(0,0,W,H);}
  if(G.shatterPieces && G.shatterPieces.length){
    for(const p of G.shatterPieces){
      if(p.life<=0) continue;
      c.save();
      c.globalAlpha = Math.max(0, p.life/p.max);
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.fillStyle = p.col;
      c.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      c.strokeStyle = 'rgba(255,180,200,0.4)';
      c.lineWidth = 1;
      c.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
      c.restore();
    }
  }
  drawPose(c);
  if(G.phase==='glitchFlee' && G.glitchT>=0.55 && G.glitchT<1.7){
    c.save();
    for(let i=0;i<6;i++){
      const y = rnd(0,H);
      const h = rnd(2,10);
      c.globalAlpha = 0.35;
      c.fillStyle = pick(['#ff2f55','#8b5cff','#fff','#000']);
      c.fillRect(0, y, W, h);
    }
    c.globalAlpha = 0.15;
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = '#ff0040';
    c.fillRect(rnd(-4,4), 0, W, H);
    c.restore();
  }
  drawBoard(c);
  const ents=G.ents.slice().sort((a,b)=>(a.z||0)-(b.z||0));
  for(const e of ents){if(e.draw)e.draw(c,e);}
  for(const sh of G.shots){c.fillStyle=sh.big?'#fff3b0':'#fff';c.beginPath();c.arc(sh.x,sh.y,sh.r,0,TAU);c.fill();if(sh.big){c.strokeStyle='#ffe14a';c.lineWidth=2;c.stroke();}}
  drawSoul(c);
  drawSlashAnims(c);
  drawFX(c);
  drawHUD(c);
  const bx=G.box;
  c.fillStyle='#000';c.strokeStyle='#fff';c.lineWidth=3;
  if(G.phase==='menu'||G.phase==='post'||G.phase==='toAttack'){
    c.fillRect(bx.x,bx.y,bx.w,bx.h);c.strokeRect(bx.x,bx.y,bx.w,bx.h);
    drawTextBox(c);
  }
  if(G.phase==='fightBar'){
    c.fillStyle='rgba(0,0,0,0.55)';
    c.fillRect(bx.x, bx.y, bx.w, bx.h);
    c.strokeStyle='#5b3fc4';c.lineWidth=3;c.strokeRect(bx.x,bx.y,bx.w,bx.h);
    drawFightBar(c);
  }
  if(G.flash>0){c.fillStyle=(G.flashCol?hexA(G.flashCol,Math.min(.7,G.flash)):'rgba(255,255,255,'+Math.min(.7,G.flash)+')');c.fillRect(0,0,W,H);}
  if(G.phase==='dead'){
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,H);
    text(c,'* '+G.B.name+' hesitates, but continues.',60,220,9,'#ff6a7d');
    text(c,'YOU DIED',W/2,270,22,'#ff2a4d','center');
    if(G.pt>.6)text(c,'Press Z to try again',W/2,310,8,'#fff','center');
  }
  if(G.phase==='victory'){
    c.fillStyle='rgba(10,4,20,.45)';c.fillRect(0,0,W,H);
    text(c,'* '+G.B.name+' was reduced to dust.',60,240,9,'#ffe14a');
    text(c,'FIGHT CLEARED',W/2,290,18,'#5ef78a','center');
    text(c,'Turns survived: '+G.turn,W/2,318,8,'#fff','center');
    if(G.pt>.6)text(c,'Press Z to continue',W/2,346,8,'#fff','center');
  }
  c.restore();
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

  if(isTap('arrowright','d'))menu.sel=(menu.sel+1)%2,sfx('sel');
  if(isTap('arrowup','arrowdown','w','s'))menu.soul=1-menu.soul,sfx('sel');
  if(isTap('z','enter',' ')){
    sfx('sel');
    const key=menu.bosses[menu.sel];
    const hp=key==='knight'?3200:300;
    newFight({boss:key,soul:menu.soul?'yellow':'red',hp:100,bossHp:hp});
  }
}

requestAnimationFrame(frame);
document.getElementById('startOverlay').addEventListener('click', function(){
  initAudio();
  this.classList.add('hide');
});
</script>
</body>
</html>
