function emit(x,y,n,c,sp=2){for(let i=0;i<n;i++){const a=rnd(0,PI2),v=rnd(.3,1)*sp;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,1),m:1,c})}}

const ev=(s,k,i,dt,f)=>{s[k]=(s[k]||0)+dt;while(s[k]>=i){s[k]-=i;s[k+'n']=(s[k+'n']||0)+1;f(s[k+'n'])}};
const tl=(s,dt,a)=>{s.T=(s.T||0)+dt;s.i=s.i||0;while(s.i<a.length&&s.T>=a[s.i][0])a[s.i++][1]()};

function bounce(b,d){b.vy+=.035*d*60;if(b.x<B.x+b.r&&b.vx<0)b.vx*=-1;if(b.x>B.x+B.w-b.r&&b.vx>0)b.vx*=-1;if(b.y>B.y+B.h-b.r&&b.vy>0)b.vy*=-.94;if(b.y<B.y+b.r&&b.vy<0)b.vy*=-1}

aSpiral:{d:7.8,b:[270,190],f(dt,s){ev(s,'a',1.1,dt,n=>{const k=16,ph=n*.7,sp=(1.05+n*.1)*SP;for(let i=0;i<k;i++){if(i>=3&&i<6)continue;bl({k:'f',r:5,dmg:7,life:5,th:i/k*PI2+ph,rd:160,u:(b,d)=>{b.th+=.016*sp*d*60;b.rd-=.85*sp*d*60;b.x=cx()+Math.cos(b.th)*b.rd;b.y=cy()+Math.sin(b.th)*b.rd}})}})}},

 if(p>0&&p<=1){s.hl={x:B.x-8,y:B.y+p*B.h};s.hr={x:B.x+B.w+8,y:B.y+B.h-p*B.h};ev(s,'a',.25,dt,()=>{s.hb.push(bl({k:'f',x:s.hl.x+14,y:s.hl.y,r:8,dmg:7,life:5.5}),bl({k:'f',x:s.hr.x-14,y:s.hr.y,r:8,dmg:7,life:5.5}))})}else if(p>1)s.hl=s.hr=null;
 if(s.T>3.1&&!s.go){s.go=1;snd(180,.35,'sawtooth',.03,180);s.hb.forEach(b=>{const dx=s.tx-b.x,dy=s.ty-b.y,m=Math.hypot(dx,dy)||1;b.vx=dx/m*3.2*SP;b.vy=dy/m*3.2*SP})}}},

pellets:{d:7.6,b:[260,180],f(dt,s){ev(s,'a',1.4,dt,()=>{const k=12,ph=rnd(0,PI2),R=95;for(let i=0;i<k;i++){const a=ph+i/k*PI2;bl({k:'c',show:1,x:so.x+Math.cos(a)*R,y:so.y+Math.sin(a)*R,r:4,warn:.7,life:3,vx:-Math.cos(a)*1.7*SP,vy:-Math.sin(a)*1.7*SP,dmg:7})}})}},

boneGap:{d:7.6,b:[300,160],f(dt,s){ev(s,'a',.55,dt,()=>{const gh=54+rnd(0,14)-up*7,gy=B.y+16+Math.random()*(B.h-32-gh),x=B.x+B.w+22,v=-2.6*SP,bh=gy-B.y,th=B.y+B.h-gy-gh;bl({k:'b',x,y:B.y+bh/2,vx:v,w:11,h:bh,life:6.5,dmg:8});bl({k:'b',x,y:gy+gh+th/2,vx:v,w:11,h:th,life:6.5,dmg:8})})}},
blasters:{d:8.2,b:[290,160],f(dt,s){ev(s,'a',1.0,dt,n=>{if(n>6)return;const h=Math.random()<.5,p=h?cl(so.y+rnd(-28,28),B.y+16,B.y+B.h-16):cl(so.x+rnd(-28,28),B.x+16,B.x+B.w-16);laser(h,p,20,.7,.4);if(up&&n%2)laser(!h,h?cl(so.x+rnd(-55,55),B.x+16,B.x+B.w-16):cl(so.y+rnd(-40,40),B.y+16,B.y+B.h-16),20,.85,.4);snd(80,.35,'sawtooth',.03,50)})}},

colorBones:{d:7.2,b:[270,160],f(dt,s){ev(s,'a',.48,dt,()=>{const l=Math.random()<.5,ty=Math.random()<.5?'b':'o';bl({k:'b',x:l?B.x-18:B.x+B.w+18,y:rnd(B.y+28,B.y+B.h-28),vx:(l?1:-1)*2.9*SP,w:11,h:55,ty,life:5.5,dmg:8})})}},
slam:{d:8.2,b:[300,160],mode:'blue',f(dt,s){ev(s,'a',1.2,dt,n=>{for(let i=0;i<2+(n%2);i++){const hh=rnd(38,72),x=rnd(B.x+22,B.x+B.w-22);zn(x-8,B.y+B.h-hh,16,hh,.6,.28)}bl({k:'b',x:B.x+B.w+16,y:B.y+B.h-14,vx:-2.7*SP,w:11,h:24,life:5.5,dmg:8});if(n%2)bl({k:'b',x:B.x-16,y:B.y+B.h-14,vx:2.7*SP,w:11,h:24,life:5.5,dmg:8})})}},
wallSlam:{d:9,b:[260,190],mode:'blue',f(dt,s){ev(s,'g',1.7,dt,n=>{gd=[0,3,2,1][(n+(Math.random()*2|0))%4];so.g=7.5;so.on=0;snd(90,.18,'sawtooth',.04,-35)});
 ev(s,'a',.55,dt,()=>{const G=GD[gd];if(G[1]){const l=Math.random()<.5;bl({k:'b',x:l?B.x-16:B.x+B.w+16,y:G[1]>0?B.y+B.h-14:B.y+14,vx:(l?1:-1)*2.5*SP,w:24,h:11,life:5.5,dmg:8})}else{const tp=Math.random()<.5;bl({k:'b',x:G[0]>0?B.x+B.w-14:B.x+14,y:tp?B.y-16:B.y+B.h+16,vy:(tp?1:-1)*2.5*SP,w:11,h:24,life:5.5,dmg:8})}})}},
undyne:{d:10,b:[190,170],mode:'green',f(dt,s){ev(s,'a',.42,dt,n=>{if(n>(up?22:17))return;const dd=ch(DIR),sl=Math.random()<.22,v=sl?1.5:2.7*SP,b=bl({k:'sp',x:cx()-dd[0]*110,y:cy()-dd[1]*110,vx:dd[0]*v,vy:dd[1]*v,r:6,ar:1,col:'#0f0',life:3.8,dmg:8});if(Math.random()<.18){b.fl=.75;b.life=4.5}})}},
spearRain:{d:7.2,b:[280,170],f(dt,s){ev(s,'a',.4,dt,n=>{const x=n%4==0?so.x:rnd(B.x+14,B.x+B.w-14);ln(x,B.y,x,B.y+B.h,2,.5,.01,'#aaa',0);bl({k:'sp',x,y:B.y-28,vy:6.2*SP,r:5,warn:.5,life:1.9,col:'#ccc',dmg:8})})}},
muffet:{d:9,b:[320,145],mode:'purple',lanes:3,f(dt,s){ev(s,'a',.48,dt,n=>{const lane=Math.random()*3|0,l=Math.random()<.5;bl({k:'c',r:6,col:'#ddd',x:l?B.x-14:B.x+B.w+14,y:B.y+B.h*(lane+1)/4,vx:(l?1:-1)*(2.2+(n%5==0?1.1:0))*SP,life:5.5,dmg:8});if(up&&n%3==0)bl({k:'c',r:6,col:'#ddd',x:l?B.x+B.w+14:B.x-14,y:B.y+B.h*(((lane+1)%3)+1)/4,vx:(l?-1:1)*2.3,life:5.5,dmg:8})})}},

 s.th+=dt*(1.2+SP*.35)*(s.T>3.8?-1:1);const ox=cx()+Math.sin(s.T*1.3)*45,oy=cy()+Math.sin(s.T*2.6)*22;s.arr.forEach((b,i)=>{const a=s.th+i/12*PI2,R=55+Math.sin(s.T*1.9+i)*9;b.x=ox+Math.cos(a)*R;b.y=oy+Math.sin(a)*R});
 ev(s,'a',.65,dt,()=>{bl({k:'c',r:5,col:'#fff',x:rnd(B.x,B.x+B.w),y:B.y-12,vy:2.4*SP,life:3.8,dmg:7})})}},

 s.th+=dt*(.85+SP*.4)*(Math.sin(s.T*.85)>=0?1:-1);const R=Math.hypot(B.w,B.h)/2+22;s.bs.forEach((b,i)=>{const a=s.th+i*Math.PI;b.x1=cx();b.y1=cy();b.x2=cx()+Math.cos(a)*R;b.y2=cy()+Math.sin(a)*R});
 ev(s,'a',1.05,dt,()=>{const a=rnd(0,PI2);bl({k:'d',r:5,col:'#fff',x:cx()+Math.cos(a)*115,y:cy()+Math.sin(a)*95,vx:-Math.cos(a)*1.9*SP,vy:-Math.sin(a)*1.9*SP,life:3,dmg:8})})}},

knight:{d:8.5,b:[300,190],f(dt,s){ev(s,'a',1.3,dt,n=>{const k=2+(n%2)+up;for(let i=0;i<k;i++){let x1,y1,x2,y2;if(Math.random()<.5){x1=B.x-22;y1=B.y+rnd(0,B.h);x2=B.x+B.w+22;y2=B.y+rnd(0,B.h)}else{x1=B.x+rnd(0,B.w);y1=B.y-22;x2=B.x+rnd(0,B.w);y2=B.y+B.h+22}ln(x1,y1,x2,y2,10,.75+i*.2,.15,'#fff',8)}snd(180,.08,'square',.025)})}},

function txt(s,x,y,sz,c='#fff',al='center'){X.font=sz+'px '+F;X.fillStyle=c;X.textAlign=al;X.fillText(s,x,y)}
function heart(x,y,sz,c){X.save();X.translate(x,y);X.scale(sz/16,sz/16);X.fillStyle=c;X.beginPath();X.moveTo(0,5.5);X.bezierCurveTo(-1.2,1.2,-9.2,-3.2,-9.2,-8.2);X.bezierCurveTo(-9.2,-13.8,-4.6,-15.8,0,-11.6);X.bezierCurveTo(4.6,-15.8,9.2,-13.8,9.2,-8.2);X.bezierCurveTo(9.2,-3.2,1.2,1.2,0,5.5);X.fill();X.restore()}
function starPoly(r,c){X.fillStyle=c;X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.42:r;X.lineTo(Math.cos(a)*q,Math.sin(a)*q)}X.closePath();X.fill()}

function rift(x,y,sc,col,gl){const n=14,tp=[],bt=[];
 for(let i=0;i<=n;i++){const q=i/n,w=Math.sin(q*Math.PI)*(13+7*Math.sin(t*2.8+i*1.5))*sc*(1+gl*.4),c=x+Math.sin(i*1.9+t*2)*5*sc+(gl?rnd(-3,3):0),yy=y+(q-.5)*175*sc;tp.push([c+w,yy]);bt.push([c-w*(.75+.2*Math.sin(i)),yy])}
 const path=()=>{X.beginPath();tp.forEach((p,i)=>i?X.lineTo(p[0]+(i%2?4:-3),p[1]):X.moveTo(p[0],p[1]));for(let i=n;i>=0;i--)X.lineTo(bt[i][0]-(i%2?3:-2),bt[i][1]);X.closePath()};
 X.save();X.globalAlpha=.4;X.translate(-3,0);X.strokeStyle='#888';X.lineWidth=1.5;path();X.stroke();X.translate(6,0);X.strokeStyle='#aaa';path();X.stroke();X.restore();
 X.save();path();X.fillStyle='#000';X.fill();X.shadowColor=col;X.shadowBlur=12;X.strokeStyle=col;X.lineWidth=2.5;X.stroke();X.shadowBlur=0;X.clip();
 for(let i=0;i<28;i++){X.globalAlpha=rnd(.08,.55);X.fillStyle=Math.random()<.6?col:'#fff';X.fillRect(x+rnd(-40,40)*sc,y+rnd(-90,90)*sc,rnd(1.5,12),rnd(1,2.5))}
 X.globalAlpha=.4;X.strokeStyle=col;X.lineWidth=1;for(let i=0;i<4;i++){const yy=y+rnd(-80,80)*sc;X.beginPath();X.moveTo(x-25*sc,yy);X.lineTo(x+25*sc,yy+rnd(-4,4));X.stroke()}X.restore()}

function drawBoss(){if(bossGone)return;const hf=hitFx||(dmgNum&&typeof dmgNum.v=='number'&&dmgNum.t>1.3);rift(320+(hf?rnd(-5,5):0),110+Math.sin(t*1.8)*3,.75+phase*.06,eyeCol||PC[phase],hf?1:0)}

function drawTeeth(b){const tw=B.w/b.N,e=b.ext;X.fillStyle='#fff';
 if(b.warn>0&&Math.floor(performance.now()/100)%2){X.strokeStyle='#ff0';X.lineWidth=2;X.strokeRect(B.x+b.li*tw+1,B.y+1,b.gt*tw-2,B.h-2)}
 for(let i=0;i<b.N;i++){if(i>=b.li&&i<b.li+b.gt)continue;const x=B.x+i*tw;X.beginPath();X.moveTo(x,B.y);X.lineTo(x+tw,B.y);X.lineTo(x+tw/2,B.y+e);X.fill();X.beginPath();X.moveTo(x,B.y+B.h);X.lineTo(x+tw,B.y+B.h);X.lineTo(x+tw/2,B.y+B.h-e);X.fill()}}

function drawB(b){
 if(b.k=='t')return drawTeeth(b);
 if(b.k=='z'){const L=b.x-b.w/2,Tp=b.y-b.h/2;if(b.warn>0){const f=Math.floor(performance.now()/120)%2;X.fillStyle=f?'rgba(255,255,255,.25)':'rgba(255,255,0,.2)';X.fillRect(L,Tp,b.w,b.h);X.strokeStyle=f?'#fff':'#ff0';X.lineWidth=2;X.strokeRect(L+1,Tp+1,b.w-2,b.h-2);if(b.w>18)txt('!',b.x,b.y+4,12,f?'#fff':'#ff0')}
  else{const p=1-b.life/b.ml;X.globalAlpha=Math.max(0,.9-p*.7);X.fillStyle=b.ty=='b'?'#0cf':b.ty=='o'?'#f80':'#fff';X.fillRect(L,Tp,b.w,b.h);X.globalAlpha=1;X.fillStyle='#fff';if(b.w>=b.h)X.fillRect(L+b.w*p-5,Tp,10,b.h);else X.fillRect(L,Tp+b.h*p-5,b.w,10)}return}
 if(b.k=='ln'){X.lineCap='round';X.beginPath();X.moveTo(b.x1,b.y1);X.lineTo(b.x2,b.y2);if(b.warn>0){X.strokeStyle=Math.floor(performance.now()/100)%2?'#f33':'#ff0';X.lineWidth=2;X.globalAlpha=.8;X.stroke();X.globalAlpha=1}else if(b.dmg>0){X.globalAlpha=Math.max(.35,1-(1-b.life/b.ml)*.4);X.strokeStyle=b.col;X.lineWidth=b.w;X.stroke();X.globalAlpha=1}return}
 const dim=b.warn>0;if(dim&&!b.show)return;X.save();if(dim)X.globalAlpha=.35;X.translate(b.x,b.y);
 if(b.k=='f'){X.globalAlpha*=.25;X.fillStyle='#888';X.beginPath();X.arc(0,0,b.r*1.6,0,PI2);X.fill();X.globalAlpha=dim?.35:1;X.fillStyle='#fff';X.beginPath();X.arc(0,0,b.r,0,PI2);X.fill();X.fillStyle='#ccc';X.beginPath();X.arc(0,-b.r*.2,b.r*.45,0,PI2);X.fill()}
 else if(b.k=='s')starPoly(b.r,b.col);
 else if(b.k=='d'){X.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);X.fillStyle=b.col;X.beginPath();X.moveTo(0,-b.r*1.5);X.lineTo(b.r*.9,0);X.lineTo(0,b.r*1.5);X.lineTo(-b.r*.9,0);X.fill()}
 else if(b.k=='sp'){X.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);X.fillStyle=b.col;X.beginPath();X.moveTo(0,-b.r*1.9);X.lineTo(b.r*.8,b.r*.9);X.lineTo(0,b.r*.3);X.lineTo(-b.r*.8,b.r*.9);X.fill();X.fillRect(-1.2,b.r*.3,2.4,b.r*1.8)}
 else if(b.k=='b'){X.fillStyle=b.col;X.fillRect(-b.w/2,-b.h/2,b.w,b.h);const v=b.h>=b.w,e=(v?b.h:b.w)/2,c=(v?b.w:b.h)*.75;X.beginPath();if(v){X.arc(0,-e,c,0,PI2);X.arc(0,e,c,0,PI2)}else{X.arc(-e,0,c,0,PI2);X.arc(e,0,c,0,PI2)}X.fill()}
 else if(b.k=='m'){const a=Math.atan2(b.vy,b.vx);X.strokeStyle='rgba(200,200,200,.4)';X.lineWidth=b.r;X.beginPath();X.moveTo(0,0);X.lineTo(-Math.cos(a)*18,-Math.sin(a)*18);X.stroke();X.fillStyle=b.col;X.beginPath();X.arc(0,0,b.r,0,PI2);X.fill()}
 else{X.fillStyle=b.col;X.beginPath();X.arc(0,0,b.r,0,PI2);X.fill()}
 X.restore()}

function skull(x,y,rot){X.save();X.translate(x,y);X.rotate(rot);X.fillStyle='#eee';X.beginPath();X.ellipse(0,0,18,13,0,0,PI2);X.fill();X.fillStyle='#bbb';X.fillRect(7,-8,12,16);X.fillStyle='#000';X.beginPath();X.ellipse(-3.5,-5,4.5,3.5,0,0,PI2);X.fill();X.beginPath();X.ellipse(-3.5,5,4.5,3.5,0,0,PI2);X.fill();X.restore()}

function drawGoner(){const s=atk.s,T0=s.T||0,a=Math.min(1,T0/.9);X.save();X.globalAlpha=a;rift(320,200,2.3+boxScale*.25,'#fff',1);
 if(T0>1.7){X.strokeStyle='rgba(255,100,255,.45)';X.lineWidth=2;for(let i=0;i<16;i++){const an=i/16*PI2+t*3.2;X.beginPath();for(let r=320;r>0;r-=16)X.lineTo(320+Math.cos(an+r*.011)*r,200+Math.sin(an+r*.011)*r*.82);X.stroke()}}X.restore()}

function drawTarget(){const x=B.x+8,y=B.y+8,w=B.w-16,h=B.h-16,g=X.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#222');g.addColorStop(.5,'#fd3');g.addColorStop(1,'#222');X.fillStyle='#000';X.fillRect(x,y,w,h);X.fillStyle=g;X.fillRect(x,y,w,h);
 for(let i=0;i<5;i++){const iw=w*(1-i*.18);X.strokeStyle=i%2?'#000':'#fff';X.lineWidth=2.5;X.strokeRect(cx()-iw/2,y,iw,h)}X.strokeStyle='#000';X.lineWidth=3;X.beginPath();X.moveTo(cx(),y);X.lineTo(cx(),y+h);X.stroke()}

function draw(dt){
 let sx=0,sy=0;if(shake>.3){shake*=.87;sx=rnd(-1,1)*shake;sy=rnd(-1,1)*shake}else shake=0;
 X.setTransform(1,0,0,1,sx,sy);X.fillStyle='#000';X.fillRect(-20,-20,W+40,H+40);
 stars.forEach(s=>{s.y-=s.s*dt*18;if(s.y<0)s.y=H;X.globalAlpha=.1+s.s*.18;X.fillStyle='#666';X.fillRect(s.x,s.y,1.5,1.5)});X.globalAlpha=1;

 if(st=='title'){rift(320,95,.65,'#fff',0);const j=Math.random()<.08?rnd(-3,3):0;txt('RANDOMZ',W/2+2+j,245,30,'#888');txt('RANDOMZ',W/2-2-j,249,30,'#ccc');txt('RANDOMZ',W/2,247,30,'#fff');txt('A RIP IN SPACE  -  80,000,000 HP',W/2,275,7,'#666');
  ['ARROWS / WASD  move      X / SHIFT  focus','Z / ENTER  confirm      X  back      M  mute','FIGHT: stop the bar in the center.','ACT > Persevere = stronger hits.','BLUE soul: jump.  GREEN: aim shield.','PURPLE: switch lines.  ORANGE: keep moving.','Most attacks are black & white. Specials break the rule.'].forEach((l,i)=>txt(l,W/2,302+i*15,6.5,i>=3?'#888':'#aaa'));
  txt('PRESS ENTER OR CLICK',W/2,445,10,Math.floor(performance.now()/500)%2?'#fff':'#f33');if(best)txt('BEST: WON IN '+best+' TURNS',W/2,465,6,'#555');return}

 drawBoss();
 if(!bossGone){txt('RANDOMZ',18,22,8,'#f55','left');X.fillStyle='#200';X.fillRect(115,11,500,13);X.fillStyle=PC[phase];X.fillRect(115,11,500*Math.max(0,bossShow/BMAX),13);X.strokeStyle='#fff';X.lineWidth=1.5;X.strokeRect(115,11,500,13);txt(Math.ceil(Math.max(0,bossShow)).toLocaleString(),W-18,42,7,'#888','right')}
 if(hitFx&&st=='slash'){X.strokeStyle='#fff';X.lineWidth=4;const p=hitFx.t/.55;for(let i=0;i<3;i++){X.beginPath();X.moveTo(255+i*18,38+p*8);X.lineTo(245+i*18+p*100,38+p*145);X.stroke()}}
 if(dmgNum){X.globalAlpha=Math.min(1,dmgNum.t);if(typeof dmgNum.v=='number'){X.fillStyle='#400';X.fillRect(200,210,240,11);X.fillStyle='#0a0';X.fillRect(200,210,240*Math.max(0,bossShow/BMAX),11)}txt(typeof dmgNum.v=='number'?dmgNum.v.toLocaleString():dmgNum.v,320,195-(1.7-dmgNum.t)*7,16,dmgNum.c);X.globalAlpha=1}

 if(atk&&atk.k=='goner'&&boxScale>1){
  X.save();X.translate(320,280);X.rotate(boxRot);X.scale(boxScale,boxScale);X.translate(-320,-280);
  X.fillStyle='#000';X.fillRect(B.x,B.y,B.w,B.h);
  X.strokeStyle='#f0f';X.lineWidth=4/boxScale;X.strokeRect(B.x-2,B.y-2,B.w+4,B.h+4);
  X.restore();
  if(fullScreen){X.strokeStyle='rgba(255,80,255,.5)';X.lineWidth=2.5;X.strokeRect(6,6,W-12,H-12)}
 }else{
  X.fillStyle='#000';X.fillRect(B.x,B.y,B.w,B.h);
  X.strokeStyle=mode=='blue'?'#0cf':mode=='green'?'#0f0':mode=='purple'?'#f0f':'#fff';X.lineWidth=3.5;X.strokeRect(B.x-2,B.y-2,B.w+4,B.h+4);
 }

 if(atk&&atk.k=='goner')drawGoner();
 if(mode=='purple'&&st=='atk'){const n=atk.lanes||3;X.strokeStyle='#f0f';X.lineWidth=1.5;for(let i=0;i<n;i++){const y=B.y+B.h*(i+1)/(n+1);X.beginPath();X.moveTo(B.x,y);X.lineTo(B.x+B.w,y);X.stroke()}}

 X.save();if(!(atk&&atk.k=='goner'&&fullScreen)){X.beginPath();X.rect(B.x,B.y,B.w,B.h);X.clip()}
 bullets.forEach(drawB);X.restore();
 bullets.forEach(b=>{if(b.k=='z'&&b.sk&&b.life>0)skull(b.sk[0],b.sk[1],b.sk[2])});
 if(atk&&atk.s.hl)[atk.s.hl,atk.s.hr].forEach(h=>{if(!h)return;X.fillStyle='#ddd';X.beginPath();X.arc(h.x,h.y,10,0,PI2);X.fill();X.fillRect(h.x-4,h.y-16,8,10)});

 if((st=='menu'||st=='talk')&&msgFull){msgFull.slice(0,msgI|0).split('\n').forEach((l,i)=>txt(l,B.x+18,B.y+32+i*24,10,'#fff','left'))}
 if(st=='sub'){sub.forEach((n,i)=>{const col=mi==2?i>>2:0,row=mi==2?i&3:i,x=B.x+45+col*265,y=B.y+28+row*20;txt('* '+n,x,y,9,i==si?'#ff0':'#fff','left');if(i==si)heart(x-20,y-3,11,'#f00')})}
 if(st=='bar'||st=='slash'){drawTarget();const bx=st=='bar'?B.x+8+barX:hitFx.bx,f=Math.floor(performance.now()/70)%2;X.fillStyle=f?'#fff':'#000';X.fillRect(bx-4,B.y+3,8,B.h-6);X.strokeStyle=f?'#000':'#fff';X.lineWidth=1.5;X.strokeRect(bx-4,B.y+3,8,B.h-6)}
 if(st=='atk'){X.save();if(inv>0&&Math.floor(inv*12)%2==0)X.globalAlpha=.3;heart(so.x,so.y,14,HC[mode]);if(mode=='green'){const d=DIR[sh];X.strokeStyle='#0f0';X.lineWidth=3.5;X.beginPath();X.arc(so.x+d[0]*24,so.y+d[1]*24,12,0,PI2);X.stroke()}X.restore()}

 ps.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.l-=dt;X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.fillRect(p.x-1.2,p.y-1.2,2.4,2.4)});ps=ps.filter(p=>p.l>0);X.globalAlpha=1;
 if(flash>0){X.fillStyle='rgba(255,30,30,'+flash*.45+')';X.fillRect(-20,-20,W+40,H+40);flash-=dt*1.7}

 txt('FRISK   LV 1',28,420,9,'#fff','left');txt('HP',245,420,7,'#fff','left');const hw=maxhp*1.4;X.fillStyle='#800';X.fillRect(270,407,hw,16);X.fillStyle='#ff0';X.fillRect(270,407,hw*Math.max(0,hp)/maxhp,16);txt(Math.ceil(hp)+' / '+maxhp,270+hw+12,420,8,gonerHit?'#f0f':'#fff','left');
 ['FIGHT','ACT','ITEM','MERCY'].forEach((n,i)=>{const x=22+i*148,sel=mi==i&&(st=='menu'||st=='sub'||st=='bar'||st=='slash'),c=sel?'#ff0':'#f80';X.strokeStyle=c;X.lineWidth=2.5;X.strokeRect(x,434,128,32);txt(n,x+64,455,9,c);if(mi==i&&st=='menu')heart(x+14,451,12,'#f00')});

 if(st=='over'){X.fillStyle='rgba(0,0,0,.82)';X.fillRect(0,0,W,H);txt('GAME OVER',W/2,175,24,'#f00');txt('* You cannot give up just yet...',W/2,245,8,'#999');txt('Randomz HP: '+Math.ceil(bossHP).toLocaleString(),W/2,285,8,'#ff0');txt('PRESS ENTER OR CLICK',W/2,395,10,Math.floor(performance.now()/500)%2?'#fff':'#f33')}
 if(st=='win'){X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,0,W,H);txt('* YOU WON! *',W/2,165,22,'#ff0');txt('The rift sealed itself in '+turn+' turns.',W/2,225,9,'#fff');txt('Times hit: '+hits+'   You earned 0 EXP.',W/2,255,8,'#999');txt('PRESS ENTER OR CLICK TO PLAY AGAIN',W/2,395,9,Math.floor(performance.now()/500)%2?'#fff':'#f33')}
 X.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<H;y+=4)X.fillRect(0,y,W,1)}

let last;function loop(ts){const dt=Math.min((ts-(last||ts))/1e3,.033);last=ts;try{if(st!='title')upd(dt);draw(dt)}catch(e){console.error(e);if(atk){atk=null;bullets=[];mode='red';boxRot=0;boxScale=1;fullScreen=false;if(st=='atk'){st='menu';T.w=580;T.h=110;T.cy=335}}}requestAnimationFrame(loop)}

function press(k){const ok=k=='z'||k=='enter'||k==' ',no=k=='x'||k=='shift'||k=='escape';if(k=='m')mute=!mute;
 if(k=='q'&&(st=='menu'||st=='talk'||st=='atk'||st=='bar'||st=='slash')){bossHP=Math.max(0,bossHP-10000000);bossShow=bossHP;dmgNum={v:10000000,t:1.4,c:'#0ff'};snd(180,.25,'square',.05,350);emit(320,120,25,'#0ff',4);if(bossHP<=0){st='talk';tkT=1.1;after=winGame;setMsg('* DEBUG KILL')}}
 if(st=='title'||st=='over'||st=='win'){if(ok)startGame();return}
 if(st=='talk'){if(ok)tkT=Math.min(tkT,.22);return}
 if(st=='menu'){if(k=='arrowleft'||k=='a')mi=(mi+3)%4;if(k=='arrowright'||k=='d')mi=(mi+1)%4;if(ok)openSub()}
 else if(st=='sub'){const n=sub.length;if(no){st='menu';return}if(mi==2){if(k=='arrowdown'||k=='s'){if((si&3)<3&&si+1<n)si++}if(k=='arrowup'||k=='w'){if(si&3)si--}if(k=='arrowright'||k=='d'){if(si+4<n)si+=4}if(k=='arrowleft'||k=='a'){if(si>=4)si-=4}}
  else{if(k=='arrowdown'||k=='s')si=(si+1)%n;if(k=='arrowup'||k=='w')si=(si+n-1)%n}if(ok)chooseSub()}
 else if(st=='bar'){if(ok)stopBar()}}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.addEventListener('pointerdown',e=>{const p=pos(e);pdown=true;pp={lx:e.clientX,ly:e.clientY,dx:0,dy:0};
 if(st=='menu'&&p.y>428){const i=Math.floor((p.x-22)/148);if(i>=0&&i<4){mi=i;press('z')}}
 else if(st=='sub'){const col=mi==2?Math.floor((p.x-B.x-30)/265):0,row=Math.floor((p.y-B.y-14)/20),i=mi==2?col*4+row:row;if(i>=0&&i<sub.length&&row>=0){si=i;press('z')}else st='menu'}
 else if(st!='atk')press('z')});
C.addEventListener('pointermove',e=>{if(pdown&&pp){const k=W/C.getBoundingClientRect().width;pp.dx+=(e.clientX-pp.lx)*k;pp.dy+=(e.clientY-pp.ly)*k;pp.lx=e.clientX;pp.ly=e.clientY}});
addEventListener('pointerup',()=>{pdown=false;pp=null});
hp=maxhp;bossHP=bossShow=BMAX;requestAnimationFrame(loop);
</script></body></html>
