<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#14121f;
    --bg-panel:#1e1b2c;
    --bg-panel-alt:#262238;
    --border:#3a3552;
    --text-primary:#f1eef9;
    --text-muted:#9993b5;
    --accent-yellow:#ffd23f;
    --accent-red:#ff5c5c;
    --accent-green:#6ee7a0;
    --accent-violet:#a78bfa;
    --accent-blue:#5ec8ff;
    --accent-pink:#ff7eb9;
    --accent-orange:#ff9f43;
    --font-display:'Cinzel', Georgia, 'Times New Roman', serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1380px;margin:0 auto;}
  header{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    padding-bottom:18px; margin-bottom:24px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,3.4vw,34px);
    margin:0;
    letter-spacing:0.01em;
    color:var(--text-primary);
  }
  h1 span{color:var(--accent-yellow);}
  .subtitle{color:var(--text-muted); font-size:14px; max-width:620px; line-height:1.5;}
  .layout{
    display:grid;
    grid-template-columns: 260px 1fr 380px;
    gap:18px;
    align-items:start;
  }
  @media (max-width: 1100px){
    .layout{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  .panel h2{
    font-family:var(--font-display);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-muted);
    margin:0 0 12px 0;
    font-weight:700;
  }
  .palette-group{margin-bottom:14px;}
  .palette-group-title{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin:0 0 6px 2px;}
  .palette-btn{
    display:block; width:100%; text-align:left;
    background:var(--bg-panel-alt);
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:9px 11px;
    border-radius:8px;
    margin-bottom:7px;
    cursor:pointer;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    transition:border-color .15s ease, transform .1s ease;
  }
  .palette-btn:hover{border-color:var(--accent-yellow);}
  .palette-btn:active{transform:scale(0.98);}
  .palette-btn small{display:block;font-weight:400;color:var(--text-muted);margin-top:2px;font-size:11px;line-height:1.35;}
  .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle;}
  #sequence{list-style:none;margin:0;padding:0;min-height:60px;max-height:72vh;overflow-y:auto;}
  #sequence:empty::after{
    content:"Add blocks from the left to build your fight.";
    color:var(--text-muted); font-size:13px; display:block; padding:20px 4px;
  }
  .block{
    background:var(--bg-panel-alt);
    border:1px solid var(--border);
    border-left:4px solid var(--accent-violet);
    border-radius:8px;
    padding:9px 11px;
    margin-bottom:7px;
    cursor:grab;
  }
  .block.repeat_start, .block.repeat_end{border-left-color:var(--accent-green);}
  .block.move_boss{border-left-color:var(--accent-blue);}
  .block.clear_bullets, .block.shake, .block.flash, .block.slowmo, .block.arena_shrink{border-left-color:var(--accent-pink);}
  .block.combo{border-left-color:var(--accent-yellow);}
  .block.dragging{opacity:0.4;}
  .block-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .block-title{font-weight:700; font-size:13px;}
  .block-remove{
    background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;
    line-height:1; padding:2px 6px;
  }
  .block-remove:hover{color:var(--accent-red);}
  .block-fields{display:flex; flex-wrap:wrap; gap:8px; margin-top:7px;}
  .field{display:flex; flex-direction:column; gap:2px;}
  .field label{font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select{
    background:var(--bg-deep); border:1px solid var(--border); color:var(--text-primary);
    border-radius:5px; padding:4px 5px; font-size:12px; font-family:var(--font-body);
  }
  .field input{width:68px;}
  .field select{width:92px;}
  .indent{margin-left:20px;}
  #stage-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  canvas#stage{
    background:#0a0912;
    border:2px solid var(--border);
    border-radius:6px;
    max-width:100%;
  }
  .hpbar-wrap{width:100%; max-width:340px;}
  .hpbar-label{display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:3px;}
  .hpbar{height:10px; background:var(--bg-panel-alt); border:1px solid var(--border); border-radius:5px; overflow:hidden;}
  .hpbar-fill{height:100%; background:var(--accent-yellow); transition:width .12s ease;}
  #status-msg{font-size:13px; color:var(--text-muted); min-height:18px; text-align:center;}
  #status-msg.win{color:var(--accent-green); font-weight:700;}
  #status-msg.lose{color:var(--accent-red); font-weight:700;}
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:13.5px;
    padding:10px 18px; border-radius:7px; border:1px solid var(--border);
    cursor:pointer; background:var(--bg-panel-alt); color:var(--text-primary);
  }
  .btn.primary{background:var(--accent-yellow); color:#221d10; border-color:var(--accent-yellow);}
  .btn.primary:hover{filter:brightness(1.07);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .controls-note{font-size:11.5px; color:var(--text-muted); text-align:center; line-height:1.5;}
  code{background:var(--bg-panel-alt); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:11px;}
  .toolbar{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .toolbar .btn{padding:6px 10px; font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Boss Fight <span>Maker</span></h1>
      <div class="subtitle">Build Deltarune-style bullet patterns with blocks — walls, spirals, lasers, cages, homing hearts, arena shrink, and more. Test-dodge it yourself.</div>
    </div>
  </header>
  <div class="layout">
    <div class="panel">
      <h2>Blocks</h2>
      <div id="palette"></div>
    </div>
    <div class="panel">
      <h2>Sequence</h2>
      <div class="toolbar">
        <button class="btn" id="clear-seq-btn" title="Clear all blocks">Clear</button>
        <button class="btn" id="export-btn" title="Copy sequence JSON">Export</button>
        <button class="btn" id="import-btn" title="Paste sequence JSON">Import</button>
      </div>
      <ul id="sequence"></ul>
    </div>
    <div class="panel">
      <h2>Test Fight</h2>
      <div id="stage-wrap">
        <canvas id="stage" width="340" height="400"></canvas>
        <div class="hpbar-wrap">
          <div class="hpbar-label"><span>SOUL</span><span id="hp-text">100/100</span></div>
          <div class="hpbar"><div class="hpbar-fill" id="hp-fill" style="width:100%"></div></div>
        </div>
        <div id="status-msg"></div>
        <div class="btn-row">
          <button class="btn primary" id="play-btn">Test Fight</button>
          <button class="btn" id="stop-btn" disabled>Stop</button>
        </div>
        <div class="controls-note">Move with <code>Arrow keys</code> or <code>WASD</code>. Don't get hit.</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";

  const SHAPE_OPTS = [
    {value:"circle", label:"Circle"},
    {value:"square", label:"Square"},
    {value:"triangle", label:"Triangle"},
    {value:"diamond", label:"Diamond"},
    {value:"heart", label:"Heart"},
    {value:"star", label:"Star"},
    {value:"cross", label:"Cross"},
    {value:"sword", label:"Sword"},
    {value:"axe", label:"Axe"},
    {value:"scythe", label:"Scythe"},
  ];

  const BLOCK_DEFS = {

      ],
    },
    clear_bullets: {
      label: "Clear Bullets", color: "#ff7eb9", group: "Flow",
      desc: "Destroy every bullet on screen",
      fields: [],
    },
    shake: {
      label: "Screen Shake", color: "#ff7eb9", group: "Flow",

        {key:"intensity", label:"Intensity", type:"number", def:6, min:1, max:18, step:1},
        {key:"duration", label:"Seconds", type:"number", def:0.4, min:0.1, max:2, step:0.05},
      ],
    },
    flash: {
      label: "Screen Flash", color: "#ff7eb9", group: "Flow",
      desc: "Brief full-screen flash",
      fields: [
        {key:"duration", label:"Seconds", type:"number", def:0.18, min:0.05, max:1, step:0.02},
        {key:"color", label:"Color", type:"select", def:"white", options:[
          {value:"white",label:"White"},{value:"yellow",label:"Yellow"},

    },
    repeat_end: {
      label: "End Repeat", color: "#6ee7a0", group: "Flow",
      desc: "Marks the end of a repeat block",
      fields: [],
    },
    spread: {
      label: "Spread Shot", color: "#ff5c5c", group: "Attacks",
      desc: "Fan of bullets across the top",
      fields: [
        {key:"count", label:"Bullets", type:"number", def:8, min:2, max:28, step:1},
        {key:"speed", label:"Speed", type:"number", def:130, min:40, max:340, step:10},
        {key:"duration", label:"Seconds", type:"number", def:2.2, min:0.4, max:7, step:0.1},

    wall: {

        {key:"shape", label:"Shape", type:"select", def:"diamond", options: SHAPE_OPTS},
      ],

    ring: {
      label: "Ring Burst", color: "#ff5c5c", group: "Attacks",
      desc: "Bullets burst outward from the boss",
      fields: [

        {key:"speed", label:"Speed", type:"number", def:115, min:40, max:280, step:10},

      ],
    },
    spiral: {
      label: "Spiral", color: "#ff5c5c", group: "Attacks",
      desc: "Rotating streams of bullets",
      fields: [

        {key:"duration", label:"Seconds", type:"number", def:3.2, min:0.6, max:10, step:0.1},

      ],
    },
    homing: {
      label: "Homing Shot", color: "#ff5c5c", group: "Attacks",
      desc: "Slow bullets that curve toward you",
      fields: [
        {key:"count", label:"Bullets", type:"number", def:5, min:1, max:14, step:1},
        {key:"gap", label:"Gap (s)", type:"number", def:0.45, min:0.1, max:2, step:0.05},
        {key:"speed", label:"Speed", type:"number", def:85, min:25, max:200, step:5},
        {key:"turnRate", label:"Turn (deg/s)", type:"number", def:75, min:10, max:240, step:5},
        {key:"duration", label:"Seconds", type:"number", def:3.2, min:0.6, max:10, step:0.1},
        {key:"shape", label:"Shape", type:"select", def:"heart", options: SHAPE_OPTS},
      ],
    },
    laser: {
      label: "Laser Beam", color: "#ff9f43", group: "Attacks",
      desc: "A thick beam that sweeps or holds",
      fields: [
        {key:"mode", label:"Mode", type:"select", def:"sweep", options:[
          {value:"sweep",label:"Sweep"},{value:"hold",label:"Hold"},{value:"vertical",label:"Vertical"}
        ]},
        {key:"width", label:"Width", type:"number", def:22, min:10, max:50, step:2},
        {key:"speed", label:"Sweep speed", type:"number", def:90, min:30, max:220, step:10},
        {key:"duration", label:"Seconds", type:"number", def:2.4, min:0.5, max:7, step:0.1},

    },
    expanding_ring: {

        {key:"shape", label:"Shape", type:"select", def:"triangle", options: SHAPE_OPTS},
      ],
    },
    cage: {
      label: "Soul Cage", color: "#ff7eb9", group: "Special",

      fields: [
        {key:"gap", label:"Final gap", type:"number", def:90, min:40, max:180, step:10},

        {key:"duration", label:"Seconds", type:"number", def:3.5, min:1.5, max:8, step:0.1},
        {key:"shape", label:"Shape", type:"select", def:"square", options: SHAPE_OPTS},
      ],
    },
    orbit: {
      label: "Orbit Burst", color: "#ff7eb9", group: "Special",

  const GROUP_ORDER = ["Flow", "Attacks", "Special"];
  const COMBO_ALLOWED = ["spread","aimed","wall","moving_wall","rain","ring","spiral","homing",
    "laser","expanding_ring","cross","wave","bounce","shotgun","orbit","splitter","chaos",
    "move_boss","telegraph","shake","flash","slowmo","arena_shrink","clear_bullets","wait"];
  let uidCounter = 1;

  function makeBlock(type){
    const def = BLOCK_DEFS[type];
    const params = {};
    (def.fields || []).forEach(f => params[f.key] = f.def);
    if (type === "combo") params.slots = [null, null, null, null];
    return {id: uidCounter++, type, params};
  }

  let sequence = [];

  const paletteEl = document.getElementById("palette");
  GROUP_ORDER.forEach(group => {
    const groupWrap = document.createElement("div");
    groupWrap.className = "palette-group";
    const gt = document.createElement("div");
    gt.className = "palette-group-title";
    gt.textContent = group;
    groupWrap.appendChild(gt);
    Object.keys(BLOCK_DEFS).forEach(type => {
      const def = BLOCK_DEFS[type];
      if (def.group !== group || type === "repeat_end") return;
      const btn = document.createElement("button");
      btn.className = "palette-btn";
      btn.innerHTML = `<span class="swatch" style="background:${def.color}"></span>${def.label}<small>${def.desc}</small>`;
      btn.addEventListener("click", () => {
        sequence.push(makeBlock(type));
        if (type === "repeat_start") sequence.push(makeBlock("repeat_end"));
        renderSequence();
      });
      groupWrap.appendChild(btn);
    });
    paletteEl.appendChild(groupWrap);
  });

  const seqEl = document.getElementById("sequence");

  function renderFieldsInto(container, fields, paramsObj){
    const fieldsWrap = document.createElement("div");
    fieldsWrap.className = "block-fields";
    fields.forEach(f => {
      const fw = document.createElement("div");
      fw.className = "field";
      const lab = document.createElement("label");
      lab.textContent = f.label;
      fw.appendChild(lab);
      if (f.type === "select"){
        const sel = document.createElement("select");
        f.options.forEach(opt => {
          const o = document.createElement("option");
          o.value = opt.value; o.textContent = opt.label;
          if (paramsObj[f.key] === opt.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => { paramsObj[f.key] = sel.value; });
        fw.appendChild(sel);
      } else {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = f.min; inp.max = f.max; inp.step = f.step;
        inp.value = paramsObj[f.key];
        inp.addEventListener("change", () => {
          let v = parseFloat(inp.value);
          if (isNaN(v)) v = f.def;
          v = Math.max(f.min, Math.min(f.max, v));
          paramsObj[f.key] = v;
          inp.value = v;
        });
        fw.appendChild(inp);
      }
      fieldsWrap.appendChild(fw);
    });
    container.appendChild(fieldsWrap);
  }

  function renderSequence(){
    seqEl.innerHTML = "";
    let depth = 0;
    sequence.forEach((block, idx) => {
      const def = BLOCK_DEFS[block.type];
      if (!def) return;
      const li = document.createElement("li");
      li.className = "block " + block.type;
      li.draggable = true;
      li.dataset.index = idx;
      if (block.type === "repeat_end") depth = Math.max(0, depth - 1);
      if (depth > 0) li.classList.add("indent");

      const row = document.createElement("div");
      row.className = "block-row";
      const title = document.createElement("span");
      title.className = "block-title";
      title.style.color = def.color;
      title.textContent = def.label;
      row.appendChild(title);

      const rm = document.createElement("button");
      rm.className = "block-remove";
      rm.textContent = "\u00d7";
      rm.title = "Remove";
      rm.addEventListener("click", (e) => {
        e.stopPropagation();
        if (block.type === "repeat_start"){
          const endIdx = findMatchingEnd(idx);
          if (endIdx !== -1) sequence.splice(endIdx, 1);
        } else if (block.type === "repeat_end"){
          const startIdx = findMatchingStart(idx);
          if (startIdx !== -1) sequence.splice(startIdx, 1);
        }
        sequence = sequence.filter(b => b.id !== block.id);
        renderSequence();
      });
      row.appendChild(rm);
      li.appendChild(row);

      if (def.fields && def.fields.length){
        const fieldsWrap = document.createElement("div");
        fieldsWrap.className = "block-fields";
        def.fields.forEach(f => {
          const fw = document.createElement("div");
          fw.className = "field";
          const lab = document.createElement("label");
          lab.textContent = f.label;
          fw.appendChild(lab);
          if (f.type === "select"){
            const sel = document.createElement("select");
            f.options.forEach(opt => {
              const o = document.createElement("option");
              o.value = opt.value; o.textContent = opt.label;
              if (block.params[f.key] === opt.value) o.selected = true;
              sel.appendChild(o);
            });
            sel.addEventListener("change", () => { block.params[f.key] = sel.value; });
            fw.appendChild(sel);
          } else {
            const inp = document.createElement("input");
            inp.type = "number";
            inp.min = f.min; inp.max = f.max; inp.step = f.step;
            inp.value = block.params[f.key];
            inp.addEventListener("change", () => {
              let v = parseFloat(inp.value);
              if (isNaN(v)) v = f.def;
              v = Math.max(f.min, Math.min(f.max, v));
              block.params[f.key] = v;
              inp.value = v;
            });
            fw.appendChild(inp);
          }
          fieldsWrap.appendChild(fw);
        });
        li.appendChild(fieldsWrap);
      }

      if (block.type === "combo"){
        if (!block.params.slots) block.params.slots = [null, null, null, null];
        const slotsWrap = document.createElement("div");
        slotsWrap.style.marginTop = "8px";
        slotsWrap.style.display = "flex";
        slotsWrap.style.flexDirection = "column";
        slotsWrap.style.gap = "6px";
        block.params.slots.forEach((slot, si) => {
          const slotBox = document.createElement("div");
          slotBox.style.border = "1px dashed var(--border)";
          slotBox.style.borderRadius = "6px";
          slotBox.style.padding = "6px 8px";

          const selRow = document.createElement("div");
          selRow.style.display = "flex";
          selRow.style.alignItems = "center";
          selRow.style.gap = "6px";
          const lab = document.createElement("span");
          lab.style.fontSize = "10px";
          lab.style.color = "var(--text-muted)";
          lab.style.textTransform = "uppercase";
          lab.textContent = "Slot " + (si + 1);
          selRow.appendChild(lab);

          const sel = document.createElement("select");
          sel.style.flex = "1";
          sel.style.fontSize = "12px";
          sel.style.background = "var(--bg-deep)";
          sel.style.color = "var(--text-primary)";
          sel.style.border = "1px solid var(--border)";
          sel.style.borderRadius = "5px";
          sel.style.padding = "4px";
          const emptyOpt = document.createElement("option");
          emptyOpt.value = ""; emptyOpt.textContent = "(empty)";
          sel.appendChild(emptyOpt);
          COMBO_ALLOWED.forEach(t => {
            const d = BLOCK_DEFS[t];
            const o = document.createElement("option");
            o.value = t; o.textContent = d.label;
            if (slot && slot.type === t) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", () => {
            const t = sel.value;
            if (!t) block.params.slots[si] = null;
            else { const nb = makeBlock(t); block.params.slots[si] = {type: t, params: nb.params}; }
            renderSequence();
          });
          selRow.appendChild(sel);
          slotBox.appendChild(selRow);

          if (slot){
            const subDef = BLOCK_DEFS[slot.type];
            if (subDef && subDef.fields && subDef.fields.length){
              renderFieldsInto(slotBox, subDef.fields, slot.params);
            }
          }
          slotsWrap.appendChild(slotBox);
        });
        li.appendChild(slotsWrap);
      }

      if (block.type === "repeat_start") depth += 1;

      li.addEventListener("dragstart", () => { dragFromIndex = idx; li.classList.add("dragging"); });
      li.addEventListener("dragend", () => { li.classList.remove("dragging"); });
      li.addEventListener("dragover", (e) => e.preventDefault());
      li.addEventListener("drop", (e) => {
        e.preventDefault();
        if (dragFromIndex === null || dragFromIndex === idx) return;
        const moved = sequence.splice(dragFromIndex, 1)[0];
        sequence.splice(idx, 0, moved);
        dragFromIndex = null;
        renderSequence();
      });
      seqEl.appendChild(li);
    });
  }

  function findMatchingEnd(startIdx){
    let d = 0;
    for (let i = startIdx; i < sequence.length; i++){
      if (sequence[i].type === "repeat_start") d++;
      if (sequence[i].type === "repeat_end"){ d--; if (d === 0) return i; }
    }
    return -1;
  }
  function findMatchingStart(endIdx){
    let d = 0;
    for (let i = endIdx; i >= 0; i--){
      if (sequence[i].type === "repeat_end") d++;
      if (sequence[i].type === "repeat_start"){ d--; if (d === 0) return i; }
    }
    return -1;
  }

  sequence = [
    makeBlock("telegraph"),
    makeBlock("spread"),
    makeBlock("wait"),
    makeBlock("spiral"),
    makeBlock("move_boss"),
    makeBlock("homing"),
    makeBlock("wall"),
    makeBlock("telegraph"),
    makeBlock("giga_laser"),
  ];
  renderSequence();

  const statusEl = document.getElementById("status-msg");
  document.getElementById("clear-seq-btn").addEventListener("click", () => {
    if (confirm("Clear the entire sequence?")){ sequence = []; renderSequence(); }
  });
  document.getElementById("export-btn").addEventListener("click", () => {
    const data = sequence.map(b => ({type: b.type, params: b.params}));

      statusEl.textContent = "Sequence copied to clipboard!";

    }).catch(() => {
      prompt("Copy this JSON:", json);

  document.getElementById("import-btn").addEventListener("click", () => {
    const raw = prompt("Paste sequence JSON:");
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) throw new Error("Not an array");
      sequence = data.map(d => {
        const b = makeBlock(d.type);
        if (d.params) Object.assign(b.params, d.params);
        return b;
      });
      renderSequence();
      statusEl.textContent = "Imported " + sequence.length + " blocks.";
    } catch (err) {
      alert("Invalid JSON: " + err.message);
    }
  });

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const BASE_BOX = {x: 20, y: 34, w: canvas.width - 40, h: canvas.height - 56};

  const playBtn = document.getElementById("play-btn");

  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  let game = null;
  let fightSequence = [];
  let lastFrame = null;

  function resetHpUI(){

  function buildRuntime(){
    BOX = Object.assign({}, BASE_BOX);
    return {
      pc: 0, t: 0, repeatStack: [], bullets: [], lasers: [], rings: [], particles: [],
      spawnAcc: 0, running: true, won: false, lost: false, steps: 0,
      telegraphFlash: 0, bossX: BOX.x + BOX.w/2, bossFrom: BOX.x + BOX.w/2, bossTo: BOX.x + BOX.w/2,
      spiralAngle: 0, timeScale: 1, slowmoLeft: 0, shakeLeft: 0, shakeIntensity: 0,

  function startFight(){
    if (sequence.length === 0){
      statusEl.textContent = "Add at least one block first.";

    fightSequence = JSON.parse(JSON.stringify(sequence));

  function stopFight(reasonText, cls){

  document.getElementById("play-btn").addEventListener("click", startFight);

  function mkBullet(x, y, vx, vy, r, shape, extra){
    const b = {x, y, vx, vy, r: r || 6, shape: shape || "circle", life: 12};
    if (extra) Object.assign(b, extra);
    return b;
  }

  function spawnSpread(g, params){
    const n = params.count;
    for (let i = 0; i < n; i++){
      const x = BOX.x + (BOX.w / (n - 1 || 1)) * i;
      g.bullets.push(mkBullet(x, BOX.y - 6, 0, params.speed, 6, params.shape));
    }
  }
  function spawnAimedWave(g, params){
    const px = g.player.x, py = g.player.y;
    const sx = g.bossX, sy = BOX.y - 4;
    const dx = px - sx, dy = py - sy;
    const len = Math.hypot(dx, dy) || 1;
    g.bullets.push(mkBullet(sx, sy, dx/len*params.speed, dy/len*params.speed, 7, params.shape));
  }
  function spawnWallRow(g, gapStart, gapSize, speed, shape){
    const gapEnd = gapStart + gapSize;
    const step = 15;
    for (let x = BOX.x; x <= BOX.x + BOX.w; x += step){
      if (x >= gapStart && x <= gapEnd) continue;
      g.bullets.push(mkBullet(x, BOX.y - 5, 0, speed, 5.5, shape));
    }
  }
  function spawnWall(g, params){
    const gapStart = BOX.x + (params.gapPos/100) * BOX.w - params.gapSize/2;
    spawnWallRow(g, gapStart, params.gapSize, params.speed, params.shape);
  }
  function spawnRainDrop(g, params){
    const x = BOX.x + Math.random() * BOX.w;
    g.bullets.push(mkBullet(x, BOX.y - 5, 0, params.speed, 5, params.shape));
  }
  function spawnRing(g, params){
    const cx = g.bossX, cy = BOX.y + 30;
    for (let i = 0; i < params.count; i++){
      const ang = (360 / params.count) * i * Math.PI / 180;
      g.bullets.push(mkBullet(cx, cy, Math.sin(ang)*params.speed, Math.cos(ang)*params.speed, 5.5, params.shape));
    }
  }
  function spawnSpiralTick(g, params){
    const cx = g.bossX, cy = BOX.y + 18;
    for (let i = 0; i < params.arms; i++){
      const ang = (g.spiralAngle + (360/params.arms)*i) * Math.PI / 180;
      g.bullets.push(mkBullet(cx, cy, Math.sin(ang)*params.speed, Math.cos(ang)*params.speed, 5, params.shape));
    }
  }
  function spawnHomingBullet(g, params){
    const sx = g.bossX, sy = BOX.y - 4;
    const angle = (Math.random()*36 - 18) * Math.PI / 180;
    g.bullets.push(mkBullet(sx, sy, Math.sin(angle)*params.speed, Math.cos(angle)*params.speed, 6, params.shape, {
      homing: true, speed: params.speed, turnRate: params.turnRate, life: 6.5
    }));
  }
  function spawnShotgunWave(g, params){
    const px = g.player.x, py = g.player.y;
    const sx = g.bossX, sy = BOX.y - 4;
    const baseAng = Math.atan2(px - sx, py - sy);
    const half = (params.spread * Math.PI/180) / 2;
    for (let i = 0; i < params.count; i++){
      const t = params.count === 1 ? 0.5 : i / (params.count - 1);
      const ang = baseAng - half + t * half * 2;
      g.bullets.push(mkBullet(sx, sy, Math.sin(ang)*params.speed, Math.cos(ang)*params.speed, 5.5, params.shape));
    }
  }
  function spawnCross(g, params){
    const cx = g.bossX, cy = BOX.y + 28;
    const rot = (params.rotate || 0) * Math.PI / 180;
    const dirs = [0, Math.PI/2, Math.PI, Math.PI*1.5];
    dirs.forEach(base => {
      for (let i = 1; i <= params.density; i++){
        const dist = i * 14;
        const ang = base + rot;
        const x = cx + Math.sin(ang) * dist;
        const y = cy + Math.cos(ang) * dist;
        g.bullets.push(mkBullet(x, y, Math.sin(ang)*params.speed, Math.cos(ang)*params.speed, 5, params.shape));
      }
    });
  }
  function spawnBounce(g, params){
    for (let i = 0; i < params.count; i++){
      const ang = (Math.random() * 50 - 25 + 180) * Math.PI / 180;
      const speed = params.speed * (0.85 + Math.random()*0.3);
      g.bullets.push(mkBullet(BOX.x + 20 + Math.random()*(BOX.w-40), BOX.y - 4,
        Math.sin(ang)*speed, Math.cos(ang)*speed, 6, params.shape,
        {bounce: true, bouncesLeft: params.bounces}));
    }
  }
  function spawnOrbit(g, params){
    const cx = g.bossX, cy = BOX.y + 26;
    for (let i = 0; i < params.count; i++){
      const ang = (360 / params.count) * i * Math.PI / 180;
      g.bullets.push(mkBullet(cx, cy, 0, 0, 5.5, params.shape, {
        orbit: true, orbitCx: cx, orbitCy: cy, orbitAngle: ang, orbitRadius: 28,
        orbitSpeed: 2.8, orbitTimeLeft: params.orbitTime, flySpeed: params.speed
      }));
    }
  }
  function spawnSplitter(g, params){
    for (let i = 0; i < params.count; i++){
      const ang = ((i / params.count) * 60 - 30) * Math.PI / 180;
      g.bullets.push(mkBullet(g.bossX, BOX.y - 4, Math.sin(ang)*params.speed, Math.cos(ang)*params.speed, 7, params.shape, {
        splitter: true, splitInto: params.splitInto, splitDelay: params.splitDelay, splitTimer: 0, speed: params.speed
      }));
    }
  }
  function spawnWaveStreams(g, params){
    for (let s = 0; s < params.count; s++){
      const baseX = BOX.x + (BOX.w / (params.count + 1)) * (s + 1);
      g.bullets.push(mkBullet(baseX, BOX.y - 6, 0, params.speed, 5.5, params.shape, {
        wave: true, waveAmp: params.amp, waveFreq: params.freq, wavePhase: s * 1.2, waveBaseX: baseX, waveT: 0
      }));
    }
  }

  function spawnExpandingRing(g, p, idx){
    const gapAngle = (((p.escapePos || 90) + (idx || 0) * 47) % 360) * Math.PI / 180;
    const gapWidth = ((p.escapeDeg || 70) * Math.PI / 180);
    g.rings.push({
      cx: g.bossX, cy: BOX.y + 28, r: 8, speed: p.speed, thickness: p.thickness, maxR: 420,
      gapAngle, gapWidth,
    });
  }
  function angleInGap(ang, gapAngle, gapWidth){
    let diff = ang - gapAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return Math.abs(diff) <= gapWidth / 2;
  }

  function comboStart(g, proc){
    const p = proc.params;
    switch (proc.type){
      case "spread": spawnSpread(g, p); break;
      case "wall": spawnWall(g, p); break;
      case "ring": spawnRing(g, p); break;
      case "cross": spawnCross(g, p); break;
      case "bounce": spawnBounce(g, p); break;
      case "orbit": spawnOrbit(g, p); break;
      case "splitter": spawnSplitter(g, p); break;
      case "aimed": proc.state.wavesLeft = p.waves - 1; proc.state.gapAcc = 0; spawnAimedWave(g, p); break;
      case "homing": proc.state.left = p.count - 1; proc.state.gapAcc = 0; spawnHomingBullet(g, p); break;
      case "shotgun": proc.state.wavesLeft = p.waves - 1; proc.state.gapAcc = 0; spawnShotgunWave(g, p); break;
      case "rain": case "moving_wall": case "chaos": proc.state.spawnAcc = 0; break;
      case "spiral": proc.state.spawnAcc = 0; proc.state.angle = 0; break;
      case "wave": proc.state.acc = 0; spawnWaveStreams(g, p); break;
      case "expanding_ring":
        proc.state.wavesLeft = p.count; proc.state.gapAcc = 0; proc.state.idx = 0;
        spawnExpandingRing(g, p, proc.state.idx); proc.state.idx++; proc.state.wavesLeft--; break;
      case "telegraph": g.telegraphFlash = Math.max(g.telegraphFlash || 0, p.duration); break;
      case "shake": g.shakeLeft = p.duration; g.shakeIntensity = p.intensity; break;
      case "flash": g.flashLeft = p.duration; g.flashColor = p.color || "white"; break;
      case "slowmo": g.timeScale = (p.factor || 40) / 100; g.slowmoLeft = p.duration; break;
      case "arena_shrink": g.arenaTargetScale = (p.scale || 70) / 100; g.arenaShrinkLeft = p.duration; break;
      case "clear_bullets": g.bullets = []; g.lasers = []; g.rings = []; break;
      case "move_boss": proc.state.from = g.bossX; proc.state.to = BOX.x + (p.targetPercent / 100) * BOX.w; break;
      case "laser":
        g.lasers.push({mode: p.mode || "sweep", width: p.width || 22, speed: p.speed || 90, t: 0, duration: p.duration || 2.4, x: BOX.x + BOX.w/2, dir: 1}); break;
      default: break; // "wait" and unknowns: nothing to do
    }
  }

  function comboTick(g, proc, dt){
    const p = proc.params;
    switch (proc.type){
      case "aimed":
        proc.state.gapAcc += dt;
        if (proc.state.wavesLeft > 0 && proc.state.gapAcc >= p.gap){ proc.state.gapAcc = 0; proc.state.wavesLeft--; spawnAimedWave(g, p); }
        break;
      case "homing":
        proc.state.gapAcc += dt;
        if (proc.state.left > 0 && proc.state.gapAcc >= p.gap){ proc.state.gapAcc = 0; proc.state.left--; spawnHomingBullet(g, p); }
        break;
      case "shotgun":
        proc.state.gapAcc += dt;
        if (proc.state.wavesLeft > 0 && proc.state.gapAcc >= p.gap){ proc.state.gapAcc = 0; proc.state.wavesLeft--; spawnShotgunWave(g, p); }
        break;
      case "rain":
        proc.state.spawnAcc += dt;
        { const interval = 1 / p.rate; while (proc.state.spawnAcc >= interval){ proc.state.spawnAcc -= interval; spawnRainDrop(g, p); } }
        break;
      case "spiral":
        proc.state.spawnAcc += dt; proc.state.angle += p.rotSpeed * dt;
        { const interval = 1 / p.rate;
          while (proc.state.spawnAcc >= interval){
            proc.state.spawnAcc -= interval;
            const cx = g.bossX, cy = BOX.y + 18;
            for (let i = 0; i < p.arms; i++){
              const ang = (proc.state.angle + (360/p.arms)*i) * Math.PI / 180;
              g.bullets.push(mkBullet(cx, cy, Math.sin(ang)*p.speed, Math.cos(ang)*p.speed, 5, p.shape));
            }
          }
        }
        break;
      case "moving_wall":
        proc.state.spawnAcc += dt;
        { const interval = 0.14;
          while (proc.state.spawnAcc >= interval){
            proc.state.spawnAcc -= interval;
            const frac = 0.5 + 0.5 * Math.sin(proc.elapsed * p.oscSpeed);
            spawnWallRow(g, BOX.x + frac * BOX.w - p.gapSize/2, p.gapSize, p.speed, p.shape);
          }
        }
        break;
      case "expanding_ring":
        if (proc.state.wavesLeft > 0){
          proc.state.gapAcc = (proc.state.gapAcc || 0) + dt;
          if (proc.state.gapAcc >= (p.gap || 0.45)){
            proc.state.gapAcc = 0;
            spawnExpandingRing(g, p, proc.state.idx); proc.state.idx++; proc.state.wavesLeft--;
          }
        }
        break;
      case "wave":
        proc.state.acc = (proc.state.acc || 0) + dt;
        if (proc.state.acc >= 0.22){ proc.state.acc = 0; spawnWaveStreams(g, p); }
        break;
      case "chaos":
        proc.state.spawnAcc += dt;
        { const rate = 3.5 * (p.intensity || 1); const interval = 1 / rate;
          while (proc.state.spawnAcc >= interval){
            proc.state.spawnAcc -= interval;
            if (Math.random() < 0.55) spawnRainDrop(g, {speed: 100 + Math.random()*60, shape: p.shape});
            else if (Math.random() < 0.5){
              const ang = Math.random()*Math.PI*2;
              g.bullets.push(mkBullet(g.bossX, BOX.y+24, Math.sin(ang)*110, Math.cos(ang)*110, 5, p.shape));
            } else spawnAimedWave(g, {speed: 140, shape: p.shape});
          }
        }
        break;
      case "move_boss":
        { const frac = Math.min(1, proc.elapsed / Math.max(0.001, p.duration || 1));
          g.bossX = proc.state.from + (proc.state.to - proc.state.from) * frac; }
        break;
      default: break;
    }
  }

  function enterInstruction(g, block){
    if (!block) return;
    const p = block.params || {};
    switch (block.type){
      case "spread": spawnSpread(g, p); break;
      case "wall": spawnWall(g, p); break;
      case "ring": spawnRing(g, p); break;
      case "aimed":
        g.aimedWavesLeft = p.waves - 1; g.aimedGapAcc = 0; spawnAimedWave(g, p); break;
      case "homing":
        g.homingLeft = p.count - 1; g.homingGapAcc = 0; spawnHomingBullet(g, p); break;
      case "telegraph": g.telegraphFlash = p.duration; break;
      case "rain": case "moving_wall": case "chaos": g.spawnAcc = 0; break;
      case "spiral": g.spawnAcc = 0; g.spiralAngle = 0; break;
      case "move_boss":
        g.bossFrom = g.bossX; g.bossTo = BOX.x + (p.targetPercent/100) * BOX.w; break;
      case "clear_bullets": g.bullets = []; g.lasers = []; g.rings = []; break;
      case "shake": g.shakeLeft = p.duration; g.shakeIntensity = p.intensity; break;
      case "flash": g.flashLeft = p.duration; g.flashColor = p.color || "white"; break;
      case "slowmo": g.timeScale = (p.factor || 40) / 100; g.slowmoLeft = p.duration; break;
      case "arena_shrink":
        g.arenaTargetScale = (p.scale || 70) / 100; g.arenaShrinkLeft = p.duration; g.currentScale = 1; break;
      case "laser":
        g.lasers.push({mode: p.mode || "sweep", width: p.width || 22, speed: p.speed || 90, t: 0, duration: p.duration || 2.4, x: BOX.x + BOX.w/2, dir: 1}); break;
      case "expanding_ring":
        g.ringWavesLeft = p.count; g.ringGapAcc = 0; g.ringParams = p; g.ringSpawnIndex = 0;
        spawnExpandingRing(g, p, g.ringSpawnIndex);
        g.ringSpawnIndex++;
        g.ringWavesLeft--; break;
      case "cross": spawnCross(g, p); break;
      case "wave": g.waveAcc = 0; g.waveParams = p; spawnWaveStreams(g, p); break;
      case "bounce": spawnBounce(g, p); break;
      case "shotgun":
        g.shotgunWavesLeft = p.waves - 1; g.shotgunGapAcc = 0; spawnShotgunWave(g, p); break;
      case "cage":
        g.cage = {left: BOX.x - 10, right: BOX.x + BOX.w + 10, top: BOX.y - 10, bottom: BOX.y + BOX.h + 10, targetGap: p.gap, speed: p.speed, shape: p.shape, t: 0}; break;
      case "orbit": spawnOrbit(g, p); break;
      case "splitter": spawnSplitter(g, p); break;
      case "giga_laser":
        g.giga = {charge: p.charge || 1.1, hold: p.hold || 1.4, width: p.width || 70, t: 0, phase: "charge", x: g.bossX}; break;
      case "chaos": g.chaosParams = p; g.spawnAcc = 0; break;
      case "combo":
        g.comboProcs = (p.slots || []).filter(Boolean).map(sub => {
          const proc = {type: sub.type, params: sub.params, state: {}, elapsed: 0};
          comboStart(g, proc);
          return proc;
        });
        break;
    }
  }

  function loop(ts){
    if (!game || !game.running) return;
    if (lastFrame === null) lastFrame = ts;
    let rawDt = (ts - lastFrame) / 1000;
    rawDt = Math.min(rawDt, 0.05);
    lastFrame = ts;
    const dt = rawDt * (game.timeScale || 1);
    update(game, dt, rawDt);
    render(game);
    if (game.won){ stopFight("Fight cleared!", "win"); return; }
    if (game.lost){ stopFight("You were hit too many times.", "lose"); return; }
    requestAnimationFrame(loop);
  }

  function applyArenaScale(g){
    const s = g.currentScale;
    const cx = BASE_BOX.x + BASE_BOX.w/2;
    const cy = BASE_BOX.y + BASE_BOX.h/2;
    BOX.w = BASE_BOX.w * s;
    BOX.h = BASE_BOX.h * s;
    BOX.x = cx - BOX.w/2;
    BOX.y = cy - BOX.h/2;
  }

  function update(g, dt, rawDt){
    g.player.hitThisFrame = false;

    if (g.slowmoLeft > 0){
      g.slowmoLeft -= rawDt;
      if (g.slowmoLeft <= 0) g.timeScale = 1;
    }
    if (g.shakeLeft > 0){
      g.shakeLeft -= rawDt;
      const intensity = g.shakeIntensity * (g.shakeLeft > 0 ? 1 : 0);
      shakeOffset.x = (Math.random()-0.5) * intensity * 2;
      shakeOffset.y = (Math.random()-0.5) * intensity * 2;
    } else { shakeOffset.x = 0; shakeOffset.y = 0; }
    if (g.flashLeft > 0) g.flashLeft -= rawDt;

    if (g.arenaShrinkLeft > 0){
      g.arenaShrinkLeft -= dt;
      g.currentScale += (g.arenaTargetScale - g.currentScale) * Math.min(1, dt * 3);
      if (g.arenaShrinkLeft <= 0){
        g.currentScale += (1 - g.currentScale) * Math.min(1, dt * 4);
        if (Math.abs(g.currentScale - 1) < 0.01) g.currentScale = 1;
      }
      applyArenaScale(g);
    } else if (g.currentScale !== 1){
      g.currentScale += (1 - g.currentScale) * Math.min(1, dt * 4);
      if (Math.abs(g.currentScale - 1) < 0.01) g.currentScale = 1;
      applyArenaScale(g);
    }

    const speed = 155;
    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;
    if (dx || dy){
      const len = Math.hypot(dx, dy);
      g.player.x += (dx/len) * speed * dt;
      g.player.y += (dy/len) * speed * dt;
    }
    g.player.x = Math.max(BOX.x + g.player.r, Math.min(BOX.x + BOX.w - g.player.r, g.player.x));
    g.player.y = Math.max(BOX.y + g.player.r, Math.min(BOX.y + BOX.h - g.player.r, g.player.y));

    if (g.player.invuln > 0) g.player.invuln -= rawDt;
    if (g.telegraphFlash > 0) g.telegraphFlash -= dt;

    if (g.pc === 0 && g.t === 0 && g.steps === 0) enterInstruction(g, fightSequence[0]);
    const block = fightSequence[g.pc];
    if (block){
      g.t += dt;
      const dur = (block.params && block.params.duration !== undefined) ? block.params.duration : 0;
      const p = block.params || {};

      if (block.type === "aimed"){
        g.aimedGapAcc = (g.aimedGapAcc || 0) + dt;
        if (g.aimedWavesLeft > 0 && g.aimedGapAcc >= p.gap){ g.aimedGapAcc = 0; g.aimedWavesLeft -= 1; spawnAimedWave(g, p); }
      }
      if (block.type === "homing"){
        g.homingGapAcc = (g.homingGapAcc || 0) + dt;
        if (g.homingLeft > 0 && g.homingGapAcc >= p.gap){ g.homingGapAcc = 0; g.homingLeft -= 1; spawnHomingBullet(g, p); }
      }
      if (block.type === "shotgun"){
        g.shotgunGapAcc = (g.shotgunGapAcc || 0) + dt;
        if (g.shotgunWavesLeft > 0 && g.shotgunGapAcc >= p.gap){ g.shotgunGapAcc = 0; g.shotgunWavesLeft -= 1; spawnShotgunWave(g, p); }
      }
      if (block.type === "rain"){
        g.spawnAcc += dt;
        const interval = 1 / p.rate;
        while (g.spawnAcc >= interval){ g.spawnAcc -= interval; spawnRainDrop(g, p); }
      }
      if (block.type === "spiral"){
        g.spawnAcc += dt;
        g.spiralAngle += p.rotSpeed * dt;
        const interval = 1 / p.rate;
        while (g.spawnAcc >= interval){ g.spawnAcc -= interval; spawnSpiralTick(g, p); }
      }
      if (block.type === "moving_wall"){
        g.spawnAcc += dt;
        const interval = 0.14;
        while (g.spawnAcc >= interval){
          g.spawnAcc -= interval;
          const frac = 0.5 + 0.5 * Math.sin(g.t * p.oscSpeed);
          spawnWallRow(g, BOX.x + frac * BOX.w - p.gapSize/2, p.gapSize, p.speed, p.shape);
        }
      }
      if (block.type === "expanding_ring" && g.ringWavesLeft > 0){
        g.ringGapAcc = (g.ringGapAcc || 0) + dt;
        if (g.ringGapAcc >= (g.ringParams.gap || 0.45)){
          g.ringGapAcc = 0;
          spawnExpandingRing(g, g.ringParams, g.ringSpawnIndex);
          g.ringSpawnIndex++;
          g.ringWavesLeft--;
        }
      }
      if (block.type === "wave"){
        g.waveAcc = (g.waveAcc || 0) + dt;
        if (g.waveAcc >= 0.22){ g.waveAcc = 0; spawnWaveStreams(g, p); }
      }
      if (block.type === "chaos"){
        g.spawnAcc += dt;
        const rate = 3.5 * (p.intensity || 1);
        const interval = 1 / rate;
        while (g.spawnAcc >= interval){
          g.spawnAcc -= interval;
          if (Math.random() < 0.55) spawnRainDrop(g, {speed: 100 + Math.random()*60, shape: p.shape});
          else if (Math.random() < 0.5){
            const ang = Math.random()*Math.PI*2;
            g.bullets.push(mkBullet(g.bossX, BOX.y+24, Math.sin(ang)*110, Math.cos(ang)*110, 5, p.shape));
          } else spawnAimedWave(g, {speed: 140, shape: p.shape});
        }
      }
      if (block.type === "move_boss"){
        const frac = Math.min(1, g.t / Math.max(0.001, dur));
        g.bossX = g.bossFrom + (g.bossTo - g.bossFrom) * frac;
      }
      if (block.type === "combo" && g.comboProcs){
        g.comboProcs.forEach(proc => {
          proc.elapsed += dt;
          if (proc.elapsed <= (proc.params.duration || 9999)) comboTick(g, proc, dt);
        });
      }
      if (block.type === "cage" && g.cage){
        const c = g.cage; c.t += dt;
        const cx = BOX.x + BOX.w/2, cy = BOX.y + BOX.h/2;
        const targetHalf = c.targetGap / 2;
        c.left = Math.min(c.left + c.speed * dt, cx - targetHalf);
        c.right = Math.max(c.right - c.speed * dt, cx + targetHalf);
        c.top = Math.min(c.top + c.speed * dt, cy - targetHalf);
        c.bottom = Math.max(c.bottom - c.speed * dt, cy + targetHalf);
      }
      if (block.type === "giga_laser" && g.giga){
        const gl = g.giga; gl.t += dt; gl.x = g.bossX;
        if (gl.phase === "charge" && gl.t >= gl.charge){ gl.phase = "fire"; gl.t = 0; }
        else if (gl.phase === "fire" && gl.t >= gl.hold){ gl.phase = "done"; }
      }

      const isRepeatMarker = block.type === "repeat_start" || block.type === "repeat_end";
      const isInstant = ["clear_bullets","shake","flash"].includes(block.type);
      const finished = isRepeatMarker || isInstant ? true : g.t >= dur;

      if (finished){
        g.steps++;
        if (g.steps > 1200){ g.won = true; return; }
        if (block.type === "repeat_start"){
          g.repeatStack.push({startIdx: g.pc + 1, remaining: p.count - 1});
          g.pc += 1;
        } else if (block.type === "repeat_end"){
          const top = g.repeatStack[g.repeatStack.length - 1];
          if (top && top.remaining > 0){ top.remaining -= 1; g.pc = top.startIdx; }
          else { g.repeatStack.pop(); g.pc += 1; }
        } else g.pc += 1;
        g.t = 0;
        if (block.type === "cage") g.cage = null;
        if (block.type === "giga_laser") g.giga = null;
        if (block.type === "combo") g.comboProcs = null;
        if (g.pc < fightSequence.length) enterInstruction(g, fightSequence[g.pc]);
      }
    }
    if (g.pc >= fightSequence.length) g.won = true;

    g.lasers.forEach(L => {
      L.t += dt;
      if (L.mode === "sweep"){
        L.x += L.dir * L.speed * dt;
        if (L.x < BOX.x + L.width/2){ L.x = BOX.x + L.width/2; L.dir = 1; }
        if (L.x > BOX.x + BOX.w - L.width/2){ L.x = BOX.x + BOX.w - L.width/2; L.dir = -1; }
      } else if (L.mode === "vertical"){
        L.x = BOX.x + BOX.w/2 + Math.sin(L.t * 1.4) * (BOX.w * 0.35);
      } else L.x = g.bossX;
    });
    g.lasers = g.lasers.filter(L => L.t < L.duration);

    g.rings.forEach(R => { R.r += R.speed * dt; });
    g.rings = g.rings.filter(R => R.r < R.maxR);

    const newBullets = [];
    g.bullets.forEach(b => {
      if (b.homing){
        const desiredAng = Math.atan2(g.player.x - b.x, g.player.y - b.y);
        const curAng = Math.atan2(b.vx, b.vy);
        let diff = desiredAng - curAng;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        const maxTurn = (b.turnRate * Math.PI/180) * dt;
        const clamped = Math.max(-maxTurn, Math.min(maxTurn, diff));
        const newAng = curAng + clamped;
        b.vx = Math.sin(newAng) * b.speed;
        b.vy = Math.cos(newAng) * b.speed;
      }
      if (b.orbit){
        if (b.orbitTimeLeft > 0){
          b.orbitTimeLeft -= dt;
          b.orbitAngle += b.orbitSpeed * dt;
          b.orbitRadius += 12 * dt;
          b.x = b.orbitCx + Math.sin(b.orbitAngle) * b.orbitRadius;
          b.y = b.orbitCy + Math.cos(b.orbitAngle) * b.orbitRadius;
        } else {
          const ang = b.orbitAngle;
          b.vx = Math.sin(ang) * b.flySpeed;
          b.vy = Math.cos(ang) * b.flySpeed;
          b.orbit = false;
        }
      }
      if (b.wave){
        b.waveT += dt;
        b.x = b.waveBaseX + Math.sin(b.waveT * b.waveFreq + b.wavePhase) * b.waveAmp;
        b.y += b.vy * dt;
      } else if (!b.orbit){
        b.x += b.vx * dt; b.y += b.vy * dt;
      }
      b.life -= dt;
      if (b.bounce && b.bouncesLeft > 0){
        if (b.x < BOX.x + b.r){ b.x = BOX.x + b.r; b.vx = Math.abs(b.vx); b.bouncesLeft--; }
        if (b.x > BOX.x + BOX.w - b.r){ b.x = BOX.x + BOX.w - b.r; b.vx = -Math.abs(b.vx); b.bouncesLeft--; }
        if (b.y < BOX.y + b.r){ b.y = BOX.y + b.r; b.vy = Math.abs(b.vy); b.bouncesLeft--; }
        if (b.y > BOX.y + BOX.h - b.r){ b.y = BOX.y + BOX.h - b.r; b.vy = -Math.abs(b.vy); b.bouncesLeft--; }
      }
      if (b.splitter){
        b.splitTimer = (b.splitTimer || 0) + dt;
        if (b.splitTimer >= b.splitDelay){
          b.splitter = false;
          for (let i = 0; i < b.splitInto; i++){
            const ang = (360 / b.splitInto) * i * Math.PI / 180 + Math.random()*0.4;
            newBullets.push(mkBullet(b.x, b.y, Math.sin(ang)*b.speed*0.9, Math.cos(ang)*b.speed*0.9, 4.5, b.shape));
          }
        }
      }
    });
    if (newBullets.length) g.bullets.push(...newBullets);
    g.bullets = g.bullets.filter(b => b.x > BOX.x - 40 && b.x < BOX.x + BOX.w + 40 && b.y > BOX.y - 40 && b.y < BOX.y + BOX.h + 40);

    g.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.vx *= 0.96; p.vy *= 0.96; });
    g.particles = g.particles.filter(p => p.life > 0);

    if (g.player.invuln <= 0 && !g.player.hitThisFrame){
      let hit = false;
      for (const b of g.bullets){
        if (Math.hypot(b.x - g.player.x, b.y - g.player.y) < b.r + g.player.r - 0.5){ hit = true; break; }
      }
      if (!hit){
        for (const L of g.lasers){
          if (L.mode === "vertical"){
            if (Math.abs(g.player.x - L.x) < L.width/2 + g.player.r) hit = true;
          } else {
            if (Math.abs(g.player.x - L.x) < L.width/2 + g.player.r) hit = true;
          }
          if (hit) break;
        }
      }
      if (!hit){
        for (const R of g.rings){
          const d = Math.hypot(g.player.x - R.cx, g.player.y - R.cy);
          if (Math.abs(d - R.r) < R.thickness/2 + g.player.r){
            if (R.gapAngle !== undefined){
              const ang = Math.atan2(g.player.y - R.cy, g.player.x - R.cx);
              if (angleInGap(ang, R.gapAngle, R.gapWidth)) continue;
            }
            hit = true; break;
          }
        }
      }
      if (!hit && g.cage){
        const c = g.cage, pr = g.player.r;
        if (g.player.x - pr < c.left || g.player.x + pr > c.right || g.player.y - pr < c.top || g.player.y + pr > c.bottom) hit = true;
      }
      if (!hit && g.giga && g.giga.phase === "fire"){
        if (Math.abs(g.player.x - g.giga.x) < g.giga.width/2 + g.player.r) hit = true;
      }
      if (hit){
        g.player.hp = Math.max(0, g.player.hp - 10);
        g.player.invuln = 0.75;
        g.player.hitThisFrame = true;
        for (let i = 0; i < 10; i++){
          const ang = Math.random()*Math.PI*2, sp = 40 + Math.random()*80;
          g.particles.push({x: g.player.x, y: g.player.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 0.35 + Math.random()*0.25, color: "#ffd23f"});
        }
        hpFill.style.width = g.player.hp + "%";
        hpText.textContent = g.player.hp + "/100";
        if (g.player.hp <= 0) g.lost = true;
      }
    }
  }

  function drawShape(ctx, x, y, r, shape){
    ctx.beginPath();
    if (shape === "square") ctx.rect(x - r, y - r, r*2, r*2);
    else if (shape === "triangle"){
      ctx.moveTo(x, y - r*1.2); ctx.lineTo(x - r, y + r*0.85); ctx.lineTo(x + r, y + r*0.85); ctx.closePath();
    } else if (shape === "diamond"){
      ctx.moveTo(x, y - r*1.25); ctx.lineTo(x + r*1.15, y); ctx.lineTo(x, y + r*1.25); ctx.lineTo(x - r*1.15, y); ctx.closePath();
    } else if (shape === "heart"){
      const s = r / 6;
      ctx.moveTo(x, y + 4*s);
      ctx.bezierCurveTo(x, y + 1.5*s, x - 5*s, y - 3*s, x - 5*s, y - 1*s);
      ctx.bezierCurveTo(x - 5*s, y + 2*s, x, y + 4.5*s, x, y + 7*s);
      ctx.bezierCurveTo(x, y + 4.5*s, x + 5*s, y + 2*s, x + 5*s, y - 1*s);
      ctx.bezierCurveTo(x + 5*s, y - 3*s, x, y + 1.5*s, x, y + 4*s);
      ctx.closePath();
    } else if (shape === "star"){
      const spikes = 5, outer = r * 1.2, inner = r * 0.5;
      for (let i = 0; i < spikes * 2; i++){
        const ang = (i * Math.PI / spikes) - Math.PI/2;
        const rad = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else if (shape === "cross"){
      const t = r * 0.4;
      ctx.moveTo(x - t, y - r); ctx.lineTo(x + t, y - r);
      ctx.lineTo(x + t, y - t); ctx.lineTo(x + r, y - t);
      ctx.lineTo(x + r, y + t); ctx.lineTo(x + t, y + t);
      ctx.lineTo(x + t, y + r); ctx.lineTo(x - t, y + r);
      ctx.lineTo(x - t, y + t); ctx.lineTo(x - r, y + t);
      ctx.lineTo(x - r, y - t); ctx.lineTo(x - t, y - t);
      ctx.closePath();
    } else if (shape === "sword"){
      ctx.moveTo(x, y - r*1.4);
      ctx.lineTo(x + r*0.28, y - r*0.3);
      ctx.lineTo(x + r*0.9, y - r*0.05);
      ctx.lineTo(x + r*0.9, y + r*0.15);
      ctx.lineTo(x + r*0.15, y + r*0.15);
      ctx.lineTo(x + r*0.15, y + r*1.3);
      ctx.lineTo(x - r*0.15, y + r*1.3);
      ctx.lineTo(x - r*0.15, y + r*0.15);
      ctx.lineTo(x - r*0.9, y + r*0.15);
      ctx.lineTo(x - r*0.9, y - r*0.05);
      ctx.lineTo(x - r*0.28, y - r*0.3);
      ctx.closePath();
    } else if (shape === "axe"){
      ctx.moveTo(x - r*0.12, y - r*1.3);
      ctx.lineTo(x + r*0.12, y - r*1.3);
      ctx.lineTo(x + r*0.12, y + r*1.3);
      ctx.lineTo(x - r*0.12, y + r*1.3);
      ctx.closePath();
      ctx.moveTo(x + r*0.1, y - r*1.1);
      ctx.quadraticCurveTo(x + r*1.3, y - r*1.1, x + r*1.25, y - r*0.3);
      ctx.quadraticCurveTo(x + r*0.9, y - r*0.15, x + r*0.1, y - r*0.5);
      ctx.closePath();
    } else if (shape === "scythe"){
      ctx.moveTo(x - r*0.1, y - r*0.2);
      ctx.lineTo(x + r*0.1, y - r*0.2);
      ctx.lineTo(x + r*0.1, y + r*1.4);
      ctx.lineTo(x - r*0.1, y + r*1.4);
      ctx.closePath();
      ctx.moveTo(x, y - r*0.2);
      ctx.quadraticCurveTo(x + r*1.3, y - r*0.6, x + r*0.9, y - r*1.5);
      ctx.quadraticCurveTo(x + r*0.5, y - r*0.9, x, y - r*0.2);
      ctx.closePath();
    } else ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function render(g){
    ctx.save();
    ctx.translate(shakeOffset.x, shakeOffset.y);
    ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);

    const borderFlash = g.telegraphFlash > 0 && Math.floor(g.telegraphFlash * 12) % 2 === 0;
    ctx.strokeStyle = borderFlash ? "#ffd23f" : "#3a3552";
    ctx.lineWidth = borderFlash ? 4 : 3;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);

    ctx.fillStyle = "#5ec8ff";
    drawShape(ctx, g.bossX, BOX.y - 16, 10, "triangle");
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(g.bossX, BOX.y - 16, 16, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    if (g.cage){
      const c = g.cage;
      ctx.fillStyle = "rgba(255, 94, 92, 0.55)";
      ctx.fillRect(BOX.x - 2, BOX.y, Math.max(0, c.left - BOX.x), BOX.h);
      ctx.fillRect(c.right, BOX.y, Math.max(0, BOX.x + BOX.w - c.right + 2), BOX.h);
      ctx.fillRect(BOX.x, BOX.y - 2, BOX.w, Math.max(0, c.top - BOX.y));
      ctx.fillRect(BOX.x, c.bottom, BOX.w, Math.max(0, BOX.y + BOX.h - c.bottom + 2));
    }

    g.lasers.forEach(L => {
      ctx.fillStyle = "rgba(255, 159, 67, 0.75)";
      if (L.mode === "vertical") ctx.fillRect(L.x - L.width/2, BOX.y, L.width, BOX.h);
      else ctx.fillRect(L.x - L.width/2, BOX.y - 4, L.width, BOX.h + 8);
      ctx.fillStyle = "rgba(255, 220, 160, 0.9)";
      const core = L.width * 0.35;
      if (L.mode === "vertical") ctx.fillRect(L.x - core/2, BOX.y, core, BOX.h);
      else ctx.fillRect(L.x - core/2, BOX.y - 4, core, BOX.h + 8);
    });

    if (g.giga){
      const gl = g.giga;
      if (gl.phase === "charge"){
        const pulse = 0.4 + 0.6 * Math.sin(gl.t * 18);
        ctx.strokeStyle = `rgba(255, 126, 185, ${pulse})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(gl.x - gl.width/2, BOX.y, gl.width, BOX.h);
        ctx.fillStyle = `rgba(255, 126, 185, ${0.15 * pulse})`;
        ctx.fillRect(gl.x - gl.width/2, BOX.y, gl.width, BOX.h);
      } else if (gl.phase === "fire"){
        ctx.fillStyle = "rgba(255, 80, 140, 0.85)";
        ctx.fillRect(gl.x - gl.width/2, BOX.y - 6, gl.width, BOX.h + 12);
        ctx.fillStyle = "rgba(255, 220, 240, 0.95)";
        ctx.fillRect(gl.x - gl.width*0.2, BOX.y - 6, gl.width*0.4, BOX.h + 12);
      }
    }

    g.rings.forEach(R => {
      ctx.strokeStyle = "rgba(255, 92, 92, 0.85)";
      ctx.lineWidth = R.thickness;
      ctx.beginPath();
      if (R.gapAngle !== undefined){
        const start = R.gapAngle + R.gapWidth / 2;
        const end = R.gapAngle - R.gapWidth / 2 + Math.PI * 2;
        ctx.arc(R.cx, R.cy, R.r, start, end);
      } else {
        ctx.arc(R.cx, R.cy, R.r, 0, Math.PI*2);
      }
      ctx.stroke();
    });

    g.bullets.forEach(b => {
      if (b.shape === "heart") ctx.fillStyle = "#ff7eb9";
      else if (b.shape === "star") ctx.fillStyle = "#ffd23f";
      else if (b.shape === "cross") ctx.fillStyle = "#a78bfa";
      else if (b.shape === "sword" || b.shape === "axe" || b.shape === "scythe") ctx.fillStyle = "#c9d3e0";
      else ctx.fillStyle = "#ff5c5c";
      drawShape(ctx, b.x, b.y, b.r, b.shape);
    });

    g.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2.5);
      ctx.fillStyle = p.color || "#ffd23f";
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    const invulnFlash = g.player.invuln > 0 && Math.floor(g.player.invuln * 14) % 2 === 0;
    ctx.fillStyle = invulnFlash ? "#ffffff" : "#ffd23f";
    ctx.beginPath(); ctx.arc(g.player.x, g.player.y, g.player.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = invulnFlash ? "#fff" : "rgba(255,210,63,0.5)";
    ctx.lineWidth = 1.5; ctx.stroke();

    if (g.flashLeft > 0){
      const a = Math.min(0.7, g.flashLeft * 4);
      const colors = {white:"255,255,255", yellow:"255,210,63", red:"255,80,80", pink:"255,126,185"};
      const c = colors[g.flashColor] || colors.white;
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }

  jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write      # required to deploy to Pages
      id-token: write   # required to get the OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  render({
    bullets: [], lasers: [], rings: [], particles: [],
    player: {x: BOX.x + BOX.w/2, y: BOX.y + BOX.h - 28, r: 6.5, invuln: 0},
    telegraphFlash: 0, bossX: BOX.x + BOX.w/2, flashLeft: 0, cage: null, giga: null
  });
})();
</script>
</body>
</html>
