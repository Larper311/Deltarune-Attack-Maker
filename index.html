<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Maker — Remake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #07060c;
  --panel: #12101a;
  --panel2: #1a1724;
  --border: #2a2438;
  --text: #f2eef8;
  --muted: #6e6680;
  --soul: #ffd23f;
  --danger: #ff3b5c;
  --pink: #ff6b9d;
  --blue: #5ec8ff;
  --violet: #a78bfa;
  --orange: #ff9f43;
  --green: #6ee7a0;
  --font-d: 'Cinzel', Georgia, serif;
  --font-b: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--font-b);
  min-height: 100vh;
  padding: 18px 14px 40px;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -15%, rgba(167,139,250,0.09), transparent),
    radial-gradient(ellipse 40% 30% at 95% 95%, rgba(255,59,92,0.04), transparent);
}
.wrap { max-width: 1520px; margin: 0 auto; }
header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px; margin-bottom: 16px;
}
h1 {
  font-family: var(--font-d);
  font-size: clamp(22px, 3.2vw, 32px);
  font-weight: 700;
  letter-spacing: 0.03em;
}
h1 span { color: var(--soul); }
.subtitle { color: var(--muted); font-size: 12.5px; max-width: 560px; line-height: 1.45; }
.badge {
  display: inline-block; background: var(--soul); color: #1a1408;
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
  margin-left: 8px; letter-spacing: 0.05em; vertical-align: middle;
}
.layout {
  display: grid;
  grid-template-columns: 260px 1fr 380px;
  gap: 14px;
  align-items: start;
}
@media (max-width: 1200px) { .layout { grid-template-columns: 1fr; } }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.panel h2 {
  font-family: var(--font-d);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 700;
}
.palette-group { margin-bottom: 12px; }
.palette-group-title {
  font-size: 10px; letter-spacing: 0.08em;
  color: var(--muted); margin: 0 0 5px 2px; text-transform: uppercase;
}
.palette-btn {
  display: block; width: 100%; text-align: left;
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 9px;
  border-radius: 7px;
  margin-bottom: 4px;
  cursor: pointer;
  font-family: var(--font-b);
  font-size: 12px;
  font-weight: 600;
  transition: border-color .12s, background .12s;
}
.palette-btn:hover { border-color: var(--soul); background: #221e2e; }
.palette-btn small {
  display: block; font-weight: 400; color: var(--muted);
  margin-top: 1px; font-size: 10px; line-height: 1.3;
}
.swatch {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 2px; margin-right: 6px; vertical-align: middle;
}
.toolbar { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar .btn { padding: 4px 9px; font-size: 11px; }
#sequence {
  list-style: none; min-height: 50px; max-height: 70vh; overflow-y: auto;
}
#sequence:empty::after {
  content: "Click attacks on the left to build a sequence.";
  color: var(--muted); font-size: 12.5px; display: block; padding: 18px 4px;
}
.block {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--violet);
  border-radius: 7px;
  padding: 7px 9px;
  margin-bottom: 5px;
  cursor: grab;
}
.block.flow { border-left-color: var(--violet); }
.block.knight { border-left-color: #c4b5fd; }
.block.spamton { border-left-color: var(--orange); }
.block.titan { border-left-color: #64748b; }
.block.king { border-left-color: #94a3b8; }
.block.attack { border-left-color: var(--danger); }
.block.dragging { opacity: 0.35; }
.block-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.block-title { font-weight: 700; font-size: 12px; }
.block-remove {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; line-height: 1; padding: 1px 4px;
}
.block-remove:hover { color: var(--danger); }
.block-fields { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.field { display: flex; flex-direction: column; gap: 1px; }
.field label {
  font-size: 9px; color: var(--muted);
  letter-spacing: 0.03em;
}
.field input, .field select {
  background: var(--void); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 2px 4px; font-size: 11px; font-family: var(--font-b);
}
.field input { width: 58px; }
.field select { width: 88px; }
#stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
canvas#stage {
  background: #05040a;
  border: 2px solid var(--border);
  border-radius: 6px;
  max-width: 100%;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}
.hpbar-wrap { width: 100%; max-width: 340px; }
.hpbar-label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted); margin-bottom: 2px;
}
.hpbar {
  height: 9px; background: var(--panel2);
  border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
}
.hpbar-fill {
  height: 100%; background: linear-gradient(90deg, var(--soul), #ffb700);
  transition: width .1s ease;
}
#status-msg { font-size: 12px; color: var(--muted); min-height: 16px; text-align: center; }
#status-msg.win { color: var(--green); font-weight: 700; }
#status-msg.lose { color: var(--danger); font-weight: 700; }
.btn {
  font-family: var(--font-b); font-weight: 700; font-size: 12.5px;
  padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border);
  cursor: pointer; background: var(--panel2); color: var(--text);
}
.btn.primary { background: var(--soul); color: #1a1408; border-color: var(--soul); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
.controls-note {
  font-size: 11px; color: var(--muted); text-align: center; line-height: 1.4;
}
code {
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 4px; font-size: 10px;
}
.boss-settings {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}
.boss-settings .field input[type="color"] {
  width: 38px; height: 24px; padding: 1px;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Boss Fight <span>Maker</span><span class="badge">REMAKE</span></h1>
      <div class="subtitle">Crystal reverse-shatter • Knife Dance • Board Rend • Sword Tunnel • Sanguine Slash • Spamton NEO chaos. Build it. Survive it.</div>
    </div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Attacks</h2>
      <div id="palette"></div>
    </div>

    <div class="panel">
      <h2>Sequence</h2>
      <div class="toolbar">
        <button class="btn" id="clear-btn">Clear</button>
        <button class="btn" id="export-btn">Export</button>
        <button class="btn" id="import-btn">Import</button>
      </div>
      <ul id="sequence"></ul>
    </div>

    <div class="panel">
      <h2>Test Fight</h2>
      <div id="stage-wrap">
        <div class="boss-settings">
          <div class="field">
            <label>Boss</label>
            <select id="boss-shape">
              <option value="triangle">Knight</option>
              <option value="star">Star</option>
              <option value="scythe">Scythe</option>
              <option value="spamton">Spamton</option>
              <option value="circle">Orb</option>
            </select>
          </div>
          <div class="field">
            <label>Color</label>
            <input type="color" id="boss-color" value="#a78bfa">
          </div>
          <div class="field">
            <label>Size</label>
            <input type="number" id="boss-size" value="14" min="8" max="28" step="1" style="width:48px">
          </div>
        </div>
        <canvas id="stage" width="340" height="420"></canvas>
        <div class="hpbar-wrap">
          <div class="hpbar-label"><span>SOUL</span><span id="hp-text">100/100</span></div>
          <div class="hpbar"><div class="hpbar-fill" id="hp-fill" style="width:100%"></div></div>
        </div>
        <div id="status-msg"></div>
        <div class="btn-row">
          <button class="btn primary" id="play-btn">Test Fight</button>
          <button class="btn" id="stop-btn" disabled>Stop</button>
        </div>
        <div class="controls-note">Move with <code>Arrows</code> or <code>WASD</code></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ═══════════════════════════════════════════════════════════
  //  BOSS FIGHT MAKER — FULL REMAKE
  //  Focus: cinematic multi-phase attacks that feel dangerous & fun
  // ═══════════════════════════════════════════════════════════

  const SHAPES = [
    { value: "circle", label: "Circle" },
    { value: "square", label: "Square" },
    { value: "triangle", label: "Triangle" },
    { value: "diamond", label: "Diamond" },
    { value: "star", label: "Star" },
    { value: "shard", label: "Shard" },
    { value: "blade", label: "Blade" },
    { value: "knife", label: "Knife" },
    { value: "crystal", label: "Crystal" },
    { value: "heart", label: "Heart" },
    { value: "pipis", label: "Pipis" },
    { value: "head", label: "Head" },
    { value: "bolt", label: "Bolt" },
    { value: "scythe", label: "Scythe" }
  ];

  // ─── BLOCK DEFINITIONS ─────────────────────────────────────
  const BLOCKS = {
    // FLOW
    wait: {
      label: "Wait", color: "#a78bfa", group: "Flow", cat: "flow",
      desc: "Pause before the next block",
      fields: [{ key: "duration", label: "Seconds", type: "number", def: 0.8, min: 0.1, max: 8, step: 0.1 }]
    },
    telegraph: {
      label: "Telegraph", color: "#ffd23f", group: "Flow", cat: "flow",
      desc: "Flash the arena border",
      fields: [{ key: "duration", label: "Seconds", type: "number", def: 0.5, min: 0.15, max: 2, step: 0.05 }]
    },
    shake: {
      label: "Screen Shake", color: "#ff6b9d", group: "Flow", cat: "flow",
      desc: "Camera impact",
      fields: [
        { key: "intensity", label: "Intensity", type: "number", def: 8, min: 2, max: 20, step: 1 },
        { key: "duration", label: "Seconds", type: "number", def: 0.3, min: 0.1, max: 1.5, step: 0.05 }
      ]
    },
    flash: {
      label: "Screen Flash", color: "#ff6b9d", group: "Flow", cat: "flow",
      desc: "Full-screen flash",
      fields: [
        { key: "duration", label: "Seconds", type: "number", def: 0.12, min: 0.04, max: 0.6, step: 0.02 },
        { key: "color", label: "Color", type: "select", def: "white", options: [
          { value: "white", label: "White" }, { value: "yellow", label: "Gold" },
          { value: "red", label: "Red" }, { value: "pink", label: "Pink" }, { value: "violet", label: "Violet" }
        ]}
      ]
    },
    slowmo: {
      label: "Slow-Mo", color: "#ff6b9d", group: "Flow", cat: "flow",
      desc: "Brief time dilation",
      fields: [
        { key: "factor", label: "Speed %", type: "number", def: 30, min: 12, max: 60, step: 5 },
        { key: "duration", label: "Seconds", type: "number", def: 0.9, min: 0.3, max: 2.5, step: 0.1 }
      ]
    },
    clear: {
      label: "Clear Bullets", color: "#ff6b9d", group: "Flow", cat: "flow",
      desc: "Destroy every projectile", fields: []
    },

    // ── KNIGHT SIGNATURES ──
    crystal_barrage: {
      label: "Crystal Barrage", color: "#c4b5fd", group: "Knight", cat: "knight",
      desc: "Crystals reverse, then explode into shards. Phase 3 homes red.",
      fields: [
        { key: "phase", label: "Phase", type: "select", def: "1", options: [
          { value: "1", label: "Phase 1" }, { value: "2", label: "Phase 2" }, { value: "3", label: "Phase 3 (home)" }
        ]},
        { key: "count", label: "Crystals", type: "number", def: 7, min: 3, max: 14, step: 1 },
        { key: "speed", label: "Speed", type: "number", def: 130, min: 60, max: 240, step: 10 },
        { key: "duration", label: "Seconds", type: "number", def: 5.5, min: 3, max: 12, step: 0.1 }
      ]
    },
    knife_dance: {
      label: "Knife Dance", color: "#e2e8f0", group: "Knight", cat: "knight",
      desc: "Knives lock on SOUL then slash the whole board. Ring variant available.",
      fields: [
        { key: "phase", label: "Phase", type: "select", def: "1", options: [
          { value: "1", label: "Phase 1" }, { value: "2", label: "Phase 2 (ring)" }, { value: "3", label: "Phase 3 (fast)" }
        ]},
        { key: "count", label: "Knives", type: "number", def: 6, min: 3, max: 12, step: 1 },
        { key: "lockTime", label: "Lock (s)", type: "number", def: 0.7, min: 0.3, max: 1.6, step: 0.05 },
        { key: "duration", label: "Seconds", type: "number", def: 5.2, min: 2.5, max: 12, step: 0.1 }
      ]
    },
    board_rend: {
      label: "Board Rend", color: "#5ec8ff", group: "Knight", cat: "knight",
      desc: "Board physically splits. Slash itself damages. Escalating orientations.",
      fields: [
        { key: "phase", label: "Phase", type: "select", def: "1", options: [
          { value: "1", label: "Phase 1 (H/V)" }, { value: "2", label: "Phase 2 (random H/V)" }, { value: "3", label: "Phase 3 (+diag)" }
        ]},
        { key: "cuts", label: "Cuts", type: "number", def: 3, min: 1, max: 6, step: 1 },
        { key: "gapTime", label: "Gap (s)", type: "number", def: 1.1, min: 0.4, max: 2.5, step: 0.1 },
        { key: "bulletRate", label: "Bullets/s", type: "number", def: 11, min: 4, max: 20, step: 1 },
        { key: "duration", label: "Seconds", type: "number", def: 7.5, min: 3, max: 16, step: 0.2 }
      ]
    },
    sword_tunnel: {
      label: "Sword Tunnel", color: "#c9d3e0", group: "Knight", cat: "knight",
      desc: "Two walls of swords with a shifting gap. Ends with a deadly multi-slash.",
      fields: [
        { key: "phase", label: "Phase", type: "select", def: "1", options: [
          { value: "1", label: "Phase 1" }, { value: "2", label: "Phase 2 (twist)" }, { value: "3", label: "Phase 3 (tight)" }
        ]},
        { key: "holdTime", label: "Hold (s)", type: "number", def: 2.6, min: 1.2, max: 5, step: 0.1 },
        { key: "waveAmp", label: "Wave amp", type: "number", def: 38, min: 12, max: 70, step: 4 },
        { key: "duration", label: "Seconds", type: "number", def: 6.2, min: 3, max: 12, step: 0.1 }
      ]
    },
    sanguine_slash: {
      label: "Sanguine Slash", color: "#ff3b5c", group: "Knight", cat: "knight",
      desc: "Centered cuts that escalate 1→2→3→4 lines. Finale spiral possible.",

        { key: "phase", label: "Phase", type: "select", def: "1", options: [
          { value: "1", label: "Phase 1 (1-4)" }, { value: "2", label: "Phase 2 (3-4 only)" }, { value: "3", label: "Phase 3 (+spiral)" }
        ]},
        { key: "gap", label: "Gap (s)", type: "number", def: 0.55, min: 0.25, max: 1.2, step: 0.05 },
        { key: "width", label: "Width", type: "number", def: 14, min: 8, max: 24, step: 1 },
        { key: "duration", label: "Seconds", type: "number", def: 6.8, min: 3, max: 14, step: 0.1 }
      ]
    },

    // ── SPAMTON NEO ──
    flying_heads: {
      label: "Flying Heads", color: "#ff9f43", group: "Spamton", cat: "spamton",
      desc: "Heads launch lane-by-lane and fire. Can be destroyed for TP feel.",
      fields: [
        { key: "count", label: "Heads", type: "number", def: 4, min: 2, max: 8, step: 1 },
        { key: "gap", label: "Gap (s)", type: "number", def: 0.5, min: 0.2, max: 1.2, step: 0.05 },
        { key: "speed", label: "Speed", type: "number", def: 90, min: 40, max: 160, step: 5 },
        { key: "fireRate", label: "Fire/s", type: "number", def: 2.4, min: 1, max: 5, step: 0.2 },
        { key: "duration", label: "Seconds", type: "number", def: 5, min: 2.5, max: 10, step: 0.1 }
      ]
    },
    pipis_call: {
      label: "A Call For You", color: "#5ec8ff", group: "Spamton", cat: "spamton",
      desc: "Bouncing Pipis that explode into tiny heads on wall hit.",
      fields: [
        { key: "count", label: "Pipis", type: "number", def: 4, min: 2, max: 8, step: 1 },
        { key: "speed", label: "Speed", type: "number", def: 135, min: 60, max: 240, step: 10 },
        { key: "heads", label: "Heads each", type: "number", def: 7, min: 3, max: 12, step: 1 },
        { key: "duration", label: "Seconds", type: "number", def: 4.5, min: 2, max: 9, step: 0.1 }
      ]
    },
    chained_heart: {
      label: "Chained Heart", color: "#ff6b9d", group: "Spamton", cat: "spamton",
      desc: "Heart swings and sprays diamonds. Lasts a long time if not destroyed.",
      fields: [
        { key: "swings", label: "Intensity", type: "number", def: 1.2, min: 0.6, max: 2.2, step: 0.1 },
        { key: "bulletRate", label: "Bullets/s", type: "number", def: 5.5, min: 2, max: 12, step: 0.5 },
        { key: "duration", label: "Seconds", type: "number", def: 6, min: 3, max: 14, step: 0.1 }
      ]
    },
    phone_grip: {
      label: "Gripping Phones", color: "#ff9f43", group: "Spamton", cat: "spamton",
      desc: "Phones grip the edges while a head approaches firing exploding shots.",
      fields: [
        { key: "phones", label: "Phones", type: "number", def: 4, min: 2, max: 8, step: 1 },
        { key: "headSpeed", label: "Head speed", type: "number", def: 50, min: 25, max: 110, step: 5 },
        { key: "duration", label: "Seconds", type: "number", def: 4.5, min: 2, max: 9, step: 0.1 }
      ]
    },
    mail_storm: {
      label: "Spam Mail", color: "#ff9f43", group: "Spamton", cat: "spamton",
      desc: "Waves of mail + occasional bombs.",
      fields: [
        { key: "rate", label: "Mail/s", type: "number", def: 6.5, min: 3, max: 14, step: 0.5 },

        { key: "duration", label: "Seconds", type: "number", def: 4, min: 1.5, max: 9, step: 0.1 }

        { key: "speed", label: "Speed", type: "number", def: 125, min: 50, max: 260, step: 10 },

      fields: [

        { key: "rate", label: "Ticks/s", type: "number", def: 7, min: 3, max: 14, step: 1 },

    ring_burst: {
      label: "Ring Burst", color: "#ff3b5c", group: "Attacks", cat: "attack",

        { key: "count", label: "Directions", type: "number", def: 14, min: 6, max: 28, step: 1 },
        { key: "speed", label: "Speed", type: "number", def: 130, min: 50, max: 250, step: 10 },
        { key: "duration", label: "Seconds", type: "number", def: 2, min: 0.6, max: 5, step: 0.1 }
      ]
    },
    rain: {
      label: "Rain", color: "#ff3b5c", group: "Attacks", cat: "attack",
      desc: "Random falling bullets",
      fields: [
        { key: "rate", label: "Bullets/s", type: "number", def: 6, min: 2, max: 14, step: 0.5 },
        { key: "speed", label: "Speed", type: "number", def: 130, min: 50, max: 260, step: 10 },
        { key: "duration", label: "Seconds", type: "number", def: 2.8, min: 0.8, max: 8, step: 0.1 }
      ]
    },
    shotgun: {
      label: "Shotgun", color: "#ff9f43", group: "Attacks", cat: "attack",
      desc: "Dense cone aimed at you",
      fields: [
        { key: "count", label: "Bullets", type: "number", def: 9, min: 4, max: 16, step: 1 },
        { key: "spread", label: "Spread °", type: "number", def: 40, min: 15, max: 80, step: 5 },
        { key: "speed", label: "Speed", type: "number", def: 165, min: 70, max: 300, step: 10 },
        { key: "waves", label: "Waves", type: "number", def: 2, min: 1, max: 5, step: 1 },
        { key: "duration", label: "Seconds", type: "number", def: 2.5, min: 0.8, max: 7, step: 0.1 }
      ]
    }
  };

  // Add totalDuration to everything that needs it
  Object.keys(BLOCKS).forEach(k => {
    const def = BLOCKS[k];
    if (!def.fields) def.fields = [];
    const hasDur = def.fields.some(f => f.key === "duration");
    if (!hasDur) {
      def.fields.push({ key: "duration", label: "Seconds", type: "number", def: 1, min: 0.2, max: 12, step: 0.1 });
    }
  });

  const GROUP_ORDER = ["Flow", "Knight", "Spamton", "Attacks"];

  let uid = 1;
  function makeBlock(type) {
    const def = BLOCKS[type];
    const params = {};
    (def.fields || []).forEach(f => params[f.key] = f.def);
    return { id: uid++, type, params };
  }

  // ─── UI ────────────────────────────────────────────────────
  let sequence = [];
  const paletteEl = document.getElementById("palette");
  const seqEl = document.getElementById("sequence");
  const statusEl = document.getElementById("status-msg");

  GROUP_ORDER.forEach(group => {
    const wrap = document.createElement("div");
    wrap.className = "palette-group";
    const title = document.createElement("div");
    title.className = "palette-group-title";
    title.textContent = group;
    wrap.appendChild(title);
    Object.keys(BLOCKS).forEach(type => {
      const def = BLOCKS[type];
      if (def.group !== group) return;
      const btn = document.createElement("button");
      btn.className = "palette-btn";
      btn.innerHTML = `<span class="swatch" style="background:${def.color}"></span>${def.label}<small>${def.desc}</small>`;
      btn.addEventListener("click", () => {
        sequence.push(makeBlock(type));
        renderSequence();
      });
      wrap.appendChild(btn);
    });
    paletteEl.appendChild(wrap);
  });

  let dragFrom = null;

  function renderFields(container, fields, params) {
    const wrap = document.createElement("div");
    wrap.className = "block-fields";
    fields.forEach(f => {
      const fw = document.createElement("div");
      fw.className = "field";
      const lab = document.createElement("label");
      lab.textContent = f.label;
      fw.appendChild(lab);
      if (f.type === "select") {
        const sel = document.createElement("select");
        f.options.forEach(opt => {
          const o = document.createElement("option");
          o.value = opt.value; o.textContent = opt.label;
          if (params[f.key] === opt.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => { params[f.key] = sel.value; });
        fw.appendChild(sel);
      } else {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = f.min; inp.max = f.max; inp.step = f.step;
        inp.value = params[f.key];
        inp.addEventListener("change", () => {
          let v = parseFloat(inp.value);
          if (isNaN(v)) v = f.def;
          v = Math.max(f.min, Math.min(f.max, v));
          params[f.key] = v; inp.value = v;
        });
        fw.appendChild(inp);
      }
      wrap.appendChild(fw);
    });
    container.appendChild(wrap);
  }

  function renderSequence() {
    seqEl.innerHTML = "";
    sequence.forEach((block, idx) => {
      const def = BLOCKS[block.type];
      if (!def) return;
      const li = document.createElement("li");
      li.className = "block " + (def.cat || "attack");
      li.draggable = true;
      li.dataset.index = idx;

      const row = document.createElement("div");
      row.className = "block-row";
      const title = document.createElement("span");
      title.className = "block-title";
      title.style.color = def.color;
      title.textContent = def.label;
      row.appendChild(title);

      const rm = document.createElement("button");
      rm.className = "block-remove";
      rm.textContent = "×";
      rm.addEventListener("click", e => {
        e.stopPropagation();
        sequence = sequence.filter(b => b.id !== block.id);
        renderSequence();
      });
      row.appendChild(rm);
      li.appendChild(row);

      if (def.fields && def.fields.length) renderFields(li, def.fields, block.params);

      li.addEventListener("dragstart", () => { dragFrom = idx; li.classList.add("dragging"); });
      li.addEventListener("dragend", () => li.classList.remove("dragging"));
      li.addEventListener("dragover", e => e.preventDefault());
      li.addEventListener("drop", e => {
        e.preventDefault();
        if (dragFrom === null || dragFrom === idx) return;
        const moved = sequence.splice(dragFrom, 1)[0];
        sequence.splice(idx, 0, moved);
        dragFrom = null;
        renderSequence();
      });
      seqEl.appendChild(li);
    });
  }

  // Showcase sequence
  sequence = [
    makeBlock("telegraph"),
    makeBlock("crystal_barrage"),
    makeBlock("wait"),
    makeBlock("knife_dance"),
    makeBlock("board_rend"),
    makeBlock("telegraph"),
    makeBlock("sword_tunnel"),
    makeBlock("sanguine_slash"),
    makeBlock("pipis_call"),
    makeBlock("flying_heads"),
    makeBlock("chained_heart")
  ];
  renderSequence();

  document.getElementById("clear-btn").addEventListener("click", () => {
    if (confirm("Clear entire sequence?")) { sequence = []; renderSequence(); }
  });
  document.getElementById("export-btn").addEventListener("click", () => {
    const data = sequence.map(b => ({ type: b.type, params: b.params }));
    const json = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(json).then(() => {
      statusEl.textContent = "Sequence copied to clipboard";
      setTimeout(() => { if (statusEl.textContent.includes("copied")) statusEl.textContent = ""; }, 2000);
    }).catch(() => prompt("Copy this:", json));
  });
  document.getElementById("import-btn").addEventListener("click", () => {
    const raw = prompt("Paste sequence JSON:");
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) throw new Error("Not an array");
      sequence = data.map(d => {
        const b = makeBlock(d.type);
        if (d.params) Object.assign(b.params, d.params);
        return b;
      });
      renderSequence();
      statusEl.textContent = "Imported " + sequence.length + " blocks";
    } catch (err) {
      alert("Invalid JSON: " + err.message);
    }
  });

  // ─── ENGINE ────────────────────────────────────────────────
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const BASE = { x: 22, y: 40, w: canvas.width - 44, h: canvas.height - 66 };
  let BOX = Object.assign({}, BASE);

  const boss = { shape: "triangle", color: "#a78bfa", size: 14 };
  document.getElementById("boss-shape").addEventListener("change", e => {
    boss.shape = e.target.value; if (!game || !game.running) render(idle());
  });
  document.getElementById("boss-color").addEventListener("input", e => {
    boss.color = e.target.value; if (!game || !game.running) render(idle());
  });
  document.getElementById("boss-size").addEventListener("change", e => {
    let v = parseFloat(e.target.value) || 14;
    v = Math.max(8, Math.min(28, v));
    boss.size = v; e.target.value = v;
    if (!game || !game.running) render(idle());
  });

  const hpFill = document.getElementById("hp-fill");
  const hpText = document.getElementById("hp-text");
  const playBtn = document.getElementById("play-btn");
  const stopBtn = document.getElementById("stop-btn");

  let game = null, lastTs = null, fightSeq = [];
  const keys = {};
  const shake = { x: 0, y: 0 };

  window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  function idle() {
    return {
      bullets: [], lasers: [], particles: [], cuts: [],
      player: { x: BOX.x + BOX.w / 2, y: BOX.y + BOX.h - 28, r: 6.5, hp: 100, inv: 0, moving: false },
      bossX: BOX.x + BOX.w / 2,
      telegraph: 0, shakeT: 0, shakeI: 0, flashT: 0, flashC: "white",
      timeScale: 1, slowT: 0,
      running: false, won: false, lost: false,
      // attack state bags
      crystal: null, knives: null, rend: null, tunnel: null, sanguine: null,
      heads: null, pipis: null, heart: null, phones: null, mail: null,
      spawnAcc: 0, spiralAng: 0
    };
  }

  function start() {
    if (sequence.length === 0) { statusEl.textContent = "Add some attacks first."; return; }
    fightSeq = sequence.map(b => ({ type: b.type, params: Object.assign({}, b.params) }));
    game = idle();
    game.running = true;
    game.pc = 0; game.t = 0;
    BOX = Object.assign({}, BASE);
    hpFill.style.width = "100%"; hpText.textContent = "100/100";
    statusEl.textContent = ""; statusEl.className = "";
    playBtn.disabled = true; stopBtn.disabled = false;
    lastTs = null;
    enter(game, fightSeq[0]);
    requestAnimationFrame(loop);
  }

  function stop(msg, cls) {
    if (game) game.running = false;
    playBtn.disabled = false; stopBtn.disabled = true;
    statusEl.textContent = msg || ""; statusEl.className = cls || "";
    BOX = Object.assign({}, BASE);
    render(idle());
  }

  playBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", () => stop("Stopped.", ""));

  // ─── HELPERS ───────────────────────────────────────────────
  function bullet(x, y, vx, vy, r, shape, extra) {
    const b = {
      x, y, vx, vy, r: r || 6, shape: shape || "circle",
      life: 12, rot: 0, spin: 0, blue: false, dmg: 10
    };
    if (extra) Object.assign(b, extra);
    return b;
  }

  function hit(g, dmg) {
    if (g.player.inv > 0 || g.player.hitThis) return;
    g.player.hp = Math.max(0, g.player.hp - (dmg || 10));
    g.player.inv = 0.65;
    g.player.hitThis = true;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 55 + Math.random() * 90;
      g.particles.push({
        x: g.player.x, y: g.player.y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.28 + Math.random() * 0.22, color: "#ffd23f"
      });
    }
    hpFill.style.width = g.player.hp + "%";
    hpText.textContent = g.player.hp + "/100";
    if (g.player.hp <= 0) g.lost = true;
  }

  function getDur(block) {
    return Math.max(0.3, Number(block.params.duration) || 1);
  }

  // ─── ENTER ATTACK ──────────────────────────────────────────
  function enter(g, block) {
    if (!block) return;
    const p = block.params || {};
    switch (block.type) {
      case "crystal_barrage":
        g.crystal = {
          phase: p.phase || "1", count: p.count || 7, speed: p.speed || 130,
          t: 0, crystals: [], state: "fire"
        };
        // spawn crystals aimed roughly at player
        for (let i = 0; i < g.crystal.count; i++) {
          const spread = (i - (g.crystal.count - 1) / 2) * 0.22;
          const base = Math.atan2(g.player.x - g.bossX, g.player.y - (BOX.y - 4));
          const ang = base + spread;
          const spd = g.crystal.speed * (0.9 + Math.random() * 0.2);
          const c = bullet(g.bossX, BOX.y - 4, Math.sin(ang) * spd, Math.cos(ang) * spd, 8, "crystal", {
            state: "out", timer: 0, home: false
          });
          g.bullets.push(c);
          g.crystal.crystals.push(c);
        }
        break;

      case "knife_dance":
        g.knives = {
          phase: p.phase || "1", count: p.count || 6, lockTime: p.lockTime || 0.7,
          t: 0, list: [], ring: [], nextAt: 0, spawned: 0, state: "spawn"
        };
        if (g.knives.phase === "2") {
          // pre-spawn ring
          const n = 8;
          for (let i = 0; i < n; i++) {
            const ang = (i / n) * Math.PI * 2;
            g.knives.ring.push({
              ang, dist: 78, x: 0, y: 0, phase: "orbit", timer: 0
            });
          }
        }
        break;

      case "board_rend":
        g.rend = {
          phase: p.phase || "1", cutsLeft: p.cuts || 3, gapTime: p.gapTime || 1.1,
          bulletRate: p.bulletRate || 11, state: "slash", t: 0,
          orient: null, sep: 0, slashProg: 0, spawnAcc: 0
        };
        beginRendCut(g);
        break;

      case "sword_tunnel":
        g.tunnel = {
          phase: p.phase || "1", holdTime: p.holdTime || 2.6, waveAmp: p.waveAmp || 38,
          t: 0, blades: [], state: "wave", twist: 0
        };
        const gap = g.tunnel.phase === "3" ? 12 : 17;
        for (let x = BOX.x + 8; x < BOX.x + BOX.w - 8; x += gap) {
          g.tunnel.blades.push({ x, y: BOX.y + 12, baseY: BOX.y + 12, side: "top", ang: 0 });
          g.tunnel.blades.push({ x, y: BOX.y + BOX.h - 12, baseY: BOX.y + BOX.h - 12, side: "bottom", ang: 0 });
        }
        break;

      case "sanguine_slash":
        g.sanguine = {
          phase: p.phase || "1", gap: p.gap || 0.55, width: p.width || 14,
          t: 0, cycle: 0, cuts: [], finale: []
        };
        break;

      case "flying_heads":
        g.heads = { params: p, list: [], nextAt: 0, spawned: 0, t: 0 };
        break;

      case "pipis_call":
        for (let i = 0; i < (p.count || 4); i++) {
          const ang = (Math.random() * 50 - 25 + 180) * Math.PI / 180;
          const spd = (p.speed || 135) * (0.85 + Math.random() * 0.3);
          g.bullets.push(bullet(
            BOX.x + 25 + Math.random() * (BOX.w - 50), BOX.y - 6,
            Math.sin(ang) * spd, Math.cos(ang) * spd, 9, "pipis",
            { pipis: true, heads: p.heads || 7, bounces: 5 }
          ));
        }
        break;

      case "chained_heart":
        g.heart = {
          x: BOX.x + BOX.w / 2, y: BOX.y + 36,
          params: p, t: 0, swing: 0, spawnAcc: 0
        };
        break;

      case "phone_grip":
        g.phones = {
          params: p, list: [],
          head: { x: BOX.x + BOX.w + 40, y: BOX.y + BOX.h / 2, vx: -(p.headSpeed || 50) },
          t: 0
        };
        for (let i = 0; i < (p.phones || 4); i++) {
          const side = i % 2 === 0 ? "left" : "right";
          const y = BOX.y + 35 + (i * 0.5) * (BOX.h - 70) / (p.phones || 4);
          g.phones.list.push({ side, y, x: side === "left" ? BOX.x - 4 : BOX.x + BOX.w + 4 });
        }
        break;

      case "mail_storm":
        g.mail = { params: p, spawnAcc: 0 };
        break;

      case "telegraph":
        g.telegraph = p.duration || 0.5;
        break;
      case "shake":
        g.shakeT = p.duration || 0.3; g.shakeI = p.intensity || 8;
        break;
      case "flash":
        g.flashT = p.duration || 0.12; g.flashC = p.color || "white";
        break;
      case "slowmo":
        g.timeScale = (p.factor || 30) / 100; g.slowT = p.duration || 0.9;
        break;
      case "clear":
        g.bullets = []; g.lasers = [];
        break;
      case "wall":
        spawnWall(g, p);
        break;
      case "ring_burst":
        spawnRing(g, p);
        break;
      case "shotgun":
        g.shotgunWaves = (p.waves || 2) - 1; g.shotgunAcc = 0;
        spawnShotgun(g, p);
        break;
      case "spiral":
      case "rain":
        g.spawnAcc = 0; g.spiralAng = 0;
        break;
    }
  }

  function beginRendCut(g) {
    const r = g.rend;
    if (!r) return;
    const phase = r.phase;
    if (phase === "1") {
      r.orient = r.cutsLeft % 2 === 0 ? "h" : "v";
    } else if (phase === "2") {
      r.orient = Math.random() < 0.5 ? "h" : "v";
    } else {
      const opts = ["h", "v", "diag"];
      // diagonal less frequent
      const roll = Math.random();
      r.orient = roll < 0.38 ? "h" : roll < 0.76 ? "v" : "diag";
    }
    r.state = "slash"; r.t = 0; r.sep = 0; r.slashProg = 0; r.spawnAcc = 0;
  }

  function spawnWall(g, p) {
    const gapStart = BOX.x + (p.gapPos / 100) * BOX.w - p.gapSize / 2;
    const gapEnd = gapStart + p.gapSize;
    for (let x = BOX.x; x <= BOX.x + BOX.w; x += 13) {
      if (x >= gapStart && x <= gapEnd) continue;
      g.bullets.push(bullet(x, BOX.y - 5, 0, p.speed, 5.5, "square"));
    }
  }
  function spawnRing(g, p) {
    for (let i = 0; i < p.count; i++) {
      const ang = (360 / p.count) * i * Math.PI / 180;
      g.bullets.push(bullet(g.bossX, BOX.y + 26, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5.5, "circle"));
    }
  }
  function spawnShotgun(g, p) {
    const base = Math.atan2(g.player.x - g.bossX, g.player.y - (BOX.y - 4));
    const half = (p.spread * Math.PI / 180) / 2;
    for (let i = 0; i < p.count; i++) {
      const t = p.count === 1 ? 0.5 : i / (p.count - 1);
      const ang = base - half + t * half * 2;
      g.bullets.push(bullet(g.bossX, BOX.y - 3, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5.5, "triangle"));
    }
  }

  // ─── MAIN LOOP ─────────────────────────────────────────────
  function loop(ts) {
    if (!game || !game.running) return;
    if (lastTs === null) lastTs = ts;
    let raw = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    const dt = raw * (game.timeScale || 1);
    update(game, dt, raw);
    render(game);
    if (game.won) { stop("Cleared!", "win"); return; }
    if (game.lost) { stop("You were hit too many times.", "lose"); return; }
    requestAnimationFrame(loop);
  }

  function update(g, dt, raw) {
    g.player.hitThis = false;

    // global effects
    if (g.slowT > 0) { g.slowT -= raw; if (g.slowT <= 0) g.timeScale = 1; }
    if (g.shakeT > 0) {
      g.shakeT -= raw;
      const i = g.shakeI * (g.shakeT > 0 ? 1 : 0);
      shake.x = (Math.random() - 0.5) * i * 2;
      shake.y = (Math.random() - 0.5) * i * 2;
    } else { shake.x = 0; shake.y = 0; }
    if (g.flashT > 0) g.flashT -= raw;
    if (g.telegraph > 0) g.telegraph -= dt;

    // player
    const speed = 168;
    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;
    g.player.moving = !!(dx || dy);
    if (dx || dy) {
      const len = Math.hypot(dx, dy) || 1;
      g.player.x += (dx / len) * speed * dt;
      g.player.y += (dy / len) * speed * dt;
    }
    g.player.x = Math.max(BOX.x + g.player.r, Math.min(BOX.x + BOX.w - g.player.r, g.player.x));
    g.player.y = Math.max(BOX.y + g.player.r, Math.min(BOX.y + BOX.h - g.player.r, g.player.y));
    if (g.player.inv > 0) g.player.inv -= raw;

    // instruction timer
    const block = fightSeq[g.pc];
    if (block) {
      g.t += dt;
      const dur = getDur(block);
      const p = block.params || {};

      // ── Crystal Barrage ──
      if (block.type === "crystal_barrage" && g.crystal) {
        const c = g.crystal;
        c.t += dt;
        if (c.state === "out") {
          // already spawned; wait then reverse
          if (c.t >= 1.15) {
            c.state = "pause";
            c.t = 0;
            c.crystals.forEach(b => { b.vx *= 0.08; b.vy *= 0.08; });
          }
        } else if (c.state === "pause") {
          if (c.t >= 0.38) {
            c.state = "reverse";
            c.t = 0;
            c.crystals.forEach(b => {
              b.vx = -b.vx * 6.5;
              b.vy = -b.vy * 6.5;
            });
          }
        } else if (c.state === "reverse") {
          if (c.t >= 0.55) {
            c.state = "explode";
            c.t = 0;
            c.crystals.forEach(b => { b.flash = 1; });
          }
        } else if (c.state === "explode") {
          c.crystals.forEach(b => {
            if (b.flash && !b.exploded) {
              b.exploded = true;
              b.life = 0;
              const phase = c.phase;
              if (phase === "1") {
                // 6 shards, 3 long-lived
                for (let i = 0; i < 6; i++) {
                  const ang = (i / 6) * Math.PI * 2 + Math.random() * 0.2;
                  const long = i % 2 === 0;
                  const spd = long ? 155 : 95;
                  g.bullets.push(bullet(b.x, b.y, Math.sin(ang) * spd, Math.cos(ang) * spd, long ? 5 : 4, "shard", {
                    life: long ? 3.8 : 2.2
                  }));
                }
              } else if (phase === "2") {
                // larger, equal distance
                for (let i = 0; i < 6; i++) {
                  const ang = (i / 6) * Math.PI * 2 + Math.random() * 0.15;
                  g.bullets.push(bullet(b.x, b.y, Math.sin(ang) * 130, Math.cos(ang) * 130, 6, "shard", { life: 3.2 }));
                }
              } else {
                // phase 3: two opposite shards that turn red and home
                const base = Math.random() * Math.PI;
                for (let i = 0; i < 2; i++) {
                  const ang = base + i * Math.PI;
                  const s = bullet(b.x, b.y, Math.sin(ang) * 90, Math.cos(ang) * 90, 6.5, "shard", {
                    life: 4.5, home: true, homeDelay: 0.35, homeTimer: 0, red: true
                  });
                  g.bullets.push(s);
                }
              }
            }
          });
        }
        // initial state transition
        if (c.state === "fire") { c.state = "out"; }
      }

      // ── Knife Dance ──
      if (block.type === "knife_dance" && g.knives) {
        const k = g.knives;
        k.t += dt;
        const gap = k.phase === "3" ? 0.22 : 0.42;

        // spawn knives one by one
        if (k.spawned < k.count && k.t >= k.nextAt) {
          const side = k.spawned % 4;
          let x, y;
          if (side === 0) { x = BOX.x - 30; y = g.player.y; }
          else if (side === 1) { x = BOX.x + BOX.w + 30; y = g.player.y; }
          else if (side === 2) { x = g.player.x; y = BOX.y - 30; }
          else { x = g.player.x; y = BOX.y + BOX.h + 30; }
          k.list.push({
            x, y, lockX: g.player.x, lockY: g.player.y,
            state: "lock", timer: 0, ang: 0
          });
          k.spawned++;
          k.nextAt = k.t + gap;
        }

        // update knives
        k.list.forEach(s => {
          s.timer += dt;
          if (s.state === "lock") {
            s.lockX += (g.player.x - s.lockX) * Math.min(1, dt * 10);
            s.lockY += (g.player.y - s.lockY) * Math.min(1, dt * 5);
            s.x += (s.lockX - s.x) * Math.min(1, dt * 8);
            s.y += (s.lockY - s.y) * Math.min(1, dt * 6);
            s.ang = Math.atan2(s.lockX - s.x, s.lockY - s.y);
            if (s.timer >= k.lockTime) {
              s.state = "slash";
              s.timer = 0;
              // create a full-board slash line
              g.cuts.push({
                x: s.lockX, y: s.lockY, ang: s.ang,
                width: 16, life: 0.55, dmg: true
              });
              // small shake
              g.shakeT = 0.18; g.shakeI = 5;
            }
          }
        });

        // ring (phase 2)
        if (k.phase === "2") {
          k.ring.forEach(r => {
            r.ang += 1.1 * dt;
            r.x = g.player.x + Math.sin(r.ang) * r.dist;
            r.y = g.player.y + Math.cos(r.ang) * r.dist;
          });
        }
      }

      // ── Board Rend ──
      if (block.type === "board_rend" && g.rend) {
        updateRend(g, dt);
      }

      // ── Sword Tunnel ──
      if (block.type === "sword_tunnel" && g.tunnel) {
        const t = g.tunnel;
        t.t += dt;
        if (t.state === "wave") {
          t.blades.forEach(b => {
            const wave = Math.sin(t.t * 1.85 + b.x * 0.04) * t.waveAmp;
            if (t.phase === "2") {
              // nightmarish twist
              t.twist += dt * 0.7;
              b.ang = t.twist * (b.side === "top" ? 1 : -1);
            }
            if (b.side === "top") b.y = b.baseY + Math.max(0, wave * (t.phase === "3" ? 0.75 : 0.55));
            else b.y = b.baseY - Math.max(0, wave * (t.phase === "3" ? 0.75 : 0.55));
          });
          if (t.t >= t.holdTime) {
            t.state = "telegraph";
            t.t = 0;
            t.blades.forEach(b => {
              b.ang = Math.atan2(g.player.x - b.x, g.player.y - b.y);
              b.teleLen = 0;
            });
          }
        } else if (t.state === "telegraph") {
          t.blades.forEach(b => {
            b.teleLen = Math.min(200, b.teleLen + 260 * dt);
          });
          if (t.t >= 0.7) {
            t.state = "fire";
            t.t = 0;
            t.blades.forEach(b => {
              b.vx = Math.sin(b.ang) * 480;
              b.vy = Math.cos(b.ang) * 480;
            });
            // reduced inv frames feel is simulated by higher damage density
            g.shakeT = 0.25; g.shakeI = 7;
          }
        } else if (t.state === "fire") {
          t.blades.forEach(b => {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
          });
        }
      }

      // ── Sanguine Slash ──
      if (block.type === "sanguine_slash" && g.sanguine) {
        const s = g.sanguine;
        s.t += dt;
        // determine how many lines this cycle should have
        let linesThis = 1;
        if (s.phase === "1") {
          // 1,2,3,4 then stop
          linesThis = Math.min(4, s.cycle + 1);
        } else {
          // phase 2/3: mostly 3 and 4
          linesThis = s.cycle % 2 === 0 ? 3 : 4;
        }

        if (s.t >= s.gap && s.cycle < (s.phase === "1" ? 4 : 6)) {
          s.t = 0;
          for (let i = 0; i < linesThis; i++) {
            s.cuts.push({
              x: g.player.x, y: g.player.y,
              ang: (i / linesThis) * Math.PI + Math.random() * 0.12,
              width: s.width,
              spin: 14 + Math.random() * 8,
              spinT: 0,
              spinDur: 0.5,
              life: 0.95,
              damaging: false
            });
          }
          s.cycle++;
        }

        // phase 3 finale spiral
        if (s.phase === "3" && s.cycle >= 6 && s.finale.length === 0 && s.t > 0.25) {
          const cx = BOX.x + BOX.w / 2, cy = BOX.y + BOX.h / 2;
          for (let i = 0; i < 8; i++) {
            s.finale.push({
              x: cx, y: cy,
              ang: (i / 8) * Math.PI * 2,
              width: s.width * 0.9,
              spin: 11 + i * 0.7,
              spinT: 0,
              spinDur: 0.85,
              life: 1.35,
              damaging: false
            });
          }
        }

        const all = s.cuts.concat(s.finale);
        all.forEach(c => {
          c.spinT += dt;
          c.life -= dt;
          const prog = Math.min(1, c.spinT / c.spinDur);
          c.curSpin = c.spin * (1 - prog * prog);
          c.ang += c.curSpin * dt;
          if (prog >= 0.88 && !c.damaging) c.damaging = true;
        });
        s.cuts = s.cuts.filter(c => c.life > 0);
        s.finale = s.finale.filter(c => c.life > 0);
      }

      // continuous spawners
      if (block.type === "rain") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        const iv = 1 / (p.rate || 6);
        while (g.spawnAcc >= iv) {
          g.spawnAcc -= iv;
          g.bullets.push(bullet(BOX.x + Math.random() * BOX.w, BOX.y - 5, 0, p.speed, 5, "diamond"));
        }
      }
      if (block.type === "spiral") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        g.spiralAng = (g.spiralAng || 0) + (p.rotSpeed || 140) * dt;
        const iv = 1 / (p.rate || 7);
        while (g.spawnAcc >= iv) {
          g.spawnAcc -= iv;
          for (let i = 0; i < (p.arms || 3); i++) {
            const ang = (g.spiralAng + (360 / (p.arms || 3)) * i) * Math.PI / 180;
            g.bullets.push(bullet(g.bossX, BOX.y + 16, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5, "diamond"));
          }
        }
      }
      if (block.type === "shotgun") {
        g.shotgunAcc = (g.shotgunAcc || 0) + dt;
        if (g.shotgunWaves > 0 && g.shotgunAcc >= 0.45) {
          g.shotgunAcc = 0; g.shotgunWaves--;
          spawnShotgun(g, p);
        }
      }

      // Spamton continuous
      if (block.type === "flying_heads" && g.heads) {
        const h = g.heads;
        h.t += dt;
        if (h.spawned < (p.count || 4) && h.t >= h.nextAt) {
          const lane = BOX.y + 45 + (h.spawned / (p.count || 4)) * (BOX.h - 90);
          h.list.push({
            x: BOX.x + BOX.w + 28, y: lane, vx: -(p.speed || 90),
            fireAcc: 0, hp: 3
          });
          h.spawned++;
          h.nextAt = h.t + (p.gap || 0.5);
        }
        h.list.forEach(hd => {
          hd.x += hd.vx * dt;
          hd.fireAcc += dt;
          if (hd.fireAcc >= 1 / (p.fireRate || 2.4)) {
            hd.fireAcc = 0;
            const ang = Math.atan2(g.player.x - hd.x, g.player.y - hd.y);
            g.bullets.push(bullet(hd.x, hd.y, Math.sin(ang) * 125, Math.cos(ang) * 125, 5, "circle"));
          }
        });
      }
      if (block.type === "chained_heart" && g.heart) {
        const h = g.heart;
        h.t += dt;
        h.swing = Math.sin(h.t * (p.swings || 1.2) * 2.2) * (BOX.w * 0.34);
        h.x = BOX.x + BOX.w / 2 + h.swing;
        h.spawnAcc += dt;
        const iv = 1 / (p.bulletRate || 5.5);
        while (h.spawnAcc >= iv) {
          h.spawnAcc -= iv;
          const ang = Math.random() * Math.PI * 2;
          g.bullets.push(bullet(h.x, h.y, Math.sin(ang) * 105, Math.cos(ang) * 105, 5.5, "diamond"));
        }
      }
      if (block.type === "phone_grip" && g.phones) {
        g.phones.t += dt;
        g.phones.head.x += g.phones.head.vx * dt;
        if (g.phones.t % 0.42 < dt) {
          const ang = Math.atan2(g.player.x - g.phones.head.x, g.player.y - g.phones.head.y);
          g.bullets.push(bullet(g.phones.head.x, g.phones.head.y,
            Math.sin(ang) * 95, Math.cos(ang) * 95, 8, "circle",
            { explode: true, explodeT: 0.85 }));
        }
      }
      if (block.type === "mail_storm" && g.mail) {
        g.mail.spawnAcc += dt;
        const iv = 1 / (p.rate || 6.5);
        while (g.mail.spawnAcc >= iv) {
          g.mail.spawnAcc -= iv;
          const bomb = Math.random() * 100 < (p.bombChance || 16);
          g.bullets.push(bullet(BOX.x + Math.random() * BOX.w, BOX.y - 6, 0, p.speed || 110,
            bomb ? 8 : 5.5, bomb ? "bolt" : "square", { bomb }));
        }
      }

      // advance
      if (g.t >= dur) {
        g.pc++;
        g.t = 0;
        // cleanup attack bags
        g.crystal = null; g.knives = null; g.rend = null; g.tunnel = null;
        g.sanguine = null; g.heads = null; g.heart = null; g.phones = null; g.mail = null;
        if (g.pc < fightSeq.length) enter(g, fightSeq[g.pc]);
      }
    }
    if (g.pc >= fightSeq.length) g.won = true;

    // bullets physics
    const newborn = [];
    g.bullets.forEach(b => {
      if (b.home && b.homeDelay != null) {
        b.homeTimer = (b.homeTimer || 0) + dt;
        if (b.homeTimer >= b.homeDelay) {
          const ang = Math.atan2(g.player.x - b.x, g.player.y - b.y);
          const spd = Math.hypot(b.vx, b.vy) || 120;
          b.vx = Math.sin(ang) * spd;
          b.vy = Math.cos(ang) * spd;
        }
      }
      if (b.pipis) {
        b.x += b.vx * dt; b.y += b.vy * dt;
        let bounced = false;
        if (b.x < BOX.x + b.r || b.x > BOX.x + BOX.w - b.r) { b.vx *= -1; bounced = true; }
        if (b.y < BOX.y + b.r || b.y > BOX.y + BOX.h - b.r) { b.vy *= -1; bounced = true; }
        if (bounced) {
          b.bounces--;
          if (b.bounces <= 0) {
            b.life = 0;
            for (let i = 0; i < (b.heads || 7); i++) {
              const ang = (i / b.heads) * Math.PI * 2;
              newborn.push(bullet(b.x, b.y, Math.sin(ang) * 125, Math.cos(ang) * 125, 4.5, "head", { life: 2.6 }));
            }
          }
        }
      } else if (b.explode) {
        b.explodeT = (b.explodeT || 0.85) - dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.explodeT <= 0 && !b.exploded) {
          b.exploded = true; b.life = 0;
          for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            newborn.push(bullet(b.x, b.y, Math.sin(ang) * 135, Math.cos(ang) * 135, 4, "circle", { life: 2 }));
          }
        }
      } else {
        b.x += b.vx * dt; b.y += b.vy * dt;
      }
      b.life -= dt;
    });
    if (newborn.length) g.bullets.push(...newborn);
    g.bullets = g.bullets.filter(b => b.life > 0 && b.x > BOX.x - 70 && b.x < BOX.x + BOX.w + 70 && b.y > BOX.y - 70 && b.y < BOX.y + BOX.h + 70);

    // cuts lifetime
    g.cuts = g.cuts.filter(c => { c.life -= dt; return c.life > 0; });

    // particles
    g.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.vx *= 0.94; p.vy *= 0.94; });
    g.particles = g.particles.filter(p => p.life > 0);

    // collision
    if (g.player.inv <= 0 && !g.player.hitThis) {
      let hitMe = false;
      for (const b of g.bullets) {
        if (Math.hypot(b.x - g.player.x, b.y - g.player.y) < b.r + g.player.r - 0.6) {
          hitMe = true; break;
        }
      }
      // sanguine cuts
      if (!hitMe && g.sanguine) {
        const all = g.sanguine.cuts.concat(g.sanguine.finale || []);
        for (const c of all) {
          if (!c.damaging) continue;
          const dx = g.player.x - c.x, dy = g.player.y - c.y;
          const proj = dx * Math.sin(c.ang) + dy * Math.cos(c.ang);
          const perp = dx * Math.cos(c.ang) - dy * Math.sin(c.ang);
          if (Math.abs(perp) < c.width / 2 + g.player.r && Math.abs(proj) < 280) { hitMe = true; break; }
        }
      }
      // knife dance slash lines
      if (!hitMe) {
        for (const c of g.cuts) {
          if (!c.dmg) continue;
          const dx = g.player.x - c.x, dy = g.player.y - c.y;
          const proj = dx * Math.sin(c.ang) + dy * Math.cos(c.ang);
          const perp = dx * Math.cos(c.ang) - dy * Math.sin(c.ang);
          if (Math.abs(perp) < c.width / 2 + g.player.r && Math.abs(proj) < 300) { hitMe = true; break; }
        }
      }
      // tunnel blades
      if (!hitMe && g.tunnel && (g.tunnel.state === "fire" || g.tunnel.state === "wave")) {
        for (const b of g.tunnel.blades) {
          if (Math.hypot(b.x - g.player.x, b.y - g.player.y) < 9 + g.player.r) { hitMe = true; break; }
        }
      }
      // knife ring
      if (!hitMe && g.knives && g.knives.phase === "2") {
        for (const r of g.knives.ring) {
          if (Math.hypot(r.x - g.player.x, r.y - g.player.y) < 10 + g.player.r) { hitMe = true; break; }
        }
      }
      // heads / heart / phones
      if (!hitMe && g.heads) {
        for (const h of g.heads.list) {
          if (Math.hypot(h.x - g.player.x, h.y - g.player.y) < 12 + g.player.r) { hitMe = true; break; }
        }
      }
      if (!hitMe && g.heart) {
        if (Math.hypot(g.heart.x - g.player.x, g.heart.y - g.player.y) < 14 + g.player.r) hitMe = true;
      }
      if (hitMe) hit(g, 10);
    }
  }

  function updateRend(g, dt) {
    const r = g.rend;
    if (!r) return;
    r.t += dt;
    if (r.state === "slash") {
      r.slashProg = Math.min(1, r.t / 0.2);
      if (r.t >= 0.2) {
        r.state = "separate"; r.t = 0;
        // damage on the cut line itself
        if (r.orient === "h") {
          if (Math.abs(g.player.y - (BOX.y + BOX.h / 2)) < 13 + g.player.r) hit(g, 14);
        } else if (r.orient === "v") {
          if (Math.abs(g.player.x - (BOX.x + BOX.w / 2)) < 13 + g.player.r) hit(g, 14);
        } else {
          const dx = g.player.x - (BOX.x + BOX.w / 2);
          const dy = g.player.y - (BOX.y + BOX.h / 2);
          if (Math.abs(dx - dy) < 18 || Math.abs(dx + dy) < 18) hit(g, 14);
        }
      }
    } else if (r.state === "separate") {
      r.sep = Math.min(1, r.t / 0.35);
      if (r.t >= 0.35) { r.state = "gap"; r.t = 0; r.spawnAcc = 0; }
    } else if (r.state === "gap") {
      r.sep = 1;
      r.spawnAcc += dt;
      const iv = 1 / (r.bulletRate || 11);
      while (r.spawnAcc >= iv) {
        r.spawnAcc -= iv;
        if (r.orient === "h") {
          const x = BOX.x + Math.random() * BOX.w;
          const dir = Math.random() < 0.5 ? -1 : 1;
          g.bullets.push(bullet(x, BOX.y + BOX.h / 2, 0, dir * 145, 7, "shard"));
        } else if (r.orient === "v") {
          const y = BOX.y + Math.random() * BOX.h;
          const dir = Math.random() < 0.5 ? -1 : 1;
          g.bullets.push(bullet(BOX.x + BOX.w / 2, y, dir * 145, 0, 7, "shard"));
        } else {
          const ang = Math.random() * Math.PI * 2;
          g.bullets.push(bullet(BOX.x + BOX.w / 2, BOX.y + BOX.h / 2,
            Math.sin(ang) * 150, Math.cos(ang) * 150, 6.5, "shard"));
        }
      }
      // constrain player to halves
      const midX = BOX.x + BOX.w / 2, midY = BOX.y + BOX.h / 2, sep = r.sep * 20;
      if (r.orient === "v") {
        if (g.player.x < midX) g.player.x = Math.min(g.player.x, midX - sep - g.player.r);
        else g.player.x = Math.max(g.player.x, midX + sep + g.player.r);
      } else if (r.orient === "h") {
        if (g.player.y < midY) g.player.y = Math.min(g.player.y, midY - sep - g.player.r);
        else g.player.y = Math.max(g.player.y, midY + sep + g.player.r);
      }
      if (r.t >= r.gapTime) { r.state = "reconnect"; r.t = 0; }
    } else if (r.state === "reconnect") {
      r.sep = 1 - Math.min(1, r.t / 0.3);
      if (r.t >= 0.3) {
        r.cutsLeft--;
        if (r.cutsLeft > 0) beginRendCut(g);
        else r.state = "done";
      }
    }
  }

  // ─── DRAW ──────────────────────────────────────────────────
  function drawShape(ctx, x, y, r, shape) {
    ctx.beginPath();
    if (shape === "square") ctx.rect(x - r, y - r, r * 2, r * 2);
    else if (shape === "triangle") {
      ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x - r, y + r * 0.85); ctx.lineTo(x + r, y + r * 0.85); ctx.closePath();
    } else if (shape === "diamond") {
      ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.15, y); ctx.lineTo(x, y + r * 1.25); ctx.lineTo(x - r * 1.15, y); ctx.closePath();
    } else if (shape === "star") {
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * 0.48 : r * 1.22;
        const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    } else if (shape === "shard" || shape === "crystal") {
      ctx.moveTo(x, y - r * 1.45); ctx.lineTo(x + r * 0.75, y + r * 0.15);
      ctx.lineTo(x + r * 0.2, y + r * 1.1); ctx.lineTo(x - r * 0.55, y + r * 0.35); ctx.closePath();
    } else if (shape === "blade" || shape === "knife") {
      ctx.moveTo(x, y - r * 1.55); ctx.lineTo(x + r * 0.38, y - r * 0.05);
      ctx.lineTo(x + r * 0.16, y + r * 1.05); ctx.lineTo(x - r * 0.16, y + r * 1.05);
      ctx.lineTo(x - r * 0.38, y - r * 0.05); ctx.closePath();
    } else if (shape === "scythe") {
      ctx.rect(x - r * 0.07, y - r * 1.15, r * 0.14, r * 2.4);
      ctx.moveTo(x - r * 0.04, y - r * 0.8);
      ctx.bezierCurveTo(x + r * 0.35, y - r * 1.55, x + r * 1.5, y - r * 1.5, x + r * 1.4, y - r * 0.4);
      ctx.bezierCurveTo(x + r * 1.3, y - r * 1.0, x + r * 0.75, y - r * 0.7, x + r * 0.3, y - r * 0.2);
      ctx.closePath();
    } else if (shape === "heart") {
      const s = r / 6;
      ctx.moveTo(x, y + 7 * s);
      ctx.bezierCurveTo(x, y + 3 * s, x - 6 * s, y + 2 * s, x - 6 * s, y - 1 * s);
      ctx.bezierCurveTo(x - 6 * s, y - 5 * s, x - 2 * s, y - 5 * s, x, y - 2 * s);
      ctx.bezierCurveTo(x + 2 * s, y - 5 * s, x + 6 * s, y - 5 * s, x + 6 * s, y - 1 * s);
      ctx.bezierCurveTo(x + 6 * s, y + 2 * s, x, y + 4 * s, x, y + 7 * s);
      ctx.closePath();
    } else if (shape === "pipis") {
      ctx.ellipse(x, y, r * 1.1, r * 0.9, 0, 0, Math.PI * 2);
    } else if (shape === "head" || shape === "spamton") {
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.moveTo(x - r * 0.4, y - r * 0.2); ctx.arc(x - r * 0.25, y - r * 0.2, r * 0.14, 0, Math.PI * 2);
      ctx.moveTo(x + r * 0.1, y - r * 0.2); ctx.arc(x + r * 0.25, y - r * 0.2, r * 0.14, 0, Math.PI * 2);
    } else if (shape === "bolt") {
      ctx.moveTo(x + r * 0.15, y - r * 1.45); ctx.lineTo(x - r * 0.65, y - r * 0.05);
      ctx.lineTo(x - r * 0.08, y - r * 0.05); ctx.lineTo(x - r * 0.4, y + r * 1.4);
      ctx.lineTo(x + r * 0.65, y - r * 0.2); ctx.lineTo(x + r * 0.08, y - r * 0.2); ctx.closePath();
    } else {
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  function render(g) {
    ctx.save();
    ctx.translate(shake.x, shake.y);
    ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);

    // arena
    const borderFlash = g.telegraph > 0 && Math.floor(g.telegraph * 14) % 2 === 0;
    ctx.strokeStyle = borderFlash ? "#ffd23f" : "#2a2438";
    ctx.lineWidth = borderFlash ? 4 : 3;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);

    // boss
    ctx.fillStyle = boss.color;
    drawShape(ctx, g.bossX, BOX.y - boss.size - 6, boss.size, boss.shape);
    ctx.globalAlpha = 0.15;
    ctx.beginPath(); ctx.arc(g.bossX, BOX.y - boss.size - 6, boss.size + 7, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Board Rend visual split
    if (g.rend && g.rend.state !== "done") {
      const r = g.rend;
      const midX = BOX.x + BOX.w / 2, midY = BOX.y + BOX.h / 2;
      const sep = r.sep * 20;
      ctx.save();
      if (r.orient === "v") {
        ctx.fillStyle = "rgba(8,7,14,0.92)";
        ctx.fillRect(BOX.x, BOX.y, BOX.w / 2 - sep, BOX.h);
        ctx.fillRect(midX + sep, BOX.y, BOX.w / 2 - sep, BOX.h);
        ctx.strokeStyle = `rgba(94,200,255,${0.55 + r.slashProg * 0.4})`;
        ctx.lineWidth = 2 + r.slashProg * 4;
        ctx.beginPath(); ctx.moveTo(midX, BOX.y); ctx.lineTo(midX, BOX.y + BOX.h); ctx.stroke();
      } else if (r.orient === "h") {
        ctx.fillStyle = "rgba(8,7,14,0.92)";
        ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h / 2 - sep);
        ctx.fillRect(BOX.x, midY + sep, BOX.w, BOX.h / 2 - sep);
        ctx.strokeStyle = `rgba(94,200,255,${0.55 + r.slashProg * 0.4})`;
        ctx.lineWidth = 2 + r.slashProg * 4;
        ctx.beginPath(); ctx.moveTo(BOX.x, midY); ctx.lineTo(BOX.x + BOX.w, midY); ctx.stroke();
      } else {
        ctx.strokeStyle = `rgba(94,200,255,${0.65 + r.slashProg * 0.3})`;
        ctx.lineWidth = 3 + r.slashProg * 3;
        ctx.beginPath(); ctx.moveTo(BOX.x, BOX.y); ctx.lineTo(BOX.x + BOX.w, BOX.y + BOX.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(BOX.x + BOX.w, BOX.y); ctx.lineTo(BOX.x, BOX.y + BOX.h); ctx.stroke();
      }
      ctx.restore();
    }

    // Sanguine cuts
    if (g.sanguine) {
      const all = g.sanguine.cuts.concat(g.sanguine.finale || []);
      all.forEach(c => {
        const a = Math.max(0, c.life / 1.1);
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(-c.ang);
        ctx.fillStyle = c.damaging ? `rgba(255,40,80,${0.82 * a})` : `rgba(255,110,150,${0.48 * a})`;
        ctx.fillRect(-300, -c.width / 2, 600, c.width);
        if (c.damaging) {
          ctx.fillStyle = `rgba(255,200,220,${0.95 * a})`;
          ctx.fillRect(-300, -c.width * 0.18, 600, c.width * 0.36);
        }
        ctx.restore();
      });
    }

    // Knife Dance slash lines
    g.cuts.forEach(c => {
      const a = Math.max(0, c.life / 0.55);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(-c.ang);
      ctx.fillStyle = `rgba(226,232,240,${0.75 * a})`;
      ctx.fillRect(-320, -c.width / 2, 640, c.width);
      ctx.fillStyle = `rgba(255,255,255,${0.9 * a})`;
      ctx.fillRect(-320, -c.width * 0.2, 640, c.width * 0.4);
      ctx.restore();
    });

    // Knife Dance knives + ring
    if (g.knives) {
      g.knives.list.forEach(s => {
        if (s.state === "slash") return;
        ctx.fillStyle = "#e2e8f0";
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(-s.ang);
        drawShape(ctx, 0, 0, 9, "knife");
        ctx.restore();
        // lock line
        ctx.strokeStyle = "rgba(255,210,63,0.5)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.lockX, s.lockY); ctx.stroke();
        ctx.setLineDash([]);
      });
      if (g.knives.phase === "2") {
        g.knives.ring.forEach(r => {
          ctx.fillStyle = "#a0aec0";
          drawShape(ctx, r.x, r.y, 8, "blade");
        });
      }
    }

    // Sword Tunnel
    if (g.tunnel) {
      g.tunnel.blades.forEach(b => {
        ctx.fillStyle = "#c9d3e0";
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(-(b.ang || 0));
        drawShape(ctx, 0, 0, 7, "blade");
        ctx.restore();
        if (g.tunnel.state === "telegraph" && b.teleLen) {
          ctx.strokeStyle = "rgba(255,70,100,0.55)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x + Math.sin(b.ang) * b.teleLen, b.y + Math.cos(b.ang) * b.teleLen);
          ctx.stroke();
        }
      });
    }

    // Flying heads
    if (g.heads) {
      g.heads.list.forEach(h => {
        ctx.fillStyle = "#ff9f43";
        drawShape(ctx, h.x, h.y, 11, "head");
      });
    }

    // Chained heart
    if (g.heart) {
      ctx.fillStyle = "#ff6b9d";
      drawShape(ctx, g.heart.x, g.heart.y, 13, "heart");
      ctx.strokeStyle = "rgba(200,200,220,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(BOX.x + BOX.w / 2, BOX.y + 8);
      ctx.lineTo(g.heart.x, g.heart.y);
      ctx.stroke();
    }

    // Phones
    if (g.phones) {
      g.phones.list.forEach(ph => {
        ctx.fillStyle = "#4a5568";
        ctx.fillRect(ph.x - 6, ph.y - 14, 12, 28);
      });
      ctx.fillStyle = "#ff9f43";
      drawShape(ctx, g.phones.head.x, g.phones.head.y, 12, "head");
    }

    // Bullets
    g.bullets.forEach(b => {
      if (b.red) ctx.fillStyle = "#ff3b5c";
      else if (b.shape === "star") ctx.fillStyle = "#ffd23f";
      else if (b.shape === "crystal" || b.shape === "shard") ctx.fillStyle = "#c4b5fd";
      else if (b.shape === "knife" || b.shape === "blade") ctx.fillStyle = "#e2e8f0";
      else if (b.shape === "pipis") ctx.fillStyle = "#5ec8ff";
      else if (b.shape === "head") ctx.fillStyle = "#ff9f43";
      else if (b.shape === "bolt") ctx.fillStyle = "#f6e05e";
      else if (b.shape === "heart") ctx.fillStyle = "#ff6b9d";
      else ctx.fillStyle = "#ff3b5c";

      if (b.flash && b.flash > 0) ctx.fillStyle = "#ffffff";

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot || 0);
      drawShape(ctx, 0, 0, b.r, b.shape);
      ctx.restore();
    });

    // particles
    g.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2.6);
      ctx.fillStyle = p.color || "#ffd23f";
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });

    // soul
    const invFlash = g.player.inv > 0 && Math.floor(g.player.inv * 14) % 2 === 0;
    ctx.fillStyle = invFlash ? "#ffffff" : "#ffd23f";
    ctx.beginPath(); ctx.arc(g.player.x, g.player.y, g.player.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = invFlash ? "#fff" : "rgba(255,210,63,0.4)";
    ctx.lineWidth = 1.5; ctx.stroke();

    // screen flash
    if (g.flashT > 0) {
      const a = Math.min(0.6, g.flashT * 4);
      const colors = { white: "255,255,255", yellow: "255,210,63", red: "255,60,90", pink: "255,107,157", violet: "167,139,250" };
      const c = colors[g.flashC] || colors.white;
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }

  render(idle());
})();
</script>
</body>
</html>
