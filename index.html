<style>

<canvas id="c" width="640" height="480"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=640,H=480,F='"Press Start 2P",monospace',PI2=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ch=a=>a[Math.random()*a.length|0];
const DIR=[[0,-1],[1,0],[0,1],[-1,0]],GD=[[0,1],[-1,0],[0,-1],[1,0]],HC={red:'#f33',blue:'#4af',green:'#0f0',purple:'#b4f'},PC=['#c6f','#f94','#6cf','#f4a','#fff'];
let st='title',keys={},mute=false,t=0,shake=0,flash=0,ps=[],bullets=[],msgFull='',msgI=0,mi=0,sub=null,si=0,barX=0,hitFx=null,dmgNum=null,tkT=0,after=null,eyeCol=null,bossGone=false;
let hp,maxhp=70,inv=0,bossHP,BMAX=15000000,bossShow,turn=0,perse=0,items=[],gonerHit=false,gonerDone=false,phase=0,up=0,atk=null,at=0,hits=0,lastAtk='',best=0,pp=null,pdown=false,mode='red',sh=0,gd=0,pl=1,pdy=0,SP=1,lastPhase=0;
try{best=+localStorage.getItem('randomz_best15')||0}catch(e){}
const B={x:30,y:280,w:580,h:110,cy:335},T={w:580,h:110,cy:335},so={x:320,y:320,mv:0,r:4.5,g:0,on:0};
const stars=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(.2,1)}));
const cx=()=>B.x+B.w/2,cy=()=>B.y+B.h/2;
/* audio */
let AC;function snd(f,d=.1,ty='square',v=.04,s=0){if(mute)return;try{AC=AC||new AudioContext();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function emit(x,y,n,c,sp=2){for(let i=0;i<n;i++){const a=rnd(0,PI2),v=rnd(.3,1)*sp;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,1),m:1,c})}}
/* bullets */
function bl(o){const b=Object.assign({x:0,y:0,vx:0,vy:0,k:'c',r:5,w:8,h:8,ty:'w',life:6,warn:0,dmg:6,col:'#fff',u:null,ml:1},o);if(b.ty=='b')b.col='#4af';if(b.ty=='o')b.col='#f80';bullets.push(b);return b}
const zn=(x,y,w,h,wr=1,l=.3,ty='w',dmg=6)=>{if(w<2||h<2)return;return bl({k:'z',x:x+w/2,y:y+h/2,w,h,warn:wr,wm:wr,life:l,ml:l,dmg,ty})};
const ev=(s,k,i,dt,f)=>{s[k]=(s[k]||0)+dt;while(s[k]>=i){s[k]-=i;s[k+'n']=(s[k+'n']||0)+1;f(s[k+'n'])}};
const tl=(s,dt,a)=>{s.T=(s.T||0)+dt;s.i=s.i||0;while(s.i<a.length&&s.T>=a[s.i][0])a[s.i++][1]()};
const ln=(x1,y1,x2,y2,w,wr,l,col,dmg=6)=>bl({k:'ln',x1,y1,x2,y2,w,warn:wr,wm:wr,life:l,ml:l,col,dmg});
function ring(x,y,k,v,r,col,o){const ph=rnd(0,PI2);for(let i=0;i<k;i++){const a=ph+i/k*PI2;bl(Object.assign({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r,col,life:4},o||{}))}}
function laser(h,pos,w=20,warn=.8,life=.4){const z=h?zn(B.x,pos-w/2,B.w,w,warn,life):zn(pos-w/2,B.y,w,B.h,warn,life);if(z)z.sk=h?[B.x-26,pos,0]:[pos,B.y-26,Math.PI/2];return z}
function bounce(b,d){b.vy+=.03*d*60;if(b.x<B.x+b.r&&b.vx<0)b.vx*=-1;if(b.x>B.x+B.w-b.r&&b.vx>0)b.vx*=-1;if(b.y>B.y+B.h-b.r&&b.vy>0)b.vy*=-.96;if(b.y<B.y+b.r&&b.vy<0)b.vy*=-1}
/* ===== ATTACKS (researched from Undertale / Deltarune bosses) ===== */
const A={
/* Toriel / Asriel Fire Magic */
fire:{d:7,b:[230,150],f(dt,s){ev(s,'a',.17,dt,n=>{bl({k:'f',x:rnd(B.x+10,B.x+B.w-10),y:B.y-10,vx:rnd(-.6,.6),vy:2.5*SP,r:7});if(n%4==0)bl({k:'f',x:so.x+rnd(-10,10),y:B.y-10,vy:3*SP,r:7})})}},
/* Asgore */
aHelix:{d:7,b:[240,180],f(dt,s){s.T=(s.T||0)+dt;ev(s,'a',.1,dt,n=>{if(s.T%1.75>1.2)return;const ph=n*.5;[-1,1].forEach(q=>bl({k:'f',x:cx()+Math.sin(ph)*72*q,y:B.y-10,vy:2.6*SP,r:6,dmg:8}))})}},
aWave:{d:7.5,b:[250,180],f(dt,s){ev(s,'a',.42,dt,n=>{if(n%4==3){const l=Math.random()<.5,x0=l?B.x:B.x+B.w/2;for(let i=0;i<16;i++)bl({k:'f',x:x0+rnd(6,B.w/2-6),y:B.y-12-rnd(0,50),vy:2.2*SP,r:7,dmg:8})}else for(let i=-1;i<=1;i++)bl({k:'f',x:cx()+i*16+Math.sin(n)*30,y:B.y-12,vy:2.8*SP,r:5,dmg:6})})}},
aSpiral:{d:7.5,b:[260,200],f(dt,s){ev(s,'a',1.15,dt,n=>{const k=18,ph=n*.9,sp=(1+n*.12)*SP;for(let i=0;i<k;i++){if(i>=3&&i<6)continue;bl({k:'f',r:6,dmg:8,life:5,th:i/k*PI2+ph,rd:170,u:(b,d)=>{b.th+=.018*sp*d*60;b.rd-=.95*sp*d*60;b.x=cx()+Math.cos(b.th)*b.rd;b.y=cy()+Math.sin(b.th)*b.rd}})}})}},
aHands:{d:8,b:[250,180],f(dt,s){s.T=(s.T||0)+dt;if(!s.in){s.in=1;s.tx=so.x;s.ty=so.y;s.hb=[]}const p=(s.T-.3)/2.4;
 if(p>0&&p<=1){s.hl={x:B.x-6,y:B.y+p*B.h};s.hr={x:B.x+B.w+6,y:B.y+B.h-p*B.h};ev(s,'a',.27,dt,()=>{s.hb.push(bl({k:'f',x:s.hl.x+14,y:s.hl.y,r:9,dmg:6,life:6}),bl({k:'f',x:s.hr.x-14,y:s.hr.y,r:9,dmg:6,life:6}))})}else if(p>1)s.hl=s.hr=null;
 if(s.T>3&&!s.go){s.go=1;snd(200,.4,'sawtooth',.04,200);s.hb.forEach(b=>{const dx=s.tx-b.x,dy=s.ty-b.y,m=Math.hypot(dx,dy)||1;b.vx=dx/m*3.4*SP;b.vy=dy/m*3.4*SP})}}},
aRings:{d:7.5,b:[260,200],f(dt,s){s.T=(s.T||0)+dt;ev(s,'a',.55,dt,n=>{const p=Math.min(1,s.T/6.5),ox=B.x+p*B.w,k=6+n;for(let i=0;i<k;i++){const a=.12*Math.PI+i/(k-1)*.76*Math.PI;bl({k:'f',x:ox,y:B.y-10,vx:Math.cos(a)*2.3*SP,vy:Math.sin(a)*2.3*SP,r:8,dmg:6,life:5})}})}},
aTrident:{d:7.5,b:[250,170],f(dt,s){if(!s.in){s.in=1;s.T=0;s.i=0;const L=2+(Math.random()*3|0),q=[];for(let i=0;i<L;i++){const ty=Math.random()<.5?'b':'o';q.push([.4+i*.65,()=>{eyeCol=ty=='b'?'#4af':'#f80';snd(i==L-1?200:380,.2,'square',.04)}]);q.push([1.0+L*.65+i*.85,()=>{eyeCol=null;zn(B.x,B.y,B.w,B.h,.38,.3,ty)}])}q.push([.4+L*.65+.3,()=>eyeCol=null]);q.sort((a,b)=>a[0]-b[0]);s.q=q}tl(s,dt,s.q)}},
/* Omega Flowey */
pellets:{d:7.5,b:[250,190],f(dt,s){ev(s,'a',1.5,dt,()=>{const k=12,ph=rnd(0,PI2),R=105;for(let i=0;i<k;i++){const a=ph+i/k*PI2;bl({k:'c',show:1,x:so.x+Math.cos(a)*R,y:so.y+Math.sin(a)*R,r:5,warn:.75,life:3,vx:-Math.cos(a)*1.9*SP,vy:-Math.sin(a)*1.9*SP})}})}},
vines:{d:7.5,b:[250,190],f(dt,s){ev(s,'a',1.5,dt,()=>{const k=3+up;for(let i=0;i<k;i++){const a=rnd(0,PI2),R=220,tx=so.x+rnd(-12,12),ty=so.y+rnd(-12,12);ln(tx+Math.cos(a)*R,ty+Math.sin(a)*R,tx-Math.cos(a)*R,ty-Math.sin(a)*R,12,.85+i*.18,.22,'#7d7')}snd(300,.1,'square',.03)})}},
bombs:{d:7,b:[250,190],f(dt,s){ev(s,'a',.8,dt,()=>{bl({k:'c',r:9,col:'#f55',x:rnd(B.x+20,B.x+B.w-20),y:B.y-12,vy:2.4*SP,life:5,u:b=>{if(b.y>=B.y+B.h-14&&!b.ex){b.ex=1;b.life=0;for(let i=0;i<10;i++){const a=-Math.PI*(i/9);bl({k:'c',r:4,col:'#f95',x:b.x,y:b.y,vx:Math.cos(a)*2.1,vy:Math.sin(a)*2.1,life:2.2,u:(q,d)=>{q.vy+=.045*d*60}})}snd(100,.2,'sawtooth',.04,-40)}}})})}},
guns:{d:7.5,b:[300,170],f(dt,s){ev(s,'a',.95,dt,()=>{const l=Math.random()<.5,y=cl(so.y+rnd(-40,40),B.y+14,B.y+B.h-14),x=l?B.x-14:B.x+B.w+14;for(let i=0;i<3;i++)bl({k:'s',r:6,col:'#ff6',show:1,x,y,vx:(l?1:-1)*3.8*SP,warn:.5+i*.12,life:4})})}},
dentata:{d:8,b:[280,190],f(dt,s){ev(s,'a',1.6,dt,n=>{if(n>4)return;const l=Math.random()<.5;bl({k:'c',r:12,col:'#7d4',x:l?B.x+10:B.x+B.w-10,y:B.y+rnd(20,B.h-20),vx:(l?1:-1)*rnd(1.8,2.6)*SP,vy:rnd(-2,2),life:6,bn:0,u:b=>{if(b.bn<4){if(b.x<B.x+b.r&&b.vx<0){b.vx*=-1;b.bn++}if(b.x>B.x+B.w-b.r&&b.vx>0){b.vx*=-1;b.bn++}if(b.y<B.y+b.r&&b.vy<0){b.vy*=-1;b.bn++}if(b.y>B.y+B.h-b.r&&b.vy>0){b.vy*=-1;b.bn++}}}})})}},
/* Sans / Papyrus */
boneGap:{d:7.5,b:[300,170],f(dt,s){ev(s,'a',.62,dt,()=>{const gh=58+rnd(0,16)-up*8,gy=B.y+14+Math.random()*(B.h-28-gh),x=B.x+B.w+20,v=-2.8*SP,bh=gy-B.y,th=B.y+B.h-gy-gh;bl({k:'b',x,y:B.y+bh/2,vx:v,w:12,h:bh,life:7});bl({k:'b',x,y:gy+gh+th/2,vx:v,w:12,h:th,life:7})})}},
blasters:{d:8,b:[290,170],f(dt,s){ev(s,'a',1.05,dt,n=>{if(n>6)return;const h=Math.random()<.5,p=h?cl(so.y+rnd(-30,30),B.y+14,B.y+B.h-14):cl(so.x+rnd(-30,30),B.x+14,B.x+B.w-14);laser(h,p,22,.75,.45);if(up)laser(!h,h?cl(so.x+rnd(-60,60),B.x+14,B.x+B.w-14):cl(so.y+rnd(-40,40),B.y+14,B.y+B.h-14),22,.95,.45);snd(90,.4,'sawtooth',.04,60)})}},
xblast:{d:8.5,b:[270,200],f(dt,s){ev(s,'a',1.9,dt,n=>{if(n>4)return;const x=cx(),y=cy(),R=240;if(n%2){ln(x,y-R,x,y+R,24,.9,.4,'#fff');ln(x-R,y,x+R,y,24,.9,.4,'#fff')}else{ln(x-R,y-R,x+R,y+R,24,.9,.4,'#fff');ln(x+R,y-R,x-R,y+R,24,.9,.4,'#fff')}snd(90,.5,'sawtooth',.04,60)})}},
colorBones:{d:7,b:[270,170],f(dt,s){ev(s,'a',.5,dt,()=>{const l=Math.random()<.5,ty=Math.random()<.5?'b':'o';bl({k:'b',x:l?B.x-18:B.x+B.w+18,y:rnd(B.y+30,B.y+B.h-30),vx:(l?1:-1)*3*SP,w:12,h:60,ty,life:6})})}},
slam:{d:8,b:[300,170],mode:'blue',f(dt,s){ev(s,'a',1.25,dt,n=>{for(let i=0;i<2+(n%2);i++){const hh=rnd(40,80),x=rnd(B.x+24,B.x+B.w-24);zn(x-9,B.y+B.h-hh,18,hh,.65,.3)}bl({k:'b',x:B.x+B.w+16,y:B.y+B.h-14,vx:-2.8*SP,w:12,h:26,life:6});if(n%2)bl({k:'b',x:B.x-16,y:B.y+B.h-14,vx:2.8*SP,w:12,h:26,life:6})})}},
wallSlam:{d:9,b:[260,200],mode:'blue',f(dt,s){ev(s,'g',1.9,dt,n=>{gd=[0,3,2,1][(n+(Math.random()*2|0))%4];so.g=8;so.on=0;snd(100,.2,'sawtooth',.05,-40)});
 ev(s,'a',.6,dt,()=>{const G=GD[gd];if(G[1]){const l=Math.random()<.5;bl({k:'b',x:l?B.x-16:B.x+B.w+16,y:G[1]>0?B.y+B.h-14:B.y+14,vx:(l?1:-1)*2.6*SP,w:26,h:12,life:6})}else{const tp=Math.random()<.5;bl({k:'b',x:G[0]>0?B.x+B.w-14:B.x+14,y:tp?B.y-16:B.y+B.h+16,vy:(tp?1:-1)*2.6*SP,w:12,h:26,life:6})}})}},
/* Undyne */
undyne:{d:10,b:[180,180],mode:'green',f(dt,s){ev(s,'a',.45,dt,n=>{if(n>(up?24:19))return;const dd=ch(DIR),sl=Math.random()<.25,v=sl?1.6:2.9*SP,b=bl({k:'sp',x:cx()-dd[0]*115,y:cy()-dd[1]*115,vx:dd[0]*v,vy:dd[1]*v,r:7,ar:1,col:'#0f0',life:4});if(Math.random()<.2){b.fl=.8;b.life=5}})}},
spearRain:{d:7,b:[280,180],f(dt,s){ev(s,'a',.42,dt,n=>{const x=n%3==0?so.x:rnd(B.x+12,B.x+B.w-12);ln(x,B.y,x,B.y+B.h,2,.55,.01,'#6df',0);bl({k:'sp',x,y:B.y-30,vy:7*SP,r:6,warn:.55,life:2,col:'#6df'})})}},
/* Muffet */
muffet:{d:9,b:[320,150],mode:'purple',lanes:3,f(dt,s){ev(s,'a',.5,dt,n=>{const lane=Math.random()*3|0,l=Math.random()<.5;bl({k:'c',r:7,col:'#fa6',x:l?B.x-14:B.x+B.w+14,y:B.y+B.h*(lane+1)/4,vx:(l?1:-1)*(2.3+(n%5==0?1.2:0))*SP,life:6});if(up&&n%3==0)bl({k:'c',r:7,col:'#fa6',x:l?B.x+B.w+14:B.x-14,y:B.y+B.h*(((lane+1)%3)+1)/4,vx:(l?-1:1)*2.4,life:6})})}},
/* Mettaton */
neoRain:{d:7,b:[280,190],f(dt,s){ev(s,'a',.14,dt,()=>{bl({k:'m',x:rnd(B.x,B.x+B.w+90),y:B.y-14,vx:-1.8*SP,vy:3.3*SP,r:5,col:'#6ef',life:4})});ev(s,'z',1.6,dt,()=>{zn(cl(so.x-16,B.x,B.x+B.w-32),B.y,32,B.h,.7,.15)})}},
/* Jevil / Spamton / Roaring Knight */
jevil:{d:8,b:[260,190],f(dt,s){s.T=(s.T||0)+dt;if(!s.in){s.in=1;s.th=0;s.arr=[];for(let i=0;i<12;i++)s.arr.push(bl({k:'d',r:7,col:'#c4f',life:9,warn:.3}))}
 s.th+=dt*(1.3+SP*.4)*(s.T>4?-1:1);const ox=cx()+Math.sin(s.T*1.4)*50,oy=cy()+Math.sin(s.T*2.8)*26;s.arr.forEach((b,i)=>{const a=s.th+i/12*PI2,R=58+Math.sin(s.T*2+i)*10;b.x=ox+Math.cos(a)*R;b.y=oy+Math.sin(a)*R});
 ev(s,'a',.7,dt,()=>{bl({k:'c',r:6,col:'#f55',x:rnd(B.x,B.x+B.w),y:B.y-10,vy:2.5*SP,life:4})})}},
knife:{d:8,b:[260,200],f(dt,s){s.T=(s.T||0)+dt;if(!s.in){s.in=1;s.th=rnd(0,PI2);s.bs=[ln(0,0,0,0,9,.9,7,'#fcf'),ln(0,0,0,0,9,.9,7,'#fcf')]}
 s.th+=dt*(.9+SP*.5)*(Math.sin(s.T*.9)>=0?1:-1);const R=Math.hypot(B.w,B.h)/2+20;s.bs.forEach((b,i)=>{const a=s.th+i*Math.PI;b.x1=cx();b.y1=cy();b.x2=cx()+Math.cos(a)*R;b.y2=cy()+Math.sin(a)*R});
 ev(s,'a',1.1,dt,()=>{const a=rnd(0,PI2);bl({k:'d',r:6,col:'#fd6',x:cx()+Math.cos(a)*120,y:cy()+Math.sin(a)*100,vx:-Math.cos(a)*2*SP,vy:-Math.sin(a)*2*SP,life:3})})}},
pipis:{d:9,b:[270,190],f(dt,s){const mk=()=>bl({k:'c',r:9,col:'#ff5',x:rnd(B.x+20,B.x+B.w-20),y:B.y+14,vx:rnd(-2.4,2.4)*SP,vy:rnd(.5,2),life:12,u:bounce});if(!s.in){s.in=1;for(let i=0;i<4;i++)mk()}ev(s,'a',2,dt,n=>{if(n<4)mk()})}},
knight:{d:8.5,b:[300,200],f(dt,s){ev(s,'a',1.4,dt,n=>{const k=2+(n%2)+up;for(let i=0;i<k;i++){let x1,y1,x2,y2;if(Math.random()<.5){x1=B.x-20;y1=B.y+rnd(0,B.h);x2=B.x+B.w+20;y2=B.y+rnd(0,B.h)}else{x1=B.x+rnd(0,B.w);y1=B.y-20;x2=B.x+rnd(0,B.w);y2=B.y+B.h+20}ln(x1,y1,x2,y2,10,.8+i*.22,.16,'#fff')}snd(200,.1,'square',.03)})}},
/* Asriel */
star:{d:9,b:[250,170],f(dt,s){ev(s,'a',.55,dt,n=>{if(n>10)return;const big=n==10,ty=B.y+rnd(20,50);bl({k:'s',x:B.x+B.w+20,y:B.y-30,vx:-3.4,vy:3.8,r:big?13:8,col:'#fff',life:5,u:b=>{if(b.y>=ty){b.life=0;ring(b.x,b.y,big?22:9,big?1.9:1.5,big?5.5:4.5,'#ff8',up?{u:(q,d)=>{const c=Math.cos(.02*d*60),sn=Math.sin(.02*d*60),x=q.vx;q.vx=x*c-q.vy*sn;q.vy=x*sn+q.vy*c}}:null);snd(500,.1,'triangle',.03)}}})})}},

 else if(b.k=='d'){X.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);X.fillStyle=b.col;X.beginPath();X.moveTo(0,-b.r*1.6);X.lineTo(b.r,0);X.lineTo(0,b.r*1.6);X.lineTo(-b.r,0);X.fill()}
 else if(b.k=='sp'){X.rotate(Math.atan2(b.vy,b.vx)+Math.PI/2);X.fillStyle=b.col;X.beginPath();X.moveTo(0,-b.r*2);X.lineTo(b.r*.9,b.r);X.lineTo(0,b.r*.4);X.lineTo(-b.r*.9,b.r);X.fill();X.fillRect(-1.5,b.r*.4,3,b.r*2)}
 else if(b.k=='b'){X.fillStyle=b.col;X.fillRect(-b.w/2,-b.h/2,b.w,b.h);const v=b.h>=b.w,e=(v?b.h:b.w)/2,c=(v?b.w:b.h)*.78;X.beginPath();if(v){X.arc(0,-e,c,0,PI2);X.arc(0,e,c,0,PI2)}else{X.arc(-e,0,c,0,PI2);X.arc(e,0,c,0,PI2)}X.fill()}
 else if(b.k=='m'){const a=Math.atan2(b.vy,b.vx);X.strokeStyle='rgba(255,230,150,.5)';X.lineWidth=b.r;X.beginPath();X.moveTo(0,0);X.lineTo(-Math.cos(a)*22,-Math.sin(a)*22);X.stroke();X.fillStyle=b.col;X.beginPath();X.arc(0,0,b.r,0,PI2);X.fill()}
 else{X.fillStyle=b.col;X.beginPath();X.arc(0,0,b.r,0,PI2);X.fill()}
 X.restore()}
function skull(x,y,rot){X.save();X.translate(x,y);X.rotate(rot);X.fillStyle='#eee';X.beginPath();X.ellipse(0,0,20,15,0,0,PI2);X.fill();X.fillStyle='#bbb';X.fillRect(8,-9,14,18);X.fillStyle='#000';X.beginPath();X.ellipse(-4,-6,5,4,0,0,PI2);X.fill();X.beginPath();X.ellipse(-4,6,5,4,0,0,PI2);X.fill();X.restore()}

 if(T0>2.2){X.strokeStyle='rgba(180,100,255,.5)';X.lineWidth=2;for(let i=0;i<14;i++){const an=i/14*PI2+t*3;X.beginPath();for(let r=300;r>0;r-=20)X.lineTo(320+Math.cos(an+r*.01)*r,150+Math.sin(an+r*.01)*r*.9);X.stroke()}}X.restore()}

 for(let i=0;i<6;i++){const iw=w*(1-i*.17);X.strokeStyle=i%2?'#000':'#fff';X.lineWidth=3;X.strokeRect(cx()-iw/2,y,iw,h)}X.strokeStyle='#000';X.lineWidth=4;X.beginPath();X.moveTo(cx(),y);X.lineTo(cx(),y+h);X.stroke()}

  txt('PRESS ENTER OR CLICK',W/2,448,11,Math.floor(performance.now()/500)%2?'#fff':'#f33');if(best)txt('BEST: WON IN '+best+' TURNS',W/2,468,7,'#666');return}
 drawBoss();
 if(!bossGone){txt('RANDOMZ',20,24,9,'#f55','left');X.fillStyle='#300';X.fillRect(120,12,500,14);X.fillStyle=PC[phase];X.fillRect(120,12,500*Math.max(0,bossShow/BMAX),14);X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(120,12,500,14);txt(Math.ceil(Math.max(0,bossShow)).toLocaleString(),W-20,44,8,'#aaa','right')}
 if(hitFx&&st=='slash'){X.strokeStyle='#fff';X.lineWidth=5;const p=hitFx.t/.6;for(let i=0;i<3;i++){X.beginPath();X.moveTo(260+i*20,40+p*10);X.lineTo(250+i*20+p*110,40+p*160);X.stroke()}}
 if(dmgNum){X.globalAlpha=Math.min(1,dmgNum.t);if(typeof dmgNum.v=='number'){X.fillStyle='#600';X.fillRect(200,215,240,12);X.fillStyle='#0c0';X.fillRect(200,215,240*Math.max(0,bossShow/BMAX),12)}txt(typeof dmgNum.v=='number'?dmgNum.v.toLocaleString():dmgNum.v,320,200-(1.8-dmgNum.t)*8,18,dmgNum.c);X.globalAlpha=1}
 X.fillStyle='#000';X.fillRect(B.x,B.y,B.w,B.h);
 if(atk&&atk.k=='goner')drawGoner();
 if(mode=='purple'&&st=='atk'){const n=atk.lanes||3;X.strokeStyle='#b4f';X.lineWidth=2;for(let i=0;i<n;i++){const y=B.y+B.h*(i+1)/(n+1);X.beginPath();X.moveTo(B.x,y);X.lineTo(B.x+B.w,y);X.stroke()}}

 if(atk&&atk.s.hl)[atk.s.hl,atk.s.hr].forEach(h=>{if(!h)return;X.fillStyle='#ddd';X.beginPath();X.arc(h.x,h.y,12,0,PI2);X.fill();X.fillRect(h.x-5,h.y-20,10,12)});
 X.strokeStyle=mode=='blue'?'#4af':mode=='green'?'#0f0':mode=='purple'?'#b4f':'#fff';X.lineWidth=4;X.strokeRect(B.x-2,B.y-2,B.w+4,B.h+4);
 if((st=='menu'||st=='talk')&&msgFull){msgFull.slice(0,msgI|0).split('\n').forEach((l,i)=>txt(l,B.x+20,B.y+34+i*26,11,'#fff','left'))}
 if(st=='sub'){sub.forEach((n,i)=>{const col=mi==2?i>>2:0,row=mi==2?i&3:i,x=B.x+50+col*270,y=B.y+30+row*22;txt('* '+n,x,y,10,i==si?'#ff0':'#fff','left');if(i==si)heart(x-22,y-4,12,'#f33')})}
 if(st=='bar'||st=='slash'){drawTarget();const bx=st=='bar'?B.x+8+barX:hitFx.bx,f=Math.floor(performance.now()/60)%2;X.fillStyle=f?'#fff':'#000';X.fillRect(bx-5,B.y+2,10,B.h-4);X.strokeStyle=f?'#000':'#fff';X.lineWidth=2;X.strokeRect(bx-5,B.y+2,10,B.h-4)}
 if(st=='atk'){X.save();if(inv>0&&Math.floor(inv*14)%2==0)X.globalAlpha=.35;heart(so.x,so.y,15,HC[mode]);if(mode=='green'){const d=DIR[sh];X.strokeStyle='#0f0';X.lineWidth=4;X.beginPath();X.arc(so.x+d[0]*26,so.y+d[1]*26,14,0,PI2);X.stroke()}X.restore()}
 ps.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.l-=dt;X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.fillRect(p.x-1.5,p.y-1.5,3,3)});ps=ps.filter(p=>p.l>0);X.globalAlpha=1;
 if(flash>0){X.fillStyle='rgba(255,40,40,'+flash*.5+')';X.fillRect(-20,-20,W+40,H+40);flash-=dt*1.8}
 txt('FRISK   LV 1',30,422,10,'#fff','left');txt('HP',250,422,8,'#fff','left');const hw=maxhp*1.5;X.fillStyle='#a00';X.fillRect(276,408,hw,18);X.fillStyle='#ff0';X.fillRect(276,408,hw*Math.max(0,hp)/maxhp,18);txt(Math.ceil(hp)+' / '+maxhp,276+hw+14,422,9,gonerHit?'#b4f':'#fff','left');
 ['FIGHT','ACT','ITEM','MERCY'].forEach((n,i)=>{const x=24+i*150,sel=mi==i&&(st=='menu'||st=='sub'||st=='bar'||st=='slash'),c=sel?'#ff0':'#f80';X.strokeStyle=c;X.lineWidth=3;X.strokeRect(x,436,130,34);txt(n,x+75,458,10,c);if(mi==i&&st=='menu')heart(x+16,454,13,'#f33')});
 if(st=='over'){X.fillStyle='rgba(0,0,0,.8)';X.fillRect(0,0,W,H);txt('GAME OVER',W/2,180,26,'#f00');txt('* You cannot give up just yet...',W/2,250,9,'#aaa');txt('Randomz HP: '+Math.ceil(bossHP).toLocaleString(),W/2,290,9,'#ff0');txt('PRESS ENTER OR CLICK',W/2,400,11,Math.floor(performance.now()/500)%2?'#fff':'#f33')}
 if(st=='win'){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,W,H);txt('* YOU WON! *',W/2,170,24,'#ff0');txt('The rift sealed itself in '+turn+' turns.',W/2,230,10,'#fff');txt('Times hit: '+hits+'   You earned 0 EXP.',W/2,260,9,'#aaa');txt('PRESS ENTER OR CLICK TO PLAY AGAIN',W/2,400,10,Math.floor(performance.now()/500)%2?'#fff':'#f33')}
 X.fillStyle='rgba(0,0,0,.1)';for(let y=0;y<H;y+=3)X.fillRect(0,y,W,1)}
let last;function loop(ts){const dt=Math.min((ts-(last||ts))/1e3,.033);last=ts;try{if(st!='title')upd(dt);draw(dt)}catch(e){console.error(e);if(atk){atk=null;bullets=[];mode='red';if(st=='atk'){st='menu';T.w=580;T.h=110;T.cy=335}}}requestAnimationFrame(loop)}

function press(k){const ok=k=='z'||k=='enter'||k==' ',no=k=='x'||k=='shift'||k=='escape';if(k=='m')mute=!mute;
 if(st=='title'||st=='over'||st=='win'){if(ok)startGame();return}
 if(st=='talk'){if(ok)tkT=Math.min(tkT,.25);return}
 if(st=='menu'){if(k=='arrowleft'||k=='a')mi=(mi+3)%4;if(k=='arrowright'||k=='d')mi=(mi+1)%4;if(ok)openSub()}
 else if(st=='sub'){const n=sub.length;if(no){st='menu';return}if(mi==2){if(k=='arrowdown'||k=='s'){if((si&3)<3&&si+1<n)si++}if(k=='arrowup'||k=='w'){if(si&3)si--}if(k=='arrowright'||k=='d'){if(si+4<n)si+=4}if(k=='arrowleft'||k=='a'){if(si>=4)si-=4}}
  else{if(k=='arrowdown'||k=='s')si=(si+1)%n;if(k=='arrowup'||k=='w')si=(si+n-1)%n}if(ok)chooseSub()}
 else if(st=='bar'){if(ok)stopBar()}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!e.repeat)press(k)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
C.addEventListener('pointerdown',e=>{const p=pos(e);pdown=true;pp={lx:e.clientX,ly:e.clientY,dx:0,dy:0};

 else if(st=='sub'){const col=mi==2?Math.floor((p.x-B.x-30)/270):0,row=Math.floor((p.y-B.y-14)/22),i=mi==2?col*4+row:row;if(i>=0&&i<sub.length&&row>=0){si=i;press('z')}else st='menu'}
 else if(st!='atk')press('z')});
C.addEventListener('pointermove',e=>{if(pdown&&pp){const k=W/C.getBoundingClientRect().width;pp.dx+=(e.clientX-pp.lx)*k;pp.dy+=(e.clientY-pp.ly)*k;pp.lx=e.clientX;pp.ly=e.clientY}});
addEventListener('pointerup',()=>{pdown=false;pp=null});
hp=maxhp;bossHP=bossShow=BMAX;requestAnimationFrame(loop);
