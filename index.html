function orb(x,y,vx,vy,r,sty,o={}){return add(Object.assign({k:'o',x,y,vx,vy,r,sty,life:8,rot:0,spin:0,draw:drawOrb,

 else if(s=='wasp'){g.rotate(h.a);const f=Math.sin(h.t*45);g.fillStyle='#ffd0f0';g.globalAlpha=al*.7;g.beginPath();g.ellipse(-3,-7,9,3+f*3,.5,0,TAU);g.fill();g.beginPath();g.ellipse(-3,7,9,3+f*3,-.5,0,TAU);g.fill();g.globalAlpha=al;g.fillStyle='#a3203a';g.beginPath();g.ellipse(0,0,11,5.5,0,0,TAU);g.fill();g.fillStyle='#ffd84a';g.fillRect(-4,-5,3,10);g.fillRect(2,-5,3,10);g.fillStyle='#fff';g.beginPath();g.moveTo(11,-2);g.lineTo(19,0);g.lineTo(11,2);g.fill()}

 g.restore()}

 if(side<2){const ey=side==0?y+h:y,dy=side==0?13:-13;for(let i=x+6;i<x+w-6;i+=18){g.beginPath();g.moveTo(i,ey);g.lineTo(i+9,ey+dy);g.lineTo(i+18,ey);g.fill()}}
 else{const ex=side==2?x+w:x,dx=side==2?13:-13;for(let i=y+6;i<y+h-6;i+=18){g.beginPath();g.moveTo(ex,i);g.lineTo(ex+dx,i+9);g.lineTo(ex,i+18);g.fill()}}}
function maw(vert,gap,gc){add({k:'mw',vert,gap,gc,warn:.9,life:1.9,dmg:12,

 hit(px,py,h){const p=h.p(h);if(p<.6)return false;if(h.vert){const a=h.gc-h.gap/2-box.y,b=box.y+box.h-h.gc-h.gap/2;return py<box.y+a*p+8||py>box.y+box.h-b*p-8}const a=h.gc-h.gap/2-box.x,b=box.x+box.w-h.gc-h.gap/2;return px<box.x+a*p+8||px>box.x+box.w-b*p-8},

function cannon(cx,cy,warn,fire,o={}){add(Object.assign({k:'cn',cx,cy,warn,fire,life:warn+fire+.5,w:30,fw:0,fired:0,sweep:0,ang:o.ang0!=null?o.ang0:Math.atan2(pl.y-cy,pl.x-cx),
 upd(h,dt){if(h.ang0==null&&h.t<h.warn-.35){const a=Math.atan2(pl.y-h.cy,pl.x-h.cx);let d=a-h.ang;d=Math.atan2(Math.sin(d),Math.cos(d));h.ang+=d*Math.min(1,dt*5)}
  const lt=h.t-h.warn;if(lt>=0&&lt<h.fire){if(!h.fired){h.fired=1;shake=.2;puff(h.cx+Math.cos(h.ang)*44,h.cy+Math.sin(h.ang)*44,14,'#fff',160);beep(120,.25,'sawtooth',.07)}h.ang+=h.sweep*dt;h.fw=Math.min(1,lt/.07)*Math.min(1,(h.fire-lt)/.12)}else h.fw=0},
 hit:(px,py,h)=>h.fw>.3&&segDist(px,py,h.cx,h.cy,h.cx+Math.cos(h.ang)*1300,h.cy+Math.sin(h.ang)*1300)<h.w*h.fw/2+3,

  g.rotate(h.ang);
  if(lt<0){const lk=h.t>h.warn-.35;g.globalAlpha=(lk?.95:.35)*(.6+.4*Math.sin(h.t*25));g.strokeStyle='#ff5a5a';g.lineWidth=lk?3:1;g.setLineDash([10,8]);g.beginPath();g.moveTo(50,0);g.lineTo(1300,0);g.stroke();g.setLineDash([]);g.globalAlpha=1}
  const rc=lt>=0&&lt<.25?(1-lt/.25)*8:0;g.translate(-rc,0);

function pend(px,py,L,amp,w,ph,warn){add({k:'pd',px,py,L,amp,w,ph,warn,a:0,life:11.5,dmg:10,

function slam(d){pl.gx=d==1?1:d==3?-1:0;pl.gy=d==2?1:d==0?-1:0;pl.vg=(pl.gy||pl.gx)*460;flash=.35;shake=.3;slamFx={t:.6,dir:d,warn:0};beep(80,.3,'sawtooth',.09)}

const NORMAL=8;
function pickNext(){const low=bHP/bMax<.35;nextIdx=low?(turn%2==0?NORMAL:Math.floor(rnd(0,NORMAL))):turn%NORMAL}

// ===== flow =====
function hurt(d,x,y){if(hitI>0||st!='attack')return;if(shield){shield=false;hitI=1;puff(x,y,12,'#9ef',100);beep(900,.15,'sine');return}
 pHP-=d;hitI=1;shake=.25;puff(x,y,14,'#ff2a2a',120);beep(90,.15,'sawtooth',.08);
 if(pHP<=0){pHP=0;hz=[];mirror=false;well=null;boxT={...MENU};st='result';setMsg('* JUDGEMENT: DENIED.\n* Your soul shatters... then reforms. Try again.',reset)}}
function reset(){pHP=pMax;bHP=bMax;mercy=0;turn=0;inv={pie:2,tea:3,glass:1};shield=false;hardMul=1;mulNow=1;ending=false;bossA=1;actUse={};hz=[];pt=[];mirror=false;well=null;mode('red');sub=null;sel=0;say='';boxT={...MENU};st='menu';pickNext();setMsg('* OMEGA-9, THE ARBITER, descends.\n* The air itself feels judged.')}
function bossTurn(line){atk=A[nextIdx];atkS={};atkT=0;hz=[];pt=[];mulNow=hardMul;hardMul=1;pl.sh=0;boxT=bx(240);atk.init(atkS);centerPl();hitI=.7;st='attack';bnr={t:2.4,txt:'[ '+atk.n+' ]'};bossSay(line?line+'\n'+atk.say:atk.say,3.4)}
function flavor(){if(mercy>=100)return '* The Arbiter lowers his rings. He is... measuring you.\n* (You can SPARE him now.)';if(bHP/bMax<.35)return '* The Arbiter burns white. The final protocol is armed.';
 return['* The rings turn. Nothing else moves.','* OMEGA-9 watches you. His eye never blinks.','* Data scrolls across the void behind him.','* A verdict is being calculated.'][turn%4]}
function endAttack(){hz=[];mirror=false;well=null;mode('red');turn++;mulNow=1;st='menu';sub=null;boxT={...MENU};pickNext();setMsg(flavor())}
const gain=n=>{mercy=clamp(mercy+n,0,100)};
const ACTS=[
['Check',()=>setMsg('* OMEGA-9 // THE ARBITER — ATK 99  DEF 99\n* Eight verdicts, then a ninth. Spears, plasma, jaws, cannons, gravity, mirrors, a black hole, seekers.\n* He respects those who endure.',()=>bossTurn())],
['Analyze',()=>{const u=actUse.an=(actUse.an||0)+1;gain(u<3?10:4);setMsg('* NEXT: '+A[nextIdx].n+'\n* '+A[nextIdx].tip,()=>bossTurn('Study me. It changes nothing.'))}],
['Salute',()=>{const u=actUse.sa=(actUse.sa||0)+1;gain(u==1?20:8);setMsg(u==1?'* You salute the Arbiter. His eye narrows.':'* You salute again. He does not react. Almost.',()=>bossTurn(u==1?'...Acknowledged.':'Enough ceremony.'))}],
['Stand Firm',()=>{const u=actUse.sf=(actUse.sf||0)+1;gain(u==1?15:10);pHP=Math.min(pMax,pHP+6);setMsg('* You steady your soul.\n* HP +6.',()=>bossTurn('Resolve. Noted.'))}],
['Provoke',()=>{const u=actUse.pv=(actUse.pv||0)+1;gain(u==1?25:10);hardMul=1.25;setMsg('* You taunt the Arbiter.\n* His next verdict will be FASTER.',()=>bossTurn('INSOLENCE.'))}]
];
const ITEMS=[['pie','Repair Kit','+30 HP'],['tea','Nano Cells','+15 HP'],['glass','Phase Shield','blocks 1 hit']];
const itemsList=()=>ITEMS.filter(i=>inv[i[0]]>0);
function useItem(k){inv[k]--;let t;if(k=='pie'){pHP=Math.min(pMax,pHP+30);t='* You use the Repair Kit.\n* HP +30.'}else if(k=='tea'){pHP=Math.min(pMax,pHP+15);t='* Nano Cells knit your soul together.\n* HP +15.'}else{shield=true;t='* A Phase Shield wraps your soul.\n* It will absorb one hit.'}
 sub=null;st='result';setMsg(t,()=>bossTurn())}
const KILL=['* The Arbiter fractures.',"* 'Impossible. Calculation... failed.'",'* The rings fall silent, one by one.','* Judgement complete. You are still standing.','THE END — Annihilation\n(Try sparing him.)'];
const SPARE=['* You offer mercy.','* The Arbiter\'s eye narrows. Measuring.',"* 'You endured every verdict. My calculation... was incomplete.'","* 'Judgement withheld. Go.'",'* The rings dim and fold away into the dark.','THE END — Judgement Withheld\nYou spared the hardest boss.'];
function endSeq(L,i=0){ending=true;st='result';boxT={...MENU};setMsg(L[i],()=>i+1<L.length?endSeq(L,i+1):(ending=false,st='title'))}
function listFor(){if(sub==1)return ACTS.map(a=>a[0]);if(sub==2){const L=itemsList();return L.length?L.map(i=>i[1]+' x'+inv[i[0]]+'   '+i[2]):['(empty)']}return['Spare','Flee']}
function choose(){
 if(sub==1){sub=null;st='result';ACTS[ssel][1]()}
 else if(sub==2){const l=itemsList();if(l.length)useItem(l[ssel][0])}
 else if(ssel==0){sub=null;if(mercy>=100)endSeq(SPARE);else{st='result';setMsg("* You offer mercy.\n* The Arbiter does not accept. 'Prove yourself first.'",()=>bossTurn('Not yet.'))}}
 else{sub=null;st='result';setMsg('* You try to leave. There is no exit from judgement.',()=>bossTurn('Run. See where it gets you.'))}}

// ===== update =====
function movePlayer(dt){
 const L=K('ArrowLeft','KeyA'),R=K('ArrowRight','KeyD'),U=K('ArrowUp','KeyW'),D=K('ArrowDown','KeyS'),sp=K('ShiftLeft','ShiftRight')?75:175;
 const dx=(R?1:0)-(L?1:0),dy=(D?1:0)-(U?1:0);pl.mv=0;
 if(pl.mode=='green'){pl.x=bc();pl.y=bcy();if(P('ArrowUp','KeyW'))pl.sh=0;if(P('ArrowRight','KeyD'))pl.sh=1;if(P('ArrowDown','KeyS'))pl.sh=2;if(P('ArrowLeft','KeyA'))pl.sh=3;return}
 if(pl.mode=='blue'){const sg=pl.gy||pl.gx,vert=pl.gy!=0,lo=(vert?box.y:box.x)+10,hi=(vert?box.y+box.h:box.x+box.w)-10,lat=vert?dx:dy;
  if(vert)pl.x+=lat*sp*dt;else pl.y+=lat*sp*dt;let ax=vert?pl.y:pl.x;
  const fl=sg>0?hi:lo,gr=Math.abs(ax-fl)<1.5,jk=vert?(sg>0?U:D):(sg>0?L:R);
  if(gr&&jk){pl.vg=-sg*350;beep(700,.05)}if(!jk&&pl.vg*sg<0&&Math.abs(pl.vg)>130)pl.vg=-sg*130;
  pl.vg+=sg*950*dt;ax+=pl.vg*dt;
  if(sg>0&&ax>=hi){ax=hi;pl.vg=0}if(sg<0&&ax<=lo){ax=lo;pl.vg=0}if(sg>0&&ax<=lo){ax=lo;pl.vg=Math.max(pl.vg,0)}if(sg<0&&ax>=hi){ax=hi;pl.vg=Math.min(pl.vg,0)}
  if(vert)pl.y=ax;else pl.x=ax;pl.mv=(lat!=0||Math.abs(pl.vg)>8)?1:0}
 else{let mx=dx,my=dy;if(mx&&my){mx*=.707;my*=.707}pl.x+=mx*sp*dt;pl.y+=my*sp*dt;pl.mv=(dx||dy)?1:0}
 if(well){const ddx=well.x-pl.x,ddy=well.y-pl.y,d=Math.hypot(ddx,ddy)||1,f=well.s*(1.3-clamp(d/280,0,1));pl.x+=ddx/d*f*dt;pl.y+=ddy/d*f*dt}
 pl.x=clamp(pl.x,box.x+10,box.x+box.w-10);pl.y=clamp(pl.y,box.y+10,box.y+box.h-10)}
function update(dt){
 sayT-=dt;shake-=dt;bossHit-=dt;hitI-=dt;flash-=dt;shFlash-=dt;bnr.t-=dt;slamFx.warn-=dt;slamFx.t-=dt;if(ending&&bossA>0)bossA=Math.max(0,bossA-dt*.15);
 handUp+=((st=='attack'?1:0)-handUp)*Math.min(1,dt*6);
 for(const p of pt){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}pt=pt.filter(p=>p.t<p.l);
 for(const k of['x','y','w','h'])box[k]+=(boxT[k]-box[k])*Math.min(1,dt*10);
 if(msgI<msg.length)msgI+=dt*40;
 if(st=='title'){if(P('KeyZ','Enter')){beep(600);reset()}}
 else if(st=='result'){if(P('KeyZ','Enter')){if(msgI<msg.length)msgI=msg.length;else if(msgCb){const c=msgCb;msgCb=null;c()}}}
 else if(st=='menu'){
  if(sub==null){if(P('ArrowLeft','KeyA'))sel=(sel+3)%4;if(P('ArrowRight','KeyD'))sel=(sel+1)%4;if(P('KeyZ','Enter')){beep(500);if(sel==0){st='fight';fb={c:box.x+20}}else{sub=sel;ssel=0}}}
  else{const n=listFor().length;if(P('ArrowUp','KeyW'))ssel=(ssel+n-1)%n;if(P('ArrowDown','KeyS'))ssel=(ssel+1)%n;if(P('KeyX','Escape'))sub=null;else if(P('KeyZ','Enter')){beep(500);choose()}}}
 else if(st=='fight'){
  fb.c+=520*dt;const mid=box.x+box.w/2,half=(box.w-40)/2;
  if(P('KeyZ','Enter')){const d=1-Math.abs(fb.c-mid)/half,dmg=Math.round(30+d*d*170);bHP-=dmg;bossHit=.6;gain(-20);puff(400,150,18,'#ffd84a',150);beep(160,.2,'sawtooth',.08);st='result';
   if(bHP<=0){bHP=0;endSeq(KILL)}else setMsg('* You strike for '+dmg+' damage.'+(d>.85?' CRIT!':'')+'\n* His respect for you drops.',()=>bossTurn('Violence. Predictable.'))}
  else if(fb.c>box.x+box.w-20){st='result';setMsg('* You missed.',()=>bossTurn('Pathetic.'))}}
 else if(st=='attack'){
  atkT+=dt;movePlayer(dt);atk.tick(atkS,dt*mulNow,atkT);
  for(const h of hz){if(st!='attack')break;h.t+=dt;if(h.upd)h.upd(h,dt);if(h.t>h.life)h.dead=1;
   if(!h.dead&&h.hit&&ruleOK(h))for(const p of hearts())if(h.hit(p.x,p.y,h)){hurt(h.dmg,p.x,p.y);break}}
  hz=hz.filter(h=>!h.dead);
  if(st=='attack'&&atkT>=atk.d)endAttack()}
 for(const k in press)delete press[k]}

// ===== drawing =====
function lines(t,mw){const o=[];for(const p of t.split('\n')){let l='';for(const w of p.split(' ')){const tl=l?l+' '+w:w;if(g.measureText(tl).width>mw&&l){o.push(l);l=w}else l=tl}o.push(l)}return o}
function heart(x,y,s,c){g.fillStyle=c;g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.3,x,y-s*.4);g.bezierCurveTo(x+s*.7,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);g.fill()}
function bar(x,y,w,h,f,c,b){g.fillStyle=b;g.fillRect(x,y,w,h);g.fillStyle=c;g.fillRect(x,y,w*clamp(f,0,1),h)}
function drawBoss(){
 const t=performance.now()/1000,bob=Math.sin(t*1.4)*7,sh=bossHit>0?rnd(-8,8):0,r=bHP/bMax,ph=r<.35?2:r<.7?1:0,col=['#ff3b3b','#ff7a2e','#fff2c0'][ph];
 g.save();g.globalAlpha=bossA;g.translate(400+sh,150+bob);
 let gr=g.createRadialGradient(0,0,20,0,0,230);gr.addColorStop(0,col+(handUp>.5?'66':'33'));gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fillRect(-240,-230,480,460);
 g.strokeStyle='#3a2a55';g.lineWidth=5;for(let i=-4;i<=4;i++){g.beginPath();g.moveTo(i*14,40);g.bezierCurveTo(i*24+Math.sin(t*2+i)*14,70,i*34-Math.cos(t*1.7+i)*16,95,i*40+Math.sin(t*2.3+i)*12,120);g.stroke()}
 for(const s of[-1,1]){g.save();g.scale(s,1);for(let i=0;i<4;i++){g.save();g.translate(34,-8+i*6);g.rotate(-.35-i*.42-handUp*.25+Math.sin(t*2+i)*.04);const L=150+(i%2)*25-i*8;g.fillStyle=i%2?'#2a1f45':'#1d1530';g.beginPath();g.moveTo(0,-9);g.lineTo(L,-2);g.lineTo(L+18,0);g.lineTo(L,3);g.lineTo(0,10);g.fill();g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.moveTo(6,-6);g.lineTo(L,-1);g.stroke();g.restore()}g.restore()}
 for(let i=0;i<3;i++){g.save();g.rotate(t*(.6+i*.35)*(i%2?-1:1));g.scale(1,.28+i*.12);g.strokeStyle=i==1?col:'#7a5cc4';g.lineWidth=3;g.setLineDash([22,9]);g.beginPath();g.arc(0,0,92+i*26,0,TAU);g.stroke();g.setLineDash([]);g.restore()}
 g.fillStyle='#cfc3ff';for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*18-8,-52);g.lineTo(i*18,-98+Math.abs(i)*10-handUp*8);g.lineTo(i*18+8,-52);g.fill()}
