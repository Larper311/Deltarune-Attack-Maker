<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MORROW — THE HOLLOW KING</title>
<style>
html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{width:min(100vw,calc(100vh*4/3));height:auto;image-rendering:pixelated;background:#000}
</style>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=640,H=480;
const keys={},press={};
addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(!keys[e.code])press[e.code]=1;keys[e.code]=1});
addEventListener('keyup',e=>keys[e.code]=0);
const K=(...a)=>a.some(k=>keys[k]),P=(...a)=>a.some(k=>press[k]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let ac;function beep(f,d=.08,t='square',v=.05){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain();o.type=t;o.frequency.value=f;n.gain.value=v;o.connect(n);n.connect(ac.destination);o.start();n.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

// ========== SPRITES ==========
const PAL={r:'#ff2a3a',w:'#fff',k:'#0a0612',y:'#ffd84a',p:'#ff5a9a',b:'#3a8aff',g:'#4aff7a',l:'#b08aff',o:'#ff8a2a',d:'#1a0a2e',c:'#8a2a2a'};
function mk(rows,s=3){const c=document.createElement('canvas');c.width=rows[0].length*s;c.height=rows.length*s;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i*s,j*s,s,s)}}));return c}
const SP={
 blade:mk(['..y..','.yyy.','yyyyy','..y..','..w..','..w..','..w..','..w..','..k..'],2),
 bigblade:mk(['...y...','..yyy..','.yyyyy.','yyyyyyy','..y.y..','..w.w..','..w.w..','..w.w..','..k.k..'],2),
 dagger:mk(['.y.','.y.','yyy','.w.','.w.','.k.'],2),
 crown:mk(['.y.y.y.','yyyyyyy','y.y.y.y','yyyyyyy'],2),
 skull:mk(['.wwwww.','wwwwwww','wkkwwkw','wwwwwww','.wwwww.','..wkw..'],2),
 star:mk(['..y..','.yyy.','yyyyy','.yyy.','..y..'],2),
 eye:mk(['.rrr.','.rwr.','.rrr.'],2)
};
function drawSp(c,x,y,rot=0,a=1,sc=1){g.save();g.globalAlpha=a;g.translate(Math.round(x),Math.round(y));g.rotate(rot);g.scale(sc,sc);g.drawImage(c,-c.width/2,-c.height/2);g.restore()}

// ========== STATE ==========
let st='title',pHP=48,pMax=48,bHP=900,bMax=900,mercy=0,turn=0,inv={},shield=false,shorten=0,ending=false,bossA=1,flash=0;
const MENU={x:50,y:255,w:540,h:135};
let box={...MENU},boxT={...MENU},msg='',msgI=0,msgCb=null,say='',sayT=0,sel=0,sub=null,ssel=0,shake=0,bossHit=0,hitI=0,actUse={};
let pl={x:320,y:320,vy:0,blue:false},hz=[],trail=[],pt=[],atk=null,atkS={},atkT=0,fb={c:0};
let phase=1,bossPose=0,weaponAngle=0,eyeGlow=0,crack=0;

function setMsg(t,cb){msg=t;msgI=0;msgCb=cb||null}
function bossSay(t,d=2.8){say=t;sayT=d}
function reset(){
  pHP=pMax;bHP=bMax;mercy=0;turn=0;inv={pie:2,tea:3,glass:1};shield=false;shorten=0;ending=false;bossA=1;actUse={};
  hz=[];pt=[];pl.blue=false;sub=null;sel=0;say='';boxT={...MENU};st='menu';phase=1;bossPose=0;crack=0;
  setMsg('* The Hollow King rises.\n* The stage itself seems to fear him.')
}
const puff=(x,y,n,c,sp=100)=>{for(let i=0;i<n;i++){const a=rnd(0,6.3),s=rnd(.4,1)*sp;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,l:rnd(.25,.6),c})}};

// ========== HAZARDS ==========
function circ(x,y,vx,vy,r=6,o={}){hz.push(Object.assign({k:'c',t:0,x,y,vx,vy,r,dmg:7,delay:0,life:14,col:'#fff'},o))}
function beam(x1,y1,x2,y2,w,warn,on,o={}){hz.push(Object.assign({k:'l',t:0,x1,y1,x2,y2,w,warn,dmg:11,life:warn+on,col:'#ff2a3a'},o))}
function spot(x,y,r,warn,on){hz.push({k:'s',t:0,x,y,r,warn,on,dmg:12,life:warn+on})}
function slash(cx,cy,ang,len,w,warn,on){const x2=cx+Math.cos(ang)*len,y2=cy+Math.sin(ang)*len;beam(cx,cy,x2,y2,w,warn,on,{slash:1,col:'#ffd84a'})}
function ring(x,y,n,sp,spr=SP.star,off=0){puff(x,y,10,'#ffd84a',70);for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;circ(x,y,Math.cos(a)*sp,Math.sin(a)*sp,6,{sp:spr,spin:5,dmg:8})}}

// ========== UNIQUE ATTACKS ==========
const A = [
// 0 - Blade Storm (opening)
{d:10,say:'The first cut is always free.',
 init(){boxT={x:150,y:250,w:340,h:150};bossPose=1},
 tick(S,dt,t){
  S.r=(S.r||0)-dt;if(S.r<=0){S.r=t<5?.45:.28;
   const side=Math.random()<.5?-1:1;
   circ(side<0?box.x-20:box.x+box.w+20,pl.y+rnd(-40,40),side*280,0,7,{sp:SP.blade,face:1,dmg:9,spin:side*8});
  }
  if(t>4){S.s=(S.s||1)-dt;if(S.s<=0){S.s=1.3;slash(320,140,Math.atan2(pl.y-140,pl.x-320),220,18,.6,.35)}}
 }},

// 1 - Crown Guillotine (vertical + horizontal death lines)
{d:11,say:'Kneel.',
 init(){boxT={x:180,y:250,w:280,h:150};bossPose=2},
 tick(S,dt,t){
  S.v=(S.v||.8)-dt;if(S.v<=0){S.v=.9;
   const x=clamp(pl.x+rnd(-25,25),box.x+20,box.x+box.w-20);
   beam(x,box.y-20,x,box.y+box.h+20,28,.75,.4,{col:'#ff2a3a'});
  }
  if(t>3){S.h=(S.h||1.1)-dt;if(S.h<=0){S.h=1.0;
   const y=clamp(pl.y+rnd(-20,20),box.y+20,box.y+box.h-20);
   beam(box.x-20,y,box.x+box.w+20,y,24,.7,.35,{col:'#ffd84a'});
  }}
  if(t>7)boxT={x:220,y:250,w:200,h:140}
 }},

// 2 - Gravity Execution (blue + bouncing blades)
{d:12,say:'Fall.',
 init(){boxT={x:120,y:250,w:400,h:160};pl.blue=true;bossPose=1},
 tick(S,dt,t){
  S.a=(S.a||.7)-dt;if(S.a<=0){S.a=1.4;
   const d=Math.random()<.5?1:-1;
   for(let i=0;i<3;i++)circ((d>0?box.x-15:box.x+box.w+15)-d*i*35,box.y+box.h-20,190*d,-40,9,{sp:SP.bigblade,spin:-6*d,dmg:10});
  }
  S.b=(S.b||1)-dt;if(S.b<=0){S.b=.65;
   circ(rnd(box.x+20,box.x+box.w-20),box.y-30,0,0,8,{sp:SP.dagger,grav:580,dmg:8,spin:4});
  }
 }},

// 3 - Throne Collapse (shrinking + multi slash)
{d:11,say:'The throne rejects you.',
 init(){boxT={x:160,y:250,w:320,h:150};bossPose=2},
 tick(S,dt,t){
  if(t>1.5)boxT={x:200,y:250,w:240,h:140};
  if(t>5)boxT={x:240,y:250,w:160,h:130};
  if(t>8)boxT={x:260,y:250,w:120,h:120};
  S.s=(S.s||.9)-dt;if(S.s<=0){S.s=.85;
   const a=Math.atan2(pl.y-160,pl.x-320)+rnd(-.4,.4);
   slash(320,160,a,240,16,.55,.3);
  }
 }},

// 4 - Dual Wield Storm (two rotating weapon hands)
{d:13,say:'Two blades. One ending.',
 init(S){boxT={x:170,y:250,w:300,h:150};bossPose=3;
  // left weapon
  beam(0,0,0,0,10,1.2,99,{col:'#b08aff',hand:1,a:0,upd(h,dt){h.a+=1.1*dt;const cx=box.x+box.w/2,cy=box.y+box.h/2;h.x1=cx;h.y1=cy;h.x2=cx+Math.cos(h.a)*175;h.y2=cy+Math.sin(h.a)*175}});
  // right weapon
  beam(0,0,0,0,8,1.2,99,{col:'#ff2a3a',hand:1,a:Math.PI,upd(h,dt){h.a-=1.7*dt;const cx=box.x+box.w/2,cy=box.y+box.h/2;h.x1=cx;h.y1=cy;h.x2=cx+Math.cos(h.a)*150;h.y2=cy+Math.sin(h.a)*150}});
 },
 tick(S,dt,t){
  if(t>5&&!S.r){S.r=1;ring(320,170,12,130,SP.star)}
  if(t>9){S.k=(S.k||1.5)-dt;if(S.k<=0){S.k=1.6;ring(320,170,16,155,SP.dagger)}}
 }},

// 5 - Phantom Execution (ghost trail + targeted)
{d:11,say:'I remember every step you took.',
 init(){boxT={x:150,y:250,w:340,h:150};bossPose=1},
 tick(S,dt,t){
  S.e=(S.e||.8)-dt;if(S.e<=0){S.e=.5;
   const o=trail.find(q=>q.t>=t-1.5)||trail[0];
   if(o)hz.push({k:'g',x:o.x,y:o.y,t:0,life:1.0});
  }
  S.f=(S.f||1.1)-dt;if(S.f<=0){S.f=1.0;
   const a=Math.atan2(pl.y-160,pl.x-320);
   circ(320,160,Math.cos(a)*230,Math.sin(a)*230,7,{sp:SP.blade,face:1,dmg:10});
  }
 }},

// 6 - Judgment (bouncing + exploding)
{d:12,say:'Catch this.',
 init(){boxT={x:130,y:250,w:380,h:160};bossPose=2},
 tick(S,dt,t){
  S.j=(S.j||.6)-dt;if(S.j<=0){S.j=.9;
   circ(320+rnd(-80,80),150,rnd(-160,160),-140,11,{sp:SP.bigblade,spin:6,grav:700,life:10,dmg:9,
    upd(h,dt){const fl=box.y+box.h-16;if(h.y>fl&&h.vy>0){h.y=fl;h.vy=-h.vy*.85;puff(h.x,fl,6,'#ffd84a',50);beep(180,.04)}
     if(h.x<box.x+14){h.x=box.x+14;h.vx=Math.abs(h.vx)}if(h.x>box.x+box.w-14){h.x=box.x+box.w-14;h.vx=-Math.abs(h.vx)}}});
  }
  if(t>5){S.f=(S.f||1.8)-dt;if(S.f<=0){S.f=1.5;
   const a=Math.atan2(pl.y-160,pl.x-320);circ(320,160,Math.cos(a)*210,Math.sin(a)*210,6,{sp:SP.dagger,face:1,dmg:9})}}
 }},

// 7 - FINAL ACT (true killer)
{d:18,say:'THIS IS THE LAST PERFORMANCE.',
 init(){boxT={x:140,y:250,w:360,h:160};flash=.8;bossPose=3;phase=2},
 tick(S,dt,t){
  // continuous spiral
  S.s=(S.s||.12)-dt;if(S.s<=0){S.s=.1;for(let a=0;a<4;a++){const an=t*2.8+a*Math.PI/2;circ(320,155,Math.cos(an)*115,Math.sin(an)*115,5,{sp:SP.star,spin:6,dmg:8})}}
  // beams
  if(t>3){S.b=(S.b||1.3)-dt;if(S.b<=0){S.b=1.1;const x=clamp(pl.x+rnd(-35,35),box.x+15,box.x+box.w-15);beam(x,box.y-15,x,box.y+box.h+15,26,.7,.35)}}
  // rain
  if(t>6){S.r=(S.r||.5)-dt;if(S.r<=0){S.r=.4;circ(pl.x+rnd(-30,30),box.y-30,0,420,7,{sp:SP.blade,face:1,dmg:9,delay:.5})}}
  // dual weapons
  if(t>9&&!S.h){S.h=1;
   beam(0,0,0,0,9,1,99,{col:'#ff2a3a',hand:1,a:0,upd(h,dt){h.a+=1.8*dt;const cx=box.x+box.w/2,cy=box.y+box.h/2;h.x1=cx;h.y1=cy;h.x2=cx+Math.cos(h.a)*165;h.y2=cy+Math.sin(h.a)*165}});
   beam(0,0,0,0,7,1,99,{col:'#ffd84a',hand:1,a:Math.PI,upd(h,dt){h.a-=2.3*dt;const cx=box.x+box.w/2,cy=box.y+box.h/2;h.x1=cx;h.y1=cy;h.x2=cx+Math.cos(h.a)*140;h.y2=cy+Math.sin(h.a)*140}});
  }
  if(t>13){S.k=(S.k||1.4)-dt;if(S.k<=0){S.k=1.5;ring(320,160,18,160,SP.blade)}}
 }}
];
const NORMAL=A.length-1;

function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function hurt(d){if(hitI>0)return;if(shield){shield=false;hitI=.9;puff(pl.x,pl.y,14,'#9ef',110);beep(950,.12,'sine');return}
 pHP-=d;hitI=.9;shake=.3;puff(pl.x,pl.y,16,'#ff2a2a',140);beep(80,.18,'sawtooth',.09);
 if(pHP<=0){pHP=0;hz=[];pl.blue=false;boxT={...MENU};st='result';setMsg('* You fall.\n* The Hollow King does not stop the show.',reset)}}

function bossTurn(line){
 const low=bHP/bMax<.32;const i=low?(turn%2===0?NORMAL:Math.floor(rnd(0,NORMAL))):turn%NORMAL;
 atk=A[i];atkS={};atkT=0;hz=[];trail=[];pl.blue=false;boxT={x:180,y:250,w:280,h:150};atk.init(atkS);
 pl.x=boxT.x+boxT.w/2;pl.y=boxT.y+boxT.h/2;pl.vy=0;hitI=.5;st='attack';
 bossSay(line?line+'\n'+atk.say:atk.say,3.2)
}
function flavor(){
 if(mercy>=100)return '* The Hollow King lowers his blades.\n* He is waiting for the final decision.';
 if(bHP/bMax<.25)return '* The crown is shattered. He is still standing.';
 if(bHP/bMax<.5)return '* Blood (or something like it) drips from the blades.';
 return['* The air itself feels sharp.','* Morrow does not blink.','* Every movement is calculated.','* The stage lights burn colder.'][turn%4]
}
function endAttack(){hz=[];pl.blue=false;turn++;shorten=0;st='menu';sub=null;boxT={...MENU};bossPose=0;setMsg(flavor())}

// ========== MENU ==========
const gain=n=>{mercy=clamp(mercy+n,0,100)};
const ACTS=[
['Check',()=>setMsg('* MORROW — ATK 120  DEF 0\n* The Hollow King.\n* He has killed every challenger for three centuries.\n* He does not fight for the audience. He fights because he must.',()=>bossTurn())],
['Challenge',()=>{const u=actUse.ch=(actUse.ch||0)+1;gain(u===1?18:8);setMsg(u===1?'* You step forward without fear.\n* Morrow\'s eyes narrow.':'* You refuse to back down.',()=>bossTurn(u===1?'...Interesting.':'Still standing?'))}],
['Ask About Crown',()=>{const u=actUse.cr=(actUse.cr||0)+1;gain(u===1?22:9);setMsg(u===1?"* You ask about the crown.\n* For a moment the blades lower.":'* He grips the crown tighter.',()=>bossTurn(u===1?'It is not a gift. It is a sentence.':'It never comes off.'))}],
['Stand Firm',()=>{const u=actUse.st=(actUse.st||0)+1;gain(u<3?14:7);shorten=1;setMsg('* You plant your feet and refuse to move.\n* Morrow is forced to adjust.',()=>bossTurn('...Stubborn.'))}],
['Show No Fear',()=>{const u=actUse.nf=(actUse.nf||0)+1;gain(u===1?20:6);setMsg(u===1?'* You look him directly in the eyes.\n* Something cracks.':'* You do not look away.',()=>bossTurn(u===1?'...Do not look at me like that.':'Focus.'))}]
];
const ITEMS=[['pie','Cold Pie','+32 HP'],['tea','Warm Tea','+16 HP'],['glass','Glass Heart','blocks 1 hit']];
const itemsList=()=>ITEMS.filter(i=>inv[i[0]]>0);
function useItem(k){inv[k]--;let t;if(k==='pie'){pHP=Math.min(pMax,pHP+32);t='* You eat the Cold Pie.\n* HP +32.'}else if(k==='tea'){pHP=Math.min(pMax,pHP+16);t='* You drink the Warm Tea.\n* HP +16.'}else{shield=true;t='* You clutch the Glass Heart.\n* It will take one hit for you.'}
 sub=null;st='result';setMsg(t,()=>bossTurn())}
const KILL=['* The Hollow King falls to one knee.','* The blades clatter to the stage.','* "...So this is how the final act ends."','* He does not rise again.','THE END — You killed the Hollow King.'];
const SPARE=['* You lower your weapon.','* Morrow stares for a long time.','* He drops both blades.','* "Three hundred years... and you are the first."','* He removes the crown.','* "Go. The stage is yours now."','THE END — You spared the most dangerous boss.'];
function endSeq(L,i=0){ending=true;st='result';boxT={...MENU};setMsg(L[i],()=>i+1<L.length?endSeq(L,i+1):(ending=false,st='title'))}
function listFor(){if(sub===1)return ACTS.map(a=>a[0]);if(sub===2){const L=itemsList();return L.length?L.map(i=>i[1]+' x'+inv[i[0]]+'  '+i[2]):['(empty)']}return['Spare','Flee']}
function choose(){
 if(sub===1){sub=null;st='result';ACTS[ssel][1]()}
 else if(sub===2){const l=itemsList();if(l.length)useItem(l[ssel][0])}
 else if(ssel===0){sub=null;if(mercy>=100)endSeq(SPARE);else{st='result';setMsg("* You offer mercy.\n* Morrow does not accept it yet.",()=>bossTurn('Not yet.'))}}
 else{sub=null;st='result';setMsg('* There is no exit.',()=>bossTurn('The show continues.'))}
}
function startFight(){st='fight';fb={c:box.x+20}}

// ========== UPDATE ==========
function update(dt){
 sayT-=dt;shake-=dt;bossHit-=dt;hitI-=dt;flash-=dt;weaponAngle+=dt*1.8;eyeGlow+=dt;
 if(ending&&bossA>0)bossA=Math.max(0,bossA-dt*.12);
 for(const p of pt){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}pt=pt.filter(p=>p.t<p.l);
 for(const k of['x','y','w','h'])box[k]+=(boxT[k]-box[k])*Math.min(1,dt*9);
 if(msgI<msg.length)msgI+=dt*40;
 if(st==='title'){if(P('KeyZ','Enter')){beep(550);reset()}}
 else if(st==='result'){if(P('KeyZ','Enter')){if(msgI<msg.length)msgI=msg.length;else if(msgCb){const c=msgCb;msgCb=null;c()}}}
 else if(st==='menu'){
  if(sub==null){if(P('ArrowLeft','KeyA'))sel=(sel+3)%4;if(P('ArrowRight','KeyD'))sel=(sel+1)%4;if(P('KeyZ','Enter')){beep(480);if(sel===0)startFight();else{sub=sel;ssel=0}}}
  else{const n=listFor().length;if(P('ArrowUp','KeyW'))ssel=(ssel+n-1)%n;if(P('ArrowDown','KeyS'))ssel=(ssel+1)%n;if(P('KeyX','Escape'))sub=null;else if(P('KeyZ','Enter')){beep(480);choose()}}}
 else if(st==='fight'){
  fb.c+=440*dt;const mid=box.x+box.w/2,half=(box.w-40)/2;
  if(P('KeyZ','Enter')){const d=1-Math.abs(fb.c-mid)/half,dmg=Math.round(28+d*d*160);bHP-=dmg;bossHit=.65;gain(-22);puff(320,110,20,'#ffd84a',160);beep(140,.22,'sawtooth',.09);
   if(bHP/bMax<.5)crack=1;if(bHP/bMax<.25)crack=2;
   st='result';if(bHP<=0){bHP=0;endSeq(KILL)}else setMsg('* You strike for '+dmg+' damage.'+(d>.85?' CRITICAL.':'')+'\n* The blades flash.',()=>bossTurn('You will regret that.'))}
  else if(fb.c>box.x+box.w-20){st='result';setMsg('* Missed.',()=>bossTurn('Predictable.'))}
 }
 else if(st==='attack'){
  atkT+=dt;movePlayer(dt);trail.push({t:atkT,x:pl.x,y:pl.y});while(trail.length&&trail[0].t<atkT-3.2)trail.shift();
  atk.tick(atkS,dt,atkT);
  for(const h of hz){h.t+=dt;
   if(h.k==='c'){if(h.t<h.delay)continue;if(h.grav)h.vy+=h.grav*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.spin)h.rot=(h.rot||0)+h.spin*dt;if(h.upd)h.upd(h,dt);
    if(h.t>h.life||h.x<-50||h.x>W+50||h.y<-50||h.y>H+50)h.dead=1;
    if(st==='attack'&&Math.hypot(h.x-pl.x,h.y-pl.y)<h.r+5)hurt(h.dmg)}
   else if(h.k==='l'){if(h.upd)h.upd(h,dt);if(h.t>h.life)h.dead=1;else if(h.t>h.warn&&st==='attack'&&segDist(pl.x,pl.y,h.x1,h.y1,h.x2,h.y2)<h.w/2+5)hurt(h.dmg)}
   else if(h.k==='s'){if(h.t>h.life)h.dead=1;else if(h.t>h.warn&&st==='attack'&&Math.hypot(h.x-pl.x,h.y-pl.y)<h.r+4)hurt(h.dmg)}
   else if(h.k==='g'&&h.t>=h.life){ring(h.x,h.y,9,140,SP.skull);h.dead=1;beep(260,.09)}}
  hz=hz.filter(h=>!h.dead);
  if(st==='attack'&&atkT>=atk.d*(shorten?.55:1))endAttack()}
 for(const k in press)delete press[k]
}
function movePlayer(dt){
 const sp=K('ShiftLeft','ShiftRight')?65:175;let dx=(K('ArrowRight','KeyD')?1:0)-(K('ArrowLeft','KeyA')?1:0),dy=(K('ArrowDown','KeyS')?1:0)-(K('ArrowUp','KeyW')?1:0);
 if(pl.blue){pl.x+=dx*sp*dt;const fl=box.y+box.h-12;if(pl.y>=fl-1&&P('ArrowUp','KeyW')){pl.vy=-360;beep(720,.04)}
  if(!K('ArrowUp','KeyW')&&pl.vy<-130)pl.vy=-130;pl.vy+=980*dt;pl.y+=pl.vy*dt;if(pl.y>=fl){pl.y=fl;pl.vy=0}}
 else{if(dx&&dy){dx*=.707;dy*=.707}pl.x+=dx*sp*dt;pl.y+=dy*sp*dt}
 pl.x=clamp(pl.x,box.x+11,box.x+box.w-11);pl.y=clamp(pl.y,box.y+11,box.y+box.h-11)
}

// ========== DRAW BOSS (completely new) ==========
function drawBoss(){
 const t=performance.now()/1000;
 const bob=Math.sin(t*1.8)*5;
 const sh=bossHit>0?rnd(-10,10):0;
 const r=bHP/bMax;
 const eyeCol=r<.3?'#ff2a3a':r<.6?'#ff8a2a':'#ffd84a';

 g.save();g.globalAlpha=bossA;g.translate(320+sh,105+bob);

 // massive dark aura
 const gr=g.createRadialGradient(0,0,20,0,0,200);
 gr.addColorStop(0,eyeCol+'55');gr.addColorStop(1,eyeCol+'00');
 g.fillStyle=gr;g.fillRect(-200,-180,400,380);

 // CAPE / BODY (tall and imposing)
 g.fillStyle='#0e0618';
 g.beginPath();g.moveTo(-50,-10);g.lineTo(50,-10);g.lineTo(120,130);g.lineTo(-120,130);g.fill();
 g.fillStyle='#1a0a2e';
 g.beginPath();g.moveTo(-35,0);g.lineTo(35,0);g.lineTo(80,130);g.lineTo(-80,130);g.fill();

 // armor plates
 g.fillStyle='#2a1535';
 for(let i=0;i<5;i++)g.fillRect(-28,20+i*18,56,12);

 // red accents
 g.fillStyle='#8a1a1a';
 g.fillRect(-6,25,12,90);

 // SHOULDERS
 g.fillStyle='#1a0a2e';
 g.beginPath();g.ellipse(-55,15,28,18,0,0,7);g.fill();
 g.beginPath();g.ellipse(55,15,28,18,0,0,7);g.fill();
 g.fillStyle='#3a1a4a';
 g.beginPath();g.ellipse(-55,15,18,12,0,0,7);g.fill();
 g.beginPath();g.ellipse(55,15,18,12,0,0,7);g.fill();

 // WEAPONS (floating / held)
 const wa=weaponAngle;
 // left blade
 g.save();g.translate(-70,40);g.rotate(-.6+Math.sin(wa)*.15);
 g.fillStyle='#ffd84a';g.fillRect(-4,-70,8,80);
 g.fillStyle='#fff';g.fillRect(-2,-65,4,20);
 g.fillStyle='#2a1a1a';g.fillRect(-6,5,12,14);
 g.restore();
 // right blade
 g.save();g.translate(70,40);g.rotate(.6-Math.sin(wa)*.15);
 g.fillStyle='#ff2a3a';g.fillRect(-4,-75,8,85);
 g.fillStyle='#fff';g.fillRect(-2,-70,4,22);
 g.fillStyle='#2a1a1a';g.fillRect(-6,5,12,14);
 g.restore();

 // HEAD (sharp, dangerous)
 g.fillStyle='#1a1025';
 g.beginPath();g.ellipse(0,-35,32,36,0,0,7);g.fill();
 g.fillStyle='#2a1a35';
 g.beginPath();g.ellipse(0,-35,26,30,0,0,7);g.fill();

 // cracked face when damaged
 if(crack>=1){
  g.strokeStyle='#5a2a2a';g.lineWidth=2;
  g.beginPath();g.moveTo(-8,-50);g.lineTo(5,-30);g.lineTo(-5,-15);g.stroke();
 }
 if(crack>=2){
  g.beginPath();g.moveTo(12,-45);g.lineTo(0,-25);g.lineTo(10,-10);g.stroke();
 }

 // EYES (glowing, intense)
 g.fillStyle='#0a0612';
 g.beginPath();g.ellipse(-13,-38,9,11,0,0,7);g.fill();
 g.beginPath();g.ellipse(13,-38,9,11,0,0,7);g.fill();
 g.fillStyle=eyeCol;
 const eg=3.5+Math.sin(eyeGlow*3)*.8;
 g.beginPath();g.arc(-13,-37,eg,0,7);g.fill();
 g.beginPath();g.arc(13,-37,eg,0,7);g.fill();
 // eye glow
 g.globalAlpha=.4;g.beginPath();g.arc(-13,-37,eg+4,0,7);g.fill();
 g.beginPath();g.arc(13,-37,eg+4,0,7);g.fill();g.globalAlpha=1;

 // mouth (grim)
 g.strokeStyle='#0a0612';g.lineWidth=3;
 g.beginPath();
 if(mercy>=100)g.arc(0,-20,12,.4,Math.PI-.4);
 else if(r<.3){g.moveTo(-16,-18);g.lineTo(16,-22)} // broken
 else{g.moveTo(-18,-20);g.lineTo(-6,-26);g.lineTo(6,-26);g.lineTo(18,-20)} // fierce
 g.stroke();

 // CROWN (dangerous, spiked)
 g.save();g.translate(0,-72+Math.sin(t*2.2)*2);
 g.fillStyle=r<.25?'#5a3a10':'#e8b020';
 g.beginPath();
 g.moveTo(-30,0);g.lineTo(-30,-22);g.lineTo(-18,-8);g.lineTo(-9,-28);g.lineTo(0,-6);
 g.lineTo(9,-28);g.lineTo(18,-8);g.lineTo(30,-22);g.lineTo(30,0);g.closePath();g.fill();
 // crown spikes
 g.fillStyle='#ff2a3a';
 g.beginPath();g.moveTo(-9,-28);g.lineTo(-6,-38);g.lineTo(-3,-28);g.fill();
 g.beginPath();g.moveTo(3,-28);g.lineTo(6,-38);g.lineTo(9,-28);g.fill();
 g.beginPath();g.moveTo(-18,-8);g.lineTo(-15,-18);g.lineTo(-12,-8);g.fill();
 g.beginPath();g.moveTo(12,-8);g.lineTo(15,-18);g.lineTo(18,-8);g.fill();
 // gem
 g.fillStyle=eyeCol;g.beginPath();g.arc(0,-12,5,0,7);g.fill();
 g.restore();

 g.restore();
}

// ========== DRAW HELPERS ==========
function lines(t,mw){const o=[];for(const p of t.split('\n')){let l='';for(const w of p.split(' ')){const tl=l?l+' '+w:w;if(g.measureText(tl).width>mw&&l){o.push(l);l=w}else l=tl}o.push(l)}return o}
function heart(x,y,s,c){g.fillStyle=c;g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.3,x,y-s*.4);g.bezierCurveTo(x+s*.7,y-s*1.3,x+s*1.6,y-s*.2,x,y+s*.9);g.fill()}
function bar(x,y,w,h,f,c,b){g.fillStyle=b;g.fillRect(x,y,w,h);g.fillStyle=c;g.fillRect(x,y,w*clamp(f,0,1),h)}
function drawBg(){
 for(let i=0;i<6;i++){g.fillStyle=i%2?'#12081c':'#1a0c28';g.fillRect(i*18,0,18,245);g.fillRect(W-(i+1)*18,0,18,245)}
 const gr=g.createLinearGradient(0,0,0,245);gr.addColorStop(0,'#ff2a3a18');gr.addColorStop(1,'#0000');
 g.fillStyle=gr;g.beginPath();g.moveTo(280,0);g.lineTo(360,0);g.lineTo(540,245);g.lineTo(100,245);g.fill()
}
function speech(){if(sayT<=0||!say)return;g.font='14px monospace';g.textBaseline='top';const L=lines(say,200),h=L.length*17+12,x=410,y=12;
 g.fillStyle='#fff';g.beginPath();g.moveTo(x,y+18);g.lineTo(x-14,y+26);g.lineTo(x,y+32);g.fill();g.fillRect(x,y,220,h);g.fillStyle='#000';L.forEach((l,i)=>g.fillText(l,x+10,y+7+i*17))}
function drawC(h){
 if(h.t<h.delay){if(h.warn){const a=.4+.3*Math.sin(h.t*35);g.strokeStyle='#ff2a3a';g.globalAlpha=a;g.lineWidth=2;g.setLineDash([5,5]);g.beginPath();g.moveTo(h.x,box.y);g.lineTo(h.x,box.y+box.h);g.stroke();g.setLineDash([]);g.globalAlpha=1;if(h.sp)drawSp(h.sp,h.x,box.y+18,0,a+.3)}return}
 if(h.sp){const rot=h.face?Math.atan2(h.vy,h.vx)-Math.PI/2:(h.rot||0);drawSp(h.sp,h.x,h.y,rot)}
 else{g.fillStyle=h.col;g.beginPath();g.arc(h.x,h.y,h.r,0,7);g.fill()}
}
function drawBlade(h){
 const dx=h.x2-h.x1,dy=h.y2-h.y1,L=Math.hypot(dx,dy)||1,on=h.t>h.warn;
 g.save();g.translate(h.x1,h.y1);g.rotate(Math.atan2(dy,dx));
 if(!on){g.globalAlpha=.45+.4*Math.sin(h.t*28);g.fillStyle=h.col;for(let i=0;i<L;i+=14)g.fillRect(i,-1.5,9,3)}
 else{const w=h.w;g.fillStyle=h.col;g.fillRect(0,-w/2,L,w);
  for(let i=0;i<L;i+=11){g.beginPath();g.moveTo(i,-w/2);g.lineTo(i+5,-w/2-6);g.lineTo(i+10,-w/2);g.fill();
   g.beginPath();g.moveTo(i,w/2);g.lineTo(i+5,w/2+6);g.lineTo(i+10,w/2);g.fill()}
  g.fillStyle='#fff';g.fillRect(0,-w*.25,L,w*.5)}
 g.restore();g.globalAlpha=1
}
function drawHand(h){
 const dx=h.x2-h.x1,dy=h.y2-h.y1,L=Math.hypot(dx,dy)||1,on=h.t>h.warn;
 g.save();g.translate(h.x1,h.y1);g.rotate(Math.atan2(dy,dx));g.globalAlpha=on?1:.4;
 g.fillStyle=h.col;g.fillRect(-20,-h.w/2,L-10,h.w);
 g.beginPath();g.moveTo(L-30,-h.w*1.6);g.lineTo(L,0);g.lineTo(L-30,h.w*1.6);g.fill();
 g.beginPath();g.arc(-18,0,h.w*1.1,0,7);g.fill();
 g.fillStyle='#fff';g.fillRect(0,-1.5,L-28,3);g.restore();g.globalAlpha=1
}
function drawSpot(h){
 const on=h.t>h.warn;g.save();g.translate(h.x,h.y);
 if(!on){g.strokeStyle='#ffd84a';g.globalAlpha=.55+.35*Math.sin(h.t*22);g.lineWidth=2;g.beginPath();g.arc(0,0,h.r*(1-.25*h.t/h.warn),0,7);g.stroke();g.setLineDash([4,4]);g.beginPath();g.arc(0,0,h.r,0,7);g.stroke();g.setLineDash([])}
 else{g.fillStyle='#ffd84a';for(let i=0;i<8;i++){const a=i*Math.PI/4+h.t*4;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-.1)*h.r*1.4,Math.sin(a-.1)*h.r*1.4);g.lineTo(Math.cos(a+.1)*h.r*1.4,Math.sin(a+.1)*h.r*1.4);g.fill()}
  g.fillStyle='#fff8c0';g.beginPath();g.arc(0,0,h.r,0,7);g.fill()}
 g.restore();g.globalAlpha=1
}
function drawGhost(h){g.globalAlpha=.55;heart(h.x,h.y,7,'#ff5a9a');g.strokeStyle='#ff5a9a';g.lineWidth=2;g.beginPath();g.arc(h.x,h.y,10+45*(1-h.t/h.life),0,7);g.stroke();drawSp(SP.skull,h.x,h.y-20,0,.5+.4*h.t/h.life);g.globalAlpha=1}

function draw(){
 g.imageSmoothingEnabled=false;g.fillStyle='#000';g.fillRect(0,0,W,H);g.save();if(shake>0)g.translate(rnd(-5,5),rnd(-5,5));
 drawBg();drawBoss();speech();
 g.fillStyle='#000';g.fillRect(box.x,box.y,box.w,box.h);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(box.x,box.y,box.w,box.h);
 g.textBaseline='top';g.font='bold 17px monospace';g.fillStyle='#fff';
 if(st==='attack'){
  for(const h of hz){if(h.k==='c')drawC(h);else if(h.k==='l')h.hand?drawHand(h):drawBlade(h);else if(h.k==='s')drawSpot(h);else drawGhost(h)}
  if(hitI<=0||Math.floor(hitI*10)%2)heart(pl.x,pl.y,6,pl.blue?'#3a8aff':'#ff2a3a');
  if(shield){g.strokeStyle='#9ef';g.lineWidth=2;g.beginPath();g.arc(pl.x,pl.y,14,0,7);g.stroke()}
 }else if(st==='fight'){
  const x0=box.x+20,x1=box.x+box.w-20,my=box.y+box.h/2;
  g.fillStyle='#1a0a12';g.fillRect(x0,my-28,x1-x0,56);
  const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'#500');gr.addColorStop(.5,'#fd3');gr.addColorStop(1,'#500');
  g.fillStyle=gr;g.fillRect(x0,my-28,x1-x0,56);g.fillStyle='#fff';g.fillRect(fb.c-5,my-35,10,70)
 }else if(st==='menu'&&sub!=null){
  const L=listFor();L.forEach((s,i)=>{g.fillStyle='#fff';g.fillText(s,box.x+48,box.y+14+i*24);if(i===ssel)heart(box.x+28,box.y+24+i*24,6,'#ff2a3a')})
 }else{
  g.fillStyle='#fff';lines(msg.slice(0,msgI|0),box.w-40).forEach((l,i)=>g.fillText(l,box.x+18,box.y+14+i*24))
 }
 for(const p of pt){g.globalAlpha=1-p.t/p.l;g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),3,3)}g.globalAlpha=1;
 if(flash>0){g.fillStyle=`rgba(255,40,50,${flash*.7})`;g.fillRect(0,0,W,H)}
 g.restore();hud();if(st==='title')title()
}
function hud(){
 g.textBaseline='top';g.font='bold 14px monospace';
 g.fillStyle=mercy>=100?'#ffd84a':'#fff';g.fillText('MORROW'+(mercy>=100?'  — READY TO SPARE':''),18,8);
 bar(18,26,230,11,bHP/bMax,'#c22','#300');
 g.fillStyle='#ffd84a';g.fillText('MERCY',18,42);bar(18,58,230,7,mercy/100,'#ffd84a','#2a2010');
 g.fillStyle='#fff';g.fillText('YOU  HP',28,400);bar(115,401,pMax*2.1,15,pHP/pMax,'#ff0','#a00');g.fillText(pHP+' / '+pMax,115+pMax*2.1+8,400);
 ['FIGHT','ACT','ITEM','MERCY'].forEach((n,i)=>{const x=25+i*152,on=st==='menu'&&sub==null&&sel===i;
  g.strokeStyle=on?'#ff0':'#f50';g.lineWidth=3;g.strokeRect(x,428,140,36);g.fillStyle=on?'#ff0':'#f50';g.fillText(n,x+42,438);if(on)heart(x+18,446,5,'#ff2a3a')});
 g.font='11px monospace';g.fillStyle='#666';g.fillText('Arrows/WASD  •  Z confirm  •  X back  •  Shift = slow',130,468)
}
function title(){
 g.fillStyle='#000c';g.fillRect(0,0,W,H);g.textAlign='center';
 g.fillStyle='#ff2a3a';g.font='bold 48px monospace';g.fillText('MORROW',320,130);
 g.fillStyle='#fff';g.font='bold 18px monospace';g.fillText('— THE HOLLOW KING —',320,175);
 const t=performance.now()/1000;
 [SP.blade,SP.bigblade,SP.dagger,SP.star,SP.skull,SP.crown].forEach((s,i)=>drawSp(s,180+i*55,230+Math.sin(t*2.2+i)*8,Math.sin(t+i)*.4,1,1.1));
 g.font='15px monospace';g.fillStyle='#aaa';
 g.fillText('A three-hundred-year reign ends tonight.',320,290);
 g.fillText('Survive. Or become another forgotten challenger.',320,312);
 g.fillStyle='#fff';g.fillText('Press Z or Enter',320,370);g.textAlign='left'
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
cv.addEventListener('click',()=>{if(st==='title')press['KeyZ']=1});
</script>
