<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0912;
    --panel: #15121e;
    --panel2: #1c1828;
    --border: #2c2740;
    --text: #f0ecf8;
    --muted: #8a839c;
    --gold: #ffd23f;
    --red: #ff4d6a;
    --pink: #ff7eb9;
    --blue: #5ec8ff;
    --green: #6ee7a0;
    --violet: #a78bfa;
    --orange: #ff9f43;
    --font-d: 'Cinzel', Georgia, serif;
    --font-b: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-b);
    min-height: 100vh;
    padding: 22px 16px 50px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167,139,250,0.11), transparent),
      radial-gradient(ellipse 50% 40% at 90% 100%, rgba(255,77,106,0.05), transparent);
  }
  .wrap { max-width: 1440px; margin: 0 auto; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px; margin-bottom: 20px;
  }
  h1 {
    font-family: var(--font-d);
    font-size: clamp(24px, 3.4vw, 34px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--gold); }
  .subtitle { color: var(--muted); font-size: 13px; max-width: 580px; line-height: 1.5; }

  .layout {
    display: grid;
    grid-template-columns: 265px 1fr 385px;
    gap: 15px;
    align-items: start;
  }
  @media (max-width: 1150px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
  }
  .panel h2 {
    font-family: var(--font-d);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 11px;
    font-weight: 700;
  }

  .palette-group { margin-bottom: 14px; }
  .palette-group-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 6px 3px;
  }
  .palette-btn {
    display: block; width: 100%; text-align: left;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    font-family: var(--font-b);
    font-size: 12.5px;
    font-weight: 600;
    transition: border-color .15s, background .15s;
  }
  .palette-btn:hover { border-color: var(--gold); background: #241f33; }
  .palette-btn small {
    display: block; font-weight: 400; color: var(--muted);
    margin-top: 2px; font-size: 10.5px; line-height: 1.3;
  }
  .swatch {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 2px; margin-right: 6px; vertical-align: middle;
  }

  .toolbar { display: flex; gap: 6px; margin-bottom: 9px; flex-wrap: wrap; }
  .toolbar .btn { padding: 5px 10px; font-size: 11.5px; }

  #sequence {
    list-style: none; min-height: 60px; max-height: 66vh; overflow-y: auto;
  }
  #sequence:empty::after {
    content: "Add blocks from the left.";
    color: var(--muted); font-size: 13px; display: block; padding: 22px 6px;
  }

  .block {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--violet);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: grab;
  }
  .block.flow { border-left-color: var(--violet); }
  .block.attack { border-left-color: var(--red); }
  .block.special { border-left-color: var(--pink); }
  .block.effect { border-left-color: var(--blue); }
  .block.spamton { border-left-color: var(--orange); }
  .block.dragging { opacity: 0.4; }
  .block-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .block-title { font-weight: 700; font-size: 12.5px; }
  .block-remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px;
  }
  .block-remove:hover { color: var(--red); }
  .block-fields { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label {
    font-size: 9px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input, .field select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 3px 5px; font-size: 11.5px; font-family: var(--font-b);
  }
  .field input { width: 60px; }
  .field select { width: 90px; }
  .indent { margin-left: 16px; }

  #stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  canvas#stage {
    background: #06050c;
    border: 2px solid var(--border);
    border-radius: 8px;
    max-width: 100%;
    box-shadow: 0 0 50px rgba(0,0,0,0.55);
  }
  .hpbar-wrap { width: 100%; max-width: 340px; }
  .hpbar-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 3px;
  }
  .hpbar {
    height: 10px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 5px; overflow: hidden;
  }
  .hpbar-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold), #ffb700);
    transition: width .12s ease;
  }
  #status-msg { font-size: 12.5px; color: var(--muted); min-height: 17px; text-align: center; }
  #status-msg.win { color: var(--green); font-weight: 700; }
  #status-msg.lose { color: var(--red); font-weight: 700; }

  .btn {
    font-family: var(--font-b); font-weight: 700; font-size: 13px;
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; background: var(--panel2); color: var(--text);
  }
  .btn.primary { background: var(--gold); color: #1a1608; border-color: var(--gold); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .controls-note {
    font-size: 11px; color: var(--muted); text-align: center; line-height: 1.45;
  }
  code {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 4px; font-size: 10.5px;
  }
  .boss-settings {
    display: flex; gap: 9px; flex-wrap: wrap; justify-content: center;
  }
  .boss-settings .field input[type="color"] {
    width: 40px; height: 26px; padding: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Boss Fight <span>Maker</span></h1>
      <div class="subtitle">Cinematic multi-stage attacks • Board splits • Crystal storms • Knife dances • Spamton chaos. Build it, then dodge it.</div>
    </div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Blocks</h2>
      <div id="palette"></div>
    </div>

    <div class="panel">
      <h2>Sequence</h2>
      <div class="toolbar">
        <button class="btn" id="clear-seq-btn">Clear</button>
        <button class="btn" id="export-btn">Export</button>
        <button class="btn" id="import-btn">Import</button>
      </div>
      <ul id="sequence"></ul>
    </div>

    <div class="panel">
      <h2>Test Fight</h2>
      <div id="stage-wrap">
        <div class="boss-settings">
          <div class="field">
            <label>Boss Shape</label>
            <select id="boss-shape">
              <option value="triangle">Triangle</option>
              <option value="circle">Circle</option>
              <option value="diamond">Diamond</option>
              <option value="star">Star</option>
              <option value="scythe">Scythe</option>
              <option value="blade">Blade</option>
              <option value="spamton">Spamton</option>
            </select>
          </div>
          <div class="field">
            <label>Color</label>
            <input type="color" id="boss-color" value="#a78bfa">
          </div>
          <div class="field">
            <label>Size</label>
            <input type="number" id="boss-size" value="12" min="6" max="24" step="1" style="width:50px">
          </div>
        </div>
        <canvas id="stage" width="340" height="420"></canvas>
        <div class="hpbar-wrap">
          <div class="hpbar-label"><span>SOUL</span><span id="hp-text">100/100</span></div>
          <div class="hpbar"><div class="hpbar-fill" id="hp-fill" style="width:100%"></div></div>
        </div>
        <div id="status-msg"></div>
        <div class="btn-row">
          <button class="btn primary" id="play-btn">Test Fight</button>
          <button class="btn" id="stop-btn" disabled>Stop</button>
        </div>
        <div class="controls-note">Move with <code>Arrows</code> or <code>WASD</code></div>
      </div>
    </div>
  </div>
</div>

  function getBlockDuration(block) {
    const p = block && block.params ? block.params : {};
    const v = Number(p.totalDuration);
    if (Number.isFinite(v)) return Math.max(0.3, Math.min(20, v));
    return Math.max(0.3, Number(p.duration) || 1);

  let uidCounter = 1;
  function makeBlock(type) {
    const def = BLOCK_DEFS[type];
    const params = {};
    (def.fields||[]).forEach(f => params[f.key] = f.def);
    if (type === "combo") params.slots = [null,null,null,null];
    return {id: uidCounter++, type, params};

  function renderFieldsInto(container, fields, paramsObj) {
    const wrap = document.createElement("div");
    wrap.className = "block-fields";
    fields.forEach(f => {
      const fw = document.createElement("div");
      fw.className = "field";
      const lab = document.createElement("label");
      lab.textContent = f.label;
      fw.appendChild(lab);
      if (f.type === "select") {
        const sel = document.createElement("select");
        f.options.forEach(opt => {
          const o = document.createElement("option");
          o.value = opt.value; o.textContent = opt.label;
          if (paramsObj[f.key] === opt.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => { paramsObj[f.key] = sel.value; });
        fw.appendChild(sel);
      } else {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = f.min; inp.max = f.max; inp.step = f.step;
        inp.value = paramsObj[f.key];
        inp.addEventListener("change", () => {
          let v = parseFloat(inp.value);
          if (isNaN(v)) v = f.def;
          v = Math.max(f.min, Math.min(f.max, v));
          paramsObj[f.key] = v; inp.value = v;
        });
        fw.appendChild(inp);
      }
      wrap.appendChild(fw);
    });
    container.appendChild(wrap);
  }

  function renderSequence() {
    seqEl.innerHTML = "";
    let depth = 0;
    sequence.forEach((block, idx) => {
      const def = BLOCK_DEFS[block.type];
      if (!def) return;
      const li = document.createElement("li");
      li.className = "block " + (def.cat || "attack");
      li.draggable = true;
      li.dataset.index = idx;
      if (block.type === "repeat_end") depth = Math.max(0, depth-1);
      if (depth > 0) li.classList.add("indent");

      const row = document.createElement("div");
      row.className = "block-row";
      const title = document.createElement("span");
      title.className = "block-title";
      title.style.color = def.color;
      title.textContent = def.label;
      row.appendChild(title);

      const rm = document.createElement("button");
      rm.className = "block-remove";
      rm.textContent = "×";
      rm.addEventListener("click", e => {
        e.stopPropagation();
        if (block.type === "repeat_start") {
          const endIdx = findMatchingEnd(idx);
          if (endIdx !== -1) sequence.splice(endIdx, 1);
        } else if (block.type === "repeat_end") {
          const startIdx = findMatchingStart(idx);
          if (startIdx !== -1) sequence.splice(startIdx, 1);
        }
        sequence = sequence.filter(b => b.id !== block.id);
        renderSequence();
      });
      row.appendChild(rm);
      li.appendChild(row);

      if (def.fields && def.fields.length) renderFieldsInto(li, def.fields, block.params);

      if (block.type === "combo") {
        if (!block.params.slots) block.params.slots = [null,null,null,null];
        const slotsWrap = document.createElement("div");
        slotsWrap.style.cssText = "margin-top:7px;display:flex;flex-direction:column;gap:5px";
        block.params.slots.forEach((slot, si) => {
          const box = document.createElement("div");
          box.style.cssText = "border:1px dashed var(--border);border-radius:6px;padding:5px 7px";
          const selRow = document.createElement("div");
          selRow.style.cssText = "display:flex;align-items:center;gap:6px";
          const lab = document.createElement("span");
          lab.style.cssText = "font-size:9.5px;color:var(--muted)";
          lab.textContent = "Slot " + (si+1);
          selRow.appendChild(lab);
          const sel = document.createElement("select");
          sel.style.cssText = "flex:1;font-size:11.5px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px";
          const empty = document.createElement("option");
          empty.value = ""; empty.textContent = "(empty)";
          sel.appendChild(empty);
          COMBO_ALLOWED.forEach(t => {
            const d = BLOCK_DEFS[t];
            const o = document.createElement("option");
            o.value = t; o.textContent = d.label;
            if (slot && slot.type === t) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", () => {
            const t = sel.value;
            if (!t) block.params.slots[si] = null;
            else {
              const nb = makeBlock(t);
              block.params.slots[si] = {type:t, params:nb.params};
            }
            renderSequence();
          });
          selRow.appendChild(sel);
          box.appendChild(selRow);
          if (slot) {
            const subDef = BLOCK_DEFS[slot.type];
            if (subDef && subDef.fields) renderFieldsInto(box, subDef.fields, slot.params);
          }
          slotsWrap.appendChild(box);
        });
        li.appendChild(slotsWrap);
      }

      if (block.type === "repeat_start") depth += 1;

      li.addEventListener("dragstart", () => { dragFromIndex = idx; li.classList.add("dragging"); });
      li.addEventListener("dragend", () => li.classList.remove("dragging"));
      li.addEventListener("dragover", e => e.preventDefault());
      li.addEventListener("drop", e => {
        e.preventDefault();
        if (dragFromIndex === null || dragFromIndex === idx) return;
        const moved = sequence.splice(dragFromIndex, 1)[0];
        sequence.splice(idx, 0, moved);
        dragFromIndex = null;
        renderSequence();
      });
      seqEl.appendChild(li);
    });
  }

  function findMatchingEnd(startIdx) {
    let d = 0;
    for (let i = startIdx; i < sequence.length; i++) {
      if (sequence[i].type === "repeat_start") d++;
      if (sequence[i].type === "repeat_end") { d--; if (d===0) return i; }
    }
    return -1;
  }
  function findMatchingStart(endIdx) {
    let d = 0;
    for (let i = endIdx; i >= 0; i--) {
      if (sequence[i].type === "repeat_end") d++;
      if (sequence[i].type === "repeat_start") { d--; if (d===0) return i; }
    }
    return -1;
  }

  // ── HELPERS ──
  function mkBullet(x, y, vx, vy, r, shape, extra) {
    const b = {x,y,vx,vy, r:r||6, shape:shape||"circle", life:14, rotation:0, spinSpeed:0, blue:false};
    if (extra) Object.assign(b, extra);
    if (b.spinEnabled) {
      const lo = Number(b.spinMin)||2, hi = Math.max(lo, Number(b.spinMax)||6);
      b.spinSpeed = (lo + Math.random()*(hi-lo)) * (Math.random()<0.5 ? -1 : 1);
    }
    return b;
  }
  function projectileExtra(params, extra) {
    const out = Object.assign({}, extra||{});
    out.spinEnabled = params && params.spinEnabled === "on";
    out.spinMin = params && params.spinMin != null ? params.spinMin : 2;
    out.spinMax = params && params.spinMax != null ? params.spinMax : 6;
    out.blue = rollBlue(params);
    return out;
  }

  function hitPlayer(g, dmg) {
    if (g.player.invuln > 0 || g.player.hitThisFrame) return;
    g.player.hp = Math.max(0, g.player.hp - (dmg||10));
    g.player.invuln = 0.7;
    g.player.hitThisFrame = true;
    for (let i=0; i<12; i++) {
      const ang = Math.random()*Math.PI*2, sp = 50+Math.random()*90;
      g.particles.push({x:g.player.x, y:g.player.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        life:0.3+Math.random()*0.25, color:"#ffd23f"});
    }
    hpFill.style.width = g.player.hp + "%";
    hpText.textContent = g.player.hp + "/100";
    if (g.player.hp <= 0) g.lost = true;
  }

  // ── SPAWN / ENTER ──
  function enterInstruction(g, block) {
    if (!block) return;
    const p = block.params || {};
    switch (block.type) {
      case "crystal_barrage":
        g.crystal = {params:p, phase:"fire", t:0, spawnAcc:0, crystals:[]};
        break;
      case "knife_dance":
        g.knifeDance = {params:p, swords:[], nextAt:0, spawned:0, t:0};
        break;
      case "board_rend":
        g.boardRend = {
          cutsLeft: p.cuts||3, orient:p.orient||"random",
          gapTime:p.gapTime||1.1, bulletRate:p.bulletRate||11,
          shape:p.shape||"shard", params:p,
          state:"slash", t:0, currentOrient:null, separation:0, slashProgress:0, spawnAcc:0
        };
        beginRendCut(g);
        break;
      case "sword_corridor":
        g.corridor = {
          params:p, blades:[], phase:"wave", t:0,
          waveAmp:p.waveAmp||38, waveSpeed:p.waveSpeed||1.8,
          holdTime:p.holdTime||2.8, shape:p.shape||"blade"
        };
        // Top and bottom lines
        const spacing = 18;
        for (let x = BOX.x + 10; x < BOX.x + BOX.w - 10; x += spacing) {
          g.corridor.blades.push({x, y: BOX.y + 14, baseY: BOX.y + 14, side:"top", ang:0, phase:"wave"});
          g.corridor.blades.push({x, y: BOX.y + BOX.h - 14, baseY: BOX.y + BOX.h - 14, side:"bottom", ang:0, phase:"wave"});
        }
        break;
      case "sanguine_slash":
        g.sanguine = {
          cycles:p.cycles||4, gap:p.gap||0.7, width:p.width||16,
          spinTime:p.spinTime||0.55, t:0, cycle:0, cuts:[]
        };
        break;
      case "shatter_ring":
        g.ringWavesLeft = p.rings||3; g.ringGapAcc=0; g.ringParams=p; g.ringIdx=0;
        spawnShatterRing(g, p, 0); g.ringIdx++; g.ringWavesLeft--;
        break;
      case "orbit_cascade":
        spawnOrbitCascade(g, p);
        break;
      case "wall": spawnWall(g, p); break;
      case "sweeping_wall": g.spawnAcc=0; break;
      case "spiral": g.spawnAcc=0; g.spiralAngle=0; break;
      case "ring_burst": spawnRingBurst(g, p); break;
      case "rain": g.spawnAcc=0; break;
      case "shotgun":
        g.shotgunWavesLeft=(p.waves||2)-1; g.shotgunGapAcc=0; spawnShotgunWave(g,p); break;
      case "bounce": spawnBounce(g,p); break;
      case "chaos": g.spawnAcc=0; g.chaosParams=p; break;
      case "rising_spikes":
        g.spikes = {params:p, wavesLeft:p.waves||3, gapAcc:0, nextWave:true};
        break;
      case "scythe_sweep":
        g.scythes = {params:p, list:[], nextAt:0, spawned:0};
        break;
      case "gravity_well":
        g.gravity = {
          cx: BOX.x+BOX.w/2, cy: BOX.y+BOX.h/2,
          pull:p.pull||55, t:0, params:p
        };
        for (let i=0; i<(p.orbitCount||8); i++) {
          const ang = (i/(p.orbitCount||8))*Math.PI*2;
          g.bullets.push(mkBullet(g.gravity.cx, g.gravity.cy, 0,0, 5.5, p.shape||"circle",
            projectileExtra(p, {orbit:true, orbitCx:g.gravity.cx, orbitCy:g.gravity.cy,
              orbitAngle:ang, orbitRadius:45, orbitSpeed:2.8, orbitTimeLeft:999, flySpeed:0})));
        }
        break;
      case "echo_blades":
        g.echo = {params:p, blades:[], nextAt:0, spawned:0};
        break;
      case "phantom_grasp":
        g.grasp = {params:p, hands:[], t:0};
        for (let i=0; i<(p.hands||4); i++) {
          const side = i%4;
          let x,y, tx,ty;
          if (side===0) { x=BOX.x-30; y=BOX.y+BOX.h*0.3+Math.random()*BOX.h*0.4; tx=BOX.x+40; ty=y; }
          else if (side===1) { x=BOX.x+BOX.w+30; y=BOX.y+BOX.h*0.3+Math.random()*BOX.h*0.4; tx=BOX.x+BOX.w-40; ty=y; }
          else if (side===2) { x=BOX.x+BOX.w*0.3+Math.random()*BOX.w*0.4; y=BOX.y-30; tx=x; ty=BOX.y+40; }
          else { x=BOX.x+BOX.w*0.3+Math.random()*BOX.w*0.4; y=BOX.y+BOX.h+30; tx=x; ty=BOX.y+BOX.h-40; }
          g.grasp.hands.push({x,y,tx,ty, r:18, progress:0});
        }
        break;
      case "pipis_barrage":
        for (let i=0; i<(p.count||5); i++) {
          const ang = (Math.random()*60-30+180)*Math.PI/180;
          const spd = (p.speed||140)*(0.85+Math.random()*0.3);
          g.bullets.push(mkBullet(
            BOX.x+30+Math.random()*(BOX.w-60), BOX.y-8,
            Math.sin(ang)*spd, Math.cos(ang)*spd, 9, "pipis",
            projectileExtra(p, {pipis:true, heads:p.heads||7, bouncesLeft:6})
          ));
        }
        break;
      case "flying_heads":
        g.heads = {params:p, list:[], nextAt:0, spawned:0};
        break;
      case "chained_heart":
        g.heart = {
          x: BOX.x+BOX.w/2, y: BOX.y+40,
          params:p, t:0, swing:0, spawnAcc:0
        };
        break;
      case "phone_grip":
        g.phones = {params:p, list:[], head:{x:BOX.x+BOX.w+40, y:BOX.y+BOX.h/2, vx:-(p.headSpeed||55)}, t:0};
        for (let i=0; i<(p.phones||4); i++) {
          const side = i%2===0 ? "left" : "right";
          const y = BOX.y + 40 + (i*0.5)*(BOX.h-80)/(p.phones||4);
          g.phones.list.push({side, y, x: side==="left"?BOX.x-5:BOX.x+BOX.w+5});
        }
        break;
      case "mail_storm":
        g.mail = {params:p, spawnAcc:0};
        break;
      case "laser":
        g.lasers.push({mode:p.mode||"sweep", width:p.width||20, speed:p.speed||95,
          t:0, duration:p.duration||2.3, x:BOX.x+BOX.w/2, dir:1, blue:rollBlue(p)});
        break;
      case "giga_laser":
        g.giga = {charge:p.charge||1, hold:p.hold||1.25, width:p.width||80,
          t:0, phase:"charge", x:g.bossX, blue:rollBlue(p)};
        break;
      case "cage":
        g.cage = {left:BOX.x-12, right:BOX.x+BOX.w+12, top:BOX.y-12, bottom:BOX.y+BOX.h+12,
          targetGap:p.gap||82, speed:p.speed||60, t:0};
        break;
      case "telegraph": g.telegraphFlash = p.duration||0.55; break;
      case "shake": g.shakeLeft=p.duration||0.35; g.shakeIntensity=p.intensity||7; break;
      case "flash": g.flashLeft=p.duration||0.14; g.flashColor=p.color||"white"; break;
      case "slowmo": g.timeScale=(p.factor||35)/100; g.slowmoLeft=p.duration||1; break;
      case "arena_shrink":
        g.arenaTargetScale=(p.scale||65)/100; g.arenaShrinkLeft=p.duration||2.6; g.currentScale=1; break;
      case "clear_bullets": g.bullets=[]; g.lasers=[]; g.rings=[]; break;
      case "move_boss":
        g.bossFrom=g.bossX; g.bossTo=BOX.x+(p.targetPercent/100)*BOX.w; break;
      case "combo":
        g.comboProcs = (p.slots||[]).filter(Boolean).map(sub => {
          const proc = {type:sub.type, params:sub.params, state:{}, elapsed:0};
          enterInstruction(g, {type:sub.type, params:sub.params});
          return proc;
        });
        break;
    }
  }

  function beginRendCut(g) {
    const r = g.boardRend;
    if (!r) return;
    r.currentOrient = r.orient==="random" ? (Math.random()<0.5?"h":"v") : r.orient;
    r.state = "slash"; r.t=0; r.separation=0; r.slashProgress=0; r.spawnAcc=0;
  }

  function spawnShatterRing(g, p, idx) {
    g.rings.push({
      cx:g.bossX, cy:BOX.y+26, r:10, speed:p.expandSpeed||105,
      thickness:7, maxR:380, shatterAt:0.52+idx*0.07, shattered:false,
      shards:p.shards||11, shape:p.shape||"shard", blue:rollBlue(p), params:p
    });
  }
  function spawnOrbitCascade(g, p) {
    const n = p.count||14;
    for (let i=0; i<n; i++) {
      const ang = (i/n)*Math.PI*2;
      g.bullets.push(mkBullet(g.bossX, BOX.y+24, 0,0, 5.5, p.shape||"star",
        projectileExtra(p, {orbit:true, orbitCx:g.bossX, orbitCy:BOX.y+24,
          orbitAngle:ang, orbitRadius:34, orbitSpeed:2.7+Math.random()*0.6,
          orbitTimeLeft:p.orbitTime||1.4, flySpeed:p.speed||145})));
    }
  }
  function spawnWallRow(g, gapStart, gapSize, params) {
    const gapEnd = gapStart + gapSize;
    for (let x=BOX.x; x<=BOX.x+BOX.w; x+=14) {
      if (x>=gapStart && x<=gapEnd) continue;
      g.bullets.push(mkBullet(x, BOX.y-6, 0, params.speed, 5.5, params.shape, projectileExtra(params)));
    }
  }
  function spawnWall(g, p) {
    const gapStart = BOX.x + (p.gapPos/100)*BOX.w - p.gapSize/2;
    spawnWallRow(g, gapStart, p.gapSize, p);
  }
  function spawnRainDrop(g, p) {
    g.bullets.push(mkBullet(BOX.x+Math.random()*BOX.w, BOX.y-6, 0, p.speed, 5, p.shape, projectileExtra(p)));
  }
  function spawnRingBurst(g, p) {
    for (let i=0; i<p.count; i++) {
      const ang = (360/p.count)*i*Math.PI/180;
      g.bullets.push(mkBullet(g.bossX, BOX.y+28, Math.sin(ang)*p.speed, Math.cos(ang)*p.speed, 5.5, p.shape, projectileExtra(p)));
    }
  }
  function spawnSpiralTick(g, p, angle) {
    for (let i=0; i<p.arms; i++) {
      const ang = (angle + (360/p.arms)*i)*Math.PI/180;
      g.bullets.push(mkBullet(g.bossX, BOX.y+18, Math.sin(ang)*p.speed, Math.cos(ang)*p.speed, 5, p.shape, projectileExtra(p)));
    }
  }
  function spawnShotgunWave(g, p) {
    const baseAng = Math.atan2(g.player.x-g.bossX, g.player.y-(BOX.y-4));
    const half = (p.spread*Math.PI/180)/2;
    for (let i=0; i<p.count; i++) {
      const t = p.count===1 ? 0.5 : i/(p.count-1);
      const ang = baseAng - half + t*half*2;
      g.bullets.push(mkBullet(g.bossX, BOX.y-4, Math.sin(ang)*p.speed, Math.cos(ang)*p.speed, 5.5, p.shape, projectileExtra(p)));
    }
  }
  function spawnBounce(g, p) {
    for (let i=0; i<p.count; i++) {
      const ang = (Math.random()*50-25+180)*Math.PI/180;
      const spd = p.speed*(0.85+Math.random()*0.3);
      g.bullets.push(mkBullet(BOX.x+20+Math.random()*(BOX.w-40), BOX.y-4,
        Math.sin(ang)*spd, Math.cos(ang)*spd, 6, p.shape,
        projectileExtra(p, {bounce:true, bouncesLeft:p.bounces})));
    }
  }

  // ── UPDATE ──
  function loop(ts) {
    if (!game || !game.running) return;
    if (lastFrame===null) lastFrame = ts;
    let rawDt = Math.min((ts-lastFrame)/1000, 0.05);
    lastFrame = ts;
    const dt = rawDt * (game.timeScale||1);
    update(game, dt, rawDt);
    render(game);
    if (game.won) { stopFight("Fight cleared!", "win"); return; }
    if (game.lost) { stopFight("You were hit too many times.", "lose"); return; }
    requestAnimationFrame(loop);
  }

  function applyArenaScale(g) {
    const s = g.currentScale;
    const cx = BASE_BOX.x + BASE_BOX.w/2, cy = BASE_BOX.y + BASE_BOX.h/2;
    BOX.w = BASE_BOX.w * s; BOX.h = BASE_BOX.h * s;
    BOX.x = cx - BOX.w/2; BOX.y = cy - BOX.h/2;
  }

  function update(g, dt, rawDt) {
    g.player.hitThisFrame = false;

    if (g.slowmoLeft>0) { g.slowmoLeft-=rawDt; if (g.slowmoLeft<=0) g.timeScale=1; }
    if (g.shakeLeft>0) {
      g.shakeLeft-=rawDt;
      const intensity = g.shakeIntensity * (g.shakeLeft>0?1:0);
      shakeOffset.x = (Math.random()-0.5)*intensity*2;
      shakeOffset.y = (Math.random()-0.5)*intensity*2;
    } else { shakeOffset.x=0; shakeOffset.y=0; }
    if (g.flashLeft>0) g.flashLeft-=rawDt;

    if (g.arenaShrinkLeft>0) {
      g.arenaShrinkLeft-=dt;
      g.currentScale += (g.arenaTargetScale-g.currentScale)*Math.min(1,dt*3);
      if (g.arenaShrinkLeft<=0) {
        g.currentScale += (1-g.currentScale)*Math.min(1,dt*4);
        if (Math.abs(g.currentScale-1)<0.01) g.currentScale=1;
      }
      applyArenaScale(g);
    } else if (g.currentScale!==1) {
      g.currentScale += (1-g.currentScale)*Math.min(1,dt*4);
      if (Math.abs(g.currentScale-1)<0.01) g.currentScale=1;
      applyArenaScale(g);
    }

    // Player
    const speed = 162;
    let dx=0, dy=0;
    if (keys["arrowleft"]||keys["a"]) dx-=1;
    if (keys["arrowright"]||keys["d"]) dx+=1;
    if (keys["arrowup"]||keys["w"]) dy-=1;
    if (keys["arrowdown"]||keys["s"]) dy+=1;
    g.player.moving = !!(dx||dy);
    if (dx||dy) {
      const len = Math.hypot(dx,dy)||1;
      g.player.x += (dx/len)*speed*dt;
      g.player.y += (dy/len)*speed*dt;
    }
    g.player.x = Math.max(BOX.x+g.player.r, Math.min(BOX.x+BOX.w-g.player.r, g.player.x));
    g.player.y = Math.max(BOX.y+g.player.r, Math.min(BOX.y+BOX.h-g.player.r, g.player.y));

    if (g.player.invuln>0) g.player.invuln-=rawDt;
    if (g.telegraphFlash>0) g.telegraphFlash-=dt;

    // Gravity well pull
    if (g.gravity) {
      const dx = g.gravity.cx - g.player.x, dy = g.gravity.cy - g.player.y;
      const dist = Math.hypot(dx,dy)||1;
      const force = (g.gravity.pull||55) / Math.max(30, dist);
      g.player.x += (dx/dist)*force*dt*18;
      g.player.y += (dy/dist)*force*dt*18;
    }

    // Board Rend
    if (g.boardRend) updateBoardRend(g, dt);

    // Instruction
    if (g.pc===0 && g.t===0 && g.steps===0) enterInstruction(g, fightSequence[0]);
    const block = fightSequence[g.pc];
    if (block) {
      g.t += dt;
      const dur = getBlockDuration(block);
      const p = block.params || {};

      // Crystal Barrage phases
      if (block.type==="crystal_barrage" && g.crystal) {
        const c = g.crystal;
        c.t += dt;
        if (c.phase==="fire") {
          c.spawnAcc += dt;
          const interval = 1/(p.rate||4.5);
          while (c.spawnAcc >= interval) {
            c.spawnAcc -= interval;
            const ang = Math.atan2(g.player.x - g.bossX, g.player.y - (BOX.y-4));
            const spd = (p.speed||130)*(0.9+Math.random()*0.2);
            const b = mkBullet(g.bossX, BOX.y-4, Math.sin(ang)*spd, Math.cos(ang)*spd, 7, p.shape||"crystal",
              projectileExtra(p, {crystal:true, phase:"out", timer:0}));
            g.bullets.push(b);
            c.crystals.push(b);
          }
          if (c.t >= (p.fireTime||1.8)) {
            c.phase = "pause"; c.t=0;
            c.crystals.forEach(b => { b.vx*=0.15; b.vy*=0.15; b.phase="pause"; });
          }
        } else if (c.phase==="pause") {
          if (c.t >= 0.45) {
            c.phase = "reverse"; c.t=0;
            c.crystals.forEach(b => {
              b.vx = -b.vx*4.5; b.vy = -b.vy*4.5;
              b.phase = "reverse";
            });
          }
        } else if (c.phase==="reverse") {
          if (c.t >= 0.7) {
            c.phase = "explode"; c.t=0;
            c.crystals.forEach(b => {
              b.flash = 1;
              b.phase = "explode";
            });
          }
        } else if (c.phase==="explode") {
          c.crystals.forEach(b => {
            if (b.phase==="explode" && !b.exploded) {
              b.exploded = true; b.life=0;
              for (let i=0; i<(p.shards||6); i++) {
                const ang = (i/(p.shards||6))*Math.PI*2 + Math.random()*0.3;
                const spd = (i%3===0 ? 155 : 95) + Math.random()*35;
                g.bullets.push(mkBullet(b.x, b.y, Math.sin(ang)*spd, Math.cos(ang)*spd, 4, "shard", {
                  blue:b.blue, life: i%3===0 ? 3.8 : 2.4
                }));
              }
            }
          });
        }
      }

      // Knife Dance
      if (block.type==="knife_dance" && g.knifeDance) {
        const kd = g.knifeDance;
        kd.t += dt;
        if (kd.spawned < (p.count||5) && kd.t >= kd.nextAt) {
          // Spawn a tracking sword from a random edge
          const side = kd.spawned % 4;
          let x,y;
          if (side===0) { x=BOX.x-25; y=g.player.y; }
          else if (side===1) { x=BOX.x+BOX.w+25; y=g.player.y; }
          else if (side===2) { x=g.player.x; y=BOX.y-25; }
          else { x=g.player.x; y=BOX.y+BOX.h+25; }
          const sword = {
            x, y, lockX:g.player.x, lockY:g.player.y,
            phase:"track", timer:0, ang:0,
            shape:p.shape||"knife", params:p
          };
          kd.swords.push(sword);
          kd.spawned++;
          kd.nextAt = kd.t + (p.gap||0.55);
        }
        kd.swords.forEach(s => {
          s.timer += dt;
          if (s.phase==="track") {
            // Fully track horizontal (and vertical lightly)
            s.lockX += (g.player.x - s.lockX) * Math.min(1, dt*8);
            s.lockY += (g.player.y - s.lockY) * Math.min(1, dt*3);
            s.x += (s.lockX - s.x) * Math.min(1, dt*6);
            s.y += (s.lockY - s.y) * Math.min(1, dt*4);
            s.ang = Math.atan2(s.lockX - s.x, s.lockY - s.y);
            if (s.timer >= (p.lockTime||0.85)) {
              s.phase = "pull"; s.timer=0;
              s.pullFromX = s.x; s.pullFromY = s.y;
              const backAng = s.ang + Math.PI;
              s.pullToX = s.x + Math.sin(backAng)*35;
              s.pullToY = s.y + Math.cos(backAng)*35;
            }
          } else if (s.phase==="pull") {
            const frac = Math.min(1, s.timer/(p.pullTime||0.35));
            s.x = s.pullFromX + (s.pullToX-s.pullFromX)*frac;
            s.y = s.pullFromY + (s.pullToY-s.pullFromY)*frac;
            if (frac>=1) {
              s.phase = "fire"; s.timer=0;
              const fireAng = Math.atan2(s.lockX - s.x, s.lockY - s.y);
              s.vx = Math.sin(fireAng)*480;
              s.vy = Math.cos(fireAng)*480;
            }
          } else if (s.phase==="fire") {
            s.x += s.vx*dt; s.y += s.vy*dt;
          }
        });
      }

      // Sword Corridor
      if (block.type==="sword_corridor" && g.corridor) {
        const c = g.corridor;
        c.t += dt;
        if (c.phase==="wave") {
          c.blades.forEach(b => {
            const wave = Math.sin(c.t * c.waveSpeed + b.x*0.04) * c.waveAmp;
            if (b.side==="top") b.y = b.baseY + Math.max(0, wave*0.5);
            else b.y = b.baseY - Math.max(0, wave*0.5);
          });
          if (c.t >= c.holdTime) {
            c.phase = "telegraph"; c.t=0;
            c.blades.forEach(b => {
              b.ang = Math.random()*Math.PI*2;
              b.telegraphLen = 0;
            });
          }
        } else if (c.phase==="telegraph") {
          c.blades.forEach(b => {
            b.telegraphLen = Math.min(180, b.telegraphLen + 220*dt);
          });
          if (c.t >= 0.7) {
            c.phase = "pull"; c.t=0;
            c.blades.forEach(b => {
              b.pullFromX=b.x; b.pullFromY=b.y;
              b.pullToX = b.x - Math.sin(b.ang)*28;
              b.pullToY = b.y - Math.cos(b.ang)*28;
            });
          }
        } else if (c.phase==="pull") {
          const frac = Math.min(1, c.t/0.3);
          c.blades.forEach(b => {
            b.x = b.pullFromX + (b.pullToX-b.pullFromX)*frac;
            b.y = b.pullFromY + (b.pullToY-b.pullFromY)*frac;
          });
          if (frac>=1) {
            c.phase = "fire"; c.t=0;
            c.blades.forEach(b => {
              b.vx = Math.sin(b.ang)*420;
              b.vy = Math.cos(b.ang)*420;
            });
          }
        } else if (c.phase==="fire") {
          c.blades.forEach(b => { b.x+=b.vx*dt; b.y+=b.vy*dt; });
        }
      }

      // Sanguine Slash
      if (block.type==="sanguine_slash" && g.sanguine) {
        const s = g.sanguine;
        s.t += dt;
        if (s.t >= s.gap && s.cycle < s.cycles) {
          s.t = 0;
          s.cuts.push({
            x: g.player.x, y: g.player.y,
            ang: Math.random()*Math.PI,
            width: s.width,
            spin: 18 + Math.random()*8,
            spinTimer: 0,
            spinTime: s.spinTime,
            life: s.spinTime + 0.45,
            damaging: false
          });
          s.cycle++;
        }
        s.cuts.forEach(c => {
          c.spinTimer += dt;
          c.life -= dt;
          // Brake the spin
          const progress = Math.min(1, c.spinTimer / c.spinTime);
          c.currentSpin = c.spin * (1 - progress*progress);
          c.ang += c.currentSpin * dt;
          if (progress >= 0.92 && !c.damaging) c.damaging = true;
        });
        s.cuts = s.cuts.filter(c => c.life > 0);
      }

      // Continuous spawners
      if (block.type==="rain") {
        g.spawnAcc=(g.spawnAcc||0)+dt;
        const interval=1/(p.rate||6.5);
        while (g.spawnAcc>=interval) { g.spawnAcc-=interval; spawnRainDrop(g,p); }
      }
      if (block.type==="spiral") {
        g.spawnAcc=(g.spawnAcc||0)+dt;
        g.spiralAngle=(g.spiralAngle||0)+(p.rotSpeed||145)*dt;
        const interval=1/(p.rate||8);
        while (g.spawnAcc>=interval) { g.spawnAcc-=interval; spawnSpiralTick(g,p,g.spiralAngle); }
      }
      if (block.type==="sweeping_wall") {
        g.spawnAcc=(g.spawnAcc||0)+dt;
        const interval=0.13;
        while (g.spawnAcc>=interval) {
          g.spawnAcc-=interval;
          const frac=0.5+0.5*Math.sin(g.t*(p.oscSpeed||2.3));
          spawnWallRow(g, BOX.x+frac*BOX.w-p.gapSize/2, p.gapSize, p);
        }
      }
      if (block.type==="shotgun") {
        g.shotgunGapAcc=(g.shotgunGapAcc||0)+dt;
        if (g.shotgunWavesLeft>0 && g.shotgunGapAcc>=(p.gap||0.5)) {
          g.shotgunGapAcc=0; g.shotgunWavesLeft--; spawnShotgunWave(g,p);
        }
      }
      if (block.type==="shatter_ring" && g.ringWavesLeft>0) {
        g.ringGapAcc=(g.ringGapAcc||0)+dt;
        if (g.ringGapAcc>=(p.gap||0.5)) {
          g.ringGapAcc=0; spawnShatterRing(g,g.ringParams,g.ringIdx); g.ringIdx++; g.ringWavesLeft--;
        }
      }
      if (block.type==="chaos") {
        g.spawnAcc=(g.spawnAcc||0)+dt;
        const rate=3.8*(p.intensity||1.35);
        const interval=1/rate;
        while (g.spawnAcc>=interval) {
          g.spawnAcc-=interval;
          if (Math.random()<0.5) spawnRainDrop(g, Object.assign({},p,{speed:100+Math.random()*70}));
          else if (Math.random()<0.5) {
            const ang=Math.random()*Math.PI*2;
            g.bullets.push(mkBullet(g.bossX,BOX.y+22, Math.sin(ang)*115, Math.cos(ang)*115,5,p.shape,projectileExtra(p)));
          } else {
            const dx=g.player.x-g.bossX, dy=g.player.y-(BOX.y-4);
            const len=Math.hypot(dx,dy)||1;
            g.bullets.push(mkBullet(g.bossX,BOX.y-4, dx/len*150, dy/len*150,6,p.shape,projectileExtra(p)));
          }
        }
      }
      if (block.type==="rising_spikes" && g.spikes) {
        const sp = g.spikes;
        if (sp.wavesLeft>0) {
          sp.gapAcc += dt;
          if (sp.nextWave || sp.gapAcc >= (p.gap||0.65)) {
            sp.nextWave=false; sp.gapAcc=0; sp.wavesLeft--;
            const n=p.count||9;
            for (let i=0; i<n; i++) {
              const x = BOX.x + (i+0.5)*(BOX.w/n);
              g.bullets.push(mkBullet(x, BOX.y+BOX.h+10, 0, -(p.speed||160), 7, p.shape||"triangle",
                projectileExtra(p, {life:3})));
            }
          }
        }
      }
      if (block.type==="scythe_sweep" && g.scythes) {
        const sc = g.scythes;
        sc.t = (sc.t||0)+dt;
        if (sc.spawned < (p.count||3) && sc.t >= sc.nextAt) {
          const fromLeft = sc.spawned%2===0;
          sc.list.push({
            x: fromLeft ? BOX.x-40 : BOX.x+BOX.w+40,
            y: BOX.y + 30 + Math.random()*(BOX.h-60),
            vx: fromLeft ? 1 : -1,
            ang: fromLeft ? 0 : Math.PI,
            speed: p.speed||2.2,
            r: 28, life:0
          });
          sc.spawned++;
          sc.nextAt = sc.t + (p.gap||0.7);
        }
        sc.list.forEach(s => {
          s.t += dt;
          s.x += s.vx * 140 * dt;
          s.ang += s.speed * dt * s.vx;
        });
      }
      if (block.type==="echo_blades" && g.echo) {
        const e = g.echo;
        e.t = (e.t||0)+dt;
        if (e.spawned < (p.count||4) && e.t >= e.nextAt) {
          const ang = Math.random()*Math.PI*2;
          const sx = g.bossX, sy = BOX.y-4;
          e.blades.push({x:sx, y:sy, vx:Math.sin(ang)*180, vy:Math.cos(ang)*180,
            echoes:[], echoTimer:0, shape:p.shape||"blade", params:p});
          e.spawned++;
          e.nextAt = e.t + 0.4;
        }
        e.blades.forEach(b => {
          b.x += b.vx*dt; b.y += b.vy*dt;
          b.echoTimer += dt;
          if (b.echoTimer >= (p.echoDelay||0.28) && b.echoes.length < (p.echoes||3)) {
            b.echoTimer=0;
            b.echoes.push({x:b.x, y:b.y, life:0.7, maxLife:0.7});
          }
          b.echoes.forEach(ec => ec.life-=dt);
          b.echoes = b.echoes.filter(ec => ec.life>0);
        });
      }
      if (block.type==="phantom_grasp" && g.grasp) {
        g.grasp.t += dt;
        g.grasp.hands.forEach(h => {
          h.progress = Math.min(1, h.progress + (p.closeSpeed||70)*dt*0.01);
          h.x = h.x + (h.tx-h.x)*h.progress*0.15;
          h.y = h.y + (h.ty-h.y)*h.progress*0.15;
        });
      }
      if (block.type==="flying_heads" && g.heads) {
        const hd = g.heads;
        hd.t = (hd.t||0)+dt;
        if (hd.spawned < (p.count||4) && hd.t >= hd.nextAt) {
          const lane = BOX.y + 50 + (hd.spawned/(p.count||4))*(BOX.h-100);
          hd.list.push({
            x: BOX.x+BOX.w+30, y:lane, vx:-(p.speed||95),
            fireAcc:0, shape:"head", params:p
          });
          hd.spawned++;
          hd.nextAt = hd.t + (p.gap||0.55);
        }
        hd.list.forEach(h => {
          h.x += h.vx*dt;
          h.fireAcc += dt;
          const interval = 1/(p.fireRate||2.5);
          if (h.fireAcc >= interval) {
            h.fireAcc=0;
            const ang = Math.atan2(g.player.x-h.x, g.player.y-h.y);
            g.bullets.push(mkBullet(h.x, h.y, Math.sin(ang)*130, Math.cos(ang)*130, 5, "circle",
              projectileExtra(p)));
          }
        });
      }
      if (block.type==="chained_heart" && g.heart) {
        const h = g.heart;
        h.t += dt;
        h.swing = Math.sin(h.t * (p.speed||2.4)) * (BOX.w*0.35);
        h.x = BOX.x + BOX.w/2 + h.swing;
        h.spawnAcc += dt;
        const interval = 1/(p.bulletRate||6);
        while (h.spawnAcc >= interval) {
          h.spawnAcc -= interval;
          const ang = Math.random()*Math.PI*2;
          g.bullets.push(mkBullet(h.x, h.y, Math.sin(ang)*110, Math.cos(ang)*110, 5.5, "diamond",
            projectileExtra(p)));
        }
      }
      if (block.type==="phone_grip" && g.phones) {
        g.phones.t += dt;
        g.phones.head.x += g.phones.head.vx * dt;
        if (g.phones.t % 0.45 < dt) {
          const ang = Math.atan2(g.player.x-g.phones.head.x, g.player.y-g.phones.head.y);
          g.bullets.push(mkBullet(g.phones.head.x, g.phones.head.y,
            Math.sin(ang)*100, Math.cos(ang)*100, 8, "circle",
            projectileExtra(p, {explode:true, explodeTimer:0.9})));
        }
      }
      if (block.type==="mail_storm" && g.mail) {
        g.mail.spawnAcc += dt;
        const interval = 1/(p.rate||7);
        while (g.mail.spawnAcc >= interval) {
          g.mail.spawnAcc -= interval;
          const isBomb = Math.random()*100 < (p.bombChance||18);
          g.bullets.push(mkBullet(BOX.x+Math.random()*BOX.w, BOX.y-8, 0, p.speed||115,
            isBomb?8:5.5, isBomb?"bolt":"square",
            projectileExtra(p, {bomb:isBomb})));
        }
      }
      if (block.type==="move_boss") {
        const frac = Math.min(1, g.t/Math.max(0.001,dur));
        g.bossX = g.bossFrom + (g.bossTo-g.bossFrom)*frac;
      }
      if (block.type==="cage" && g.cage) {
        const c=g.cage; c.t+=dt;
        const cx=BOX.x+BOX.w/2, cy=BOX.y+BOX.h/2, th=c.targetGap/2;
        c.left=Math.min(c.left+c.speed*dt, cx-th);
        c.right=Math.max(c.right-c.speed*dt, cx+th);
        c.top=Math.min(c.top+c.speed*dt, cy-th);
        c.bottom=Math.max(c.bottom-c.speed*dt, cy+th);
      }
      if (block.type==="giga_laser" && g.giga) {
        const gl=g.giga; gl.t+=dt; gl.x=g.bossX;
        if (gl.phase==="charge" && gl.t>=gl.charge) { gl.phase="fire"; gl.t=0; }
        else if (gl.phase==="fire" && gl.t>=gl.hold) gl.phase="done";
      }

      const isRepeat = block.type==="repeat_start"||block.type==="repeat_end";
      const finished = isRepeat || g.t >= dur;
      if (finished) {
        g.steps++;
        if (g.steps>1800) { g.won=true; return; }
        if (block.type==="repeat_start") {
          g.repeatStack.push({startIdx:g.pc+1, remaining:(p.count||2)-1});
          g.pc+=1;
        } else if (block.type==="repeat_end") {
          const top=g.repeatStack[g.repeatStack.length-1];
          if (top && top.remaining>0) { top.remaining--; g.pc=top.startIdx; }
          else { g.repeatStack.pop(); g.pc+=1; }
        } else g.pc+=1;
        g.t=0;
        // cleanup
        ["cage","giga","comboProcs","boardRend","corridor","sanguine","crystal","knifeDance",
         "spikes","scythes","gravity","echo","grasp","heads","heart","phones","mail"].forEach(k => {
          if (block.type.replace(/_/g,"") === k.replace(/_/g,"") || 
              (block.type==="board_rend"&&k==="boardRend") ||
              (block.type==="knife_dance"&&k==="knifeDance") ||
              (block.type==="sword_corridor"&&k==="corridor") ||
              (block.type==="sanguine_slash"&&k==="sanguine") ||
              (block.type==="crystal_barrage"&&k==="crystal") ||
              (block.type==="rising_spikes"&&k==="spikes") ||
              (block.type==="scythe_sweep"&&k==="scythes") ||
              (block.type==="gravity_well"&&k==="gravity") ||
              (block.type==="echo_blades"&&k==="echo") ||
              (block.type==="phantom_grasp"&&k==="grasp") ||
              (block.type==="flying_heads"&&k==="heads") ||
              (block.type==="chained_heart"&&k==="heart") ||
              (block.type==="phone_grip"&&k==="phones") ||
              (block.type==="mail_storm"&&k==="mail") ||
              (block.type==="giga_laser"&&k==="giga") ||
              (block.type==="cage"&&k==="cage") ||
              (block.type==="combo"&&k==="comboProcs")) {
            g[k] = null;
          }
        });
        if (g.pc < fightSequence.length) enterInstruction(g, fightSequence[g.pc]);
      }
    }
    if (g.pc >= fightSequence.length) g.won = true;

    // Lasers
    g.lasers.forEach(L => {
      L.t+=dt;
      if (L.mode==="sweep") {
        L.x += L.dir*L.speed*dt;
        if (L.x < BOX.x+L.width/2) { L.x=BOX.x+L.width/2; L.dir=1; }
        if (L.x > BOX.x+BOX.w-L.width/2) { L.x=BOX.x+BOX.w-L.width/2; L.dir=-1; }
      } else if (L.mode==="vertical") L.x = BOX.x+BOX.w/2 + Math.sin(L.t*1.5)*(BOX.w*0.32);
      else L.x = g.bossX;
    });
    g.lasers = g.lasers.filter(L => L.t < L.duration);

    // Rings
    g.rings.forEach(R => {
      R.r += R.speed*dt;
      if (!R.shattered && R.r>40 && R.r/R.maxR > (R.shatterAt||0.5)) {
        R.shattered=true;
        for (let i=0; i<(R.shards||11); i++) {
          const ang=(i/R.shards)*Math.PI*2+Math.random()*0.2;
          const spd=90+Math.random()*50;
          g.bullets.push(mkBullet(R.cx+Math.sin(ang)*R.r, R.cy+Math.cos(ang)*R.r,
            Math.sin(ang)*spd, Math.cos(ang)*spd, 4.5, R.shape||"shard",
            projectileExtra(R.params||{}, {blue:R.blue})));
        }
      }
    });
    g.rings = g.rings.filter(R => R.r < R.maxR);

    // Bullets update
    const newBullets = [];
    g.bullets.forEach(b => {
      if (b.spinEnabled) b.rotation += (b.spinSpeed||0)*dt;

      if (b.crystal && b.flash) {
        b.flash -= dt*3;
      }

      if (b.orbit) {
        if (b.orbitTimeLeft > 0) {
          b.orbitTimeLeft -= dt;
          b.orbitAngle += b.orbitSpeed*dt;
          b.orbitRadius += 7*dt;
          b.x = b.orbitCx + Math.sin(b.orbitAngle)*b.orbitRadius;
          b.y = b.orbitCy + Math.cos(b.orbitAngle)*b.orbitRadius;
        } else if (!b.released && b.flySpeed) {
          b.released=true;
          b.vx = Math.sin(b.orbitAngle)*b.flySpeed;
          b.vy = Math.cos(b.orbitAngle)*b.flySpeed;
          b.orbit=false;
        }
      }

      if (b.pipis) {
        b.x += b.vx*dt; b.y += b.vy*dt;
        if (b.x < BOX.x+b.r || b.x > BOX.x+BOX.w-b.r) {
          b.vx *= -1; b.bouncesLeft--;
          if (b.bouncesLeft <= 0) {
            b.life=0;
            for (let i=0; i<(b.heads||7); i++) {
              const ang = (i/b.heads)*Math.PI*2;
              newBullets.push(mkBullet(b.x,b.y, Math.sin(ang)*130, Math.cos(ang)*130, 4.5, "head", {life:2.8, blue:b.blue}));
            }
          }
        }
        if (b.y < BOX.y+b.r || b.y > BOX.y+BOX.h-b.r) {
          b.vy *= -1; b.bouncesLeft--;
          if (b.bouncesLeft <= 0) {
            b.life=0;
            for (let i=0; i<(b.heads||7); i++) {
              const ang = (i/b.heads)*Math.PI*2;
              newBullets.push(mkBullet(b.x,b.y, Math.sin(ang)*130, Math.cos(ang)*130, 4.5, "head", {life:2.8, blue:b.blue}));
            }
          }
        }
      } else if (b.explode) {
        b.explodeTimer = (b.explodeTimer||0.9) - dt;
        b.x += b.vx*dt; b.y += b.vy*dt;
        if (b.explodeTimer <= 0 && !b.exploded) {
          b.exploded=true; b.life=0;
          for (let i=0; i<8; i++) {
            const ang=(i/8)*Math.PI*2;
            newBullets.push(mkBullet(b.x,b.y, Math.sin(ang)*140, Math.cos(ang)*140, 4, "circle", {life:2}));
          }
        }
      } else if (!b.orbit) {
        b.x += b.vx*dt; b.y += b.vy*dt;
      }

      b.life -= dt;

      if (b.bounce && b.bouncesLeft>0) {
        if (b.x < BOX.x+b.r) { b.x=BOX.x+b.r; b.vx=Math.abs(b.vx); b.bouncesLeft--; }
        if (b.x > BOX.x+BOX.w-b.r) { b.x=BOX.x+BOX.w-b.r; b.vx=-Math.abs(b.vx); b.bouncesLeft--; }
        if (b.y < BOX.y+b.r) { b.y=BOX.y+b.r; b.vy=Math.abs(b.vy); b.bouncesLeft--; }
        if (b.y > BOX.y+BOX.h-b.r) { b.y=BOX.y+BOX.h-b.r; b.vy=-Math.abs(b.vy); b.bouncesLeft--; }
      }
    });
    if (newBullets.length) g.bullets.push(...newBullets);
    g.bullets = g.bullets.filter(b => b.life>0 && b.x>BOX.x-60 && b.x<BOX.x+BOX.w+60 && b.y>BOX.y-60 && b.y<BOX.y+BOX.h+60);

    g.particles.forEach(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; p.vx*=0.95; p.vy*=0.95; });
    g.particles = g.particles.filter(p => p.life>0);

    // Collision
    if (g.player.invuln<=0 && !g.player.hitThisFrame) {
      let hit=false;
      for (const b of g.bullets) {
        if (Math.hypot(b.x-g.player.x, b.y-g.player.y) < b.r+g.player.r-0.7) {
          if (!b.blue || g.player.moving) { hit=true; break; }
        }
      }
      if (!hit) {
        for (const L of g.lasers) {
          if (Math.abs(g.player.x-L.x) < L.width/2+g.player.r) {
            if (!L.blue || g.player.moving) { hit=true; break; }
          }
        }
      }
      if (!hit) {
        for (const R of g.rings) {
          if (R.shattered) continue;
          const d=Math.hypot(g.player.x-R.cx, g.player.y-R.cy);
          if (Math.abs(d-R.r) < R.thickness/2+g.player.r) {
            if (R.blue && !g.player.moving) continue;
            hit=true; break;
          }
        }
      }
      if (!hit && g.cage) {
        const c=g.cage, pr=g.player.r;
        if (g.player.x-pr<c.left||g.player.x+pr>c.right||g.player.y-pr<c.top||g.player.y+pr>c.bottom) hit=true;
      }
      if (!hit && g.giga && g.giga.phase==="fire") {
        if (Math.abs(g.player.x-g.giga.x) < g.giga.width/2+g.player.r) {
          if (!g.giga.blue || g.player.moving) hit=true;
        }
      }
      // Sanguine
      if (!hit && g.sanguine) {
        for (const c of g.sanguine.cuts) {
          if (!c.damaging) continue;
          const dx=g.player.x-c.x, dy=g.player.y-c.y;
          const proj = dx*Math.sin(c.ang) + dy*Math.cos(c.ang);
          const perp = dx*Math.cos(c.ang) - dy*Math.sin(c.ang);
          if (Math.abs(perp) < c.width/2+g.player.r && Math.abs(proj)<260) { hit=true; break; }
        }
      }
      // Knife Dance swords
      if (!hit && g.knifeDance) {
        for (const s of g.knifeDance.swords) {
          if (s.phase==="fire" && Math.hypot(s.x-g.player.x, s.y-g.player.y)<10+g.player.r) { hit=true; break; }
        }
      }
      // Corridor
      if (!hit && g.corridor && (g.corridor.phase==="fire"||g.corridor.phase==="wave")) {
        for (const b of g.corridor.blades) {
          if (Math.hypot(b.x-g.player.x, b.y-g.player.y)<9+g.player.r) { hit=true; break; }
        }
      }
      // Scythes
      if (!hit && g.scythes) {
        for (const s of g.scythes.list) {
          if (Math.hypot(s.x-g.player.x, s.y-g.player.y)<s.r+g.player.r) { hit=true; break; }
        }
      }
      // Grasp hands
      if (!hit && g.grasp) {
        for (const h of g.grasp.hands) {
          if (Math.hypot(h.x-g.player.x, h.y-g.player.y)<h.r+g.player.r) { hit=true; break; }
        }
      }
      // Flying heads
      if (!hit && g.heads) {
        for (const h of g.heads.list) {
          if (Math.hypot(h.x-g.player.x, h.y-g.player.y)<12+g.player.r) { hit=true; break; }
        }
      }
      // Chained heart
      if (!hit && g.heart) {
        if (Math.hypot(g.heart.x-g.player.x, g.heart.y-g.player.y)<14+g.player.r) hit=true;
      }
      // Echoes
      if (!hit && g.echo) {
        for (const b of g.echo.blades) {
          if (Math.hypot(b.x-g.player.x, b.y-g.player.y)<8+g.player.r) { hit=true; break; }
          for (const ec of b.echoes) {
            if (Math.hypot(ec.x-g.player.x, ec.y-g.player.y)<7+g.player.r) { hit=true; break; }
          }
        }
      }
      if (hit) hitPlayer(g, 10);
    }
  }

  function updateBoardRend(g, dt) {
    const r = g.boardRend;
    if (!r) return;
    r.t += dt;
    if (r.state==="slash") {
      r.slashProgress = Math.min(1, r.t/0.22);
      if (r.t>=0.22) {
        r.state="separate"; r.t=0;
        // damage on the cut line
        if (r.currentOrient==="h") {
          if (Math.abs(g.player.y-(BOX.y+BOX.h/2))<12+g.player.r) hitPlayer(g,14);
        } else {
          if (Math.abs(g.player.x-(BOX.x+BOX.w/2))<12+g.player.r) hitPlayer(g,14);
        }
      }
    } else if (r.state==="separate") {
      r.separation = Math.min(1, r.t/0.4);
      if (r.t>=0.4) { r.state="gap"; r.t=0; r.spawnAcc=0; }
    } else if (r.state==="gap") {
      r.separation=1;
      r.spawnAcc += dt;
      const interval = 1/(r.bulletRate||11);
      while (r.spawnAcc>=interval) {
        r.spawnAcc-=interval;
        if (r.currentOrient==="h") {
          const x=BOX.x+Math.random()*BOX.w;
          const dir=Math.random()<0.5?-1:1;
          g.bullets.push(mkBullet(x, BOX.y+BOX.h/2, 0, dir*145, 7.5, r.shape, projectileExtra(r.params)));
        } else {
          const y=BOX.y+Math.random()*BOX.h;
          const dir=Math.random()<0.5?-1:1;
          g.bullets.push(mkBullet(BOX.x+BOX.w/2, y, dir*145, 0, 7.5, r.shape, projectileExtra(r.params)));
        }
      }
      // Constrain player to halves
      const midX=BOX.x+BOX.w/2, midY=BOX.y+BOX.h/2, sep=r.separation*22;
      if (r.currentOrient==="v") {
        if (g.player.x < midX) g.player.x = Math.min(g.player.x, midX-sep-g.player.r);
        else g.player.x = Math.max(g.player.x, midX+sep+g.player.r);
      } else {
        if (g.player.y < midY) g.player.y = Math.min(g.player.y, midY-sep-g.player.r);
        else g.player.y = Math.max(g.player.y, midY+sep+g.player.r);
      }
      if (r.t >= r.gapTime) { r.state="reconnect"; r.t=0; }
    } else if (r.state==="reconnect") {
      r.separation = 1 - Math.min(1, r.t/0.35);
      if (r.t>=0.35) {
        r.cutsLeft--;
        if (r.cutsLeft>0) beginRendCut(g);
        else r.state="done";
      }
    }
  }

  // ── DRAW ──
  function drawShape(ctx, x, y, r, shape) {
    ctx.beginPath();
    if (shape==="square") ctx.rect(x-r,y-r,r*2,r*2);
    else if (shape==="triangle") { ctx.moveTo(x,y-r*1.2); ctx.lineTo(x-r,y+r*.85); ctx.lineTo(x+r,y+r*.85); ctx.closePath(); }
    else if (shape==="diamond") { ctx.moveTo(x,y-r*1.25); ctx.lineTo(x+r*1.15,y); ctx.lineTo(x,y+r*1.25); ctx.lineTo(x-r*1.15,y); ctx.closePath(); }
    else if (shape==="heart") {
      const s=r/6;
      ctx.moveTo(x,y+7*s);
      ctx.bezierCurveTo(x,y+3*s,x-6*s,y+2*s,x-6*s,y-1*s);
      ctx.bezierCurveTo(x-6*s,y-5*s,x-2*s,y-5*s,x,y-2*s);
      ctx.bezierCurveTo(x+2*s,y-5*s,x+6*s,y-5*s,x+6*s,y-1*s);
      ctx.bezierCurveTo(x+6*s,y+2*s,x,y+4*s,x,y+7*s); ctx.closePath();
    } else if (shape==="star") {
      for (let i=0;i<10;i++) {
        const a=i*Math.PI/5-Math.PI/2, rad=i%2?r*.5:r*1.25;
        const px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      } ctx.closePath();
    } else if (shape==="cross") {
      const t=r*.32;
      ctx.moveTo(x-t,y-r); ctx.lineTo(x+t,y-r); ctx.lineTo(x+t,y-t);
      ctx.lineTo(x+r,y-t); ctx.lineTo(x+r,y+t); ctx.lineTo(x+t,y+t);
      ctx.lineTo(x+t,y+r); ctx.lineTo(x-t,y+r); ctx.lineTo(x-t,y+t);
      ctx.lineTo(x-r,y+t); ctx.lineTo(x-r,y-t); ctx.lineTo(x-t,y-t); ctx.closePath();
    } else if (shape==="blade"||shape==="knife") {
      ctx.moveTo(x,y-r*1.6); ctx.lineTo(x+r*.4,y-r*.1); ctx.lineTo(x+r*.18,y+r*1.1);
      ctx.lineTo(x-r*.18,y+r*1.1); ctx.lineTo(x-r*.4,y-r*.1); ctx.closePath();
    } else if (shape==="scythe") {
      ctx.rect(x-r*.08,y-r*1.2,r*.16,r*2.5);
      ctx.moveTo(x-r*.05,y-r*.85);
      ctx.bezierCurveTo(x+r*.4,y-r*1.65,x+r*1.55,y-r*1.6,x+r*1.45,y-r*.45);
      ctx.bezierCurveTo(x+r*1.35,y-r*1.05,x+r*.8,y-r*.75,x+r*.35,y-r*.25); ctx.closePath();
    } else if (shape==="crystal"||shape==="gem") {
      ctx.moveTo(x,y-r*1.4); ctx.lineTo(x+r*.9,y-r*.3); ctx.lineTo(x+r*.55,y+r*1.1);
      ctx.lineTo(x-r*.55,y+r*1.1); ctx.lineTo(x-r*.9,y-r*.3); ctx.closePath();
    } else if (shape==="shard") {
      ctx.moveTo(x,y-r*1.5); ctx.lineTo(x+r*.7,y+r*.2); ctx.lineTo(x+r*.15,y+r*1.1);
      ctx.lineTo(x-r*.5,y+r*.4); ctx.closePath();
    } else if (shape==="pipis") {
      ctx.ellipse(x,y,r*1.1,r*0.9,0,0,Math.PI*2);
    } else if (shape==="head"||shape==="spamton") {
      ctx.arc(x,y,r,0,Math.PI*2);
      // simple face
      ctx.moveTo(x-r*.4,y-r*.2); ctx.arc(x-r*.25,y-r*.2,r*.15,0,Math.PI*2);
      ctx.moveTo(x+r*.1,y-r*.2); ctx.arc(x+r*.25,y-r*.2,r*.15,0,Math.PI*2);
    } else if (shape==="bolt") {
      ctx.moveTo(x+r*.15,y-r*1.5); ctx.lineTo(x-r*.7,y-r*.1); ctx.lineTo(x-r*.1,y-r*.1);
      ctx.lineTo(x-r*.45,y+r*1.45); ctx.lineTo(x+r*.7,y-r*.25); ctx.lineTo(x+r*.08,y-r*.25); ctx.closePath();
    } else if (shape==="moon") {
      ctx.arc(x,y,r*1.2,Math.PI*.2,Math.PI*1.8);
      ctx.arc(x+r*.45,y-r*.15,r*.95,Math.PI*1.8,Math.PI*.2,true);
    } else if (shape==="hex") {
      for (let i=0;i<6;i++) {
        const a=i*Math.PI/3-Math.PI/6;
        const px=x+Math.cos(a)*r*1.15, py=y+Math.sin(a)*r*1.15;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      } ctx.closePath();
    } else ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  }

  function render(g) {
    ctx.save();
    ctx.translate(shakeOffset.x, shakeOffset.y);
    ctx.clearRect(-20,-20,canvas.width+40,canvas.height+40);

    // Arena
    const borderFlash = g.telegraphFlash>0 && Math.floor(g.telegraphFlash*14)%2===0;
    ctx.strokeStyle = borderFlash ? "#ffd23f" : "#2c2740";
    ctx.lineWidth = borderFlash ? 4 : 3;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);

    // Boss
    ctx.fillStyle = bossSettings.color;
    drawShape(ctx, g.bossX, BOX.y-bossSettings.size-8, bossSettings.size, bossSettings.shape);
    ctx.globalAlpha=0.18;
    ctx.beginPath(); ctx.arc(g.bossX, BOX.y-bossSettings.size-8, bossSettings.size+8,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;

    // Board Rend – actual split halves
    if (g.boardRend && g.boardRend.state!=="done") {
      const r=g.boardRend;
      const midX=BOX.x+BOX.w/2, midY=BOX.y+BOX.h/2;
      const sep=r.separation*22;
      ctx.save();
      if (r.currentOrient==="v") {
        // left half
        ctx.fillStyle="rgba(12,10,20,0.92)";
        ctx.fillRect(BOX.x, BOX.y, BOX.w/2-sep, BOX.h);
        // right half
        ctx.fillRect(midX+sep, BOX.y, BOX.w/2-sep, BOX.h);
        // cut glow
        ctx.strokeStyle=`rgba(94,200,255,${0.6+r.slashProgress*0.4})`;
        ctx.lineWidth=2+r.slashProgress*4;
        ctx.beginPath(); ctx.moveTo(midX,BOX.y); ctx.lineTo(midX,BOX.y+BOX.h); ctx.stroke();
      } else {
        ctx.fillStyle="rgba(12,10,20,0.92)";
        ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h/2-sep);
        ctx.fillRect(BOX.x, midY+sep, BOX.w, BOX.h/2-sep);
        ctx.strokeStyle=`rgba(94,200,255,${0.6+r.slashProgress*0.4})`;
        ctx.lineWidth=2+r.slashProgress*4;
        ctx.beginPath(); ctx.moveTo(BOX.x,midY); ctx.lineTo(BOX.x+BOX.w,midY); ctx.stroke();
      }
      ctx.restore();
    }

    // Cage
    if (g.cage) {
      const c=g.cage;
      ctx.fillStyle="rgba(255,77,106,0.48)";
      ctx.fillRect(BOX.x-2,BOX.y, Math.max(0,c.left-BOX.x), BOX.h);
      ctx.fillRect(c.right,BOX.y, Math.max(0,BOX.x+BOX.w-c.right+2), BOX.h);
      ctx.fillRect(BOX.x,BOX.y-2, BOX.w, Math.max(0,c.top-BOX.y));
      ctx.fillRect(BOX.x,c.bottom, BOX.w, Math.max(0,BOX.y+BOX.h-c.bottom+2));
    }

    // Lasers
    g.lasers.forEach(L => {
      ctx.fillStyle="rgba(255,159,67,0.7)";
      ctx.fillRect(L.x-L.width/2, BOX.y-4, L.width, BOX.h+8);
      ctx.fillStyle="rgba(255,220,160,0.9)";
      const core=L.width*0.35;
      ctx.fillRect(L.x-core/2, BOX.y-4, core, BOX.h+8);
    });

    // Giga
    if (g.giga) {
      const gl=g.giga;
      if (gl.phase==="charge") {
        const pulse=0.35+0.65*Math.sin(gl.t*20);
        ctx.strokeStyle=`rgba(255,126,185,${pulse})`;
        ctx.lineWidth=2.5;
        ctx.strokeRect(gl.x-gl.width/2, BOX.y, gl.width, BOX.h);
        ctx.fillStyle=`rgba(255,126,185,${0.12*pulse})`;
        ctx.fillRect(gl.x-gl.width/2, BOX.y, gl.width, BOX.h);
      } else if (gl.phase==="fire") {
        ctx.fillStyle="rgba(255,70,140,0.85)";
        ctx.fillRect(gl.x-gl.width/2, BOX.y-6, gl.width, BOX.h+12);
        ctx.fillStyle="rgba(255,210,235,0.95)";
        ctx.fillRect(gl.x-gl.width*0.18, BOX.y-6, gl.width*0.36, BOX.h+12);
      }
    }

    // Rings
    g.rings.forEach(R => {
      if (R.shattered) return;
      ctx.strokeStyle="rgba(255,77,106,0.85)";
      ctx.lineWidth=R.thickness;
      ctx.beginPath(); ctx.arc(R.cx,R.cy,R.r,0,Math.PI*2); ctx.stroke();
    });

    // Sanguine cuts
    if (g.sanguine) {
      g.sanguine.cuts.forEach(c => {
        const a = Math.max(0, c.life / (c.spinTime+0.45));
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(-c.ang);
        ctx.fillStyle = c.damaging ? `rgba(255,40,80,${0.75*a})` : `rgba(255,120,160,${0.45*a})`;
        ctx.fillRect(-280, -c.width/2, 560, c.width);
        if (c.damaging) {
          ctx.fillStyle=`rgba(255,200,220,${0.9*a})`;
          ctx.fillRect(-280, -c.width*0.18, 560, c.width*0.36);
        }
        ctx.restore();
      });
    }

    // Knife Dance swords
    if (g.knifeDance) {
      g.knifeDance.swords.forEach(s => {
        ctx.fillStyle = s.phase==="fire" ? "#e2e8f0" : "#a0aec0";
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(-s.ang);
        drawShape(ctx, 0, 0, 9, s.shape||"knife");
        ctx.restore();
        // lock indicator while tracking
        if (s.phase==="track" || s.phase==="pull") {
          ctx.strokeStyle="rgba(255,210,63,0.5)";
          ctx.lineWidth=1;
          ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.lockX,s.lockY); ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    // Sword Corridor
    if (g.corridor) {
      g.corridor.blades.forEach(b => {
        ctx.fillStyle="#c9d3e0";
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(-(b.ang||0));
        drawShape(ctx, 0, 0, 7, g.corridor.shape||"blade");
        ctx.restore();
        // Telegraph lines
        if (g.corridor.phase==="telegraph" && b.telegraphLen) {
          ctx.strokeStyle="rgba(255,80,100,0.55)";
          ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x + Math.sin(b.ang)*b.telegraphLen, b.y + Math.cos(b.ang)*b.telegraphLen);
          ctx.stroke();
        }
      });
    }

    // Scythes
    if (g.scythes) {
      g.scythes.list.forEach(s => {
        ctx.fillStyle="#a78bfa";
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.ang);
        drawShape(ctx, 0, 0, s.r, "scythe");
        ctx.restore();
      });
    }

    // Grasp hands
    if (g.grasp) {
      g.grasp.hands.forEach(h => {
        ctx.fillStyle="rgba(167,139,250,0.7)";
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle="rgba(200,180,255,0.8)";
        ctx.lineWidth=2; ctx.stroke();
      });
    }

    // Flying heads
    if (g.heads) {
      g.heads.list.forEach(h => {
        ctx.fillStyle="#ff9f43";
        drawShape(ctx, h.x, h.y, 11, "head");
      });
    }

    // Chained heart
    if (g.heart) {
      ctx.fillStyle="#ff7eb9";
      drawShape(ctx, g.heart.x, g.heart.y, 13, "heart");
      // chain
      ctx.strokeStyle="rgba(200,200,220,0.5)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(BOX.x+BOX.w/2, BOX.y+10);
      ctx.lineTo(g.heart.x, g.heart.y);
      ctx.stroke();
    }

    // Phones
    if (g.phones) {
      g.phones.list.forEach(ph => {
        ctx.fillStyle="#4a5568";
        ctx.fillRect(ph.x-6, ph.y-14, 12, 28);
      });
      ctx.fillStyle="#ff9f43";
      drawShape(ctx, g.phones.head.x, g.phones.head.y, 12, "head");
    }

    // Bullets
    g.bullets.forEach(b => {
      if (b.shape==="heart") ctx.fillStyle="#ff7eb9";
      else if (b.shape==="star") ctx.fillStyle="#ffd23f";
      else if (b.shape==="crystal"||b.shape==="gem") ctx.fillStyle="#c4b5fd";
      else if (b.shape==="shard") ctx.fillStyle="#a78bfa";
      else if (b.shape==="knife"||b.shape==="blade") ctx.fillStyle="#e2e8f0";
      else if (b.shape==="pipis") ctx.fillStyle="#5ec8ff";
      else if (b.shape==="head") ctx.fillStyle="#ff9f43";
      else if (b.shape==="bolt") ctx.fillStyle="#f6e05e";
      else ctx.fillStyle="#ff4d6a";
      if (b.blue) ctx.fillStyle="#5ec8ff";
      if (b.flash && b.flash>0) ctx.fillStyle="#ffffff";

      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.rotation||0);
      drawShape(ctx,0,0,b.r,b.shape);
      ctx.restore();
    });

    // Echo blades + echoes
    if (g.echo) {
      g.echo.blades.forEach(b => {
        ctx.fillStyle="#ff7eb9";
        drawShape(ctx, b.x, b.y, 7, b.shape||"blade");
        b.echoes.forEach(ec => {
          ctx.globalAlpha = Math.max(0, ec.life/ec.maxLife*0.6);
          ctx.fillStyle="#ff7eb9";
          drawShape(ctx, ec.x, ec.y, 6, b.shape||"blade");
          ctx.globalAlpha=1;
        });
      });
    }

    // Particles
    g.particles.forEach(p => {
      ctx.globalAlpha=Math.max(0,p.life*2.8);
      ctx.fillStyle=p.color||"#ffd23f";
      ctx.beginPath(); ctx.arc(p.x,p.y,2.3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    });

    // Soul
    const invulnFlash = g.player.invuln>0 && Math.floor(g.player.invuln*14)%2===0;
    ctx.fillStyle = invulnFlash ? "#ffffff" : "#ffd23f";
    ctx.beginPath(); ctx.arc(g.player.x, g.player.y, g.player.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = invulnFlash ? "#fff" : "rgba(255,210,63,0.45)";
    ctx.lineWidth=1.5; ctx.stroke();

    // Flash
    if (g.flashLeft>0) {
      const a=Math.min(0.65, g.flashLeft*4);
      const colors={white:"255,255,255",yellow:"255,210,63",red:"255,70,90",pink:"255,126,185",violet:"167,139,250"};
      const c=colors[g.flashColor]||colors.white;
      ctx.fillStyle=`rgba(${c},${a})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    ctx.restore();
  }

  render(idleState());
})();
</script>
</body>
</html>
