<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a14;
    --panel: #16131f;
    --panel2: #1e1a2a;
    --border: #2e2940;
    --text: #f0ecf8;
    --muted: #8b849e;
    --gold: #ffd23f;
    --red: #ff4d6a;
    --pink: #ff7eb9;
    --blue: #5ec8ff;
    --green: #6ee7a0;
    --violet: #a78bfa;
    --orange: #ff9f43;
    --font-d: 'Cinzel', Georgia, serif;
    --font-b: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-b);
    min-height: 100vh;
    padding: 24px 18px 50px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167,139,250,0.12), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255,77,106,0.06), transparent);
  }
  .wrap { max-width: 1420px; margin: 0 auto; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px; margin-bottom: 22px;
  }
  h1 {
    font-family: var(--font-d);
    font-size: clamp(26px, 3.5vw, 36px);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--gold); }
  .subtitle { color: var(--muted); font-size: 13.5px; max-width: 560px; line-height: 1.5; }

  .layout {
    display: grid;
    grid-template-columns: 270px 1fr 390px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1150px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .panel h2 {
    font-family: var(--font-d);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 700;
  }

  .palette-group { margin-bottom: 16px; }
  .palette-group-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0 0 7px 3px;
  }
  .palette-btn {
    display: block; width: 100%; text-align: left;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    font-family: var(--font-b);
    font-size: 13px;
    font-weight: 600;
    transition: border-color .15s, transform .1s, background .15s;
  }
  .palette-btn:hover { border-color: var(--gold); background: #252033; }
  .palette-btn:active { transform: scale(0.98); }
  .palette-btn small {
    display: block; font-weight: 400; color: var(--muted);
    margin-top: 2px; font-size: 11px; line-height: 1.35;
  }
  .swatch {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; margin-right: 7px; vertical-align: middle;
  }

  .toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar .btn { padding: 6px 11px; font-size: 12px; }

  #sequence {
    list-style: none; min-height: 70px; max-height: 68vh; overflow-y: auto;
  }
  #sequence:empty::after {
    content: "Add blocks from the left to build the fight.";
    color: var(--muted); font-size: 13px; display: block; padding: 24px 6px;
  }

  .block {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--violet);
    border-radius: 8px;
    padding: 9px 11px;
    margin-bottom: 7px;
    cursor: grab;
  }
  .block.flow { border-left-color: var(--violet); }
  .block.attack { border-left-color: var(--red); }
  .block.special { border-left-color: var(--pink); }
  .block.effect { border-left-color: var(--blue); }
  .block.dragging { opacity: 0.4; }
  .block-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .block-title { font-weight: 700; font-size: 13px; }
  .block-remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 5px;
  }
  .block-remove:hover { color: var(--red); }
  .block-fields { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label {
    font-size: 9.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .field input, .field select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 4px 6px; font-size: 12px; font-family: var(--font-b);
  }
  .field input { width: 64px; }
  .field select { width: 96px; }
  .indent { margin-left: 18px; }

  #stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  canvas#stage {
    background: #07060d;
    border: 2px solid var(--border);
    border-radius: 8px;
    max-width: 100%;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .hpbar-wrap { width: 100%; max-width: 340px; }
  .hpbar-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 3px;
  }
  .hpbar {
    height: 11px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .hpbar-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold), #ffb700);
    transition: width .12s ease;
  }
  #status-msg { font-size: 13px; color: var(--muted); min-height: 18px; text-align: center; }
  #status-msg.win { color: var(--green); font-weight: 700; }
  #status-msg.lose { color: var(--red); font-weight: 700; }

  .btn {
    font-family: var(--font-b); font-weight: 700; font-size: 13.5px;
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
    cursor: pointer; background: var(--panel2); color: var(--text);
    transition: filter .15s, transform .1s;
  }
  .btn.primary { background: var(--gold); color: #1a1608; border-color: var(--gold); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .controls-note {
    font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.5;
  }
  code {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 11px;
  }

  .boss-settings {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 4px;
  }
  .boss-settings .field input[type="color"] {
    width: 42px; height: 28px; padding: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Boss Fight <span>Maker</span></h1>
      <div class="subtitle">Build cinematic Deltarune-style patterns. Multi-stage attacks, board cuts, crystal storms, blade dances. Test-dodge everything.</div>
    </div>
  </header>

  <div class="layout">
    <!-- LEFT: Palette -->
    <div class="panel">
      <h2>Blocks</h2>
      <div id="palette"></div>
    </div>

    <!-- CENTER: Sequence -->
    <div class="panel">
      <h2>Sequence</h2>
      <div class="toolbar">
        <button class="btn" id="clear-seq-btn">Clear</button>
        <button class="btn" id="export-btn">Export</button>
        <button class="btn" id="import-btn">Import</button>
      </div>
      <ul id="sequence"></ul>
    </div>

    <!-- RIGHT: Stage -->
    <div class="panel">
      <h2>Test Fight</h2>
      <div id="stage-wrap">
        <div class="boss-settings">
          <div class="field">
            <label>Boss Shape</label>
            <select id="boss-shape">
              <option value="triangle">Triangle</option>
              <option value="circle">Circle</option>
              <option value="diamond">Diamond</option>
              <option value="star">Star</option>
              <option value="scythe">Scythe</option>
              <option value="blade">Blade</option>
            </select>
          </div>
          <div class="field">
            <label>Color</label>
            <input type="color" id="boss-color" value="#a78bfa">
          </div>
          <div class="field">
            <label>Size</label>
            <input type="number" id="boss-size" value="12" min="6" max="24" step="1" style="width:52px">
          </div>
        </div>
        <canvas id="stage" width="340" height="420"></canvas>
        <div class="hpbar-wrap">
          <div class="hpbar-label"><span>SOUL</span><span id="hp-text">100/100</span></div>
          <div class="hpbar"><div class="hpbar-fill" id="hp-fill" style="width:100%"></div></div>
        </div>
        <div id="status-msg"></div>
        <div class="btn-row">
          <button class="btn primary" id="play-btn">Test Fight</button>
          <button class="btn" id="stop-btn" disabled>Stop</button>
        </div>
        <div class="controls-note">Move with <code>Arrow keys</code> or <code>WASD</code>. Survive the sequence.</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // SHAPES

  const SHAPE_OPTS = [

    {value:"triangle", label:"Triangle"},

    {value:"heart", label:"Heart"},
    {value:"star", label:"Star"},
    {value:"cross", label:"Cross"},
    {value:"blade", label:"Blade"},
    {value:"scythe", label:"Scythe"},
    {value:"crystal", label:"Crystal"},
    {value:"shard", label:"Shard"},
    {value:"knife", label:"Knife"},

    {value:"gem", label:"Gem"},

    orbit_cascade: {

  // Add totalDuration + spin to every block except repeat_end
  Object.keys(BLOCK_DEFS).forEach(type => {
    if (type === "repeat_end") return;
    const def = BLOCK_DEFS[type];
    const existing = (def.fields || []).find(f => f.key === "duration");
    const defaultTotal = existing ? existing.def : 1;
    def.fields = (def.fields || []).concat([
      {key:"totalDuration", label:"Total Time", type:"number", def:defaultTotal, min:0.2, max:20, step:0.1},
      {key:"spinEnabled", label:"Spin", type:"select", def:"off", options:[{value:"off",label:"Off"},{value:"on",label:"On"}]},
      {key:"spinMin", label:"Spin Min", type:"number", def:2, min:0.3, max:12, step:0.1},
      {key:"spinMax", label:"Spin Max", type:"number", def:6, min:0.3, max:16, step:0.1}
    ]);
  });

  // Blue attack option on relevant attacks
  const BLUE_FIELDS = [
    {key:"blueEnabled", label:"Blue Atk", type:"select", def:"off", options:[{value:"off",label:"Off"},{value:"on",label:"On"}]},
    {key:"bluePercent", label:"Blue %", type:"number", def:30, min:5, max:100, step:5}
  ];
  ["crystal_barrage","knife_dance","shatter_ring","orbit_cascade","wall","sweeping_wall","spiral",
   "ring_burst","rain","shotgun","bounce","chaos","laser","giga_laser","cage"].forEach(t => {
    if (BLOCK_DEFS[t]) BLOCK_DEFS[t].fields = BLOCK_DEFS[t].fields.concat(BLUE_FIELDS);
  });

  function rollBlue(p) {
    return !!(p && p.blueEnabled === "on" && Math.random()*100 < (p.bluePercent != null ? p.bluePercent : 30));
  }

  function getBlockDuration(block) {
    const p = block && block.params ? block.params : {};
    const v = Number(p.totalDuration);
    if (Number.isFinite(v)) return Math.max(0.2, Math.min(20, v));
    return Math.max(0.2, Number(p.duration) || 1);
  }

  const GROUP_ORDER = ["Flow", "Attacks", "Special"];
  const COMBO_ALLOWED = Object.keys(BLOCK_DEFS).filter(t => 
    t !== "repeat_start" && t !== "repeat_end" && t !== "combo"
  );

  let uidCounter = 1;
  function makeBlock(type) {
    const def = BLOCK_DEFS[type];
    const params = {};
    (def.fields || []).forEach(f => params[f.key] = f.def);
    if (type === "combo") params.slots = [null, null, null, null];
    return { id: uidCounter++, type, params };
  }

  // ─────────────────────────────────────────────
  // UI
  // ─────────────────────────────────────────────
  let sequence = [];
  const paletteEl = document.getElementById("palette");
  const seqEl = document.getElementById("sequence");
  const statusEl = document.getElementById("status-msg");

  GROUP_ORDER.forEach(group => {
    const wrap = document.createElement("div");
    wrap.className = "palette-group";
    const title = document.createElement("div");
    title.className = "palette-group-title";
    title.textContent = group;
    wrap.appendChild(title);

    Object.keys(BLOCK_DEFS).forEach(type => {
      const def = BLOCK_DEFS[type];
      if (def.group !== group || type === "repeat_end") return;
      const btn = document.createElement("button");
      btn.className = "palette-btn";
      btn.innerHTML = `<span class="swatch" style="background:${def.color}"></span>${def.label}<small>${def.desc}</small>`;
      btn.addEventListener("click", () => {
        sequence.push(makeBlock(type));
        if (type === "repeat_start") sequence.push(makeBlock("repeat_end"));
        renderSequence();
      });
      wrap.appendChild(btn);
    });
    paletteEl.appendChild(wrap);
  });

  let dragFromIndex = null;

  function renderFieldsInto(container, fields, paramsObj) {
    const wrap = document.createElement("div");
    wrap.className = "block-fields";
    fields.forEach(f => {
      const fw = document.createElement("div");
      fw.className = "field";
      const lab = document.createElement("label");
      lab.textContent = f.label;
      fw.appendChild(lab);
      if (f.type === "select") {
        const sel = document.createElement("select");
        f.options.forEach(opt => {
          const o = document.createElement("option");
          o.value = opt.value; o.textContent = opt.label;
          if (paramsObj[f.key] === opt.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener("change", () => { paramsObj[f.key] = sel.value; });
        fw.appendChild(sel);
      } else {
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = f.min; inp.max = f.max; inp.step = f.step;
        inp.value = paramsObj[f.key];
        inp.addEventListener("change", () => {
          let v = parseFloat(inp.value);
          if (isNaN(v)) v = f.def;
          v = Math.max(f.min, Math.min(f.max, v));
          paramsObj[f.key] = v;
          inp.value = v;
        });
        fw.appendChild(inp);
      }
      wrap.appendChild(fw);
    });
    container.appendChild(wrap);
  }

  function renderSequence() {
    seqEl.innerHTML = "";
    let depth = 0;
    sequence.forEach((block, idx) => {
      const def = BLOCK_DEFS[block.type];
      if (!def) return;
      const li = document.createElement("li");
      li.className = "block " + (def.cat || "attack");
      li.draggable = true;
      li.dataset.index = idx;
      if (block.type === "repeat_end") depth = Math.max(0, depth - 1);
      if (depth > 0) li.classList.add("indent");

      const row = document.createElement("div");
      row.className = "block-row";
      const title = document.createElement("span");
      title.className = "block-title";
      title.style.color = def.color;
      title.textContent = def.label;
      row.appendChild(title);

      const rm = document.createElement("button");
      rm.className = "block-remove";
      rm.textContent = "×";
      rm.addEventListener("click", (e) => {
        e.stopPropagation();
        if (block.type === "repeat_start") {
          const endIdx = findMatchingEnd(idx);
          if (endIdx !== -1) sequence.splice(endIdx, 1);
        } else if (block.type === "repeat_end") {
          const startIdx = findMatchingStart(idx);
          if (startIdx !== -1) sequence.splice(startIdx, 1);
        }
        sequence = sequence.filter(b => b.id !== block.id);
        renderSequence();
      });
      row.appendChild(rm);
      li.appendChild(row);

      if (def.fields && def.fields.length) {
        renderFieldsInto(li, def.fields, block.params);
      }

      // Combo slots
      if (block.type === "combo") {
        if (!block.params.slots) block.params.slots = [null, null, null, null];
        const slotsWrap = document.createElement("div");
        slotsWrap.style.marginTop = "8px";
        slotsWrap.style.display = "flex";
        slotsWrap.style.flexDirection = "column";
        slotsWrap.style.gap = "6px";

        block.params.slots.forEach((slot, si) => {
          const box = document.createElement("div");
          box.style.border = "1px dashed var(--border)";
          box.style.borderRadius = "6px";
          box.style.padding = "6px 8px";

          const selRow = document.createElement("div");
          selRow.style.display = "flex";
          selRow.style.alignItems = "center";
          selRow.style.gap = "6px";
          const lab = document.createElement("span");
          lab.style.fontSize = "10px";
          lab.style.color = "var(--muted)";
          lab.textContent = "Slot " + (si + 1);
          selRow.appendChild(lab);

          const sel = document.createElement("select");
          sel.style.flex = "1";
          sel.style.fontSize = "12px";
          sel.style.background = "var(--bg)";
          sel.style.color = "var(--text)";
          sel.style.border = "1px solid var(--border)";
          sel.style.borderRadius = "5px";
          sel.style.padding = "4px";
          const empty = document.createElement("option");
          empty.value = ""; empty.textContent = "(empty)";
          sel.appendChild(empty);
          COMBO_ALLOWED.forEach(t => {
            const d = BLOCK_DEFS[t];
            const o = document.createElement("option");
            o.value = t; o.textContent = d.label;
            if (slot && slot.type === t) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", () => {
            const t = sel.value;
            if (!t) block.params.slots[si] = null;
            else {
              const nb = makeBlock(t);
              block.params.slots[si] = { type: t, params: nb.params };
            }
            renderSequence();
          });
          selRow.appendChild(sel);
          box.appendChild(selRow);

          if (slot) {
            const subDef = BLOCK_DEFS[slot.type];
            if (subDef && subDef.fields) renderFieldsInto(box, subDef.fields, slot.params);
          }
          slotsWrap.appendChild(box);
        });
        li.appendChild(slotsWrap);
      }

      if (block.type === "repeat_start") depth += 1;

      li.addEventListener("dragstart", () => { dragFromIndex = idx; li.classList.add("dragging"); });
      li.addEventListener("dragend", () => { li.classList.remove("dragging"); });
      li.addEventListener("dragover", e => e.preventDefault());
      li.addEventListener("drop", e => {
        e.preventDefault();
        if (dragFromIndex === null || dragFromIndex === idx) return;
        const moved = sequence.splice(dragFromIndex, 1)[0];
        sequence.splice(idx, 0, moved);
        dragFromIndex = null;
        renderSequence();
      });
      seqEl.appendChild(li);
    });
  }

  function findMatchingEnd(startIdx) {
    let d = 0;
    for (let i = startIdx; i < sequence.length; i++) {
      if (sequence[i].type === "repeat_start") d++;
      if (sequence[i].type === "repeat_end") { d--; if (d === 0) return i; }
    }
    return -1;
  }
  function findMatchingStart(endIdx) {
    let d = 0;
    for (let i = endIdx; i >= 0; i--) {
      if (sequence[i].type === "repeat_end") d++;
      if (sequence[i].type === "repeat_start") { d--; if (d === 0) return i; }
    }
    return -1;
  }

  // Default cool sequence
  sequence = [
    makeBlock("telegraph"),
    makeBlock("crystal_barrage"),
    makeBlock("wait"),
    makeBlock("knife_dance"),
    makeBlock("board_rend"),
    makeBlock("telegraph"),
    makeBlock("sword_corridor"),
    makeBlock("sanguine_slash"),
    makeBlock("giga_laser"),
  ];
  renderSequence();

  document.getElementById("clear-seq-btn").addEventListener("click", () => {
    if (confirm("Clear entire sequence?")) { sequence = []; renderSequence(); }
  });
  document.getElementById("export-btn").addEventListener("click", () => {
    const data = sequence.map(b => ({ type: b.type, params: b.params }));
    const json = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(json).then(() => {
      statusEl.textContent = "Sequence copied!";
      setTimeout(() => { if (statusEl.textContent.includes("copied")) statusEl.textContent = ""; }, 2000);
    }).catch(() => prompt("Copy this JSON:", json));
  });
  document.getElementById("import-btn").addEventListener("click", () => {
    const raw = prompt("Paste sequence JSON:");
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) throw new Error("Not an array");
      sequence = data.map(d => {
        const b = makeBlock(d.type);
        if (d.params) Object.assign(b.params, d.params);
        return b;
      });
      renderSequence();
      statusEl.textContent = "Imported " + sequence.length + " blocks.";
    } catch (err) {
      alert("Invalid JSON: " + err.message);
    }
  });

  function idleState() {
    return {
      bullets: [], lasers: [], rings: [], particles: [], cuts: [],
      player: { x: BOX.x + BOX.w/2, y: BOX.y + BOX.h - 30, r: 6.5, hp: 100, invuln: 0, moving: false },
      bossX: BOX.x + BOX.w/2,

  function startFight() {
    if (sequence.length === 0) {

    fightSequence = sequence.map(b => ({ type: b.type, params: Object.assign({}, b.params) }));

  // ─────────────────────────────────────────────
  // BULLET HELPERS
  // ─────────────────────────────────────────────
  function mkBullet(x, y, vx, vy, r, shape, extra) {
    const b = {
      x, y, vx, vy, r: r || 6, shape: shape || "circle",
      life: 14, rotation: 0, spinSpeed: 0, blue: false
    };
    if (extra) Object.assign(b, extra);
    if (b.spinEnabled) {
      const lo = Number(b.spinMin) || 2, hi = Math.max(lo, Number(b.spinMax) || 6);
      b.spinSpeed = (lo + Math.random() * (hi - lo)) * (Math.random() < 0.5 ? -1 : 1);
    }
    return b;
  }

  function projectileExtra(params, extra) {
    const out = Object.assign({}, extra || {});
    out.spinEnabled = params && params.spinEnabled === "on";
    out.spinMin = params && params.spinMin != null ? params.spinMin : 2;
    out.spinMax = params && params.spinMax != null ? params.spinMax : 6;
    out.blue = rollBlue(params);
    return out;
  }

  // ─────────────────────────────────────────────
  // SPAWN FUNCTIONS
  // ─────────────────────────────────────────────
  function spawnCrystalBarrage(g, p) {
    const n = p.count || 7;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + Math.random() * 0.3;
      const speed = (p.speed || 95) * (0.85 + Math.random() * 0.3);
      g.bullets.push(mkBullet(
        g.bossX, BOX.y + 20,
        Math.sin(ang) * speed, Math.cos(ang) * speed,
        7, p.shape || "crystal",
        projectileExtra(p, {
          crystal: true,
          reverseAt: p.reverseAt || 0.55,
          reverseTimer: 0,
          shards: p.shards || 5,
          originalSpeed: speed
        })
      ));
    }
  }

  function spawnKnifeDance(g, p) {
    const n = p.count || 6;
    for (let i = 0; i < n; i++) {
      // Spawn around the edges, pointing toward player
      const side = i % 4;
      let x, y, ang;
      if (side === 0) { x = BOX.x - 20; y = BOX.y + Math.random() * BOX.h; }
      else if (side === 1) { x = BOX.x + BOX.w + 20; y = BOX.y + Math.random() * BOX.h; }
      else if (side === 2) { x = BOX.x + Math.random() * BOX.w; y = BOX.y - 20; }
      else { x = BOX.x + Math.random() * BOX.w; y = BOX.y + BOX.h + 20; }

      ang = Math.atan2(g.player.x - x, g.player.y - y);
      g.bullets.push(mkBullet(x, y, 0, 0, 8, p.shape || "knife", projectileExtra(p, {
        knife: true,
        lockTime: p.lockTime || 0.7,
        lockTimer: 0,
        slashSpeed: p.slashSpeed || 520,
        targetAng: ang,
        phase: "lock"
      })));
    }
  }

  function spawnShatterRing(g, p, idx) {
    g.rings.push({
      cx: g.bossX, cy: BOX.y + 26, r: 10,
      speed: p.expandSpeed || 110,
      thickness: 7, maxR: 380,
      shatterAt: 0.55 + idx * 0.08,
      shattered: false,
      shards: p.shards || 10,
      shape: p.shape || "shard",
      blue: rollBlue(p),
      params: p
    });
  }

  function spawnOrbitCascade(g, p) {
    const n = p.count || 12;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      g.bullets.push(mkBullet(g.bossX, BOX.y + 24, 0, 0, 5.5, p.shape || "star", projectileExtra(p, {
        orbit: true,
        orbitCx: g.bossX, orbitCy: BOX.y + 24,
        orbitAngle: ang, orbitRadius: 32,
        orbitSpeed: 2.6 + Math.random() * 0.8,
        orbitTimeLeft: p.orbitTime || 1.3,
        flySpeed: p.speed || 140,
        releaseWave: Math.floor(i / (n / (p.releaseWaves || 3)))
      })));
    }
  }

  function spawnWallRow(g, gapStart, gapSize, params) {
    const gapEnd = gapStart + gapSize;
    const step = 14;
    for (let x = BOX.x; x <= BOX.x + BOX.w; x += step) {
      if (x >= gapStart && x <= gapEnd) continue;
      g.bullets.push(mkBullet(x, BOX.y - 6, 0, params.speed, 5.5, params.shape, projectileExtra(params)));
    }
  }

  function spawnWall(g, p) {
    const gapStart = BOX.x + (p.gapPos / 100) * BOX.w - p.gapSize / 2;
    spawnWallRow(g, gapStart, p.gapSize, p);
  }

  function spawnRainDrop(g, p) {
    const x = BOX.x + Math.random() * BOX.w;
    g.bullets.push(mkBullet(x, BOX.y - 6, 0, p.speed, 5, p.shape, projectileExtra(p)));
  }

  function spawnRingBurst(g, p) {
    const cx = g.bossX, cy = BOX.y + 28;
    for (let i = 0; i < p.count; i++) {
      const ang = (360 / p.count) * i * Math.PI / 180;
      g.bullets.push(mkBullet(cx, cy, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5.5, p.shape, projectileExtra(p)));
    }
  }

  function spawnSpiralTick(g, p, angle) {
    const cx = g.bossX, cy = BOX.y + 18;
    for (let i = 0; i < p.arms; i++) {
      const ang = (angle + (360 / p.arms) * i) * Math.PI / 180;
      g.bullets.push(mkBullet(cx, cy, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5, p.shape, projectileExtra(p)));
    }
  }

  function spawnShotgunWave(g, p) {
    const px = g.player.x, py = g.player.y;
    const sx = g.bossX, sy = BOX.y - 4;
    const baseAng = Math.atan2(px - sx, py - sy);
    const half = (p.spread * Math.PI / 180) / 2;
    for (let i = 0; i < p.count; i++) {
      const t = p.count === 1 ? 0.5 : i / (p.count - 1);
      const ang = baseAng - half + t * half * 2;
      g.bullets.push(mkBullet(sx, sy, Math.sin(ang) * p.speed, Math.cos(ang) * p.speed, 5.5, p.shape, projectileExtra(p)));
    }
  }

  function spawnBounce(g, p) {
    for (let i = 0; i < p.count; i++) {
      const ang = (Math.random() * 50 - 25 + 180) * Math.PI / 180;
      const speed = p.speed * (0.85 + Math.random() * 0.3);
      g.bullets.push(mkBullet(
        BOX.x + 20 + Math.random() * (BOX.w - 40), BOX.y - 4,
        Math.sin(ang) * speed, Math.cos(ang) * speed, 6, p.shape,
        projectileExtra(p, { bounce: true, bouncesLeft: p.bounces })
      ));
    }
  }

  function spawnSwordCorridor(g, p) {
    // Create two vertical rows of blades with a gap
    const gap = p.gapSize || 55;
    const mid = BOX.y + BOX.h / 2;
    g.corridor = {
      blades: [],
      gapCenter: mid,
      gapSize: gap,
      shiftSpeed: p.shiftSpeed || 1.6,
      holdTime: p.holdTime || 2.2,
      t: 0,
      phase: "move",
      shape: p.shape || "blade",
      params: p
    };
    const spacing = 16;
    for (let y = BOX.y - 10; y < BOX.y + BOX.h + 20; y += spacing) {
      // left row
      g.corridor.blades.push({ x: BOX.x + 28, y, side: "left", ang: 0 });
      // right row
      g.corridor.blades.push({ x: BOX.x + BOX.w - 28, y, side: "right", ang: 0 });
    }
  }

  // ─────────────────────────────────────────────
  // BOARD REND
  // ─────────────────────────────────────────────
  function startBoardRend(g, p) {
    g.boardRend = {
      cutsLeft: p.cuts || 3,
      orient: p.orient || "random",
      gapTime: p.gapTime || 0.9,
      bulletRate: p.bulletRate || 8,
      shape: p.shape || "shard",
      params: p,
      state: "slash",
      t: 0,
      currentOrient: null,
      separation: 0,
      slashProgress: 0
    };
    beginRendCut(g);
  }

  function beginRendCut(g) {
    const r = g.boardRend;
    if (!r) return;
    if (r.orient === "random") {
      r.currentOrient = Math.random() < 0.5 ? "h" : "v";
    } else {
      r.currentOrient = r.orient;
    }
    r.state = "slash";
    r.t = 0;
    r.separation = 0;
    r.slashProgress = 0;
    r.spawnAcc = 0;
  }

  function updateBoardRend(g, dt) {
    const r = g.boardRend;
    if (!r) return;
    r.t += dt;

    if (r.state === "slash") {
      r.slashProgress = Math.min(1, r.t / 0.25);
      if (r.t >= 0.25) {
        r.state = "separate";
        r.t = 0;
        // Damage if player is on the cut line
        const pr = g.player.r;
        if (r.currentOrient === "h") {
          if (Math.abs(g.player.y - (BOX.y + BOX.h / 2)) < 10 + pr) {
            hitPlayer(g, 12);
          }
        } else {
          if (Math.abs(g.player.x - (BOX.x + BOX.w / 2)) < 10 + pr) {
            hitPlayer(g, 12);
          }
        }
      }
    } else if (r.state === "separate") {
      r.separation = Math.min(1, r.t / 0.35);
      if (r.t >= 0.35) {
        r.state = "gap";
        r.t = 0;
        r.spawnAcc = 0;
      }
    } else if (r.state === "gap") {
      r.separation = 1;
      r.spawnAcc += dt;
      const interval = 1 / (r.bulletRate || 8);
      while (r.spawnAcc >= interval) {
        r.spawnAcc -= interval;
        // Fire from the gap
        if (r.currentOrient === "h") {
          const x = BOX.x + Math.random() * BOX.w;
          const y = BOX.y + BOX.h / 2;
          const dir = Math.random() < 0.5 ? -1 : 1;
          g.bullets.push(mkBullet(x, y, 0, dir * 130, 5, r.shape, projectileExtra(r.params)));
        } else {
          const x = BOX.x + BOX.w / 2;
          const y = BOX.y + Math.random() * BOX.h;
          const dir = Math.random() < 0.5 ? -1 : 1;
          g.bullets.push(mkBullet(x, y, dir * 130, 0, 5, r.shape, projectileExtra(r.params)));
        }
      }
      if (r.t >= r.gapTime) {
        r.state = "reconnect";
        r.t = 0;
      }
    } else if (r.state === "reconnect") {
      r.separation = 1 - Math.min(1, r.t / 0.4);
      if (r.t >= 0.4) {
        r.cutsLeft--;
        if (r.cutsLeft > 0) beginRendCut(g);
        else r.state = "done";
      }
    }

    // Constrain player to the active half
    if (r.state !== "done" && r.separation > 0.1) {
      const midX = BOX.x + BOX.w / 2;
      const midY = BOX.y + BOX.h / 2;
      const sep = r.separation * 18;
      if (r.currentOrient === "v") {
        // vertical cut → left/right halves
        if (g.player.x < midX) {
          g.player.x = Math.min(g.player.x, midX - sep - g.player.r);
        } else {
          g.player.x = Math.max(g.player.x, midX + sep + g.player.r);
        }
      } else {
        if (g.player.y < midY) {
          g.player.y = Math.min(g.player.y, midY - sep - g.player.r);
        } else {
          g.player.y = Math.max(g.player.y, midY + sep + g.player.r);
        }
      }
    }
  }

  // ─────────────────────────────────────────────
  // ENTER / TICK
  // ─────────────────────────────────────────────
  function enterInstruction(g, block) {
    if (!block) return;
    const p = block.params || {};
    switch (block.type) {
      case "crystal_barrage": spawnCrystalBarrage(g, p); break;
      case "knife_dance": spawnKnifeDance(g, p); break;
      case "board_rend": startBoardRend(g, p); break;
      case "sword_corridor": spawnSwordCorridor(g, p); break;
      case "sanguine_slash":
        g.sanguine = { cycles: p.cycles || 4, gap: p.gap || 0.55, width: p.width || 18, t: 0, cycle: 0, cuts: 1 };
        break;
      case "shatter_ring":
        g.ringWavesLeft = p.rings || 3;
        g.ringGapAcc = 0;
        g.ringParams = p;
        g.ringIdx = 0;
        spawnShatterRing(g, p, 0);
        g.ringIdx++;
        g.ringWavesLeft--;
        break;
      case "orbit_cascade": spawnOrbitCascade(g, p); break;
      case "wall": spawnWall(g, p); break;
      case "sweeping_wall": g.spawnAcc = 0; break;
      case "spiral": g.spawnAcc = 0; g.spiralAngle = 0; break;
      case "ring_burst": spawnRingBurst(g, p); break;
      case "rain": g.spawnAcc = 0; break;
      case "shotgun":
        g.shotgunWavesLeft = (p.waves || 2) - 1;
        g.shotgunGapAcc = 0;
        spawnShotgunWave(g, p);
        break;
      case "bounce": spawnBounce(g, p); break;
      case "chaos": g.spawnAcc = 0; g.chaosParams = p; break;
      case "laser":
        g.lasers.push({
          mode: p.mode || "sweep", width: p.width || 20, speed: p.speed || 95,
          t: 0, duration: p.duration || 2.3, x: BOX.x + BOX.w / 2, dir: 1, blue: rollBlue(p)
        });
        break;
      case "giga_laser":
        g.giga = {
          charge: p.charge || 1.0, hold: p.hold || 1.3, width: p.width || 78,
          t: 0, phase: "charge", x: g.bossX, blue: rollBlue(p)
        };
        break;
      case "cage":
        g.cage = {
          left: BOX.x - 12, right: BOX.x + BOX.w + 12,
          top: BOX.y - 12, bottom: BOX.y + BOX.h + 12,
          targetGap: p.gap || 85, speed: p.speed || 58, t: 0
        };
        break;
      case "telegraph": g.telegraphFlash = p.duration || 0.6; break;
      case "shake": g.shakeLeft = p.duration || 0.35; g.shakeIntensity = p.intensity || 7; break;
      case "flash": g.flashLeft = p.duration || 0.15; g.flashColor = p.color || "white"; break;
      case "slowmo": g.timeScale = (p.factor || 35) / 100; g.slowmoLeft = p.duration || 1; break;
      case "arena_shrink":
        g.arenaTargetScale = (p.scale || 65) / 100;
        g.arenaShrinkLeft = p.duration || 2.8;
        g.currentScale = 1;
        break;
      case "clear_bullets": g.bullets = []; g.lasers = []; g.rings = []; break;
      case "move_boss":
        g.bossFrom = g.bossX;
        g.bossTo = BOX.x + (p.targetPercent / 100) * BOX.w;
        break;
      case "combo":
        g.comboProcs = (p.slots || []).filter(Boolean).map(sub => {
          const proc = { type: sub.type, params: sub.params, state: {}, elapsed: 0 };
          // Re-use enter for simple ones
          if (["wall","ring_burst","bounce","crystal_barrage","knife_dance","orbit_cascade"].includes(sub.type)) {
            enterInstruction(g, { type: sub.type, params: sub.params });
          }
          return proc;
        });
        break;
    }
  }

  function hitPlayer(g, dmg) {
    if (g.player.invuln > 0 || g.player.hitThisFrame) return;
    g.player.hp = Math.max(0, g.player.hp - (dmg || 10));
    g.player.invuln = 0.7;
    g.player.hitThisFrame = true;
    for (let i = 0; i < 12; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 90;
      g.particles.push({
        x: g.player.x, y: g.player.y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0.3 + Math.random() * 0.25, color: "#ffd23f"
      });
    }
    hpFill.style.width = g.player.hp + "%";
    hpText.textContent = g.player.hp + "/100";
    if (g.player.hp <= 0) g.lost = true;
  }

  // ─────────────────────────────────────────────
  // MAIN LOOP
  // ─────────────────────────────────────────────
  function loop(ts) {
    if (!game || !game.running) return;
    if (lastFrame === null) lastFrame = ts;
    let rawDt = Math.min((ts - lastFrame) / 1000, 0.05);
    lastFrame = ts;
    const dt = rawDt * (game.timeScale || 1);
    update(game, dt, rawDt);
    render(game);
    if (game.won) { stopFight("Fight cleared!", "win"); return; }
    if (game.lost) { stopFight("You were hit too many times.", "lose"); return; }
    requestAnimationFrame(loop);
  }

  function applyArenaScale(g) {
    const s = g.currentScale;
    const cx = BASE_BOX.x + BASE_BOX.w / 2;
    const cy = BASE_BOX.y + BASE_BOX.h / 2;
    BOX.w = BASE_BOX.w * s;
    BOX.h = BASE_BOX.h * s;
    BOX.x = cx - BOX.w / 2;
    BOX.y = cy - BOX.h / 2;
  }

  function update(g, dt, rawDt) {
    g.player.hitThisFrame = false;

    // Effects
    if (g.slowmoLeft > 0) {
      g.slowmoLeft -= rawDt;
      if (g.slowmoLeft <= 0) g.timeScale = 1;
    }
    if (g.shakeLeft > 0) {
      g.shakeLeft -= rawDt;
      const intensity = g.shakeIntensity * (g.shakeLeft > 0 ? 1 : 0);
      shakeOffset.x = (Math.random() - 0.5) * intensity * 2;
      shakeOffset.y = (Math.random() - 0.5) * intensity * 2;
    } else {
      shakeOffset.x = 0; shakeOffset.y = 0;
    }
    if (g.flashLeft > 0) g.flashLeft -= rawDt;

    if (g.arenaShrinkLeft > 0) {
      g.arenaShrinkLeft -= dt;
      g.currentScale += (g.arenaTargetScale - g.currentScale) * Math.min(1, dt * 3);
      if (g.arenaShrinkLeft <= 0) {
        g.currentScale += (1 - g.currentScale) * Math.min(1, dt * 4);
        if (Math.abs(g.currentScale - 1) < 0.01) g.currentScale = 1;
      }
      applyArenaScale(g);
    } else if (g.currentScale !== 1) {
      g.currentScale += (1 - g.currentScale) * Math.min(1, dt * 4);
      if (Math.abs(g.currentScale - 1) < 0.01) g.currentScale = 1;
      applyArenaScale(g);
    }

    // Player movement
    const speed = 160;
    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    if (keys["arrowup"] || keys["w"]) dy -= 1;
    if (keys["arrowdown"] || keys["s"]) dy += 1;
    g.player.moving = !!(dx || dy);
    if (dx || dy) {
      const len = Math.hypot(dx, dy) || 1;
      g.player.x += (dx / len) * speed * dt;
      g.player.y += (dy / len) * speed * dt;
    }
    g.player.x = Math.max(BOX.x + g.player.r, Math.min(BOX.x + BOX.w - g.player.r, g.player.x));
    g.player.y = Math.max(BOX.y + g.player.r, Math.min(BOX.y + BOX.h - g.player.r, g.player.y));

    if (g.player.invuln > 0) g.player.invuln -= rawDt;
    if (g.telegraphFlash > 0) g.telegraphFlash -= dt;

    // Board rend
    if (g.boardRend) updateBoardRend(g, dt);

    // Instruction pointer
    if (g.pc === 0 && g.t === 0 && g.steps === 0) enterInstruction(g, fightSequence[0]);
    const block = fightSequence[g.pc];
    if (block) {
      g.t += dt;
      const dur = getBlockDuration(block);
      const p = block.params || {};

      // Continuous attacks
      if (block.type === "rain") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        const interval = 1 / (p.rate || 6);
        while (g.spawnAcc >= interval) {
          g.spawnAcc -= interval;
          spawnRainDrop(g, p);
        }
      }
      if (block.type === "spiral") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        g.spiralAngle = (g.spiralAngle || 0) + (p.rotSpeed || 140) * dt;
        const interval = 1 / (p.rate || 8);
        while (g.spawnAcc >= interval) {
          g.spawnAcc -= interval;
          spawnSpiralTick(g, p, g.spiralAngle);
        }
      }
      if (block.type === "sweeping_wall") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        const interval = 0.13;
        while (g.spawnAcc >= interval) {
          g.spawnAcc -= interval;
          const frac = 0.5 + 0.5 * Math.sin(g.t * (p.oscSpeed || 2.4));
          spawnWallRow(g, BOX.x + frac * BOX.w - p.gapSize / 2, p.gapSize, p);
        }
      }
      if (block.type === "shotgun") {
        g.shotgunGapAcc = (g.shotgunGapAcc || 0) + dt;
        if (g.shotgunWavesLeft > 0 && g.shotgunGapAcc >= (p.gap || 0.5)) {
          g.shotgunGapAcc = 0;
          g.shotgunWavesLeft--;
          spawnShotgunWave(g, p);
        }
      }
      if (block.type === "shatter_ring" && g.ringWavesLeft > 0) {
        g.ringGapAcc = (g.ringGapAcc || 0) + dt;
        if (g.ringGapAcc >= (p.gap || 0.5)) {
          g.ringGapAcc = 0;
          spawnShatterRing(g, g.ringParams, g.ringIdx);
          g.ringIdx++;
          g.ringWavesLeft--;
        }
      }
      if (block.type === "chaos") {
        g.spawnAcc = (g.spawnAcc || 0) + dt;
        const rate = 3.8 * (p.intensity || 1.3);
        const interval = 1 / rate;
        while (g.spawnAcc >= interval) {
          g.spawnAcc -= interval;
          if (Math.random() < 0.5) spawnRainDrop(g, Object.assign({}, p, { speed: 100 + Math.random() * 70 }));
          else if (Math.random() < 0.5) {
            const ang = Math.random() * Math.PI * 2;
            g.bullets.push(mkBullet(g.bossX, BOX.y + 22, Math.sin(ang) * 115, Math.cos(ang) * 115, 5, p.shape, projectileExtra(p)));
          } else {
            const px = g.player.x, py = g.player.y;
            const dx = px - g.bossX, dy = py - (BOX.y - 4);
            const len = Math.hypot(dx, dy) || 1;
            g.bullets.push(mkBullet(g.bossX, BOX.y - 4, dx / len * 150, dy / len * 150, 6, p.shape, projectileExtra(p)));
          }
        }
      }
      if (block.type === "move_boss") {
        const frac = Math.min(1, g.t / Math.max(0.001, dur));
        g.bossX = g.bossFrom + (g.bossTo - g.bossFrom) * frac;
      }
      if (block.type === "cage" && g.cage) {
        const c = g.cage;
        c.t += dt;
        const cx = BOX.x + BOX.w / 2, cy = BOX.y + BOX.h / 2;
        const targetHalf = c.targetGap / 2;
        c.left = Math.min(c.left + c.speed * dt, cx - targetHalf);
        c.right = Math.max(c.right - c.speed * dt, cx + targetHalf);
        c.top = Math.min(c.top + c.speed * dt, cy - targetHalf);
        c.bottom = Math.max(c.bottom - c.speed * dt, cy + targetHalf);
      }
      if (block.type === "giga_laser" && g.giga) {
        const gl = g.giga;
        gl.t += dt;
        gl.x = g.bossX;
        if (gl.phase === "charge" && gl.t >= gl.charge) { gl.phase = "fire"; gl.t = 0; }
        else if (gl.phase === "fire" && gl.t >= gl.hold) gl.phase = "done";
      }
      if (block.type === "sanguine_slash" && g.sanguine) {
        const s = g.sanguine;
        s.t += dt;
        if (s.t >= s.gap) {
          s.t = 0;
          // Create cuts
          const cuts = Math.min(s.cuts, 4);
          for (let i = 0; i < cuts; i++) {
            const ang = (i / cuts) * Math.PI + (s.cycle * 0.4);
            g.cuts.push({
              x: g.player.x, y: g.player.y,
              ang, width: s.width, life: 0.35, maxLife: 0.35
            });
          }
          s.cycle++;
          s.cuts = Math.min(4, s.cuts + 1);
          if (s.cycle >= s.cycles) s.done = true;
        }
      }
      if (block.type === "sword_corridor" && g.corridor) {
        const c = g.corridor;
        c.t += dt;
        if (c.phase === "move") {
          c.gapCenter = BOX.y + BOX.h / 2 + Math.sin(c.t * c.shiftSpeed) * (BOX.h * 0.28);
          if (c.t >= c.holdTime) {
            c.phase = "slash";
            c.t = 0;
            // Point all blades toward player and prepare to fly
            c.blades.forEach(b => {
              b.ang = Math.atan2(g.player.x - b.x, g.player.y - b.y);
              b.vx = Math.sin(b.ang) * 380;
              b.vy = Math.cos(b.ang) * 380;
            });
          }
        } else if (c.phase === "slash") {
          c.blades.forEach(b => {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
          });
        }
      }

      const isRepeat = block.type === "repeat_start" || block.type === "repeat_end";
      const finished = isRepeat || g.t >= dur;

      if (finished) {
        g.steps++;
        if (g.steps > 1500) { g.won = true; return; }
        if (block.type === "repeat_start") {
          g.repeatStack.push({ startIdx: g.pc + 1, remaining: (p.count || 2) - 1 });
          g.pc += 1;
        } else if (block.type === "repeat_end") {
          const top = g.repeatStack[g.repeatStack.length - 1];
          if (top && top.remaining > 0) {
            top.remaining -= 1;
            g.pc = top.startIdx;
          } else {
            g.repeatStack.pop();
            g.pc += 1;
          }
        } else {
          g.pc += 1;
        }
        g.t = 0;
        if (block.type === "cage") g.cage = null;
        if (block.type === "giga_laser") g.giga = null;
        if (block.type === "combo") g.comboProcs = null;
        if (block.type === "board_rend") g.boardRend = null;
        if (block.type === "sword_corridor") g.corridor = null;
        if (block.type === "sanguine_slash") g.sanguine = null;
        if (g.pc < fightSequence.length) enterInstruction(g, fightSequence[g.pc]);
      }
    }
    if (g.pc >= fightSequence.length) g.won = true;

    // Lasers
    g.lasers.forEach(L => {
      L.t += dt;
      if (L.mode === "sweep") {
        L.x += L.dir * L.speed * dt;
        if (L.x < BOX.x + L.width / 2) { L.x = BOX.x + L.width / 2; L.dir = 1; }
        if (L.x > BOX.x + BOX.w - L.width / 2) { L.x = BOX.x + BOX.w - L.width / 2; L.dir = -1; }
      } else if (L.mode === "vertical") {
        L.x = BOX.x + BOX.w / 2 + Math.sin(L.t * 1.5) * (BOX.w * 0.32);
      } else {
        L.x = g.bossX;
      }
    });
    g.lasers = g.lasers.filter(L => L.t < L.duration);

    // Rings
    g.rings.forEach(R => {
      R.r += R.speed * dt;
      if (!R.shattered && R.r > 40 && R.r / R.maxR > (R.shatterAt || 0.5)) {
        R.shattered = true;
        // Spawn shards
        for (let i = 0; i < (R.shards || 10); i++) {
          const ang = (i / R.shards) * Math.PI * 2 + Math.random() * 0.2;
          const spd = 90 + Math.random() * 50;
          g.bullets.push(mkBullet(R.cx + Math.sin(ang) * R.r, R.cy + Math.cos(ang) * R.r,
            Math.sin(ang) * spd, Math.cos(ang) * spd, 4.5, R.shape || "shard",
            projectileExtra(R.params || {}, { blue: R.blue })));
        }
      }
    });
    g.rings = g.rings.filter(R => R.r < R.maxR);

    // Cuts (sanguine)
    g.cuts.forEach(c => { c.life -= dt; });
    g.cuts = g.cuts.filter(c => c.life > 0);

    // Bullets
    const newBullets = [];
    g.bullets.forEach(b => {
      if (b.spinEnabled) b.rotation += (b.spinSpeed || 0) * dt;

      // Crystal reverse + explode
      if (b.crystal) {
        b.reverseTimer = (b.reverseTimer || 0) + dt;
        const totalLife = 1.1;
        if (b.reverseTimer < (b.reverseAt || 0.55) * totalLife) {
          // still going out
        } else if (!b.reversed) {
          b.reversed = true;
          b.vx *= -0.7;
          b.vy *= -0.7;
        } else if (b.reverseTimer > totalLife && !b.exploded) {
          b.exploded = true;
          b.life = 0;
          for (let i = 0; i < (b.shards || 5); i++) {
            const ang = (i / b.shards) * Math.PI * 2 + Math.random() * 0.4;
            const spd = (i % 3 === 0 ? 140 : 90) + Math.random() * 30;
            newBullets.push(mkBullet(b.x, b.y, Math.sin(ang) * spd, Math.cos(ang) * spd, 4, "shard", {
              blue: b.blue, life: i % 3 === 0 ? 3.5 : 2.2
            }));
          }
        }
      }

      // Knife lock → slash
      if (b.knife) {
        if (b.phase === "lock") {
          b.lockTimer = (b.lockTimer || 0) + dt;
          // Keep pointing at player
          b.targetAng = Math.atan2(g.player.x - b.x, g.player.y - b.y);
          b.rotation = -b.targetAng;
          if (b.lockTimer >= (b.lockTime || 0.7)) {
            b.phase = "slash";
            b.vx = Math.sin(b.targetAng) * (b.slashSpeed || 520);
            b.vy = Math.cos(b.targetAng) * (b.slashSpeed || 520);
          }
        }
      }

      // Orbit
      if (b.orbit) {
        if (b.orbitTimeLeft > 0) {
          b.orbitTimeLeft -= dt;
          b.orbitAngle += b.orbitSpeed * dt;
          b.orbitRadius += 8 * dt;
          b.x = b.orbitCx + Math.sin(b.orbitAngle) * b.orbitRadius;
          b.y = b.orbitCy + Math.cos(b.orbitAngle) * b.orbitRadius;
        } else if (!b.released) {
          b.released = true;
          const ang = b.orbitAngle;
          b.vx = Math.sin(ang) * b.flySpeed;
          b.vy = Math.cos(ang) * b.flySpeed;
          b.orbit = false;
        }
      }

      if (!b.orbit && !b.knife || b.phase === "slash") {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }

      b.life -= dt;

      if (b.bounce && b.bouncesLeft > 0) {
        if (b.x < BOX.x + b.r) { b.x = BOX.x + b.r; b.vx = Math.abs(b.vx); b.bouncesLeft--; }
        if (b.x > BOX.x + BOX.w - b.r) { b.x = BOX.x + BOX.w - b.r; b.vx = -Math.abs(b.vx); b.bouncesLeft--; }
        if (b.y < BOX.y + b.r) { b.y = BOX.y + b.r; b.vy = Math.abs(b.vy); b.bouncesLeft--; }
        if (b.y > BOX.y + BOX.h - b.r) { b.y = BOX.y + BOX.h - b.r; b.vy = -Math.abs(b.vy); b.bouncesLeft--; }
      }
    });
    if (newBullets.length) g.bullets.push(...newBullets);
    g.bullets = g.bullets.filter(b =>
      b.life > 0 &&
      b.x > BOX.x - 50 && b.x < BOX.x + BOX.w + 50 &&
      b.y > BOX.y - 50 && b.y < BOX.y + BOX.h + 50
    );

    // Particles
    g.particles.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      p.vx *= 0.95; p.vy *= 0.95;
    });
    g.particles = g.particles.filter(p => p.life > 0);

    // Collision
    if (g.player.invuln <= 0 && !g.player.hitThisFrame) {
      let hit = false;
      for (const b of g.bullets) {
        if (Math.hypot(b.x - g.player.x, b.y - g.player.y) < b.r + g.player.r - 0.8) {
          if (!b.blue || g.player.moving) { hit = true; break; }
        }
      }
      if (!hit) {
        for (const L of g.lasers) {
          if (Math.abs(g.player.x - L.x) < L.width / 2 + g.player.r) {
            if (!L.blue || g.player.moving) { hit = true; break; }
          }
        }
      }
      if (!hit) {
        for (const R of g.rings) {
          if (R.shattered) continue;
          const d = Math.hypot(g.player.x - R.cx, g.player.y - R.cy);
          if (Math.abs(d - R.r) < R.thickness / 2 + g.player.r) {
            if (R.blue && !g.player.moving) continue;
            hit = true; break;
          }
        }
      }
      if (!hit && g.cage) {
        const c = g.cage, pr = g.player.r;
        if (g.player.x - pr < c.left || g.player.x + pr > c.right ||
            g.player.y - pr < c.top || g.player.y + pr > c.bottom) hit = true;
      }
      if (!hit && g.giga && g.giga.phase === "fire") {
        if (Math.abs(g.player.x - g.giga.x) < g.giga.width / 2 + g.player.r) {
          if (!g.giga.blue || g.player.moving) hit = true;
        }
      }
      // Sanguine cuts
      if (!hit) {
        for (const c of g.cuts) {
          // Approximate as a thick line through the player position
          const dx = g.player.x - c.x, dy = g.player.y - c.y;
          const proj = dx * Math.sin(c.ang) + dy * Math.cos(c.ang);
          const perp = dx * Math.cos(c.ang) - dy * Math.sin(c.ang);
          if (Math.abs(perp) < c.width / 2 + g.player.r && Math.abs(proj) < 200) {
            hit = true; break;
          }
        }
      }
      // Corridor blades
      if (!hit && g.corridor && g.corridor.phase === "slash") {
        for (const b of g.corridor.blades) {
          if (Math.hypot(b.x - g.player.x, b.y - g.player.y) < 10 + g.player.r) {
            hit = true; break;
          }
        }
      }
      if (hit) hitPlayer(g, 10);
    }
  }

  // ─────────────────────────────────────────────
  // DRAWING
  // ─────────────────────────────────────────────
  function drawShape(ctx, x, y, r, shape) {
    ctx.beginPath();
    if (shape === "square") ctx.rect(x - r, y - r, r * 2, r * 2);
    else if (shape === "triangle") {
      ctx.moveTo(x, y - r * 1.2); ctx.lineTo(x - r, y + r * 0.85); ctx.lineTo(x + r, y + r * 0.85); ctx.closePath();
    } else if (shape === "diamond") {
      ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.15, y); ctx.lineTo(x, y + r * 1.25); ctx.lineTo(x - r * 1.15, y); ctx.closePath();
    } else if (shape === "heart") {
      const s = r / 6;
      ctx.moveTo(x, y + 7 * s);
      ctx.bezierCurveTo(x, y + 3 * s, x - 6 * s, y + 2 * s, x - 6 * s, y - 1 * s);
      ctx.bezierCurveTo(x - 6 * s, y - 5 * s, x - 2 * s, y - 5 * s, x, y - 2 * s);
      ctx.bezierCurveTo(x + 2 * s, y - 5 * s, x + 6 * s, y - 5 * s, x + 6 * s, y - 1 * s);
      ctx.bezierCurveTo(x + 6 * s, y + 2 * s, x, y + 4 * s, x, y + 7 * s);
      ctx.closePath();
    } else if (shape === "star") {
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5 - Math.PI / 2;
        const rad = i % 2 ? r * 0.5 : r * 1.25;
        const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    } else if (shape === "cross") {
      const t = r * 0.32;
      ctx.moveTo(x - t, y - r); ctx.lineTo(x + t, y - r); ctx.lineTo(x + t, y - t);
      ctx.lineTo(x + r, y - t); ctx.lineTo(x + r, y + t); ctx.lineTo(x + t, y + t);
      ctx.lineTo(x + t, y + r); ctx.lineTo(x - t, y + r); ctx.lineTo(x - t, y + t);
      ctx.lineTo(x - r, y + t); ctx.lineTo(x - r, y - t); ctx.lineTo(x - t, y - t); ctx.closePath();
    } else if (shape === "blade" || shape === "knife") {
      ctx.moveTo(x, y - r * 1.6);
      ctx.lineTo(x + r * 0.4, y - r * 0.1);
      ctx.lineTo(x + r * 0.18, y + r * 1.1);
      ctx.lineTo(x - r * 0.18, y + r * 1.1);
      ctx.lineTo(x - r * 0.4, y - r * 0.1);
      ctx.closePath();
    } else if (shape === "scythe") {
      ctx.rect(x - r * 0.08, y - r * 1.2, r * 0.16, r * 2.5);
      ctx.moveTo(x - r * 0.05, y - r * 0.85);
      ctx.bezierCurveTo(x + r * 0.4, y - r * 1.65, x + r * 1.55, y - r * 1.6, x + r * 1.45, y - r * 0.45);
      ctx.bezierCurveTo(x + r * 1.35, y - r * 1.05, x + r * 0.8, y - r * 0.75, x + r * 0.35, y - r * 0.25);
      ctx.closePath();
    } else if (shape === "crystal" || shape === "gem") {
      ctx.moveTo(x, y - r * 1.4);
      ctx.lineTo(x + r * 0.9, y - r * 0.3);
      ctx.lineTo(x + r * 0.55, y + r * 1.1);
      ctx.lineTo(x - r * 0.55, y + r * 1.1);
      ctx.lineTo(x - r * 0.9, y - r * 0.3);
      ctx.closePath();
    } else if (shape === "shard") {
      ctx.moveTo(x, y - r * 1.5);
      ctx.lineTo(x + r * 0.7, y + r * 0.2);
      ctx.lineTo(x + r * 0.15, y + r * 1.1);
      ctx.lineTo(x - r * 0.5, y + r * 0.4);
      ctx.closePath();
    } else if (shape === "bolt") {
      ctx.moveTo(x + r * 0.15, y - r * 1.5);
      ctx.lineTo(x - r * 0.7, y - r * 0.1);
      ctx.lineTo(x - r * 0.1, y - r * 0.1);
      ctx.lineTo(x - r * 0.45, y + r * 1.45);
      ctx.lineTo(x + r * 0.7, y - r * 0.25);
      ctx.lineTo(x + r * 0.08, y - r * 0.25);
      ctx.closePath();
    } else if (shape === "moon") {
      ctx.arc(x, y, r * 1.2, Math.PI * 0.2, Math.PI * 1.8);
      ctx.arc(x + r * 0.45, y - r * 0.15, r * 0.95, Math.PI * 1.8, Math.PI * 0.2, true);
    } else if (shape === "hex") {
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 - Math.PI / 6;
        const px = x + Math.cos(a) * r * 1.15, py = y + Math.sin(a) * r * 1.15;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    } else {
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  function render(g) {
    ctx.save();
    ctx.translate(shakeOffset.x, shakeOffset.y);
    ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);

    // Arena
    const borderFlash = g.telegraphFlash > 0 && Math.floor(g.telegraphFlash * 14) % 2 === 0;
    ctx.strokeStyle = borderFlash ? "#ffd23f" : "#2e2940";
    ctx.lineWidth = borderFlash ? 4 : 3;
    ctx.strokeRect(BOX.x, BOX.y, BOX.w, BOX.h);

    // Boss
    ctx.fillStyle = bossSettings.color;
    drawShape(ctx, g.bossX, BOX.y - bossSettings.size - 8, bossSettings.size, bossSettings.shape);
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.arc(g.bossX, BOX.y - bossSettings.size - 8, bossSettings.size + 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Board Rend visual
    if (g.boardRend && g.boardRend.state !== "done") {
      const r = g.boardRend;
      const midX = BOX.x + BOX.w / 2;
      const midY = BOX.y + BOX.h / 2;
      const sep = r.separation * 18;
      ctx.save();
      if (r.currentOrient === "v") {
        ctx.strokeStyle = "rgba(94,200,255,0.85)";
        ctx.lineWidth = 2 + r.slashProgress * 3;
        ctx.beginPath();
        ctx.moveTo(midX, BOX.y);
        ctx.lineTo(midX, BOX.y + BOX.h);
        ctx.stroke();
        if (r.separation > 0) {
          ctx.fillStyle = "rgba(10,8,18,0.7)";
          ctx.fillRect(midX - sep, BOX.y, sep * 2, BOX.h);
        }
      } else {
        ctx.strokeStyle = "rgba(94,200,255,0.85)";
        ctx.lineWidth = 2 + r.slashProgress * 3;
        ctx.beginPath();
        ctx.moveTo(BOX.x, midY);
        ctx.lineTo(BOX.x + BOX.w, midY);
        ctx.stroke();
        if (r.separation > 0) {
          ctx.fillStyle = "rgba(10,8,18,0.7)";
          ctx.fillRect(BOX.x, midY - sep, BOX.w, sep * 2);
        }
      }
      ctx.restore();
    }

    // Cage
    if (g.cage) {
      const c = g.cage;
      ctx.fillStyle = "rgba(255,77,106,0.5)";
      ctx.fillRect(BOX.x - 2, BOX.y, Math.max(0, c.left - BOX.x), BOX.h);
      ctx.fillRect(c.right, BOX.y, Math.max(0, BOX.x + BOX.w - c.right + 2), BOX.h);
      ctx.fillRect(BOX.x, BOX.y - 2, BOX.w, Math.max(0, c.top - BOX.y));
      ctx.fillRect(BOX.x, c.bottom, BOX.w, Math.max(0, BOX.y + BOX.h - c.bottom + 2));
    }

    // Lasers
    g.lasers.forEach(L => {
      ctx.fillStyle = "rgba(255,159,67,0.7)";
      ctx.fillRect(L.x - L.width / 2, BOX.y - 4, L.width, BOX.h + 8);
      ctx.fillStyle = "rgba(255,220,160,0.9)";
      const core = L.width * 0.35;
      ctx.fillRect(L.x - core / 2, BOX.y - 4, core, BOX.h + 8);
    });

    // Giga laser
    if (g.giga) {
      const gl = g.giga;
      if (gl.phase === "charge") {
        const pulse = 0.35 + 0.65 * Math.sin(gl.t * 20);
        ctx.strokeStyle = `rgba(255,126,185,${pulse})`;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(gl.x - gl.width / 2, BOX.y, gl.width, BOX.h);
        ctx.fillStyle = `rgba(255,126,185,${0.12 * pulse})`;
        ctx.fillRect(gl.x - gl.width / 2, BOX.y, gl.width, BOX.h);
      } else if (gl.phase === "fire") {
        ctx.fillStyle = "rgba(255,70,140,0.85)";
        ctx.fillRect(gl.x - gl.width / 2, BOX.y - 6, gl.width, BOX.h + 12);
        ctx.fillStyle = "rgba(255,210,235,0.95)";
        ctx.fillRect(gl.x - gl.width * 0.18, BOX.y - 6, gl.width * 0.36, BOX.h + 12);
      }
    }

    // Rings
    g.rings.forEach(R => {
      if (R.shattered) return;
      ctx.strokeStyle = "rgba(255,77,106,0.85)";
      ctx.lineWidth = R.thickness;
      ctx.beginPath();
      ctx.arc(R.cx, R.cy, R.r, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Sanguine cuts
    g.cuts.forEach(c => {
      const a = Math.max(0, c.life / c.maxLife);
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(-c.ang);
      ctx.fillStyle = `rgba(255,50,90,${0.7 * a})`;
      ctx.fillRect(-220, -c.width / 2, 440, c.width);
      ctx.fillStyle = `rgba(255,180,200,${0.9 * a})`;
      ctx.fillRect(-220, -c.width * 0.2, 440, c.width * 0.4);
      ctx.restore();
    });

    // Corridor blades
    if (g.corridor) {
      g.corridor.blades.forEach(b => {
        // Only draw if inside or near board, or during slash
        ctx.fillStyle = "#c9d3e0";
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(-b.ang || 0);
        drawShape(ctx, 0, 0, 7, g.corridor.shape || "blade");
        ctx.restore();
      });
      // Gap indicator during move phase
      if (g.corridor.phase === "move") {
        ctx.strokeStyle = "rgba(94,200,255,0.4)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(BOX.x + 40, g.corridor.gapCenter - g.corridor.gapSize / 2, BOX.w - 80, g.corridor.gapSize);
        ctx.setLineDash([]);
      }
    }

    // Bullets
    g.bullets.forEach(b => {
      if (b.shape === "heart") ctx.fillStyle = "#ff7eb9";
      else if (b.shape === "star") ctx.fillStyle = "#ffd23f";
      else if (b.shape === "crystal" || b.shape === "gem") ctx.fillStyle = "#c4b5fd";
      else if (b.shape === "shard") ctx.fillStyle = "#a78bfa";
      else if (b.shape === "knife" || b.shape === "blade") ctx.fillStyle = "#e2e8f0";
      else if (b.shape === "scythe") ctx.fillStyle = "#cbd5e1";
      else ctx.fillStyle = "#ff4d6a";
      if (b.blue) ctx.fillStyle = "#5ec8ff";

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rotation || 0);
      drawShape(ctx, 0, 0, b.r, b.shape);
      ctx.restore();
    });

    // Particles
    g.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2.8);
      ctx.fillStyle = p.color || "#ffd23f";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // Soul
    const invulnFlash = g.player.invuln > 0 && Math.floor(g.player.invuln * 14) % 2 === 0;
    ctx.fillStyle = invulnFlash ? "#ffffff" : "#ffd23f";
    ctx.beginPath();
    ctx.arc(g.player.x, g.player.y, g.player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = invulnFlash ? "#fff" : "rgba(255,210,63,0.45)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Flash overlay
    if (g.flashLeft > 0) {
      const a = Math.min(0.65, g.flashLeft * 4);
      const colors = {
        white: "255,255,255", yellow: "255,210,63", red: "255,70,90",
        pink: "255,126,185", violet: "167,139,250"
      };
      const c = colors[g.flashColor] || colors.white;
      ctx.fillStyle = `rgba(${c},${a})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }

  render(idleState());
})();
</script>
</body>
</html>
